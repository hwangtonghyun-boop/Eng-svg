<svg viewBox="0 0 900 465" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="비속도가 커질수록 임펠러가 원심형에서 사류형을 거쳐 축류형으로 변하는 형상 비교" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>비속도가 임펠러의 형상을 결정한다</title>

  <defs>
    <marker id="nsFlow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1d5a92"/>
    </marker>
    <marker id="nsDim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c1500a"/>
    </marker>
    <marker id="nsBig" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#44546a"/>
    </marker>
  </defs>

  <g font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif">

    <text x="20" y="48" font-size="17" font-weight="700" fill="#2c3e50">비속도가 커지면 임펠러는 원반에서 프로펠러가 된다</text>
    <text x="20" y="70" font-size="12.5" fill="#1f2933">축을 지나는 단면으로 본 형상. 아래쪽 점선이 회전축이다</text>

    <!-- ===== 원심형 ===== -->
    <rect x="20" y="90" width="280" height="240" rx="8" fill="#fafbfc" stroke="#dfe4e8"/>
    <text x="160" y="118" font-size="13.5" font-weight="700" fill="#2c3e50" text-anchor="middle">원심형 (Radial)</text>
    <text x="160" y="136" font-size="10.5" fill="#1f2933" text-anchor="middle">저비속도</text>

    <path d="M 70 242 C 105 240, 130 215, 130 155 L 146 155 C 146 210, 118 275, 70 275 Z"
          fill="#dce8f2" stroke="#44546a" stroke-width="2.2"/>

    <line x1="30" y1="300" x2="290" y2="300" stroke="#8b98a4" stroke-width="1.2" stroke-dasharray="12 4 3 4"/>

    <path d="M 45 258 L 66 258" stroke="#1d5a92" stroke-width="2.6" marker-end="url(#nsFlow)"/>
    <path d="M 138 150 L 138 122" stroke="#1d5a92" stroke-width="2.6" marker-end="url(#nsFlow)"/>

    <path d="M 175 300 L 175 155" stroke="#c1500a" stroke-width="1.8" marker-start="url(#nsDim)" marker-end="url(#nsDim)"/>
    <text x="182" y="230" font-size="12" font-weight="700" fill="#8a3a08">D₂</text>
    <path d="M 52 300 L 52 242" stroke="#c1500a" stroke-width="1.8" marker-start="url(#nsDim)" marker-end="url(#nsDim)"/>
    <text x="30" y="275" font-size="12" font-weight="700" fill="#8a3a08">D₁</text>

    <text x="34" y="320" font-size="10.5" font-weight="700" fill="#1a1a1a">D₂/D₁ 크다 — 유체가 직각으로 꺾인다</text>

    <!-- ===== 사류형 ===== -->
    <rect x="310" y="90" width="280" height="240" rx="8" fill="#fafbfc" stroke="#dfe4e8"/>
    <text x="450" y="118" font-size="13.5" font-weight="700" fill="#2c3e50" text-anchor="middle">사류형 (Mixed Flow)</text>
    <text x="450" y="136" font-size="10.5" fill="#1f2933" text-anchor="middle">중비속도</text>

    <path d="M 360 238 C 395 236, 425 222, 445 198 L 462 218 C 440 252, 405 278, 360 278 Z"
          fill="#dce8f2" stroke="#44546a" stroke-width="2.2"/>

    <line x1="320" y1="300" x2="580" y2="300" stroke="#8b98a4" stroke-width="1.2" stroke-dasharray="12 4 3 4"/>

    <path d="M 335 258 L 356 258" stroke="#1d5a92" stroke-width="2.6" marker-end="url(#nsFlow)"/>
    <path d="M 462 192 L 486 166" stroke="#1d5a92" stroke-width="2.6" marker-end="url(#nsFlow)"/>

    <path d="M 508 300 L 508 208" stroke="#c1500a" stroke-width="1.8" marker-start="url(#nsDim)" marker-end="url(#nsDim)"/>
    <text x="515" y="258" font-size="12" font-weight="700" fill="#8a3a08">D₂</text>
    <path d="M 342 300 L 342 238" stroke="#c1500a" stroke-width="1.8" marker-start="url(#nsDim)" marker-end="url(#nsDim)"/>
    <text x="320" y="273" font-size="12" font-weight="700" fill="#8a3a08">D₁</text>

    <text x="324" y="320" font-size="10.5" font-weight="700" fill="#1a1a1a">D₂/D₁ 중간 — 비스듬히 빠져나간다</text>

    <!-- ===== 축류형 ===== -->
    <rect x="600" y="90" width="280" height="240" rx="8" fill="#fafbfc" stroke="#dfe4e8"/>
    <text x="740" y="118" font-size="13.5" font-weight="700" fill="#2c3e50" text-anchor="middle">축류형 (Axial)</text>
    <text x="740" y="136" font-size="10.5" fill="#1f2933" text-anchor="middle">고비속도</text>

    <rect x="640" y="222" width="140" height="78" fill="#dce8f2"/>
    <line x1="640" y1="222" x2="780" y2="222" stroke="#44546a" stroke-width="2.6"/>

    <rect x="655" y="268" width="110" height="32" fill="#44546a"/>
    <polygon points="678,268 695,226 709,226 692,268" fill="#6b8194" stroke="#3f4b58" stroke-width="1.4"/>
    <polygon points="726,268 743,226 757,226 740,268" fill="#6b8194" stroke="#3f4b58" stroke-width="1.4"/>

    <line x1="610" y1="300" x2="870" y2="300" stroke="#8b98a4" stroke-width="1.2" stroke-dasharray="12 4 3 4"/>

    <path d="M 608 248 L 632 248" stroke="#1d5a92" stroke-width="2.6" marker-end="url(#nsFlow)"/>
    <path d="M 786 248 L 812 248" stroke="#1d5a92" stroke-width="2.6" marker-end="url(#nsFlow)"/>

    <path d="M 830 300 L 830 222" stroke="#c1500a" stroke-width="1.8" marker-start="url(#nsDim)" marker-end="url(#nsDim)"/>
    <text x="838" y="266" font-size="12" font-weight="700" fill="#8a3a08">D₂ ≈ D₁</text>

    <text x="614" y="320" font-size="10.5" font-weight="700" fill="#1a1a1a">D₂/D₁ ≈ 1 — 곧게 통과한다</text>

    <!-- 비속도 축 -->
    <path d="M 60 358 L 850 358" stroke="#44546a" stroke-width="3.4" marker-end="url(#nsBig)"/>
    <text x="455" y="350" font-size="13" font-weight="700" fill="#2c3e50" text-anchor="middle">비속도 (Ns) 증가</text>

    <text x="160" y="388" font-size="11.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">높은 양정 · 적은 유량</text>
    <text x="450" y="388" font-size="11.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">중간</text>
    <text x="740" y="388" font-size="11.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">낮은 양정 · 많은 유량</text>

    <!-- 캡션 -->
    <text x="20" y="425" font-size="13" fill="#1a1a1a">
      원심형은 유체를 바깥으로 던져 원심력으로 압력을 만든다. 축류형은 프로펠러처럼 밀어내므로 압력 대신 유량을 얻는다.
    </text>
    <text x="20" y="447" font-size="13" fill="#1a1a1a">
      그 사이의 사류형은 두 방식이 섞인 형태다. 비속도는 이 세 가지 중 어느 형상이어야 하는지를 알려주는 숫자다.
    </text>
  </g>
</svg>
