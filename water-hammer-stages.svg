<svg viewBox="0 0 900 450" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="정전 후 수격 진행 4단계 - 부압파 전파, 기주 분리, 역류 시작, 재결합 충돌과 체크 밸브 슬램" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>정전 후 수격은 이렇게 진행된다</title>

  <defs>
    <marker id="whNavy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2f3d4f"/>
    </marker>
    <marker id="whRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c0392b"/>
    </marker>
  </defs>

  <g font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif">

    <!-- ============ ① 부압파 ============ -->
    <rect x="20" y="30" width="210" height="350" rx="8" fill="#eef4f8" stroke="#cddce6"/>
    <text x="35" y="58" font-size="13.5" font-weight="700" fill="#2c3e50">① 부압파</text>
    <text x="35" y="76" font-size="10" fill="#1f2933">압력이 떨어진다</text>
    <text x="35" y="96" font-size="10.5" font-weight="700" fill="#1d5a92">압력 ↓</text>

    <path d="M 68 250 L 90 250 L 125 155 L 170 155 L 215 215" fill="none" stroke="#44546a" stroke-width="20" stroke-linejoin="round"/>
    <path d="M 68 250 L 90 250 L 125 155 L 170 155 L 215 215" fill="none" stroke="#dce8f2" stroke-width="13" stroke-linejoin="round"/>

    <rect x="36" y="235" width="30" height="30" rx="3" fill="#44546a"/>
    <polygon points="74,243 74,257 86,250" fill="#2f3d4f"/>

    <path d="M 130 142 L 165 142" stroke="#2f3d4f" stroke-width="2.4" marker-end="url(#whNavy)"/>
    <text x="147" y="134" font-size="10" font-weight="700" fill="#2f3d4f" text-anchor="middle">관성 유동</text>

    <text x="51" y="283" font-size="10" font-weight="700" fill="#1a1a1a" text-anchor="middle">펌프</text>
    <text x="102" y="300" font-size="10" fill="#1a1a1a" text-anchor="middle">체크 밸브</text>

    <text x="35" y="326" font-size="10" fill="#1a1a1a">유체는 관성으로 나아간다</text>
    <text x="35" y="344" font-size="10" font-weight="700" fill="#1d5a92">토출 쪽 압력이 급락한다</text>

    <!-- ============ ② 기주 분리 ============ -->
    <rect x="240" y="30" width="210" height="350" rx="8" fill="#e3edf4" stroke="#bcd2df"/>
    <text x="255" y="58" font-size="13.5" font-weight="700" fill="#2c3e50">② 기주 분리</text>
    <text x="255" y="76" font-size="10" fill="#1f2933">물기둥이 끊긴다</text>
    <text x="255" y="96" font-size="10.5" font-weight="700" fill="#1d5a92">압력 최저</text>

    <path d="M 288 250 L 310 250 L 345 155 L 390 155 L 435 215" fill="none" stroke="#44546a" stroke-width="20" stroke-linejoin="round"/>
    <path d="M 288 250 L 310 250 L 345 155 L 358 155" fill="none" stroke="#dce8f2" stroke-width="13" stroke-linejoin="round"/>
    <path d="M 377 155 L 390 155 L 435 215" fill="none" stroke="#dce8f2" stroke-width="13" stroke-linejoin="round"/>
    <rect x="358" y="148.5" width="19" height="13" fill="#ffffff" stroke="#c0392b" stroke-width="1.6" stroke-dasharray="4 3"/>

    <rect x="256" y="235" width="30" height="30" rx="3" fill="#44546a"/>
    <polygon points="294,243 294,257 306,250" fill="#2f3d4f"/>

    <text x="367" y="134" font-size="10" font-weight="700" fill="#a03228" text-anchor="middle">증기 공동</text>

    <text x="255" y="326" font-size="10" fill="#1a1a1a">압력이 포화증기압 아래로</text>
    <text x="255" y="344" font-size="10" font-weight="700" fill="#a03228">고점에서 증기 공동이 생긴다</text>

    <!-- ============ ③ 역류 ============ -->
    <rect x="460" y="30" width="210" height="350" rx="8" fill="#fdf6e9" stroke="#e8dcc0"/>
    <text x="475" y="58" font-size="13.5" font-weight="700" fill="#2c3e50">③ 역류 시작</text>
    <text x="475" y="76" font-size="10" fill="#1f2933">물기둥이 되돌아온다</text>
    <text x="475" y="96" font-size="10.5" font-weight="700" fill="#8a6114">압력 회복 중</text>

    <path d="M 508 250 L 530 250 L 565 155 L 610 155 L 655 215" fill="none" stroke="#44546a" stroke-width="20" stroke-linejoin="round"/>
    <path d="M 508 250 L 530 250 L 565 155 L 582 155" fill="none" stroke="#dce8f2" stroke-width="13" stroke-linejoin="round"/>
    <path d="M 593 155 L 610 155 L 655 215" fill="none" stroke="#dce8f2" stroke-width="13" stroke-linejoin="round"/>
    <rect x="582" y="148.5" width="11" height="13" fill="#ffffff" stroke="#c0392b" stroke-width="1.6" stroke-dasharray="4 3"/>

    <rect x="476" y="235" width="30" height="30" rx="3" fill="#44546a"/>
    <polygon points="514,243 514,257 526,250" fill="#2f3d4f"/>

    <path d="M 622 142 L 588 142" stroke="#c0392b" stroke-width="2.6" marker-end="url(#whRed)"/>
    <text x="605" y="134" font-size="10" font-weight="700" fill="#a03228" text-anchor="middle">역류</text>

    <text x="475" y="326" font-size="10" fill="#1a1a1a">위치 에너지에 밀려 돌아온다</text>
    <text x="475" y="344" font-size="10" font-weight="700" fill="#8a6114">공동이 압착되기 시작한다</text>

    <!-- ============ ④ 재결합 충돌 ============ -->
    <rect x="680" y="30" width="210" height="350" rx="8" fill="#fdf0ee" stroke="#e8d0cb"/>
    <text x="695" y="58" font-size="13.5" font-weight="700" fill="#2c3e50">④ 재결합 충돌</text>
    <text x="695" y="76" font-size="10" fill="#1f2933">충격파와 슬램</text>
    <text x="695" y="96" font-size="10.5" font-weight="700" fill="#a03228">압력 급상승</text>

    <path d="M 728 250 L 750 250 L 785 155 L 830 155 L 875 215" fill="none" stroke="#44546a" stroke-width="20" stroke-linejoin="round"/>
    <path d="M 728 250 L 750 250 L 785 155 L 830 155 L 875 215" fill="none" stroke="#dce8f2" stroke-width="13" stroke-linejoin="round"/>

    <circle cx="807" cy="155" r="16" fill="#e8a33d" opacity="0.45"/>
    <path d="M 807 137 L 807 130 M 807 173 L 807 180 M 789 155 L 782 155 M 825 155 L 832 155" stroke="#c0392b" stroke-width="2.6"/>
    <path d="M 795 143 L 789 137 M 819 167 L 825 173 M 819 143 L 825 137 M 795 167 L 789 173" stroke="#c0392b" stroke-width="2"/>
    <text x="807" y="122" font-size="10" font-weight="700" fill="#a03228" text-anchor="middle">충격파</text>

    <circle cx="740" cy="250" r="13" fill="#e8a33d" opacity="0.45"/>
    <path d="M 740 235 L 740 229 M 740 265 L 740 271 M 725 250 L 719 250 M 755 250 L 761 250" stroke="#c0392b" stroke-width="2.4"/>
    <text x="740" y="285" font-size="10" font-weight="700" fill="#a03228" text-anchor="middle">슬램</text>

    <rect x="696" y="235" width="30" height="30" rx="3" fill="#44546a"/>

    <text x="695" y="326" font-size="10" fill="#1a1a1a">공동이 닫히며 충격파 발생</text>
    <text x="695" y="344" font-size="10" font-weight="700" fill="#a03228">체크 밸브도 함께 얻어맞는다</text>

    <!-- 캡션 -->
    <text x="20" y="410" font-size="13" fill="#1a1a1a">
      쥬코프스키 식이 주는 압력 상승은 ①단계의 이야기다. ②③④를 거치며 생기는 충격은 그보다 클 수 있다.
    </text>
    <text x="20" y="432" font-size="13" fill="#1a1a1a">
      기주 분리가 일어나면 그때부터가 진짜 위험이다. 부압을 막는 것이 고압을 막는 것보다 먼저다.
    </text>
  </g>
</svg>
