<svg viewBox="0 0 900 455" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="강성 축과 유연 축의 운전 속도와 임계속도 관계, 그리고 분리 여유" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>강성 축과 유연 축</title>

  <defs>
    <marker id="axArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a1a"/>
    </marker>
  </defs>

  <g font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif">

    <!-- ============ ① 강성 축 ============ -->
    <rect x="20" y="30" width="860" height="170" rx="8" fill="#f7fbf7" stroke="#d6e6d4"/>
    <text x="40" y="58" font-size="14" font-weight="700" fill="#2c3e50">① 강성 축 (Rigid) — 임계속도 아래에서 돈다</text>
    <text x="40" y="76" font-size="10.5" fill="#1f2933">운전 속도 &lt; 1차 임계속도 · 서브크리티컬</text>

    <rect x="612" y="95" width="78" height="55" fill="#fbe9e7"/>

    <path d="M 80 146 L 480 144 C 560 141, 615 100, 650 97 C 685 100, 730 138, 790 145 L 845 146"
          fill="none" stroke="#c0392b" stroke-width="2.8"/>

    <line x1="650" y1="95" x2="650" y2="150" stroke="#c0392b" stroke-width="1.8" stroke-dasharray="6 4"/>
    <line x1="380" y1="95" x2="380" y2="150" stroke="#2f3d4f" stroke-width="2.2" stroke-dasharray="8 4"/>

    <text x="380" y="90" font-size="11" font-weight="700" fill="#2f3d4f" text-anchor="middle">운전 속도</text>
    <text x="650" y="90" font-size="11" font-weight="700" fill="#a03228" text-anchor="middle">1차 임계속도</text>

    <path d="M 70 150 L 852 150" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#axArrow)"/>
    <text x="848" y="166" font-size="10.5" fill="#1a1a1a" text-anchor="end">회전수</text>

    <line x1="380" y1="168" x2="650" y2="168" stroke="#2f6b3a" stroke-width="2"/>
    <line x1="380" y1="162" x2="380" y2="174" stroke="#2f6b3a" stroke-width="2"/>
    <line x1="650" y1="162" x2="650" y2="174" stroke="#2f6b3a" stroke-width="2"/>
    <text x="515" y="186" font-size="11" font-weight="700" fill="#2f6b3a" text-anchor="middle">분리 여유</text>

    <text x="70" y="186" font-size="10.5" fill="#1a1a1a">공진 구간을 만나지 않는다</text>

    <!-- ============ ② 유연 축 ============ -->
    <rect x="20" y="215" width="860" height="170" rx="8" fill="#fdf9f8" stroke="#e8d9d6"/>
    <text x="40" y="243" font-size="14" font-weight="700" fill="#2c3e50">② 유연 축 (Flexible) — 임계속도 위에서 돈다</text>
    <text x="40" y="261" font-size="10.5" fill="#1f2933">1차 임계속도 &lt; 운전 속도 &lt; 2차 임계속도 · 슈퍼크리티컬</text>

    <rect x="245" y="280" width="72" height="55" fill="#fbe9e7"/>
    <rect x="765" y="280" width="73" height="55" fill="#fbe9e7"/>

    <path d="M 80 331 C 150 329, 235 288, 280 284 C 325 288, 390 326, 470 331 L 590 332 C 670 331, 755 296, 800 290 C 818 293, 835 310, 845 320"
          fill="none" stroke="#c0392b" stroke-width="2.8"/>

    <line x1="280" y1="280" x2="280" y2="335" stroke="#c0392b" stroke-width="1.8" stroke-dasharray="6 4"/>
    <line x1="800" y1="280" x2="800" y2="335" stroke="#c0392b" stroke-width="1.8" stroke-dasharray="6 4"/>
    <line x1="560" y1="280" x2="560" y2="335" stroke="#2f3d4f" stroke-width="2.2" stroke-dasharray="8 4"/>

    <text x="280" y="275" font-size="11" font-weight="700" fill="#a03228" text-anchor="middle">1차 임계속도</text>
    <text x="560" y="275" font-size="11" font-weight="700" fill="#2f3d4f" text-anchor="middle">운전 속도</text>
    <text x="800" y="275" font-size="11" font-weight="700" fill="#a03228" text-anchor="middle">2차 임계속도</text>

    <path d="M 70 335 L 852 335" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#axArrow)"/>
    <text x="848" y="326" font-size="10.5" fill="#1a1a1a" text-anchor="end">회전수</text>

    <path d="M 248 296 L 272 288" stroke="#a03228" stroke-width="1.2"/>
    <text x="140" y="300" font-size="10.5" font-weight="700" fill="#a03228">기동 · 정지 시 반드시 통과</text>

    <line x1="280" y1="353" x2="560" y2="353" stroke="#2f6b3a" stroke-width="2"/>
    <line x1="280" y1="347" x2="280" y2="359" stroke="#2f6b3a" stroke-width="2"/>
    <line x1="560" y1="347" x2="560" y2="359" stroke="#2f6b3a" stroke-width="2"/>
    <text x="420" y="371" font-size="11" font-weight="700" fill="#2f6b3a" text-anchor="middle">분리 여유</text>

    <line x1="560" y1="353" x2="800" y2="353" stroke="#2f6b3a" stroke-width="2"/>
    <line x1="800" y1="347" x2="800" y2="359" stroke="#2f6b3a" stroke-width="2"/>
    <text x="680" y="371" font-size="11" font-weight="700" fill="#2f6b3a" text-anchor="middle">분리 여유</text>

    <!-- 캡션 -->
    <text x="20" y="415" font-size="13" fill="#1a1a1a">
      붉은 곡선은 회전수에 따른 진동 진폭이다. 봉우리가 임계속도이고, 운전 속도가 그 봉우리에서 얼마나 떨어져 있어야 하는지가 분리 여유다.
    </text>
    <text x="20" y="437" font-size="13" fill="#1a1a1a">
      요구되는 여유는 고정된 퍼센트가 아니라 감쇠 정도에 따라 달라진다. 감쇠가 크면 봉우리가 낮아 여유 요구도 줄어든다.
    </text>
  </g>
</svg>
