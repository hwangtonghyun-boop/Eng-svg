<svg viewBox="0 0 900 440" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="배관 응력 검사를 위한 림 게이지와 페이스 게이지 설치, 그리고 배관 체결 전후 축 변위" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>배관 응력 검사 — 게이지 설치와 판정</title>

  <defs>
    <marker id="sDim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c0392b"/>
    </marker>
  </defs>

  <g font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif">

    <!-- ============ PANEL A ============ -->
    <rect x="20" y="30" width="420" height="330" rx="8" fill="#fafbfc" stroke="#dfe4e8"/>
    <text x="38" y="58" font-size="14" font-weight="700" fill="#2c3e50">① 게이지는 무엇을 겨냥하는가</text>
    <text x="38" y="76" font-size="10.5" fill="#1f2933">커플링 허브에 브래킷을 걸어 상대 허브를 읽는다</text>

    <line x1="50" y1="202" x2="410" y2="202" stroke="#8b98a4" stroke-width="1.2" stroke-dasharray="12 4 3 4"/>

    <rect x="60" y="190" width="90" height="25" fill="#44546a"/>
    <rect x="150" y="158" width="45" height="89" fill="#6b8194" stroke="#3f4b58" stroke-width="1.4"/>
    <rect x="265" y="158" width="45" height="89" fill="#6b8194" stroke="#3f4b58" stroke-width="1.4"/>
    <rect x="310" y="190" width="90" height="25" fill="#44546a"/>

    <text x="105" y="236" font-size="10" fill="#1a1a1a" text-anchor="middle">펌프 축</text>
    <text x="355" y="236" font-size="10" fill="#1a1a1a" text-anchor="middle">모터 축</text>
    <text x="172" y="268" font-size="10" font-weight="700" fill="#1a1a1a" text-anchor="middle">펌프 허브</text>
    <text x="288" y="268" font-size="10" font-weight="700" fill="#1a1a1a" text-anchor="middle">모터 허브</text>

    <path d="M 172 158 L 172 105 L 300 105" fill="none" stroke="#44546a" stroke-width="4"/>
    <line x1="225" y1="105" x2="225" y2="160" stroke="#44546a" stroke-width="4"/>

    <line x1="288" y1="142" x2="288" y2="158" stroke="#c0392b" stroke-width="3"/>
    <circle cx="288" cy="126" r="16" fill="#ffffff" stroke="#c0392b" stroke-width="2.2"/>
    <circle cx="288" cy="126" r="2.5" fill="#c0392b"/>
    <line x1="288" y1="126" x2="288" y2="113" stroke="#c0392b" stroke-width="2"/>

    <line x1="241" y1="176" x2="265" y2="176" stroke="#2f6b3a" stroke-width="3"/>
    <circle cx="225" cy="176" r="16" fill="#ffffff" stroke="#2f6b3a" stroke-width="2.2"/>
    <circle cx="225" cy="176" r="2.5" fill="#2f6b3a"/>
    <line x1="225" y1="176" x2="225" y2="163" stroke="#2f6b3a" stroke-width="2"/>

    <text x="312" y="120" font-size="11" font-weight="700" fill="#a03228">림 게이지</text>
    <text x="312" y="136" font-size="9.5" fill="#5c221b">외주면 → 평행 편차</text>

    <path d="M 196 286 L 222 194" stroke="#2f6b3a" stroke-width="1.2"/>
    <text x="150" y="298" font-size="11" font-weight="700" fill="#2f6b3a">페이스 게이지</text>
    <text x="150" y="314" font-size="9.5" fill="#1e3a19">단면 → 각도 편차</text>

    <text x="38" y="342" font-size="11" font-weight="700" fill="#1a1a1a">두 게이지는 서로 다른 변위를 읽는다. 반드시 둘 다 볼 것</text>

    <!-- ============ PANEL B ============ -->
    <rect x="460" y="30" width="420" height="330" rx="8" fill="#fafbfc" stroke="#dfe4e8"/>
    <text x="478" y="58" font-size="14" font-weight="700" fill="#2c3e50">② 체결 전후로 축이 움직이는가</text>
    <text x="478" y="76" font-size="10.5" fill="#1f2933">움직인 양이 곧 배관이 가하는 힘이다</text>

    <!-- 상태 1 -->
    <text x="478" y="110" font-size="11.5" font-weight="700" fill="#2f6b3a">배관을 푼 상태 (기준)</text>
    <line x1="490" y1="155" x2="740" y2="155" stroke="#8b98a4" stroke-width="1.2" stroke-dasharray="12 4 3 4"/>
    <rect x="490" y="145" width="65" height="20" fill="#44546a"/>
    <rect x="555" y="128" width="45" height="54" fill="#6b8194" stroke="#3f4b58" stroke-width="1.4"/>
    <rect x="640" y="128" width="45" height="54" fill="#6b8194" stroke="#3f4b58" stroke-width="1.4"/>
    <rect x="685" y="145" width="65" height="20" fill="#44546a"/>

    <circle cx="806" cy="155" r="26" fill="#ffffff" stroke="#44546a" stroke-width="2"/>
    <line x1="806" y1="129" x2="806" y2="134" stroke="#5b6673" stroke-width="1.6"/>
    <line x1="832" y1="155" x2="827" y2="155" stroke="#5b6673" stroke-width="1.6"/>
    <line x1="806" y1="181" x2="806" y2="176" stroke="#5b6673" stroke-width="1.6"/>
    <line x1="780" y1="155" x2="785" y2="155" stroke="#5b6673" stroke-width="1.6"/>
    <line x1="806" y1="155" x2="806" y2="134" stroke="#2f6b3a" stroke-width="2.4"/>
    <circle cx="806" cy="155" r="3" fill="#2f6b3a"/>
    <text x="806" y="200" font-size="10.5" font-weight="700" fill="#2f6b3a" text-anchor="middle">영점</text>

    <!-- 상태 2 -->
    <text x="478" y="232" font-size="11.5" font-weight="700" fill="#a03228">배관을 체결한 상태</text>

    <path d="M 520 250 L 520 280" stroke="#c0392b" stroke-width="2.6" marker-end="url(#sDim)"/>
    <text x="534" y="262" font-size="10" font-weight="700" fill="#a03228">배관 하중</text>

    <line x1="490" y1="282" x2="740" y2="282" stroke="#8b98a4" stroke-width="1.2" stroke-dasharray="12 4 3 4"/>
    <rect x="640" y="255" width="45" height="54" fill="#6b8194" stroke="#3f4b58" stroke-width="1.4"/>
    <rect x="685" y="272" width="65" height="20" fill="#44546a"/>
    <rect x="490" y="284" width="65" height="20" fill="#44546a"/>
    <rect x="555" y="267" width="45" height="54" fill="#6b8194" stroke="#3f4b58" stroke-width="1.4"/>

    <path d="M 618 282 L 618 294" stroke="#c0392b" stroke-width="2" marker-start="url(#sDim)" marker-end="url(#sDim)"/>
    <path d="M 612 262 L 618 279" stroke="#c0392b" stroke-width="1.2"/>
    <text x="610" y="258" font-size="10" font-weight="700" fill="#a03228" text-anchor="end">축 변위</text>

    <circle cx="806" cy="282" r="26" fill="#ffffff" stroke="#44546a" stroke-width="2"/>
    <line x1="806" y1="256" x2="806" y2="261" stroke="#5b6673" stroke-width="1.6"/>
    <line x1="832" y1="282" x2="827" y2="282" stroke="#5b6673" stroke-width="1.6"/>
    <line x1="806" y1="308" x2="806" y2="303" stroke="#5b6673" stroke-width="1.6"/>
    <line x1="780" y1="282" x2="785" y2="282" stroke="#5b6673" stroke-width="1.6"/>
    <line x1="806" y1="282" x2="820" y2="265" stroke="#c0392b" stroke-width="2.4"/>
    <circle cx="806" cy="282" r="3" fill="#c0392b"/>
    <text x="806" y="327" font-size="10.5" font-weight="700" fill="#a03228" text-anchor="middle">바늘이 움직였다</text>

    <text x="478" y="348" font-size="11" font-weight="700" fill="#1a1a1a">흡입과 토출을 따로 조여 각각 읽어야 원인이 좁혀진다</text>

    <!-- 캡션 -->
    <text x="20" y="395" font-size="13" fill="#1a1a1a">
      배관을 조였을 때 축이 움직인다는 것은, 배관이 펌프를 밀거나 당기고 있다는 뜻이다. 그 힘은 케이싱을 비틀고 내부 간극을 무너뜨린다.
    </text>
    <text x="20" y="417" font-size="13" fill="#1a1a1a">
      모터 발판에 심을 넣어 정렬을 다시 맞추면 눈금은 맞아 보이지만, 케이싱은 여전히 비틀린 채다.
    </text>
  </g>
</svg>
