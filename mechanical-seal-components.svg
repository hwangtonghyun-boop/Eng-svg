<svg viewBox="0 0 900 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="메카니칼 씰 단면 구조와 네 가지 핵심 구성 요소" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>메카니칼 씰의 4대 구성 요소</title>

  <g font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif">

    <text x="30" y="52" font-size="18" font-weight="700" fill="#2c3e50">메카니칼 씰의 단면 구조</text>
    <text x="30" y="76" font-size="13.5" fill="#1f2933">회전축과 직각을 이루는 두 평면이 실제 밀봉을 담당한다</text>

    <!-- 영역 표기 -->
    <text x="150" y="178" font-size="12.5" fill="#1f2933">공정 유체 측</text>
    <text x="548" y="248" font-size="12.5" fill="#1f2933">대기 측</text>

    <!-- 케이싱 브래킷 -->
    <rect x="100" y="190" width="40" height="170" fill="#c8d2da" stroke="#97a3ad"/>

    <!-- 축 · 슬리브 -->
    <rect x="80" y="375" width="560" height="30" fill="#44546a"/>
    <rect x="150" y="350" width="470" height="25" fill="#6b8194"/>
    <text x="605" y="368" font-size="11" fill="#ffffff" text-anchor="end">슬리브</text>

    <!-- 중심선 -->
    <line x1="80" y1="420" x2="640" y2="420" stroke="#8b98a4" stroke-width="1.2" stroke-dasharray="14 4 3 4"/>

    <!-- 드라이브 칼라 -->
    <rect x="190" y="255" width="45" height="95" fill="#7f95a6" stroke="#5b6673"/>
    <rect x="206" y="238" width="12" height="24" fill="#5b6673"/>

    <!-- 스프링 -->
    <path d="M 235 302 L 243 288 L 253 316 L 263 288 L 273 316 L 283 288 L 293 316 L 303 288 L 313 316 L 320 302"
          fill="none" stroke="#5b6673" stroke-width="2.6"/>

    <!-- 회전 링 -->
    <rect x="320" y="255" width="70" height="95" fill="#6b8194" stroke="#3f4b58"/>

    <!-- 고정 링 -->
    <rect x="392" y="255" width="63" height="95" fill="#405b73" stroke="#2f3d4f"/>

    <!-- 글랜드 -->
    <rect x="392" y="200" width="68" height="55" fill="#c8d2da" stroke="#97a3ad"/>
    <rect x="460" y="200" width="65" height="160" fill="#c8d2da" stroke="#97a3ad"/>

    <!-- 1차 밀봉면 -->
    <line x1="391" y1="250" x2="391" y2="355" stroke="#c0392b" stroke-width="4"/>

    <!-- 2차 밀봉재 -->
    <circle cx="352" cy="348" r="7" fill="#2c3e50"/>
    <circle cx="457" cy="300" r="7" fill="#2c3e50"/>

    <!-- 번호 뱃지 -->
    <circle cx="348" cy="224" r="12" fill="#c0392b"/>
    <text x="348" y="229" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
    <line x1="356" y1="234" x2="386" y2="252" stroke="#c0392b" stroke-width="1.4"/>

    <circle cx="352" cy="318" r="12" fill="#2c3e50"/>
    <text x="352" y="323" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>

    <circle cx="490" cy="300" r="12" fill="#2c3e50"/>
    <text x="490" y="305" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>

    <circle cx="277" cy="238" r="12" fill="#2c3e50"/>
    <text x="277" y="243" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>

    <circle cx="212" cy="212" r="12" fill="#2c3e50"/>
    <text x="212" y="217" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>

    <!-- ===== 범례 ===== -->
    <rect x="655" y="150" width="225" height="280" rx="8" fill="#fafbfc" stroke="#dfe4e8"/>

    <circle cx="682" cy="190" r="12" fill="#c0392b"/>
    <text x="682" y="195" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
    <text x="704" y="188" font-size="13.5" font-weight="700" fill="#2c3e50">1차 밀봉면</text>
    <text x="704" y="208" font-size="11.5" fill="#1f2933">회전 링 + 고정 링</text>

    <circle cx="682" cy="256" r="12" fill="#2c3e50"/>
    <text x="682" y="261" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
    <text x="704" y="254" font-size="13.5" font-weight="700" fill="#2c3e50">2차 밀봉재</text>
    <text x="704" y="274" font-size="11.5" fill="#1f2933">O-링 · 웨지 · 그래파이트</text>

    <circle cx="682" cy="322" r="12" fill="#2c3e50"/>
    <text x="682" y="327" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
    <text x="704" y="320" font-size="13.5" font-weight="700" fill="#2c3e50">추진 기구</text>
    <text x="704" y="340" font-size="11.5" fill="#1f2933">스프링 · 메탈 벨로즈</text>

    <circle cx="682" cy="388" r="12" fill="#2c3e50"/>
    <text x="682" y="393" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
    <text x="704" y="386" font-size="13.5" font-weight="700" fill="#2c3e50">구동 요소</text>
    <text x="704" y="406" font-size="11.5" fill="#1f2933">셋스크루 · 드라이브 핀</text>

    <!-- 캡션 -->
    <line x1="100" y1="452" x2="138" y2="452" stroke="#c0392b" stroke-width="4"/>
    <text x="148" y="457" font-size="13" fill="#1a1a1a">붉은 선이 1차 밀봉면. 여기에 1㎛ 안팎의 유막이 형성된다.</text>
  </g>
</svg>
