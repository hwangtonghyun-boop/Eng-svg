<svg viewBox="0 0 900 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="API 610 원심 펌프 타입 분류 체계 - OH, BB, VS 계열" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>API 610 펌프 타입 분류</title>

  <g font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif">

    <!-- 루트 -->
    <rect x="350" y="30" width="200" height="40" rx="6" fill="#2c3e50"/>
    <text x="450" y="56" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">API 610 원심 펌프</text>

    <path d="M 450 70 L 450 88" stroke="#5b6673" stroke-width="1.8" fill="none"/>
    <path d="M 160 88 L 740 88" stroke="#5b6673" stroke-width="1.8" fill="none"/>
    <path d="M 160 88 L 160 105" stroke="#5b6673" stroke-width="1.8" fill="none"/>
    <path d="M 450 88 L 450 105" stroke="#5b6673" stroke-width="1.8" fill="none"/>
    <path d="M 740 88 L 740 105" stroke="#5b6673" stroke-width="1.8" fill="none"/>

    <!-- ============ OH ============ -->
    <rect x="20" y="100" width="280" height="390" rx="8" fill="#fafbfc" stroke="#dfe4e8"/>
    <rect x="30" y="105" width="260" height="70" rx="6" fill="#dce8f2" stroke="#44546a" stroke-width="1.6"/>
    <text x="160" y="133" font-size="20" font-weight="700" fill="#1a3a52" text-anchor="middle">OH</text>
    <text x="160" y="151" font-size="10.5" fill="#1a3a52" text-anchor="middle">Overhung · 외팔보형</text>
    <text x="160" y="167" font-size="10.5" fill="#1a1a1a" text-anchor="middle">임펠러가 베어링 바깥에</text>

    <rect x="36" y="186" width="248" height="22" rx="3" fill="#c4d8e8"/>
    <text x="46" y="201" font-size="11" font-weight="700" fill="#123049">플렉시블 커플링</text>

    <rect x="42" y="212" width="236" height="26" rx="3" fill="#ffffff" stroke="#dfe4e8"/>
    <text x="52" y="229" font-size="12" font-weight="700" fill="#1a3a52">OH1</text>
    <text x="98" y="229" font-size="10.5" fill="#1a1a1a">수평 · 발 지지</text>

    <rect x="42" y="240" width="236" height="26" rx="3" fill="#ffffff" stroke="#dfe4e8"/>
    <text x="52" y="257" font-size="12" font-weight="700" fill="#1a3a52">OH2</text>
    <text x="98" y="257" font-size="10.5" fill="#1a1a1a">수평 · 중심선 지지</text>

    <rect x="42" y="268" width="236" height="26" rx="3" fill="#ffffff" stroke="#dfe4e8"/>
    <text x="52" y="285" font-size="12" font-weight="700" fill="#1a3a52">OH3</text>
    <text x="98" y="285" font-size="10.5" fill="#1a1a1a">수직 인라인 · 자체 베어링</text>

    <rect x="36" y="302" width="248" height="22" rx="3" fill="#c4d8e8"/>
    <text x="46" y="317" font-size="11" font-weight="700" fill="#123049">리지드 커플링</text>

    <rect x="42" y="328" width="236" height="26" rx="3" fill="#ffffff" stroke="#dfe4e8"/>
    <text x="52" y="345" font-size="12" font-weight="700" fill="#1a3a52">OH4</text>
    <text x="98" y="345" font-size="10.5" fill="#1a1a1a">수직 인라인 · 모터 베어링</text>

    <rect x="36" y="362" width="248" height="22" rx="3" fill="#c4d8e8"/>
    <text x="46" y="377" font-size="11" font-weight="700" fill="#123049">직결 · 기어 일체</text>

    <rect x="42" y="388" width="236" height="26" rx="3" fill="#ffffff" stroke="#dfe4e8"/>
    <text x="52" y="405" font-size="12" font-weight="700" fill="#1a3a52">OH5</text>
    <text x="98" y="405" font-size="10.5" fill="#1a1a1a">수직 인라인 · 모터 직결</text>

    <rect x="42" y="416" width="236" height="26" rx="3" fill="#ffffff" stroke="#dfe4e8"/>
    <text x="52" y="433" font-size="12" font-weight="700" fill="#1a3a52">OH6</text>
    <text x="98" y="433" font-size="10.5" fill="#1a1a1a">증속 기어 내장 고속형</text>

    <text x="160" y="470" font-size="10.5" font-weight="700" fill="#123049" text-anchor="middle">방향과 커플링으로 갈린다</text>

    <!-- ============ BB ============ -->
    <rect x="310" y="100" width="280" height="390" rx="8" fill="#fafbfc" stroke="#dfe4e8"/>
    <rect x="320" y="105" width="260" height="70" rx="6" fill="#e5efe3" stroke="#44546a" stroke-width="1.6"/>
    <text x="450" y="133" font-size="20" font-weight="700" fill="#25441f" text-anchor="middle">BB</text>
    <text x="450" y="151" font-size="10.5" fill="#25441f" text-anchor="middle">Between Bearings · 양단 지지형</text>
    <text x="450" y="167" font-size="10.5" fill="#1a1a1a" text-anchor="middle">임펠러가 베어링 사이에</text>

    <rect x="326" y="186" width="248" height="22" rx="3" fill="#cfe0cb"/>
    <text x="336" y="201" font-size="11" font-weight="700" fill="#1e3a19">1단 · 2단</text>

    <rect x="332" y="212" width="236" height="26" rx="3" fill="#ffffff" stroke="#dfe4e8"/>
    <text x="342" y="229" font-size="12" font-weight="700" fill="#25441f">BB1</text>
    <text x="388" y="229" font-size="10.5" fill="#1a1a1a">축방향 분할 · 통상 양흡입</text>

    <rect x="332" y="240" width="236" height="26" rx="3" fill="#ffffff" stroke="#dfe4e8"/>
    <text x="342" y="257" font-size="12" font-weight="700" fill="#25441f">BB2</text>
    <text x="388" y="257" font-size="10.5" fill="#1a1a1a">방사형 분할</text>

    <rect x="326" y="274" width="248" height="22" rx="3" fill="#cfe0cb"/>
    <text x="336" y="289" font-size="11" font-weight="700" fill="#1e3a19">다단</text>

    <rect x="332" y="300" width="236" height="26" rx="3" fill="#ffffff" stroke="#dfe4e8"/>
    <text x="342" y="317" font-size="12" font-weight="700" fill="#25441f">BB3</text>
    <text x="388" y="317" font-size="10.5" fill="#1a1a1a">축방향 분할 · 대향 임펠러</text>

    <rect x="332" y="328" width="236" height="26" rx="3" fill="#fdf3e0" stroke="#dcc191"/>
    <text x="342" y="345" font-size="12" font-weight="700" fill="#7a5a24">BB4</text>
    <text x="388" y="345" font-size="10.5" fill="#1a1a1a">방사형 분할 · 링 섹션</text>

    <rect x="332" y="356" width="236" height="26" rx="3" fill="#ffffff" stroke="#dfe4e8"/>
    <text x="342" y="373" font-size="12" font-weight="700" fill="#25441f">BB5</text>
    <text x="388" y="373" font-size="10.5" fill="#1a1a1a">이중 케이싱 · 배럴</text>

    <rect x="332" y="394" width="236" height="40" rx="3" fill="#fbe9e7" stroke="#d9a9a2"/>
    <text x="342" y="411" font-size="10" font-weight="700" fill="#a03228">BB4 주의</text>
    <text x="342" y="427" font-size="9.5" fill="#7b3f38">방사형이지만 위험 공정에서는 배제된다</text>

    <text x="450" y="470" font-size="10.5" font-weight="700" fill="#1e3a19" text-anchor="middle">단수와 케이싱 분할로 갈린다</text>

    <!-- ============ VS ============ -->
    <rect x="600" y="100" width="280" height="390" rx="8" fill="#fafbfc" stroke="#dfe4e8"/>
    <rect x="610" y="105" width="260" height="70" rx="6" fill="#f4e9d8" stroke="#44546a" stroke-width="1.6"/>
    <text x="740" y="133" font-size="20" font-weight="700" fill="#5c4610" text-anchor="middle">VS</text>
    <text x="740" y="151" font-size="10.5" fill="#5c4610" text-anchor="middle">Vertically Suspended · 수직 매설형</text>
    <text x="740" y="167" font-size="10.5" fill="#1a1a1a" text-anchor="middle">구동부는 지상, 펌프부는 침적</text>

    <rect x="616" y="186" width="248" height="22" rx="3" fill="#ead9be"/>
    <text x="626" y="201" font-size="11" font-weight="700" fill="#4d3d0f">단일 케이싱 · 칼럼 토출</text>

    <rect x="622" y="212" width="236" height="26" rx="3" fill="#ffffff" stroke="#dfe4e8"/>
    <text x="632" y="229" font-size="12" font-weight="700" fill="#5c4610">VS1</text>
    <text x="678" y="229" font-size="10.5" fill="#1a1a1a">디퓨저</text>

    <rect x="622" y="240" width="236" height="26" rx="3" fill="#ffffff" stroke="#dfe4e8"/>
    <text x="632" y="257" font-size="12" font-weight="700" fill="#5c4610">VS2</text>
    <text x="678" y="257" font-size="10.5" fill="#1a1a1a">볼류트</text>

    <rect x="622" y="268" width="236" height="26" rx="3" fill="#ffffff" stroke="#dfe4e8"/>
    <text x="632" y="285" font-size="12" font-weight="700" fill="#5c4610">VS3</text>
    <text x="678" y="285" font-size="10.5" fill="#1a1a1a">축류</text>

    <rect x="616" y="302" width="248" height="22" rx="3" fill="#ead9be"/>
    <text x="626" y="317" font-size="11" font-weight="700" fill="#4d3d0f">단일 케이싱 · 별도 토출</text>

    <rect x="622" y="328" width="236" height="26" rx="3" fill="#ffffff" stroke="#dfe4e8"/>
    <text x="632" y="345" font-size="12" font-weight="700" fill="#5c4610">VS4</text>
    <text x="678" y="345" font-size="10.5" fill="#1a1a1a">라인샤프트 · 침적 베어링</text>

    <rect x="622" y="356" width="236" height="26" rx="3" fill="#ffffff" stroke="#dfe4e8"/>
    <text x="632" y="373" font-size="12" font-weight="700" fill="#5c4610">VS5</text>
    <text x="678" y="373" font-size="10.5" fill="#1a1a1a">캔틸레버 · 침적 베어링 없음</text>

    <rect x="616" y="390" width="248" height="22" rx="3" fill="#ead9be"/>
    <text x="626" y="405" font-size="11" font-weight="700" fill="#4d3d0f">이중 케이싱 (Can)</text>

    <rect x="622" y="416" width="236" height="26" rx="3" fill="#ffffff" stroke="#dfe4e8"/>
    <text x="632" y="433" font-size="12" font-weight="700" fill="#5c4610">VS6</text>
    <text x="678" y="433" font-size="10.5" fill="#1a1a1a">캔 + 디퓨저</text>

    <rect x="622" y="444" width="236" height="26" rx="3" fill="#ffffff" stroke="#dfe4e8"/>
    <text x="632" y="461" font-size="12" font-weight="700" fill="#5c4610">VS7</text>
    <text x="678" y="461" font-size="10.5" fill="#1a1a1a">캔 + 볼류트</text>

    <!-- 캡션 -->
    <text x="20" y="515" font-size="13" fill="#1a1a1a">
      세 계열은 회전체를 어떻게 지지하는가로 갈린다. 그 다음 숫자가 구분하는 축은 계열마다 다르다.
    </text>
    <text x="20" y="537" font-size="13" fill="#1a1a1a">
      OH는 방향과 커플링, BB는 단수와 케이싱 분할, VS는 케이싱 수와 토출 경로를 나눈다.
    </text>
  </g>
</svg>
