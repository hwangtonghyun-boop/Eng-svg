<svg viewBox="0 0 900 410" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="같은 기계라도 측정 조건에 따라 값이 달라지고, 같은 진동도 RMS와 피크로 다르게 표현된다" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>같은 기계, 다른 숫자</title>

  <defs>
    <marker id="cmpArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c1500a"/>
    </marker>
  </defs>

  <g font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif">

    <!-- ============ ① 조건이 바뀌면 ============ -->
    <rect x="20" y="30" width="540" height="310" rx="8" fill="#fafbfc" stroke="#dfe4e8"/>
    <text x="40" y="58" font-size="14" font-weight="700" fill="#2c3e50">① 조건이 바뀌면 값이 달라진다</text>
    <text x="40" y="76" font-size="10.5" fill="#1f2933">같은 기계를 서로 다른 조건에서 측정한 결과</text>

    <line x1="80" y1="100" x2="80" y2="290" stroke="#1a1a1a" stroke-width="1.6"/>
    <line x1="80" y1="290" x2="530" y2="290" stroke="#1a1a1a" stroke-width="1.6"/>
    <text x="64" y="195" font-size="10.5" fill="#1a1a1a" transform="rotate(-90 64 195)" text-anchor="middle">진동값</text>

    <line x1="80" y1="125" x2="530" y2="125" stroke="#c1500a" stroke-width="1.8" stroke-dasharray="7 4"/>
    <text x="438" y="119" font-size="10.5" font-weight="700" fill="#8a3a08">완화 한계 (POR 밖)</text>

    <line x1="80" y1="160" x2="530" y2="160" stroke="#2f6b3a" stroke-width="1.8" stroke-dasharray="7 4"/>
    <text x="438" y="154" font-size="10.5" font-weight="700" fill="#2f6b3a">기본 한계 (POR 안)</text>

    <rect x="130" y="210" width="60" height="80" fill="#7f95a6" stroke="#44546a" stroke-width="1.4"/>
    <rect x="250" y="175" width="60" height="115" fill="#6b8194" stroke="#44546a" stroke-width="1.4"/>
    <rect x="370" y="140" width="60" height="150" fill="#dcc191" stroke="#a8862b" stroke-width="1.4"/>

    <text x="160" y="308" font-size="10.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">공장 시험</text>
    <text x="160" y="322" font-size="9.5" fill="#1a1a1a" text-anchor="middle">POR · 배관 없음</text>
    <text x="280" y="308" font-size="10.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">현장 설치</text>
    <text x="280" y="322" font-size="9.5" fill="#1a1a1a" text-anchor="middle">POR · 배관 체결</text>
    <text x="400" y="308" font-size="10.5" font-weight="700" fill="#8a3a08" text-anchor="middle">현장 · POR 밖</text>
    <text x="400" y="322" font-size="9.5" fill="#8a3a08" text-anchor="middle">저유량 운전</text>

    <!-- ============ ② 같은 값, 다른 표현 ============ -->
    <rect x="580" y="30" width="300" height="310" rx="8" fill="#fdf6e9" stroke="#e8dcc0"/>
    <text x="600" y="58" font-size="14" font-weight="700" fill="#2c3e50">② 같은 값, 다른 표현</text>
    <text x="600" y="76" font-size="10.5" fill="#1f2933">단위를 확인하지 않으면</text>

    <line x1="620" y1="100" x2="620" y2="290" stroke="#1a1a1a" stroke-width="1.6"/>
    <line x1="620" y1="290" x2="860" y2="290" stroke="#1a1a1a" stroke-width="1.6"/>

    <rect x="655" y="200" width="55" height="90" fill="#6b8194" stroke="#44546a" stroke-width="1.4"/>
    <rect x="765" y="163" width="55" height="127" fill="#6b8194" stroke="#44546a" stroke-width="1.4"/>

    <path d="M 715 198 L 760 165" stroke="#c1500a" stroke-width="2.4" marker-end="url(#cmpArrow)"/>
    <text x="737" y="148" font-size="13" font-weight="700" fill="#8a3a08" text-anchor="middle">× 1.41</text>

    <text x="682" y="308" font-size="11" font-weight="700" fill="#1a1a1a" text-anchor="middle">RMS</text>
    <text x="792" y="308" font-size="11" font-weight="700" fill="#1a1a1a" text-anchor="middle">피크</text>

    <text x="600" y="330" font-size="10.5" font-weight="700" fill="#8a3a08">진동은 그대로다. 표현만 달라졌다</text>

    <!-- 캡션 -->
    <text x="20" y="370" font-size="13" fill="#1a1a1a">
      왼쪽 세 막대는 모두 같은 기계다. 배관을 물리면 오르고, 운전점을 벗어나면 더 오른다. 대신 적용되는 한계선도 달라진다.
    </text>
    <text x="20" y="392" font-size="13" fill="#1a1a1a">
      오른쪽 두 막대도 같은 진동이다. RMS인지 피크인지 확인하지 않고 숫자만 비교하면 40% 넘게 어긋난다.
    </text>
  </g>
</svg>
