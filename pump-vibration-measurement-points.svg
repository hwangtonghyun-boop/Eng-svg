<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 680 400" xmlns="http://www.w3.org/2000/svg" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif"><rect width="680" height="400" fill="#fff"/><defs><marker id="ar" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9z" fill="#c0392b"/></marker></defs>
<text x="200" y="28" font-size="15" font-weight="bold" text-anchor="middle">하우징 진동: 베어링마다 H·V·A</text>
<rect x="40" y="150" width="140" height="70" rx="6" fill="#e8a33d" stroke="#555"/><text x="110" y="190" font-size="13" text-anchor="middle">모터</text>
<line x1="180" y1="185" x2="230" y2="185" stroke="#333" stroke-width="6"/>
<rect x="230" y="160" width="60" height="50" rx="4" fill="#ddd" stroke="#555"/><text x="260" y="232" font-size="11" text-anchor="middle">펌프 DE 베어링</text>
<circle cx="340" cy="185" r="38" fill="#9db8d8" stroke="#555"/><text x="340" y="190" font-size="13" text-anchor="middle">펌프</text>
<rect x="390" y="160" width="60" height="50" rx="4" fill="#ddd" stroke="#555"/><text x="420" y="232" font-size="11" text-anchor="middle">펌프 NDE 베어링</text>
<line x1="260" y1="160" x2="260" y2="115" stroke="#c0392b" stroke-width="2.5" marker-end="url(#ar)"/><text x="260" y="109" font-size="12" fill="#c0392b" text-anchor="middle">V (수직)</text>
<line x1="230" y1="195" x2="200" y2="235" stroke="#c0392b" stroke-width="2.5" marker-end="url(#ar)"/><text x="194" y="251" font-size="12" fill="#c0392b" text-anchor="end">H (수평)</text>


<line x1="450" y1="185" x2="470" y2="185" stroke="#c0392b" stroke-width="2.5" marker-end="url(#ar)"/><text x="458" y="255" font-size="12" fill="#c0392b" text-anchor="middle">A (축 방향)</text>
<line x1="420" y1="160" x2="420" y2="115" stroke="#c0392b" stroke-width="2.5" marker-end="url(#ar)"/><text x="420" y="109" font-size="12" fill="#c0392b" text-anchor="middle">V</text>
<rect x="40" y="270" width="320" height="110" rx="8" fill="#f5f8fc"/>
<text x="55" y="295" font-size="12">· 센서: 가속도계 또는 속도 센서</text>
<text x="55" y="317" font-size="12">· 단위: 속도 mm/s RMS (전체값·스펙트럼)</text>
<text x="55" y="339" font-size="12">· 베어링 결함 → 고주파 가속도로 확인</text>
<text x="55" y="361" font-size="12">· 같은 위치를 표시해 두고 추세 관리</text>
<text x="545" y="28" font-size="15" font-weight="bold" text-anchor="middle">축 진동: 프록시미티 프로브</text>
<circle cx="545" cy="190" r="70" fill="#f3f3f3" stroke="#555"/>
<circle cx="545" cy="190" r="34" fill="#9db8d8" stroke="#1f5fa8" stroke-width="2"/>
<text x="545" y="195" font-size="12" text-anchor="middle">축</text>
<g transform="rotate(-45 545 190)"><rect x="539" y="100" width="12" height="40" fill="#555"/></g>
<g transform="rotate(45 545 190)"><rect x="539" y="100" width="12" height="40" fill="#555"/></g>
<text x="470" y="110" font-size="12" text-anchor="middle">X 프로브</text><text x="620" y="110" font-size="12" text-anchor="middle">Y 프로브</text>
<text x="545" y="280" font-size="12" text-anchor="middle" fill="#555">두 프로브를 90° 간격으로 설치</text>
<text x="545" y="300" font-size="12" text-anchor="middle" fill="#555">→ 축의 실제 궤적(오빗)과 위치</text>
<text x="545" y="320" font-size="12" text-anchor="middle" fill="#555">단위: µm p-p (축과 베어링의 상대 변위)</text>
</svg>