<svg viewBox="0 0 900 815" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="공정 펌프 4단계 선정 플로차트" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>공정 펌프 선정 4단계 흐름</title>

  <defs>
    <marker id="fArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6673"/>
    </marker>
  </defs>

  <g font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif">

    <!-- 단계 배경 -->
    <rect x="15" y="78" width="870" height="154" rx="6" fill="#fafbfc"/>
    <rect x="15" y="248" width="870" height="164" rx="6" fill="#f4f7f8"/>
    <rect x="15" y="428" width="870" height="174" rx="6" fill="#fafbfc"/>
    <rect x="15" y="618" width="870" height="98" rx="6" fill="#f4f7f8"/>

    <!-- 단계 라벨 -->
    <text x="60" y="146" font-size="13" font-weight="700" fill="#1a1a1a" text-anchor="middle">1단계</text>
    <text x="60" y="166" font-size="11" fill="#1f2933" text-anchor="middle">흡입 조건</text>
    <text x="60" y="316" font-size="13" font-weight="700" fill="#1a1a1a" text-anchor="middle">2단계</text>
    <text x="60" y="336" font-size="11" fill="#1f2933" text-anchor="middle">온도</text>
    <text x="60" y="496" font-size="13" font-weight="700" fill="#1a1a1a" text-anchor="middle">3단계</text>
    <text x="60" y="516" font-size="11" fill="#1f2933" text-anchor="middle">압력·위험도</text>
    <text x="60" y="666" font-size="13" font-weight="700" fill="#1a1a1a" text-anchor="middle">4단계</text>
    <text x="60" y="686" font-size="11" fill="#1f2933" text-anchor="middle">유량·양정</text>

    <!-- 입력 -->
    <rect x="110" y="25" width="410" height="40" rx="6" fill="#eef2f5" stroke="#7a8794" stroke-width="1.4"/>
    <text x="315" y="50" font-size="13" font-weight="600" fill="#2c3e50" text-anchor="middle">공정 데이터 입력 — Q, H, T, P, NPSHa, 유체 특성</text>
    <path d="M 270 65 L 270 114" stroke="#5b6673" stroke-width="1.8" marker-end="url(#fArrow)"/>

    <!-- ===== 1단계 ===== -->
    <rect x="110" y="120" width="320" height="65" rx="6" fill="#dfe6eb" stroke="#5b6673" stroke-width="1.6"/>
    <text x="270" y="148" font-size="13" font-weight="700" fill="#2c3e50" text-anchor="middle">NPSHa가 극도로 부족하거나</text>
    <text x="270" y="170" font-size="13" font-weight="700" fill="#2c3e50" text-anchor="middle">지하 섬프에서 배액하는가?</text>

    <path d="M 430 152 L 545 152" stroke="#5b6673" stroke-width="1.6" fill="none"/>
    <path d="M 545 102 L 545 202" stroke="#5b6673" stroke-width="1.6" fill="none"/>
    <path d="M 545 102 L 556 102" stroke="#5b6673" stroke-width="1.6" marker-end="url(#fArrow)"/>
    <path d="M 545 152 L 556 152" stroke="#5b6673" stroke-width="1.6" marker-end="url(#fArrow)"/>
    <path d="M 545 202 L 556 202" stroke="#5b6673" stroke-width="1.6" marker-end="url(#fArrow)"/>

    <rect x="560" y="82" width="320" height="40" rx="6" fill="#eaf1f7" stroke="#a9c3d9" stroke-width="1.4"/>
    <text x="576" y="100" font-size="13" font-weight="700" fill="#24567f">VS6 (Double Casing Can)</text>
    <text x="576" y="116" font-size="11" fill="#123049">임펠러를 지하로 매설해 정수두 확보</text>

    <rect x="560" y="132" width="320" height="40" rx="6" fill="#eaf1f7" stroke="#a9c3d9" stroke-width="1.4"/>
    <text x="576" y="150" font-size="13" font-weight="700" fill="#24567f">VS4 (라인샤프트)</text>
    <text x="576" y="166" font-size="11" fill="#123049">청정 배액 — 수조 내 베어링 허용</text>

    <rect x="560" y="182" width="320" height="40" rx="6" fill="#eaf1f7" stroke="#a9c3d9" stroke-width="1.4"/>
    <text x="576" y="200" font-size="13" font-weight="700" fill="#24567f">VS5 (캔틸레버)</text>
    <text x="576" y="216" font-size="11" fill="#123049">슬러지·고형물 — 수조 내 베어링 없음</text>

    <path d="M 270 185 L 270 284" stroke="#5b6673" stroke-width="1.8" marker-end="url(#fArrow)"/>
    <text x="282" y="240" font-size="11.5" fill="#1f2933">해당 없음 → 수평형으로 진행</text>

    <!-- ===== 2단계 ===== -->
    <rect x="110" y="290" width="320" height="65" rx="6" fill="#dfe6eb" stroke="#5b6673" stroke-width="1.6"/>
    <text x="270" y="318" font-size="13" font-weight="700" fill="#2c3e50" text-anchor="middle">운전 온도가</text>
    <text x="270" y="340" font-size="13" font-weight="700" fill="#2c3e50" text-anchor="middle">어느 구간인가?</text>

    <path d="M 430 322 L 545 322" stroke="#5b6673" stroke-width="1.6" fill="none"/>
    <path d="M 545 275 L 545 375" stroke="#5b6673" stroke-width="1.6" fill="none"/>
    <path d="M 545 275 L 556 275" stroke="#5b6673" stroke-width="1.6" marker-end="url(#fArrow)"/>
    <path d="M 545 325 L 556 325" stroke="#5b6673" stroke-width="1.6" marker-end="url(#fArrow)"/>
    <path d="M 545 375 L 556 375" stroke="#5b6673" stroke-width="1.6" marker-end="url(#fArrow)"/>

    <rect x="560" y="255" width="320" height="40" rx="6" fill="#f2f6f2" stroke="#b8ccb5" stroke-width="1.4"/>
    <text x="576" y="273" font-size="13" font-weight="700" fill="#3f6139">저온 · 상온</text>
    <text x="576" y="289" font-size="11" fill="#1e3a19">OH1도 가능하나 OH2가 사실상 표준</text>

    <rect x="560" y="305" width="320" height="40" rx="6" fill="#f2f6f2" stroke="#b8ccb5" stroke-width="1.4"/>
    <text x="576" y="323" font-size="13" font-weight="700" fill="#3f6139">고온</text>
    <text x="576" y="339" font-size="11" fill="#1e3a19">중심선 지지 필수 — OH2 또는 BB2</text>

    <rect x="560" y="355" width="320" height="40" rx="6" fill="#f2f6f2" stroke="#b8ccb5" stroke-width="1.4"/>
    <text x="576" y="373" font-size="13" font-weight="700" fill="#3f6139">초고온 · 열충격</text>
    <text x="576" y="389" font-size="11" fill="#1e3a19">방사형 분할 필수 — BB1 · BB3 배제</text>

    <path d="M 270 355 L 270 464" stroke="#5b6673" stroke-width="1.8" marker-end="url(#fArrow)"/>
    <text x="282" y="412" font-size="11.5" fill="#1f2933">제약 적용 후 계속</text>

    <!-- ===== 3단계 ===== -->
    <rect x="110" y="470" width="320" height="65" rx="6" fill="#dfe6eb" stroke="#5b6673" stroke-width="1.6"/>
    <text x="270" y="498" font-size="13" font-weight="700" fill="#2c3e50" text-anchor="middle">압력과 유체 위험도가</text>
    <text x="270" y="520" font-size="13" font-weight="700" fill="#2c3e50" text-anchor="middle">어느 수준인가?</text>

    <path d="M 430 502 L 545 502" stroke="#5b6673" stroke-width="1.6" fill="none"/>
    <path d="M 545 460 L 545 560" stroke="#5b6673" stroke-width="1.6" fill="none"/>
    <path d="M 545 460 L 556 460" stroke="#5b6673" stroke-width="1.6" marker-end="url(#fArrow)"/>
    <path d="M 545 510 L 556 510" stroke="#5b6673" stroke-width="1.6" marker-end="url(#fArrow)"/>
    <path d="M 545 560 L 556 560" stroke="#5b6673" stroke-width="1.6" marker-end="url(#fArrow)"/>

    <rect x="560" y="440" width="320" height="40" rx="6" fill="#eef6ed" stroke="#a8c9a2" stroke-width="1.4"/>
    <text x="576" y="458" font-size="13" font-weight="700" fill="#3f6139">중·저압 · 비등점 높은 유체</text>
    <text x="576" y="474" font-size="11" fill="#1e3a19">축방향 분할 — BB1 / BB3</text>

    <rect x="560" y="490" width="320" height="40" rx="6" fill="#fdf3e0" stroke="#dcc191" stroke-width="1.4"/>
    <text x="576" y="508" font-size="13" font-weight="700" fill="#7a5a24">고압 또는 가연성 저비중</text>
    <text x="576" y="524" font-size="11" fill="#4d3d0f">방사형 분할 — BB2</text>

    <rect x="560" y="540" width="320" height="40" rx="6" fill="#fbe9e7" stroke="#d9a9a2" stroke-width="1.4"/>
    <text x="576" y="558" font-size="13" font-weight="700" fill="#a03228">초고압 · 수소화 · 고압 BFW</text>
    <text x="576" y="574" font-size="11" fill="#5c221b">이중 케이싱 — BB5</text>

    <path d="M 270 535 L 270 639" stroke="#5b6673" stroke-width="1.8" marker-end="url(#fArrow)"/>
    <text x="282" y="590" font-size="11.5" fill="#1f2933">제약 적용 후 계속</text>

    <!-- ===== 4단계 ===== -->
    <rect x="110" y="645" width="320" height="55" rx="6" fill="#dfe6eb" stroke="#5b6673" stroke-width="1.6"/>
    <text x="270" y="668" font-size="13" font-weight="700" fill="#2c3e50" text-anchor="middle">유량 · 양정 매핑</text>
    <text x="270" y="688" font-size="12" fill="#1a1a1a" text-anchor="middle">단단으로 되는가, 다단이 필요한가</text>

    <path d="M 430 672 L 545 672" stroke="#5b6673" stroke-width="1.6" fill="none"/>
    <path d="M 545 640 L 545 690" stroke="#5b6673" stroke-width="1.6" fill="none"/>
    <path d="M 545 640 L 556 640" stroke="#5b6673" stroke-width="1.6" marker-end="url(#fArrow)"/>
    <path d="M 545 690 L 556 690" stroke="#5b6673" stroke-width="1.6" marker-end="url(#fArrow)"/>

    <rect x="560" y="620" width="320" height="40" rx="6" fill="#eef2f5" stroke="#7a8794" stroke-width="1.4"/>
    <text x="576" y="638" font-size="13" font-weight="700" fill="#2c3e50">단단</text>
    <text x="576" y="654" font-size="11" fill="#1a1a1a">OH2 → 오버행 처짐 한계 시 BB1 / BB2</text>

    <rect x="560" y="670" width="320" height="40" rx="6" fill="#eef2f5" stroke="#7a8794" stroke-width="1.4"/>
    <text x="576" y="688" font-size="13" font-weight="700" fill="#2c3e50">다단</text>
    <text x="576" y="704" font-size="11" fill="#1a1a1a">BB3 → 초고압 · 고온이면 BB5</text>

    <!-- ===== 경고 ===== -->
    <rect x="110" y="735" width="770" height="55" rx="6" fill="#fbe9e7" stroke="#c0392b" stroke-width="1.6"/>
    <text x="130" y="757" font-size="13.5" font-weight="700" fill="#a03228">BB4 주의</text>
    <text x="130" y="777" font-size="12.5" fill="#5c221b">방사형 분할이라는 이유만으로 BB4를 고르면 안 된다. 단마다 밀봉 조인트가 생겨 위험 공정에서는 배제된다.</text>

  </g>
</svg>
