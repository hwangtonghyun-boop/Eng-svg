<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 680 290" xmlns="http://www.w3.org/2000/svg" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif"><rect width="680" height="290" fill="#fff"/>
<text x="170" y="30" font-size="15" font-weight="bold" text-anchor="middle">정지·냉간 (정렬 작업 시점)</text><rect x="20" y="200" width="300" height="14" fill="#bbb"/><rect x="30" y="110" width="120" height="90" rx="6" fill="#9db8d8" stroke="#555"/><text x="90.0" y="160.0" font-size="13" text-anchor="middle">고온 펌프</text><rect x="190" y="96" width="120" height="104" rx="6" fill="#e8a33d" stroke="#555"/><text x="250.0" y="153.0" font-size="13" text-anchor="middle">모터</text><line x1="90" y1="135" x2="170" y2="135" stroke="#1f5fa8" stroke-width="5"/><line x1="170" y1="121" x2="250" y2="121" stroke="#a46a00" stroke-width="5"/><text x="170" y="245" font-size="13" text-anchor="middle" fill="#c0392b">모터를 일부러 높게 세팅 (콜드 오프셋)</text>
<text x="340" y="150" font-size="26" text-anchor="middle" fill="#444">→</text>
<text x="510" y="30" font-size="15" font-weight="bold" text-anchor="middle">운전·열간</text><rect x="360" y="200" width="300" height="14" fill="#bbb"/><rect x="370" y="96" width="120" height="104" rx="6" fill="#9db8d8" stroke="#555"/><text x="430.0" y="153.0" font-size="13" text-anchor="middle">고온 펌프</text><rect x="530" y="96" width="120" height="104" rx="6" fill="#e8a33d" stroke="#555"/><text x="590.0" y="153.0" font-size="13" text-anchor="middle">모터</text><line x1="430" y1="121" x2="510" y2="121" stroke="#1f5fa8" stroke-width="5"/><line x1="510" y1="121" x2="590" y2="121" stroke="#a46a00" stroke-width="5"/><text x="510" y="245" font-size="13" text-anchor="middle" fill="#2e8b57">펌프가 열팽창으로 올라와 축이 일직선</text>
<text x="340" y="275" font-size="12" text-anchor="middle" fill="#555">높이 차이는 이해를 돕기 위해 과장해 그렸다.</text>
</svg>