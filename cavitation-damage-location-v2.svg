<svg viewBox="0 0 900 680" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="임펠러 날개 단면에서 NPSH 부족 캐비테이션과 흡입 재순환 캐비테이션의 침식 위치 비교" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>캐비테이션 유형별 임펠러 날개 침식 위치</title>

  <defs>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3d7ab8"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c0392b"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7a8794"/>
    </marker>
  </defs>

  <g font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif">

    <!-- ================= PANEL A ================= -->
    <rect x="18" y="70" width="424" height="530" rx="8" fill="#fafbfc" stroke="#dfe4e8" stroke-width="1"/>
    <text x="40" y="106" font-size="19" font-weight="700" fill="#2c3e50">① NPSH 부족 캐비테이션</text>
    <text x="40" y="130" font-size="14" fill="#1f2933">정격 유량 부근 · 흡입 압력 부족</text>

    <!-- 인접 날개 -->
    <path d="M 134 294 Q 218 270 308.4 175.6 L 316.4 190 Q 228.4 292.4 134 294 Z"
          fill="#c8d2da" stroke="#aab6c0" stroke-width="1.4"/>
    <text x="330" y="230" font-size="12" fill="#1f2933">인접 날개</text>

    <!-- 주 날개 -->
    <path d="M 134 454 Q 218 430 308.4 335.6 L 316.4 350 Q 228.4 452.4 134 454 Z"
          fill="#44546a" stroke="#2f3d4f" stroke-width="1.4"/>

    <!-- 유입 유동 (정상 입사각) -->
    <path d="M 45 330 L 125 316" stroke="#3d7ab8" stroke-width="2.6" fill="none" marker-end="url(#arrowBlue)"/>
    <path d="M 45 388 L 125 374" stroke="#3d7ab8" stroke-width="2.6" fill="none" marker-end="url(#arrowBlue)"/>
    <path d="M 45 446 L 125 432" stroke="#3d7ab8" stroke-width="2.6" fill="none" marker-end="url(#arrowBlue)"/>
    <text x="45" y="530" font-size="13" fill="#3d7ab8">유입 유동 (정상 입사각)</text>

    <!-- 침식부: 부압면 -->
    <path d="M 167.6 441.6 Q 188.4 430 210.8 418" stroke="#e74c3c" stroke-width="10"
          stroke-linecap="round" fill="none" opacity="0.9"/>

    <!-- 침식 주석 -->
    <text x="48" y="226" font-size="14" font-weight="700" fill="#c0392b">부압면 침식</text>
    <text x="48" y="246" font-size="12.5" fill="#5c221b">리딩엣지 하류 · 기포 붕괴부</text>
    <path d="M 100 254 L 200 424" stroke="#c0392b" stroke-width="1.4" fill="none"/>
    <circle cx="100" cy="254" r="3" fill="#c0392b"/>

    <!-- 면 표기 -->
    <text x="200" y="398" font-size="12.5" fill="#1a1a1a">부압면 (Suction Side)</text>
    <text x="245" y="468" font-size="12.5" fill="#1a1a1a">압력면 (Pressure Side)</text>

    <!-- 회전 방향 -->
    <path d="M 400 380 L 400 430" stroke="#7a8794" stroke-width="2" fill="none" marker-end="url(#arrowGray)"/>
    <text x="372" y="370" font-size="11.5" fill="#1f2933">회전 방향</text>

    <!-- ================= PANEL B ================= -->
    <rect x="458" y="70" width="424" height="530" rx="8" fill="#fdf9f8" stroke="#e8d9d6" stroke-width="1"/>
    <text x="480" y="106" font-size="19" font-weight="700" fill="#2c3e50">② 흡입 재순환 캐비테이션</text>
    <text x="480" y="130" font-size="14" fill="#1f2933">저유량 운전 · 흡입비속도가 높을수록 조기 발생</text>

    <g transform="translate(440,0)">
      <!-- 인접 날개 -->
      <path d="M 134 294 Q 218 270 308.4 175.6 L 316.4 190 Q 228.4 292.4 134 294 Z"
            fill="#c8d2da" stroke="#aab6c0" stroke-width="1.4"/>

      <!-- 주 날개 -->
      <path d="M 134 454 Q 218 430 308.4 335.6 L 316.4 350 Q 228.4 452.4 134 454 Z"
            fill="#44546a" stroke="#2f3d4f" stroke-width="1.4"/>

      <!-- 역류 -->
      <path d="M 255 350 L 95 350" stroke="#c0392b" stroke-width="2.8" fill="none"
            stroke-dasharray="9 5" marker-end="url(#arrowRed)"/>
      <text x="118" y="334" font-size="13" font-weight="600" fill="#c0392b">흡입 배관으로 역류</text>

      <!-- 감소된 유입 유동 (과도한 입사각) -->
      <path d="M 60 388 L 128 440" stroke="#3d7ab8" stroke-width="2.6" fill="none" marker-end="url(#arrowBlue)"/>
      <path d="M 60 440 L 124 476" stroke="#3d7ab8" stroke-width="2.6" fill="none" marker-end="url(#arrowBlue)"/>
      <text x="45" y="530" font-size="13" fill="#3d7ab8">감소된 유입 유동</text>

      <!-- 와류 -->
      <path d="M 201 489 A 21 21 0 1 1 172 473" stroke="#c0392b" stroke-width="2.4"
            fill="none" marker-end="url(#arrowRed)"/>

      <!-- 침식부: 압력면 -->
      <path d="M 146.8 454 Q 174 447.6 201.2 439.6" stroke="#e74c3c" stroke-width="10"
            stroke-linecap="round" fill="none" opacity="0.9"/>

      <!-- 침식 주석 -->
      <path d="M 248 504 L 202 450" stroke="#c0392b" stroke-width="1.4" fill="none"/>
      <circle cx="248" cy="504" r="3" fill="#c0392b"/>
      <text x="238" y="524" font-size="14" font-weight="700" fill="#c0392b">압력면 입구 침식</text>
      <text x="238" y="544" font-size="12.5" fill="#5c221b">재순환 와류 충돌부</text>

      <!-- 면 표기 -->
      <text x="245" y="468" font-size="12.5" fill="#1a1a1a">압력면 (Pressure Side)</text>
    </g>

    <!-- 캡션 -->
    <text x="450" y="638" font-size="13.5" fill="#1a1a1a" text-anchor="middle">
      분해 점검 시 침식 위치는 원인을 가르는 결정적 단서다. 부압면이면 흡입 압력 부족, 압력면 입구면 저유량 재순환이다.
    </text>
  </g>
</svg>
