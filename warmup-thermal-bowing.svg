<svg viewBox="0 0 900 410" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="웜업 없이 급가열했을 때의 축 휨과 마모 링 접촉, 그리고 웜업 후 균일 온도 상태 비교" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>웜업이 지키는 것은 간극이다</title>

  <defs>
    <marker id="clrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2f6b3a"/>
    </marker>
  </defs>

  <g font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif">

    <!-- ============ ① 웜업 없이 ============ -->
    <rect x="20" y="30" width="420" height="310" rx="8" fill="#fdf9f8" stroke="#e8d9d6"/>
    <text x="40" y="58" font-size="14" font-weight="700" fill="#2c3e50">① 웜업 없이 급가열</text>
    <text x="40" y="76" font-size="10.5" fill="#1f2933">상부만 데워져 온도차가 생긴다</text>

    <rect x="55" y="130" width="355" height="140" rx="6" fill="none" stroke="#44546a" stroke-width="2.4"/>
    <rect x="57" y="132" width="351" height="68" fill="#fbe9e7"/>
    <rect x="57" y="200" width="351" height="68" fill="#e3edf4"/>
    <line x1="57" y1="200" x2="408" y2="200" stroke="#a8b4bd" stroke-width="1.2" stroke-dasharray="5 3"/>

    <text x="75" y="152" font-size="11" font-weight="700" fill="#a03228">뜨겁다</text>
    <text x="75" y="258" font-size="11" font-weight="700" fill="#1d5a92">차갑다</text>
    <text x="352" y="148" font-size="10" font-weight="700" fill="#1a1a1a">케이싱</text>

    <path d="M 45 205 Q 232 172, 420 205" fill="none" stroke="#44546a" stroke-width="16"/>

    <rect x="149" y="160" width="22" height="25" fill="#6b8194" stroke="#3f4b58" stroke-width="1.2"/>
    <rect x="149" y="225" width="22" height="25" fill="#6b8194" stroke="#3f4b58" stroke-width="1.2"/>
    <rect x="289" y="160" width="22" height="25" fill="#6b8194" stroke="#3f4b58" stroke-width="1.2"/>
    <rect x="289" y="225" width="22" height="25" fill="#6b8194" stroke="#3f4b58" stroke-width="1.2"/>

    <circle cx="160" cy="185" r="11" fill="#e8a33d" opacity="0.55"/>
    <path d="M 160 171 L 160 165 M 147 185 L 141 185 M 173 185 L 179 185" stroke="#c0392b" stroke-width="2.2"/>
    <circle cx="300" cy="185" r="11" fill="#e8a33d" opacity="0.55"/>
    <path d="M 300 171 L 300 165 M 287 185 L 281 185 M 313 185 L 319 185" stroke="#c0392b" stroke-width="2.2"/>

    <text x="160" y="288" font-size="10" font-weight="700" fill="#1a1a1a" text-anchor="middle">마모 링</text>
    <text x="380" y="209" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">축</text>

    <text x="40" y="308" font-size="11" fill="#1a1a1a">상부가 더 팽창해 축이 위로 휜다</text>
    <text x="40" y="326" font-size="11" font-weight="700" fill="#a03228">위쪽 간극이 닫히며 마모 링에 닿는다</text>

    <!-- ============ ② 웜업 후 ============ -->
    <rect x="460" y="30" width="420" height="310" rx="8" fill="#f7fbf7" stroke="#d6e6d4"/>
    <text x="480" y="58" font-size="14" font-weight="700" fill="#2c3e50">② 웜업 완료</text>
    <text x="480" y="76" font-size="10.5" fill="#1f2933">상하 온도가 고르게 맞춰졌다</text>

    <rect x="495" y="130" width="355" height="140" rx="6" fill="none" stroke="#44546a" stroke-width="2.4"/>
    <rect x="497" y="132" width="351" height="136" fill="#fdf3e0"/>

    <text x="515" y="152" font-size="11" font-weight="700" fill="#7a5a24">고르게 데워짐</text>
    <text x="792" y="148" font-size="10" font-weight="700" fill="#1a1a1a">케이싱</text>

    <path d="M 485 205 L 860 205" fill="none" stroke="#44546a" stroke-width="16"/>

    <rect x="589" y="160" width="22" height="25" fill="#6b8194" stroke="#3f4b58" stroke-width="1.2"/>
    <rect x="589" y="225" width="22" height="25" fill="#6b8194" stroke="#3f4b58" stroke-width="1.2"/>
    <rect x="729" y="160" width="22" height="25" fill="#6b8194" stroke="#3f4b58" stroke-width="1.2"/>
    <rect x="729" y="225" width="22" height="25" fill="#6b8194" stroke="#3f4b58" stroke-width="1.2"/>

    <path d="M 600 186 L 600 196" stroke="#2f6b3a" stroke-width="1.8" marker-start="url(#clrA)" marker-end="url(#clrA)"/>
    <path d="M 600 214 L 600 224" stroke="#2f6b3a" stroke-width="1.8" marker-start="url(#clrA)" marker-end="url(#clrA)"/>
    <text x="618" y="196" font-size="10" font-weight="700" fill="#2f6b3a">간극 유지</text>

    <path d="M 740 186 L 740 196" stroke="#2f6b3a" stroke-width="1.8" marker-start="url(#clrA)" marker-end="url(#clrA)"/>
    <path d="M 740 214 L 740 224" stroke="#2f6b3a" stroke-width="1.8" marker-start="url(#clrA)" marker-end="url(#clrA)"/>

    <text x="600" y="288" font-size="10" font-weight="700" fill="#1a1a1a" text-anchor="middle">마모 링</text>
    <text x="820" y="209" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">축</text>

    <text x="480" y="308" font-size="11" fill="#1a1a1a">온도가 고르면 축이 곧게 유지된다</text>
    <text x="480" y="326" font-size="11" font-weight="700" fill="#2f6b3a">위아래 간극이 모두 살아 있다</text>

    <!-- 캡션 -->
    <text x="20" y="370" font-size="13" fill="#1a1a1a">
      간극은 온도가 균일할 때를 전제로 설계되었다. 상하 온도차가 생기면 축이 휘고 그 전제가 무너진다.
    </text>
    <text x="20" y="392" font-size="13" fill="#1a1a1a">
      기동 전 수동 회전 확인이 결정적인 이유가 여기 있다. 온도계는 몇 지점만 보여주지만, 축은 실제 간극 상태를 그대로 알려준다.
    </text>
  </g>
</svg>
