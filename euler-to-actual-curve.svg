<svg viewBox="0 0 900 470" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="오일러 이론 곡선에서 슬립과 손실을 거쳐 실제 성능 곡선이 만들어지는 과정" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>이론 곡선에서 실제 성능 곡선으로</title>

  <g font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif">

    <!-- ============ PANEL A ============ -->
    <rect x="20" y="30" width="420" height="370" rx="8" fill="#fafbfc" stroke="#dfe4e8"/>
    <text x="45" y="62" font-size="15.5" font-weight="700" fill="#2c3e50">① 이론 (오일러) — 형상별 기울기</text>

    <line x1="70" y1="350" x2="415" y2="350" stroke="#1a1a1a" stroke-width="1.6"/>
    <line x1="70" y1="90" x2="70" y2="350" stroke="#1a1a1a" stroke-width="1.6"/>

    <line x1="70" y1="200" x2="350" y2="120" stroke="#c0392b" stroke-width="2.8"/>
    <line x1="70" y1="200" x2="350" y2="200" stroke="#7a5a24" stroke-width="2.8"/>
    <line x1="70" y1="200" x2="350" y2="290" stroke="#2f6b3a" stroke-width="2.8"/>

    <text x="356" y="118" font-size="12.5" font-weight="700" fill="#a03228">전곡형</text>
    <text x="356" y="134" font-size="10.5" fill="#5c221b">β₂ &gt; 90°</text>

    <text x="356" y="198" font-size="12.5" font-weight="700" fill="#7a5a24">반경형</text>
    <text x="356" y="214" font-size="10.5" fill="#4d3d0f">β₂ = 90°</text>

    <text x="356" y="288" font-size="12.5" font-weight="700" fill="#2f6b3a">후곡형</text>
    <text x="356" y="304" font-size="10.5" fill="#1e3a19">β₂ &lt; 90°</text>

    <circle cx="70" cy="200" r="5" fill="#1a1a1a"/>
    <text x="85" y="328" font-size="12" fill="#1a1a1a">Q = 0 에서는 세 형상 모두 vu₂ = u₂</text>
    <text x="85" y="344" font-size="12" fill="#1a1a1a">→ 이론 차단 양정이 같다</text>

    <text x="242" y="378" font-size="12.5" fill="#1a1a1a" text-anchor="middle">유량 Q</text>
    <text x="46" y="220" font-size="12.5" fill="#1a1a1a" transform="rotate(-90 46 220)" text-anchor="middle">이론 양정</text>

    <!-- ============ PANEL B ============ -->
    <rect x="460" y="30" width="420" height="370" rx="8" fill="#fafbfc" stroke="#dfe4e8"/>
    <text x="485" y="62" font-size="15.5" font-weight="700" fill="#2c3e50">② 이론에서 실제 곡선으로</text>

    <!-- 슬립 영역 -->
    <path d="M 510 150 L 800 240 L 800 263 L 510 190 Z" fill="#e3ecf3"/>
    <!-- 손실 영역 -->
    <path d="M 510 190 L 800 263 L 800 305 C 780 285, 720 250, 660 245 C 620 243, 570 240, 510 240 Z" fill="#f6e7dc"/>

    <line x1="510" y1="350" x2="855" y2="350" stroke="#1a1a1a" stroke-width="1.6"/>
    <line x1="510" y1="90" x2="510" y2="350" stroke="#1a1a1a" stroke-width="1.6"/>

    <line x1="510" y1="150" x2="800" y2="240" stroke="#5b6673" stroke-width="2.4" stroke-dasharray="8 4"/>
    <line x1="510" y1="190" x2="800" y2="263" stroke="#c1500a" stroke-width="2.4" stroke-dasharray="8 4"/>
    <path d="M 510 240 C 570 240, 620 243, 660 245 C 720 250, 780 285, 800 305"
          fill="none" stroke="#2f3d4f" stroke-width="3"/>

    <text x="806" y="244" font-size="12" font-weight="700" fill="#1a1a1a">오일러 이론</text>
    <text x="806" y="268" font-size="12" font-weight="700" fill="#c1500a">슬립 반영</text>
    <text x="806" y="309" font-size="12" font-weight="700" fill="#2f3d4f">실제 곡선</text>

    <text x="618" y="212" font-size="12" font-weight="700" fill="#1d5a92">슬립</text>
    <text x="596" y="238" font-size="12" font-weight="700" fill="#8a4a12">손실</text>

    <circle cx="660" cy="245" r="5" fill="#c0392b"/>
    <text x="648" y="268" font-size="11.5" font-weight="700" fill="#a03228">BEP 부근</text>

    <text x="682" y="378" font-size="12.5" fill="#1a1a1a" text-anchor="middle">유량 Q</text>
    <text x="486" y="220" font-size="12.5" fill="#1a1a1a" transform="rotate(-90 486 220)" text-anchor="middle">양정</text>

    <!-- 캡션 -->
    <text x="20" y="432" font-size="13" fill="#1a1a1a">
      슬립은 날개 수가 유한해 에너지 전달 자체가 줄어드는 현상이고, 손실은 전달된 에너지가 마찰과 충격으로 버려지는 몫이다.
    </text>
    <text x="20" y="452" font-size="13" fill="#1a1a1a">
      충격 손실이 최소가 되는 지점 부근에서 효율이 가장 높아지며, 그것이 BEP다.
    </text>
  </g>
</svg>
