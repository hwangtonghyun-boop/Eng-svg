<svg viewBox="0 0 900 410" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="API 610 재질 클래스 S-1 S-6 C-6 A-8 D-1 D-2 비교 스펙트럼" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>API 610 재질 클래스 스펙트럼</title>

  <g font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif">

    <text x="20" y="46" font-size="18" font-weight="700" fill="#2c3e50">API 610 재질 클래스 스펙트럼</text>
    <text x="20" y="70" font-size="13.5" fill="#1f2933">오른쪽으로 갈수록 내식성과 강도가 올라가고, 단가도 함께 올라간다</text>

    <!-- 클래스 바 -->
    <rect x="130" y="92" width="123.3" height="38" fill="#8496a4"/>
    <rect x="253.3" y="92" width="123.3" height="38" fill="#6b8194"/>
    <rect x="376.7" y="92" width="123.3" height="38" fill="#556e84"/>
    <rect x="500" y="92" width="123.3" height="38" fill="#405b73"/>
    <rect x="623.3" y="92" width="123.3" height="38" fill="#2d4861"/>
    <rect x="746.7" y="92" width="123.3" height="38" fill="#1c3550"/>

    <text x="191.7" y="117" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">S-1</text>
    <text x="315" y="117" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">S-6</text>
    <text x="438.3" y="117" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">C-6</text>
    <text x="561.7" y="117" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">A-8</text>
    <text x="685" y="117" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">D-1</text>
    <text x="808.3" y="117" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">D-2</text>

    <!-- 열 구분선 -->
    <line x1="253.3" y1="145" x2="253.3" y2="336" stroke="#e8ecef"/>
    <line x1="376.7" y1="145" x2="376.7" y2="336" stroke="#e8ecef"/>
    <line x1="500" y1="145" x2="500" y2="336" stroke="#e8ecef"/>
    <line x1="623.3" y1="145" x2="623.3" y2="336" stroke="#e8ecef"/>
    <line x1="746.7" y1="145" x2="746.7" y2="336" stroke="#e8ecef"/>

    <!-- 행 구분선 -->
    <line x1="20" y1="145" x2="870" y2="145" stroke="#dfe4e8"/>
    <line x1="20" y1="176" x2="870" y2="176" stroke="#eef1f3"/>
    <line x1="20" y1="206" x2="870" y2="206" stroke="#eef1f3"/>
    <line x1="20" y1="232" x2="870" y2="232" stroke="#eef1f3"/>
    <line x1="20" y1="276" x2="870" y2="276" stroke="#eef1f3"/>
    <line x1="20" y1="336" x2="870" y2="336" stroke="#dfe4e8"/>

    <!-- 행 라벨 -->
    <text x="118" y="166" font-size="12.5" fill="#1f2933" text-anchor="end">케이싱</text>
    <text x="118" y="196" font-size="12.5" fill="#1f2933" text-anchor="end">트림</text>
    <text x="118" y="224" font-size="12.5" fill="#1f2933" text-anchor="end">PREN</text>
    <text x="118" y="257" font-size="12.5" fill="#1f2933" text-anchor="end">상대 단가</text>
    <text x="118" y="298" font-size="12.5" fill="#1f2933" text-anchor="end">대표 적용</text>

    <!-- 케이싱 -->
    <text x="191.7" y="166" font-size="12.5" fill="#1a1a1a" text-anchor="middle">탄소강 (WCB)</text>
    <text x="315" y="166" font-size="12.5" fill="#1a1a1a" text-anchor="middle">탄소강 (WCB)</text>
    <text x="438.3" y="166" font-size="12.5" fill="#1a1a1a" text-anchor="middle">12% Cr (CA15)</text>
    <text x="561.7" y="166" font-size="12.5" fill="#1a1a1a" text-anchor="middle">316 (CF8M)</text>
    <text x="685" y="166" font-size="12.5" fill="#1a1a1a" text-anchor="middle">듀플렉스 (4A)</text>
    <text x="808.3" y="166" font-size="12.5" fill="#1a1a1a" text-anchor="middle">슈퍼 듀플렉스</text>

    <!-- 트림 -->
    <text x="191.7" y="196" font-size="12.5" fill="#1a1a1a" text-anchor="middle">주철</text>
    <text x="315" y="196" font-size="12.5" fill="#1a1a1a" text-anchor="middle">12% Cr</text>
    <text x="438.3" y="196" font-size="12.5" fill="#1a1a1a" text-anchor="middle">12% Cr</text>
    <text x="561.7" y="196" font-size="12.5" fill="#1a1a1a" text-anchor="middle">316 SS</text>
    <text x="685" y="196" font-size="12.5" fill="#1a1a1a" text-anchor="middle">듀플렉스</text>
    <text x="808.3" y="196" font-size="12.5" fill="#1a1a1a" text-anchor="middle">슈퍼 듀플렉스</text>

    <!-- PREN -->
    <text x="191.7" y="224" font-size="12.5" fill="#1f2933" text-anchor="middle">—</text>
    <text x="315" y="224" font-size="12.5" fill="#1f2933" text-anchor="middle">낮음</text>
    <text x="438.3" y="224" font-size="12.5" fill="#1f2933" text-anchor="middle">보통</text>
    <text x="561.7" y="224" font-size="12.5" font-weight="600" fill="#1a1a1a" text-anchor="middle">약 24~26</text>
    <text x="685" y="224" font-size="12.5" font-weight="600" fill="#1a1a1a" text-anchor="middle">약 33~35</text>
    <text x="808.3" y="224" font-size="12.5" font-weight="600" fill="#1a1a1a" text-anchor="middle">40 이상</text>

    <!-- 상대 단가 -->
    <rect x="140" y="245" width="26" height="18" rx="2" fill="#8496a4"/>
    <rect x="263.3" y="245" width="34" height="18" rx="2" fill="#6b8194"/>
    <rect x="386.7" y="245" width="52" height="18" rx="2" fill="#556e84"/>
    <rect x="510" y="245" width="72" height="18" rx="2" fill="#405b73"/>
    <rect x="633.3" y="245" width="94" height="18" rx="2" fill="#2d4861"/>
    <rect x="756.7" y="245" width="105" height="18" rx="2" fill="#1c3550"/>

    <!-- 대표 적용 -->
    <text x="191.7" y="298" font-size="11.5" fill="#1a1a1a" text-anchor="middle">비부식성</text>
    <text x="191.7" y="316" font-size="11.5" fill="#1a1a1a" text-anchor="middle">저위험 유체</text>

    <text x="315" y="298" font-size="11.5" fill="#1a1a1a" text-anchor="middle">일반 정유</text>
    <text x="315" y="316" font-size="11.5" fill="#1a1a1a" text-anchor="middle">석유화학</text>

    <text x="438.3" y="298" font-size="11.5" fill="#1a1a1a" text-anchor="middle">고온 탄화수소</text>
    <text x="438.3" y="316" font-size="11.5" fill="#1a1a1a" text-anchor="middle">고에너지 BFP</text>

    <text x="561.7" y="298" font-size="11.5" fill="#1a1a1a" text-anchor="middle">화학 산</text>
    <text x="561.7" y="316" font-size="11.5" fill="#1a1a1a" text-anchor="middle">극저온 LNG</text>

    <text x="685" y="298" font-size="11.5" fill="#1a1a1a" text-anchor="middle">해수 취수</text>
    <text x="685" y="316" font-size="11.5" fill="#1a1a1a" text-anchor="middle">염화물 환경</text>

    <text x="808.3" y="298" font-size="11.5" fill="#1a1a1a" text-anchor="middle">고농도 염화물</text>
    <text x="808.3" y="316" font-size="11.5" fill="#1a1a1a" text-anchor="middle">담수화 고압</text>

    <!-- 캡션 -->
    <text x="20" y="368" font-size="12.5" fill="#1f2933">
      단가는 상대 비교용이며 프로젝트 조건에 따라 달라진다. 부품별 정확한 조합은 적용 판본의 Table H.1을 확인할 것.
    </text>
    <text x="20" y="390" font-size="12.5" fill="#a03228">
      주의: 듀플렉스는 고온 취화와 저온 취성 때문에 극저온 서비스에는 A-8이 맞다. 오른쪽이 항상 상위 호환은 아니다.
    </text>
  </g>
</svg>
