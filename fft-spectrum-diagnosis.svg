<svg viewBox="0 0 900 490" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="FFT 스펙트럼의 주요 진단 주파수 - 1배, 2배, 1배 미만 성분, 날개 통과 주파수, 베어링 결함 소수배 성분" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>FFT 스펙트럼에서 무엇을 찾는가</title>

  <defs>
    <marker id="fftAx" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a1a"/>
    </marker>
    <marker id="fftHF" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6b3fa0"/>
    </marker>
  </defs>

  <g font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif">

    <text x="20" y="48" font-size="17" font-weight="700" fill="#2c3e50">FFT 스펙트럼에서 찾아야 할 것</text>
    <text x="20" y="70" font-size="12.5" fill="#1f2933">가로축은 회전 주파수의 배수, 세로축은 진폭이다</text>

    <line x1="90" y1="90" x2="90" y2="320" stroke="#1a1a1a" stroke-width="1.6"/>
    <path d="M 90 320 L 858 320" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#fftAx)"/>
    <text x="72" y="205" font-size="11.5" fill="#1a1a1a" transform="rotate(-90 72 205)" text-anchor="middle">진폭</text>
    <text x="850" y="358" font-size="11" fill="#1a1a1a" text-anchor="end">주파수 (1× 배수)</text>

    <path d="M 95 316 L 130 314 L 165 317 L 200 315 L 235 316 L 270 314 L 305 317 L 340 315 L 375 316 L 410 314 L 445 317 L 480 315 L 515 316 L 550 314 L 585 317 L 620 315 L 655 316 L 690 314 L 725 317 L 760 315 L 795 316 L 830 315 L 850 316"
          fill="none" stroke="#a8b4bd" stroke-width="1.4"/>

    <path d="M 100 320 C 108 316, 114 272, 122 262 C 130 272, 138 314, 148 320 Z" fill="#cfe0ee" stroke="#1d5a92" stroke-width="2"/>
    <text x="122" y="250" font-size="11" font-weight="700" fill="#123049" text-anchor="middle">1× 미만</text>

    <line x1="159" y1="320" x2="159" y2="158" stroke="#c0392b" stroke-width="6" stroke-linecap="round"/>
    <text x="159" y="146" font-size="15" font-weight="700" fill="#a03228" text-anchor="middle">1×</text>

    <line x1="228" y1="320" x2="228" y2="222" stroke="#c1500a" stroke-width="6" stroke-linecap="round"/>
    <text x="228" y="210" font-size="14" font-weight="700" fill="#8a3a08" text-anchor="middle">2×</text>

    <line x1="297" y1="320" x2="297" y2="288" stroke="#7a8794" stroke-width="5" stroke-linecap="round"/>
    <line x1="366" y1="320" x2="366" y2="298" stroke="#7a8794" stroke-width="5" stroke-linecap="round"/>
    <line x1="504" y1="320" x2="504" y2="305" stroke="#7a8794" stroke-width="5" stroke-linecap="round"/>
    <line x1="573" y1="320" x2="573" y2="308" stroke="#7a8794" stroke-width="5" stroke-linecap="round"/>
    <line x1="642" y1="320" x2="642" y2="303" stroke="#7a8794" stroke-width="5" stroke-linecap="round"/>
    <line x1="712" y1="320" x2="712" y2="307" stroke="#7a8794" stroke-width="5" stroke-linecap="round"/>

    <line x1="325" y1="320" x2="325" y2="298" stroke="#6b3fa0" stroke-width="3.4" stroke-linecap="round"/>
    <line x1="339" y1="320" x2="339" y2="272" stroke="#6b3fa0" stroke-width="5" stroke-linecap="round"/>
    <line x1="353" y1="320" x2="353" y2="300" stroke="#6b3fa0" stroke-width="3.4" stroke-linecap="round"/>
    <line x1="394" y1="320" x2="394" y2="288" stroke="#6b3fa0" stroke-width="5" stroke-linecap="round"/>

    <line x1="322" y1="255" x2="400" y2="255" stroke="#6b3fa0" stroke-width="1.8"/>
    <line x1="322" y1="249" x2="322" y2="261" stroke="#6b3fa0" stroke-width="1.8"/>
    <line x1="400" y1="249" x2="400" y2="261" stroke="#6b3fa0" stroke-width="1.8"/>
    <text x="361" y="245" font-size="11" font-weight="700" fill="#4a2a70" text-anchor="middle">소수배</text>

    <line x1="435" y1="320" x2="435" y2="240" stroke="#2f6b3a" stroke-width="6" stroke-linecap="round"/>
    <text x="435" y="228" font-size="12.5" font-weight="700" fill="#245430" text-anchor="middle">BPF (Z×)</text>

    <line x1="781" y1="320" x2="781" y2="288" stroke="#2f6b3a" stroke-width="5" stroke-linecap="round"/>
    <text x="781" y="278" font-size="11" font-weight="700" fill="#245430" text-anchor="middle">2×BPF</text>

    <text x="159" y="340" font-size="10.5" fill="#1a1a1a" text-anchor="middle">1×</text>
    <text x="228" y="340" font-size="10.5" fill="#1a1a1a" text-anchor="middle">2×</text>
    <text x="297" y="340" font-size="10.5" fill="#1a1a1a" text-anchor="middle">3×</text>
    <text x="366" y="340" font-size="10.5" fill="#1a1a1a" text-anchor="middle">4×</text>
    <text x="435" y="340" font-size="10.5" fill="#1a1a1a" text-anchor="middle">5×</text>
    <text x="781" y="340" font-size="10.5" fill="#1a1a1a" text-anchor="middle">10×</text>

    <text x="640" y="122" font-size="11" font-weight="700" fill="#4a2a70">이보다 높은 대역에서</text>
    <text x="640" y="140" font-size="11" font-weight="700" fill="#4a2a70">베어링 초기 결함이 먼저 보인다</text>
    <path d="M 795 152 L 850 152" stroke="#6b3fa0" stroke-width="2.2" marker-end="url(#fftHF)"/>

    <!-- 범례 -->
    <line x1="40" y1="378" x2="40" y2="366" stroke="#c0392b" stroke-width="6" stroke-linecap="round"/>
    <text x="56" y="378" font-size="11.5" fill="#1a1a1a">1× — 불평형, 축 휨, 정렬 불량, 강성 저하가 모두 여기 나타난다</text>

    <line x1="40" y1="402" x2="40" y2="390" stroke="#c1500a" stroke-width="6" stroke-linecap="round"/>
    <text x="56" y="402" font-size="11.5" fill="#1a1a1a">2× — 정렬 불량. 샵 테스트 대비 올랐다면 배관 응력을 의심한다</text>

    <line x1="40" y1="426" x2="40" y2="414" stroke="#1d5a92" stroke-width="6" stroke-linecap="round"/>
    <text x="56" y="426" font-size="11.5" fill="#1a1a1a">1× 미만 둔덕 — 유체 재순환 또는 오일 훨. 유량과 회전수를 바꿔 구분한다</text>

    <line x1="480" y1="450" x2="480" y2="438" stroke="#2f6b3a" stroke-width="6" stroke-linecap="round"/>
    <text x="496" y="450" font-size="11.5" fill="#1a1a1a">BPF — 임펠러와 컷워터의 간격, 그리고 운전점</text>

    <line x1="40" y1="450" x2="40" y2="438" stroke="#6b3fa0" stroke-width="6" stroke-linecap="round"/>
    <text x="56" y="450" font-size="11.5" fill="#1a1a1a">소수배 성분 — 베어링 결함</text>

    <!-- 캡션 -->
    <text x="20" y="478" font-size="12.5" fill="#1a1a1a">
      같은 주파수에 여러 원인이 겹친다. FFT는 원인을 특정해 주는 것이 아니라, 어디를 볼지 알려주는 도구다.
    </text>
  </g>
</svg>
