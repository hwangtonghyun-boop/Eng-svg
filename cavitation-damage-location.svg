<svg viewBox="0 0 900 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="임펠러 날개 단면에서 NPSH 부족 캐비테이션과 흡입 재순환 캐비테이션의 침식 위치 비교" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>캐비테이션 유형별 임펠러 날개 침식 위치</title>

  <defs>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3d7ab8"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c0392b"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7a8794"/>
    </marker>
  </defs>

  <g font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif">

    <!-- ================= PANEL A ================= -->
    <rect x="18" y="70" width="424" height="470" rx="8" fill="#fafbfc" stroke="#dfe4e8" stroke-width="1"/>
    <text x="40" y="106" font-size="19" font-weight="700" fill="#2c3e50">① NPSH 부족 캐비테이션</text>
    <text x="40" y="130" font-size="14" fill="#7a8794">정격 유량 부근 · 흡입 압력 부족</text>

    <g transform="translate(0,80)">
      <!-- 인접 날개 (고스트) -->
      <path d="M 130 180 Q 235 150 348 32 L 358 50 Q 248 178 130 180 Z"
            fill="#c8d2da" stroke="#aab6c0" stroke-width="1.5"/>
      <text x="300" y="150" font-size="12" fill="#8b98a4">인접 날개</text>

      <!-- 주 날개 -->
      <path d="M 130 380 Q 235 350 348 232 L 358 250 Q 248 378 130 380 Z"
            fill="#44546a" stroke="#2f3d4f" stroke-width="1.5"/>

      <!-- 유입 흐름 (정상 입사) -->
      <path d="M 45 318 L 112 300" stroke="#3d7ab8" stroke-width="2.6" fill="none" marker-end="url(#arrowBlue)"/>
      <path d="M 45 378 L 112 360" stroke="#3d7ab8" stroke-width="2.6" fill="none" marker-end="url(#arrowBlue)"/>
      <path d="M 45 438 L 112 420" stroke="#3d7ab8" stroke-width="2.6" fill="none" marker-end="url(#arrowBlue)"/>
      <text x="40" y="478" font-size="13" fill="#3d7ab8">유입 유동 (정상 입사각)</text>

      <!-- 침식부: 부압면 -->
      <path d="M 170 365 Q 198 350 228 334" stroke="#e74c3c" stroke-width="10"
            stroke-linecap="round" fill="none" opacity="0.9"/>

      <!-- 지시선 -->
      <path d="M 262 316 L 214 342" stroke="#c0392b" stroke-width="1.4" fill="none"/>
      <circle cx="262" cy="316" r="3" fill="#c0392b"/>
      <text x="270" y="308" font-size="14" font-weight="700" fill="#c0392b">부압면 침식</text>
      <text x="270" y="328" font-size="12.5" fill="#8b5b56">LE 하류 · 기포 붕괴 지점</text>

      <!-- 면 표기 -->
      <text x="196" y="316" font-size="12.5" fill="#5b6673">부압면 (Suction Side)</text>
      <text x="212" y="404" font-size="12.5" fill="#5b6673">압력면 (Pressure Side)</text>

      <!-- 회전 방향 -->
      <path d="M 398 196 L 398 250" stroke="#7a8794" stroke-width="2" fill="none" marker-end="url(#arrowGray)"/>
      <text x="374" y="188" font-size="11.5" fill="#7a8794">회전 방향</text>
    </g>

    <!-- ================= PANEL B ================= -->
    <rect x="458" y="70" width="424" height="470" rx="8" fill="#fdf9f8" stroke="#e8d9d6" stroke-width="1"/>
    <text x="480" y="106" font-size="19" font-weight="700" fill="#2c3e50">② 흡입 재순환 캐비테이션</text>
    <text x="480" y="130" font-size="14" fill="#7a8794">저유량 운전 · 흡입비속도가 높을수록 조기 발생</text>

    <g transform="translate(440,80)">
      <!-- 인접 날개 (고스트) -->
      <path d="M 130 180 Q 235 150 348 32 L 358 50 Q 248 178 130 180 Z"
            fill="#c8d2da" stroke="#aab6c0" stroke-width="1.5"/>

      <!-- 주 날개 -->
      <path d="M 130 380 Q 235 350 348 232 L 358 250 Q 248 378 130 380 Z"
            fill="#44546a" stroke="#2f3d4f" stroke-width="1.5"/>

      <!-- 감소된 유입 유동 (과도한 입사각) -->
      <path d="M 48 372 L 114 424" stroke="#3d7ab8" stroke-width="2.6" fill="none" marker-end="url(#arrowBlue)"/>
      <path d="M 48 424 L 110 458" stroke="#3d7ab8" stroke-width="2.6" fill="none" marker-end="url(#arrowBlue)"/>
      <text x="40" y="492" font-size="13" fill="#3d7ab8">감소된 유입 유동</text>

      <!-- 역류 -->
      <path d="M 268 268 L 82 268" stroke="#c0392b" stroke-width="2.8" fill="none"
            stroke-dasharray="9 5" marker-end="url(#arrowRed)"/>
      <text x="128" y="256" font-size="13" font-weight="600" fill="#c0392b">흡입 배관으로 역류</text>

      <!-- 와류 -->
      <path d="M 214 424 A 26 26 0 1 1 178 402" stroke="#c0392b" stroke-width="2.4"
            fill="none" marker-end="url(#arrowRed)"/>
      <text x="228" y="446" font-size="12.5" fill="#c0392b">와류 캐비테이션</text>

      <!-- 침식부: 압력면 -->
      <path d="M 146 380 Q 180 372 214 362" stroke="#e74c3c" stroke-width="10"
            stroke-linecap="round" fill="none" opacity="0.9"/>

      <!-- 지시선 -->
      <path d="M 200 470 L 176 386" stroke="#c0392b" stroke-width="1.4" fill="none"/>
      <circle cx="200" cy="470" r="3" fill="#c0392b"/>
      <text x="152" y="492" font-size="14" font-weight="700" fill="#c0392b">압력면 침식</text>
      <text x="126" y="512" font-size="12.5" fill="#8b5b56">LE 입구 · 재순환 와류 충돌부</text>
    </g>

    <!-- 캡션 -->
    <text x="450" y="578" font-size="13.5" fill="#5b6673" text-anchor="middle">
      분해 점검 시 침식 위치는 원인을 가르는 결정적 단서다. 부압면이면 흡입 압력 부족, 압력면 입구면 저유량 재순환이다.
    </text>
  </g>
</svg>
