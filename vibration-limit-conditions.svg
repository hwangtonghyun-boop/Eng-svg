<svg viewBox="0 0 900 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="진동 허용치가 하나의 숫자로 정해지기까지 거치는 여섯 가지 조건" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>허용치는 조건의 집합이다</title>

  <defs>
    <marker id="stArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6673"/>
    </marker>
  </defs>

  <g font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif">

    <text x="20" y="48" font-size="17" font-weight="700" fill="#2c3e50">허용치 하나가 정해지기까지</text>
    <text x="20" y="70" font-size="12.5" fill="#1f2933">이 여섯 가지가 모두 정해져야 비로소 숫자가 나온다</text>

    <path d="M 34 106 L 34 436" stroke="#5b6673" stroke-width="2.2" marker-end="url(#stArrow)"/>

    <!-- ① 적용 규격 -->
    <rect x="50" y="100" width="240" height="48" rx="5" fill="#dfe6eb" stroke="#5b6673" stroke-width="1.4"/>
    <text x="66" y="130" font-size="12.5" font-weight="700" fill="#1a1a1a">① 적용 규격</text>
    <rect x="320" y="108" width="160" height="32" rx="4" fill="#ffffff" stroke="#a9c3d9" stroke-width="1.6"/>
    <text x="400" y="129" font-size="11.5" font-weight="700" fill="#24567f" text-anchor="middle">API 610</text>
    <rect x="500" y="108" width="160" height="32" rx="4" fill="#ffffff" stroke="#a9c3d9" stroke-width="1.6"/>
    <text x="580" y="129" font-size="11.5" font-weight="700" fill="#24567f" text-anchor="middle">HI 9.6.4</text>

    <!-- ② 펌프 형식 -->
    <rect x="50" y="156" width="240" height="48" rx="5" fill="#dfe6eb" stroke="#5b6673" stroke-width="1.4"/>
    <text x="66" y="186" font-size="12.5" font-weight="700" fill="#1a1a1a">② 펌프 형식</text>
    <rect x="320" y="164" width="160" height="32" rx="4" fill="#ffffff" stroke="#dfe4e8"/>
    <text x="400" y="185" font-size="11.5" fill="#1a1a1a" text-anchor="middle">OH · 외팔보형</text>
    <rect x="500" y="164" width="160" height="32" rx="4" fill="#ffffff" stroke="#dfe4e8"/>
    <text x="580" y="185" font-size="11.5" fill="#1a1a1a" text-anchor="middle">BB · 양단 지지</text>
    <rect x="680" y="164" width="160" height="32" rx="4" fill="#ffffff" stroke="#dfe4e8"/>
    <text x="760" y="185" font-size="11.5" fill="#1a1a1a" text-anchor="middle">VS · 수직 매설</text>

    <!-- ③ 회전수 · 동력 -->
    <rect x="50" y="212" width="240" height="48" rx="5" fill="#dfe6eb" stroke="#5b6673" stroke-width="1.4"/>
    <text x="66" y="242" font-size="12.5" font-weight="700" fill="#1a1a1a">③ 회전수 · 동력</text>
    <rect x="320" y="220" width="160" height="32" rx="4" fill="#ffffff" stroke="#dfe4e8"/>
    <text x="400" y="241" font-size="11.5" fill="#1a1a1a" text-anchor="middle">저속 · 소형</text>
    <rect x="500" y="220" width="160" height="32" rx="4" fill="#ffffff" stroke="#dfe4e8"/>
    <text x="580" y="241" font-size="11.5" fill="#1a1a1a" text-anchor="middle">고속 · 대형</text>
    <text x="690" y="241" font-size="10.5" fill="#1f2933">에너지 수준이 다르면 기준도 다르다</text>

    <!-- ④ 측정 위치 · 방향 -->
    <rect x="50" y="268" width="240" height="48" rx="5" fill="#dfe6eb" stroke="#5b6673" stroke-width="1.4"/>
    <text x="66" y="298" font-size="12.5" font-weight="700" fill="#1a1a1a">④ 측정 위치 · 방향</text>
    <rect x="320" y="276" width="160" height="32" rx="4" fill="#ffffff" stroke="#dfe4e8"/>
    <text x="400" y="297" font-size="11.5" fill="#1a1a1a" text-anchor="middle">베어링 하우징</text>
    <rect x="500" y="276" width="160" height="32" rx="4" fill="#ffffff" stroke="#dfe4e8"/>
    <text x="580" y="297" font-size="11.5" fill="#1a1a1a" text-anchor="middle">모터 상부</text>
    <rect x="680" y="276" width="160" height="32" rx="4" fill="#ffffff" stroke="#dfe4e8"/>
    <text x="760" y="297" font-size="11.5" fill="#1a1a1a" text-anchor="middle">축 진동 (근접 탐촉자)</text>

    <!-- ⑤ 측정량 · 단위 -->
    <rect x="50" y="324" width="240" height="48" rx="5" fill="#dfe6eb" stroke="#5b6673" stroke-width="1.4"/>
    <text x="66" y="354" font-size="12.5" font-weight="700" fill="#1a1a1a">⑤ 측정량 · 단위</text>
    <rect x="320" y="332" width="160" height="32" rx="4" fill="#fdf3e0" stroke="#dcc191" stroke-width="1.6"/>
    <text x="400" y="353" font-size="11.5" font-weight="700" fill="#7a5a24" text-anchor="middle">속도 RMS</text>
    <rect x="500" y="332" width="160" height="32" rx="4" fill="#fdf3e0" stroke="#dcc191" stroke-width="1.6"/>
    <text x="580" y="353" font-size="11.5" font-weight="700" fill="#7a5a24" text-anchor="middle">속도 피크</text>
    <rect x="680" y="332" width="160" height="32" rx="4" fill="#ffffff" stroke="#dfe4e8"/>
    <text x="760" y="353" font-size="11.5" fill="#1a1a1a" text-anchor="middle">주파수 범위</text>

    <!-- ⑥ 운전 영역 -->
    <rect x="50" y="380" width="240" height="48" rx="5" fill="#dfe6eb" stroke="#5b6673" stroke-width="1.4"/>
    <text x="66" y="410" font-size="12.5" font-weight="700" fill="#1a1a1a">⑥ 운전 영역</text>
    <rect x="320" y="388" width="160" height="32" rx="4" fill="#e8f2e6" stroke="#a8c9a2" stroke-width="1.6"/>
    <text x="400" y="409" font-size="11.5" font-weight="700" fill="#2f6b3a" text-anchor="middle">POR 안 — 기본 한계</text>
    <rect x="500" y="388" width="200" height="32" rx="4" fill="#fbe9e7" stroke="#d9a9a2" stroke-width="1.6"/>
    <text x="600" y="409" font-size="11.5" font-weight="700" fill="#a03228" text-anchor="middle">POR 밖 — 일정 비율 완화</text>

    <!-- 최종 -->
    <rect x="50" y="442" width="820" height="46" rx="6" fill="#2c3e50"/>
    <text x="460" y="471" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">이 조건들이 모두 정해져야 비로소 하나의 허용치가 나온다</text>

    <!-- 캡션 -->
    <text x="20" y="518" font-size="13" fill="#1a1a1a">
      허용치는 숫자 하나가 아니라 조건의 집합이다. 조건이 다르면 같은 기계에서도 다른 값이 나온다.
    </text>
    <text x="20" y="540" font-size="13" fill="#1a1a1a">
      두 규격의 숫자를 나란히 놓기 전에, 이 여섯 가지가 모두 같은지부터 확인해야 한다.
    </text>
  </g>
</svg>
