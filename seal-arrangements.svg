<svg viewBox="0 0 900 465" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="API 682 Arrangement 1, 2, 3 씰 배열의 단면과 차압 방향 비교" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>씰 배열 세 가지 — 차압 방향의 차이</title>

  <defs>
    <marker id="pRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c0392b"/>
    </marker>
    <marker id="pGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6673"/>
    </marker>
  </defs>

  <g font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif">

    <!-- ============ PANEL A ============ -->
    <rect x="20" y="30" width="280" height="365" rx="8" fill="#fafbfc" stroke="#dfe4e8"/>
    <text x="45" y="62" font-size="15" font-weight="700" fill="#2c3e50">Arrangement 1</text>
    <text x="45" y="82" font-size="12" fill="#1f2933">싱글 씰</text>

    <rect x="40" y="122" width="125" height="126" fill="#f0dcc4"/>
    <rect x="165" y="122" width="115" height="126" fill="#f2f4f6"/>
    <rect x="40" y="110" width="240" height="12" fill="#c8d2da" stroke="#97a3ad"/>

    <text x="102" y="145" font-size="11.5" font-weight="700" fill="#4a3c14" text-anchor="middle">공정 유체</text>
    <text x="222" y="145" font-size="11.5" font-weight="700" fill="#1f2933" text-anchor="middle">대기</text>

    <path d="M 75 180 L 158 180" stroke="#c0392b" stroke-width="2.6" marker-end="url(#pRed)"/>

    <rect x="137" y="200" width="25" height="48" fill="#6b8194" stroke="#3f4b58"/>
    <rect x="168" y="200" width="25" height="48" fill="#405b73" stroke="#2f3d4f"/>
    <line x1="165" y1="122" x2="165" y2="248" stroke="#c0392b" stroke-width="4"/>

    <rect x="40" y="248" width="240" height="20" fill="#6b8194"/>
    <rect x="40" y="268" width="240" height="24" fill="#44546a"/>
    <line x1="40" y1="305" x2="280" y2="305" stroke="#8b98a4" stroke-width="1.2" stroke-dasharray="14 4 3 4"/>

    <text x="45" y="337" font-size="11.5" fill="#1a1a1a">밀봉면 1세트</text>
    <text x="45" y="357" font-size="11.5" fill="#1a1a1a">공정 유체가 유막을 만든다</text>
    <text x="45" y="377" font-size="11.5" font-weight="700" fill="#a03228">정상 상태에서도 미량 배출</text>

    <!-- ============ PANEL B ============ -->
    <rect x="310" y="30" width="280" height="365" rx="8" fill="#fafbfc" stroke="#dfe4e8"/>
    <text x="335" y="62" font-size="15" font-weight="700" fill="#2c3e50">Arrangement 2</text>
    <text x="335" y="82" font-size="12" fill="#1f2933">비가압 이중 씰 — 버퍼 유체</text>

    <rect x="330" y="122" width="80" height="126" fill="#f0dcc4"/>
    <rect x="410" y="122" width="80" height="126" fill="#dce8f2"/>
    <rect x="490" y="122" width="80" height="126" fill="#f2f4f6"/>
    <rect x="330" y="110" width="240" height="12" fill="#c8d2da" stroke="#97a3ad"/>

    <text x="370" y="145" font-size="11.5" font-weight="700" fill="#4a3c14" text-anchor="middle">공정</text>
    <text x="450" y="145" font-size="11.5" font-weight="700" fill="#123049" text-anchor="middle">버퍼</text>
    <text x="530" y="145" font-size="11.5" font-weight="700" fill="#1f2933" text-anchor="middle">대기</text>

    <path d="M 352 180 L 403 180" stroke="#c0392b" stroke-width="2.6" marker-end="url(#pRed)"/>

    <rect x="382" y="200" width="25" height="48" fill="#6b8194" stroke="#3f4b58"/>
    <rect x="413" y="200" width="25" height="48" fill="#405b73" stroke="#2f3d4f"/>
    <line x1="410" y1="122" x2="410" y2="248" stroke="#c0392b" stroke-width="4"/>

    <rect x="462" y="200" width="25" height="48" fill="#6b8194" stroke="#3f4b58"/>
    <rect x="493" y="200" width="25" height="48" fill="#405b73" stroke="#2f3d4f"/>
    <line x1="490" y1="122" x2="490" y2="248" stroke="#c0392b" stroke-width="4"/>

    <rect x="330" y="248" width="240" height="20" fill="#6b8194"/>
    <rect x="330" y="268" width="240" height="24" fill="#44546a"/>
    <line x1="330" y1="305" x2="570" y2="305" stroke="#8b98a4" stroke-width="1.2" stroke-dasharray="14 4 3 4"/>

    <text x="335" y="337" font-size="11.5" font-weight="700" fill="#a03228">버퍼 압력 &lt; 공정 압력</text>
    <text x="335" y="357" font-size="11.5" fill="#1a1a1a">내측 씰이 공정압을 홀로 감당</text>
    <text x="335" y="377" font-size="11.5" fill="#1a1a1a">고장 시 경보 → 계획 정지</text>

    <!-- ============ PANEL C ============ -->
    <rect x="600" y="30" width="280" height="365" rx="8" fill="#fafbfc" stroke="#dfe4e8"/>
    <text x="625" y="62" font-size="15" font-weight="700" fill="#2c3e50">Arrangement 3</text>
    <text x="625" y="82" font-size="12" fill="#1f2933">가압 이중 씰 — 배리어 유체</text>

    <rect x="620" y="122" width="80" height="126" fill="#f0dcc4"/>
    <rect x="700" y="122" width="80" height="126" fill="#d8ecd6"/>
    <rect x="780" y="122" width="80" height="126" fill="#f2f4f6"/>
    <rect x="620" y="110" width="240" height="12" fill="#c8d2da" stroke="#97a3ad"/>

    <text x="660" y="145" font-size="11.5" font-weight="700" fill="#4a3c14" text-anchor="middle">공정</text>
    <text x="740" y="145" font-size="11.5" font-weight="700" fill="#1e3a19" text-anchor="middle">배리어</text>
    <text x="820" y="145" font-size="11.5" font-weight="700" fill="#1f2933" text-anchor="middle">대기</text>

    <path d="M 697 180 L 646 180" stroke="#c0392b" stroke-width="2.6" marker-end="url(#pRed)"/>
    <path d="M 787 180 L 838 180" stroke="#5b6673" stroke-width="2" marker-end="url(#pGray)"/>

    <rect x="672" y="200" width="25" height="48" fill="#6b8194" stroke="#3f4b58"/>
    <rect x="703" y="200" width="25" height="48" fill="#405b73" stroke="#2f3d4f"/>
    <line x1="700" y1="122" x2="700" y2="248" stroke="#c0392b" stroke-width="4"/>

    <rect x="752" y="200" width="25" height="48" fill="#6b8194" stroke="#3f4b58"/>
    <rect x="783" y="200" width="25" height="48" fill="#405b73" stroke="#2f3d4f"/>
    <line x1="780" y1="122" x2="780" y2="248" stroke="#c0392b" stroke-width="4"/>

    <rect x="620" y="248" width="240" height="20" fill="#6b8194"/>
    <rect x="620" y="268" width="240" height="24" fill="#44546a"/>
    <line x1="620" y1="305" x2="860" y2="305" stroke="#8b98a4" stroke-width="1.2" stroke-dasharray="14 4 3 4"/>

    <text x="625" y="337" font-size="11.5" font-weight="700" fill="#2f6b3a">배리어 압력 &gt; 공정 압력</text>
    <text x="625" y="357" font-size="11.5" fill="#1a1a1a">내측 유막이 깨끗한 배리어</text>
    <text x="625" y="377" font-size="11.5" fill="#1a1a1a">공정 유체가 나올 경로 없음</text>

    <!-- 캡션 -->
    <text x="20" y="425" font-size="13" fill="#1a1a1a">
      붉은 선이 밀봉면이다. Arrangement 2와 3은 내측 씰에 걸리는 차압의 방향이 정반대이며, 그 하나가 모든 차이를 만든다.
    </text>
    <text x="20" y="447" font-size="13" fill="#1a1a1a">
      배치 형식(페이스투백, 백투백 등)은 Arrangement 번호와 별개 항목이므로 데이터 시트에서 따로 확인해야 한다.
    </text>
  </g>
</svg>
