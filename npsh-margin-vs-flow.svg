<svg viewBox="0 0 900 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="유량이 늘면 NPSHa는 줄고 NPSHr은 커져 두 곡선이 교차하는 관계" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>두 값은 유량에 따라 서로를 향해 다가온다</title>

  <defs>
    <marker id="mgArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2f6b3a"/>
    </marker>
    <marker id="npAx" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a1a"/>
    </marker>
  </defs>

  <g font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif">

    <text x="20" y="48" font-size="17" font-weight="700" fill="#2c3e50">NPSHa도 NPSHr도 고정값이 아니다</text>
    <text x="20" y="70" font-size="12.5" fill="#1f2933">유량이 늘면 한쪽은 내려가고 다른 쪽은 올라간다</text>

    <rect x="605" y="90" width="195" height="230" fill="#fbe9e7"/>

    <line x1="100" y1="90" x2="100" y2="320" stroke="#1a1a1a" stroke-width="1.6"/>
    <path d="M 100 320 L 815 320" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#npAx)"/>
    <text x="82" y="205" font-size="11.5" fill="#1a1a1a" transform="rotate(-90 82 205)" text-anchor="middle">NPSH</text>
    <text x="808" y="358" font-size="11" fill="#1a1a1a" text-anchor="end">유량 Q</text>

    <path d="M 110 140 C 250 148, 400 175, 620 240 C 690 268, 750 295, 790 318"
          fill="none" stroke="#1d5a92" stroke-width="3"/>
    <path d="M 110 296 C 250 290, 400 272, 560 248 C 650 232, 730 214, 790 198"
          fill="none" stroke="#c0392b" stroke-width="3"/>

    <text x="180" y="132" font-size="12" font-weight="700" fill="#1d5a92">NPSHa — 계통이 주는 값</text>
    <text x="200" y="310" font-size="12" font-weight="700" fill="#a03228">NPSHr — 펌프가 요구하는 값</text>

    <line x1="350" y1="90" x2="350" y2="320" stroke="#2f6b3a" stroke-width="1.8" stroke-dasharray="7 4"/>
    <text x="350" y="84" font-size="11" font-weight="700" fill="#2f6b3a" text-anchor="middle">정격점</text>
    <path d="M 350 178 L 350 270" stroke="#2f6b3a" stroke-width="2.4" marker-start="url(#mgArrow)" marker-end="url(#mgArrow)"/>
    <text x="362" y="228" font-size="12" font-weight="700" fill="#2f6b3a">마진</text>

    <line x1="605" y1="90" x2="605" y2="320" stroke="#c0392b" stroke-width="1.8" stroke-dasharray="7 4"/>
    <circle cx="605" cy="238" r="7" fill="#c0392b"/>
    <text x="605" y="84" font-size="11" font-weight="700" fill="#a03228" text-anchor="middle">한계 유량</text>
    <text x="700" y="150" font-size="12" font-weight="700" fill="#a03228" text-anchor="middle">여기부터</text>
    <text x="700" y="168" font-size="12" font-weight="700" fill="#a03228" text-anchor="middle">캐비테이션</text>

    <text x="100" y="340" font-size="10.5" fill="#1a1a1a" text-anchor="middle">0</text>

    <!-- 캡션 -->
    <text x="20" y="382" font-size="13" fill="#1a1a1a">
      유량이 늘면 NPSHa는 마찰 손실 때문에 줄고, NPSHr은 입구 유속이 빨라져 커진다. 두 값이 서로를 향해 다가온다.
    </text>
    <text x="20" y="404" font-size="13" fill="#1a1a1a">
      그래서 검토는 정격점 하나가 아니라 운전 범위 전체에서 해야 한다. 대개 최대 유량 지점이 가장 가혹하다.
    </text>
  </g>
</svg>
