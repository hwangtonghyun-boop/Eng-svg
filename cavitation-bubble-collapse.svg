<svg viewBox="0 0 900 460" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="캐비테이션 기포의 생성, 압력 회복, 비대칭 붕괴, 마이크로 제트 형성 과정" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>기포 붕괴와 마이크로 제트</title>

  <defs>
    <marker id="pRed2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c0392b"/>
    </marker>
    <marker id="pBlue2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b8aa8"/>
    </marker>
  </defs>

  <g font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif">

    <!-- ============ ① 기포 생성 ============ -->
    <rect x="20" y="30" width="210" height="345" rx="8" fill="#fafbfc" stroke="#dfe4e8"/>
    <text x="35" y="58" font-size="14" font-weight="700" fill="#2c3e50">① 기포 생성</text>
    <text x="35" y="76" font-size="10.5" fill="#123049">P &lt; Pv · 저압 영역</text>

    <circle cx="125" cy="185" r="34" fill="#eaf3f8" stroke="#5b8aa8" stroke-width="2" stroke-dasharray="5 3"/>
    <path d="M 125 133 L 125 145" stroke="#5b8aa8" stroke-width="2" marker-end="url(#pBlue2)"/>
    <path d="M 177 185 L 165 185" stroke="#5b8aa8" stroke-width="2" marker-end="url(#pBlue2)"/>
    <path d="M 73 185 L 85 185" stroke="#5b8aa8" stroke-width="2" marker-end="url(#pBlue2)"/>
    <path d="M 125 237 L 125 225" stroke="#5b8aa8" stroke-width="2" marker-end="url(#pBlue2)"/>

    <rect x="40" y="250" width="170" height="42" fill="#6b8194" stroke="#44546a" stroke-width="1.6"/>
    <text x="125" y="276" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">금속 표면</text>

    <text x="35" y="330" font-size="10" fill="#1a1a1a">국소 압력이 포화증기압 아래로</text>
    <text x="35" y="348" font-size="10" fill="#1a1a1a">증기 기포가 생겨 자란다</text>

    <!-- ============ ② 압력 회복 ============ -->
    <rect x="240" y="30" width="210" height="345" rx="8" fill="#fafbfc" stroke="#dfe4e8"/>
    <text x="255" y="58" font-size="14" font-weight="700" fill="#2c3e50">② 압력 회복</text>
    <text x="255" y="76" font-size="10.5" fill="#7b2018">P &gt; Pv · 고압부 진입</text>

    <circle cx="345" cy="190" r="30" fill="#eaf3f8" stroke="#5b8aa8" stroke-width="2"/>

    <path d="M 397 190 L 381 190" stroke="#c0392b" stroke-width="2.4" marker-end="url(#pRed2)"/>
    <path d="M 381.8 153.2 L 370.5 164.5" stroke="#c0392b" stroke-width="2.4" marker-end="url(#pRed2)"/>
    <path d="M 345 138 L 345 154" stroke="#c0392b" stroke-width="2.4" marker-end="url(#pRed2)"/>
    <path d="M 308.2 153.2 L 319.5 164.5" stroke="#c0392b" stroke-width="2.4" marker-end="url(#pRed2)"/>
    <path d="M 293 190 L 309 190" stroke="#c0392b" stroke-width="2.4" marker-end="url(#pRed2)"/>
    <path d="M 308.2 226.8 L 319.5 215.5" stroke="#c0392b" stroke-width="2.4" marker-end="url(#pRed2)"/>
    <path d="M 345 242 L 345 226" stroke="#c0392b" stroke-width="2.4" marker-end="url(#pRed2)"/>
    <path d="M 381.8 226.8 L 370.5 215.5" stroke="#c0392b" stroke-width="2.4" marker-end="url(#pRed2)"/>

    <rect x="260" y="250" width="170" height="42" fill="#6b8194" stroke="#44546a" stroke-width="1.6"/>
    <text x="345" y="276" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">금속 표면</text>

    <text x="255" y="330" font-size="10" fill="#1a1a1a">임펠러가 압력을 회복시킨다</text>
    <text x="255" y="348" font-size="10" fill="#1a1a1a">기포가 눌리기 시작한다</text>

    <!-- ============ ③ 비대칭 붕괴 ============ -->
    <rect x="460" y="30" width="210" height="345" rx="8" fill="#fdf9f8" stroke="#e8d9d6"/>
    <text x="475" y="58" font-size="14" font-weight="700" fill="#2c3e50">③ 비대칭 붕괴</text>
    <text x="475" y="76" font-size="10.5" fill="#7b2018">벽면 근처</text>

    <path d="M 535 205 C 535 180, 545 170, 557 178 C 561 186, 569 186, 573 178 C 585 170, 595 180, 595 205 C 595 228, 581 238, 565 238 C 549 238, 535 228, 535 205 Z"
          fill="#eaf3f8" stroke="#5b8aa8" stroke-width="2"/>

    <path d="M 565 130 L 565 172" stroke="#c0392b" stroke-width="3.6" marker-end="url(#pRed2)"/>
    <path d="M 610 150 L 590 170" stroke="#c0392b" stroke-width="2.4" marker-end="url(#pRed2)"/>
    <path d="M 520 150 L 540 170" stroke="#c0392b" stroke-width="2.4" marker-end="url(#pRed2)"/>
    <path d="M 625 205 L 605 205" stroke="#c0392b" stroke-width="2.4" marker-end="url(#pRed2)"/>
    <path d="M 505 205 L 525 205" stroke="#c0392b" stroke-width="2.4" marker-end="url(#pRed2)"/>

    <text x="608" y="172" font-size="10.5" font-weight="700" fill="#a03228">함몰</text>

    <rect x="480" y="250" width="170" height="42" fill="#6b8194" stroke="#44546a" stroke-width="1.6"/>
    <text x="565" y="276" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">금속 표면</text>

    <text x="475" y="330" font-size="10" fill="#1a1a1a">벽 쪽에서는 유체가 밀려들 수 없다</text>
    <text x="475" y="348" font-size="10" font-weight="700" fill="#a03228">그래서 반대편이 함몰된다</text>

    <!-- ============ ④ 마이크로 제트 ============ -->
    <rect x="680" y="30" width="210" height="345" rx="8" fill="#fdf9f8" stroke="#e8d9d6"/>
    <text x="695" y="58" font-size="14" font-weight="700" fill="#2c3e50">④ 마이크로 제트</text>
    <text x="695" y="76" font-size="10.5" fill="#7b2018">충격이 한 점에 집중</text>

    <path d="M 785 138 L 785 172" stroke="#c0392b" stroke-width="3.6" marker-end="url(#pRed2)"/>

    <ellipse cx="763" cy="222" rx="17" ry="15" fill="#eaf3f8" stroke="#5b8aa8" stroke-width="2"/>
    <ellipse cx="807" cy="222" rx="17" ry="15" fill="#eaf3f8" stroke="#5b8aa8" stroke-width="2"/>

    <polygon points="780,178 790,178 788,246 782,246" fill="#1d5a92"/>
    <polygon points="778,242 792,242 785,254" fill="#1d5a92"/>
    <text x="797" y="196" font-size="10.5" font-weight="700" fill="#1d5a92">제트</text>

    <rect x="700" y="250" width="170" height="42" fill="#6b8194" stroke="#44546a" stroke-width="1.6"/>
    <path d="M 774 250 Q 785 266 796 250 Z" fill="#2f3d4f"/>
    <path d="M 772 246 L 760 238" stroke="#c0392b" stroke-width="2"/>
    <path d="M 798 246 L 810 238" stroke="#c0392b" stroke-width="2"/>
    <text x="785" y="282" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">금속 표면</text>

    <text x="695" y="330" font-size="10" fill="#1a1a1a">가느다란 제트가 벽을 때린다</text>
    <text x="695" y="348" font-size="10" font-weight="700" fill="#a03228">반복 충격이 피로 파괴를 만든다</text>

    <!-- 캡션 -->
    <text x="20" y="412" font-size="13" fill="#1a1a1a">
      기포는 벽 근처에서 대칭으로 오그라들지 못한다. 벽 쪽에서 유체가 밀려들 수 없으니 반대편이 함몰되고, 제트는 항상 벽을 향한다.
    </text>
    <text x="20" y="434" font-size="13" fill="#1a1a1a">
      한 번의 충격으로 금속이 뜯기는 것이 아니라, 무수한 반복 충격이 누적되어 표면이 피로 파괴된다. 그래서 손상은 시간이 걸린다.
    </text>
  </g>
</svg>
