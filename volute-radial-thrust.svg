<svg viewBox="0 0 900 470" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="싱글 볼류트의 BEP와 저유량 압력 분포, 듀얼 볼류트의 상쇄 비교" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>볼류트 압력 분포와 반경 추력</title>

  <defs>
    <marker id="prIn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c0392b"/>
    </marker>
    <marker id="prNet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ffd24a"/>
    </marker>
  </defs>

  <g font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif">

    <!-- ============ ① 싱글 · BEP ============ -->
    <rect x="20" y="30" width="280" height="360" rx="8" fill="#fafbfc" stroke="#dfe4e8"/>
    <text x="38" y="58" font-size="14" font-weight="700" fill="#2c3e50">① 싱글 볼류트 · BEP</text>
    <text x="38" y="76" font-size="10.5" fill="#1f2933">설계 유량</text>

    <polygon points="155,277 285,277 285,310 155,310" fill="#dce8f2" stroke="#44546a" stroke-width="1.6"/>
    <path d="M 155 277 A 64 64 0 0 0 201.7 261.7 A 68 68 0 0 0 225.25 215 A 72 72 0 0 0 207.6 162.4 A 76 76 0 0 0 155 136.5 A 80 80 0 0 0 96.6 156.6 A 84 84 0 0 0 68.25 215 A 88 88 0 0 0 90.7 279.3 A 92 92 0 0 0 155 310"
          fill="none" stroke="#44546a" stroke-width="2.2"/>
    <circle cx="155" cy="215" r="48" fill="#44546a"/>
    <line x1="155" y1="263" x2="155" y2="279" stroke="#b8862b" stroke-width="5"/>

    <path d="M 225.2 185.9 L 203.0 195.1" stroke="#c0392b" stroke-width="2.4" marker-end="url(#prIn)"/>
    <path d="M 184.1 144.8 L 174.9 167.0" stroke="#c0392b" stroke-width="2.4" marker-end="url(#prIn)"/>
    <path d="M 125.9 144.8 L 135.1 167.0" stroke="#c0392b" stroke-width="2.4" marker-end="url(#prIn)"/>
    <path d="M 84.8 185.9 L 107.0 195.1" stroke="#c0392b" stroke-width="2.4" marker-end="url(#prIn)"/>
    <path d="M 84.8 244.1 L 107.0 234.9" stroke="#c0392b" stroke-width="2.4" marker-end="url(#prIn)"/>
    <path d="M 125.9 285.2 L 135.1 263.0" stroke="#c0392b" stroke-width="2.4" marker-end="url(#prIn)"/>
    <path d="M 184.1 285.2 L 174.9 263.0" stroke="#c0392b" stroke-width="2.4" marker-end="url(#prIn)"/>
    <path d="M 225.2 244.1 L 203.0 234.9" stroke="#c0392b" stroke-width="2.4" marker-end="url(#prIn)"/>

    <text x="155" y="219" font-size="11" font-weight="700" fill="#ffd24a" text-anchor="middle">합력 ≈ 0</text>

    <text x="38" y="355" font-size="10.5" fill="#1a1a1a">둘레 압력이 고르게 분포한다</text>
    <text x="38" y="373" font-size="10.5" font-weight="700" fill="#2f6b3a">합력이 거의 0에 가깝다</text>

    <!-- ============ ② 싱글 · 저유량 ============ -->
    <rect x="310" y="30" width="280" height="360" rx="8" fill="#fdf9f8" stroke="#e8d9d6"/>
    <text x="328" y="58" font-size="14" font-weight="700" fill="#2c3e50">② 싱글 볼류트 · 저유량</text>
    <text x="328" y="76" font-size="10.5" fill="#1f2933">설계점에서 벗어남</text>

    <polygon points="445,277 575,277 575,310 445,310" fill="#dce8f2" stroke="#44546a" stroke-width="1.6"/>
    <path d="M 445 277 A 64 64 0 0 0 491.7 261.7 A 68 68 0 0 0 515.25 215 A 72 72 0 0 0 497.6 162.4 A 76 76 0 0 0 445 136.5 A 80 80 0 0 0 386.6 156.6 A 84 84 0 0 0 358.25 215 A 88 88 0 0 0 380.7 279.3 A 92 92 0 0 0 445 310"
          fill="none" stroke="#44546a" stroke-width="2.2"/>
    <circle cx="445" cy="215" r="48" fill="#44546a"/>
    <line x1="445" y1="263" x2="445" y2="279" stroke="#b8862b" stroke-width="5"/>

    <path d="M 480.2 300.0 L 464.9 263.0" stroke="#c0392b" stroke-width="3" marker-end="url(#prIn)"/>
    <path d="M 524.5 247.9 L 493.0 234.9" stroke="#c0392b" stroke-width="3" marker-end="url(#prIn)"/>
    <path d="M 518.9 184.4 L 493.0 195.1" stroke="#c0392b" stroke-width="2.6" marker-end="url(#prIn)"/>
    <path d="M 473.3 146.6 L 464.9 167.0" stroke="#c0392b" stroke-width="2.4" marker-end="url(#prIn)"/>
    <path d="M 418.2 150.3 L 425.1 167.0" stroke="#c0392b" stroke-width="2.2" marker-end="url(#prIn)"/>
    <path d="M 384.0 189.7 L 397.0 195.1" stroke="#c0392b" stroke-width="2.2" marker-end="url(#prIn)"/>
    <path d="M 382.2 241.0 L 397.0 234.9" stroke="#c0392b" stroke-width="2.2" marker-end="url(#prIn)"/>
    <path d="M 416.7 283.4 L 425.1 263.0" stroke="#c0392b" stroke-width="2.4" marker-end="url(#prIn)"/>

    <path d="M 445 215 L 390 181" stroke="#ffd24a" stroke-width="5" marker-end="url(#prNet)"/>
    <text x="386" y="170" font-size="11" font-weight="700" fill="#8a6a10" text-anchor="end">합력</text>

    <text x="328" y="355" font-size="10.5" fill="#1a1a1a">컷워터 쪽 압력이 치솟는다</text>
    <text x="328" y="373" font-size="10.5" font-weight="700" fill="#a03228">축을 옆으로 미는 합력이 남는다</text>

    <!-- ============ ③ 듀얼 · 저유량 ============ -->
    <rect x="600" y="30" width="280" height="360" rx="8" fill="#f7fbf7" stroke="#d6e6d4"/>
    <text x="618" y="58" font-size="14" font-weight="700" fill="#2c3e50">③ 듀얼 볼류트 · 저유량</text>
    <text x="618" y="76" font-size="10.5" fill="#1f2933">분할벽으로 유로 2분할</text>

    <polygon points="735,277 865,277 865,325 735,325" fill="#dce8f2" stroke="#44546a" stroke-width="1.6"/>
    <line x1="735" y1="310" x2="865" y2="310" stroke="#44546a" stroke-width="1.4"/>
    <path d="M 735 120 A 108 108 0 0 0 735 325" fill="none" stroke="#44546a" stroke-width="2.2"/>
    <path d="M 735 277 A 64 64 0 0 0 781.7 261.7 A 68 68 0 0 0 805.25 215 A 72 72 0 0 0 787.6 162.4 A 76 76 0 0 0 735 136.5 A 80 80 0 0 0 676.6 156.6 A 84 84 0 0 0 648.25 215 A 88 88 0 0 0 670.7 279.3 A 92 92 0 0 0 735 310"
          fill="none" stroke="#44546a" stroke-width="2.2"/>
    <circle cx="735" cy="215" r="48" fill="#44546a"/>
    <line x1="735" y1="263" x2="735" y2="279" stroke="#b8862b" stroke-width="5"/>
    <line x1="735" y1="167" x2="735" y2="120" stroke="#b8862b" stroke-width="5"/>

    <path d="M 767.1 292.6 L 754.9 263.0" stroke="#c0392b" stroke-width="2.6" marker-end="url(#prIn)"/>
    <path d="M 807.1 244.9 L 783.0 234.9" stroke="#c0392b" stroke-width="2.4" marker-end="url(#prIn)"/>
    <path d="M 801.5 187.4 L 783.0 195.1" stroke="#c0392b" stroke-width="2.2" marker-end="url(#prIn)"/>
    <path d="M 761.0 152.2 L 754.9 167.0" stroke="#c0392b" stroke-width="2.2" marker-end="url(#prIn)"/>
    <path d="M 702.9 137.4 L 715.1 167.0" stroke="#c0392b" stroke-width="2.6" marker-end="url(#prIn)"/>
    <path d="M 662.9 185.1 L 687.0 195.1" stroke="#c0392b" stroke-width="2.4" marker-end="url(#prIn)"/>
    <path d="M 668.5 242.6 L 687.0 234.9" stroke="#c0392b" stroke-width="2.2" marker-end="url(#prIn)"/>
    <path d="M 709.0 277.8 L 715.1 263.0" stroke="#c0392b" stroke-width="2.2" marker-end="url(#prIn)"/>

    <text x="735" y="219" font-size="11" font-weight="700" fill="#ffd24a" text-anchor="middle">합력 ≈ 0</text>

    <text x="618" y="355" font-size="10.5" fill="#1a1a1a">같은 분포가 180도 어긋나 두 번</text>
    <text x="618" y="373" font-size="10.5" font-weight="700" fill="#2f6b3a">둘레를 합하면 거의 상쇄된다</text>

    <!-- 범례 -->
    <line x1="30" y1="415" x2="58" y2="415" stroke="#b8862b" stroke-width="5"/>
    <text x="66" y="420" font-size="11" fill="#1a1a1a">컷워터 · 분할벽</text>

    <path d="M 200 415 L 228 415" stroke="#c0392b" stroke-width="2.6" marker-end="url(#prIn)"/>
    <text x="236" y="420" font-size="11" fill="#1a1a1a">볼류트 압력 (화살표 길이 = 크기)</text>

    <line x1="490" y1="415" x2="518" y2="415" stroke="#ffd24a" stroke-width="5"/>
    <text x="526" y="420" font-size="11" fill="#1a1a1a">축에 걸리는 합력</text>

    <text x="30" y="448" font-size="13" fill="#1a1a1a">
      화살표 길이가 그 위치의 압력이다. 듀얼 볼류트는 힘을 없애는 것이 아니라, 같은 분포를 180도 어긋나게 두 번 만들어 합을 줄인다.
    </text>
  </g>
</svg>
