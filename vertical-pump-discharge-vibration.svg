<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 470" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">
  <rect width="860" height="470" fill="#ffffff"/>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/>
    </marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2c6fbb"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>

  <!-- ===== Left: side view ===== -->
  <text x="215" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#222">① 측면도 — 지상 구조물은 외팔보처럼 흔들린다</text>

  <!-- motor -->
  <rect x="150" y="60" width="120" height="120" rx="8" fill="#e8eef5" stroke="#34495e" stroke-width="2"/>
  <text x="210" y="125" text-anchor="middle" font-size="15" fill="#34495e" font-weight="700">모터</text>
  <!-- measurement point -->
  <circle cx="210" cy="60" r="6" fill="#c0392b"/>
  <line x1="210" y1="48" x2="320" y2="48" stroke="#c0392b" stroke-width="3" marker-end="url(#ar)"/>
  <line x1="210" y1="48" x2="110" y2="48" stroke="#c0392b" stroke-width="3" marker-end="url(#ar)"/>
  <text x="330" y="53" font-size="13" fill="#c0392b" font-weight="700">토출 방향 진동</text>

  <!-- discharge head -->
  <path d="M160,180 L260,180 L280,290 L140,290 Z" fill="#f4f6f8" stroke="#34495e" stroke-width="2"/>
  <rect x="185" y="200" width="50" height="55" rx="4" fill="#ffffff" stroke="#7f8c8d" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="210" y="232" text-anchor="middle" font-size="11" fill="#7f8c8d">점검창</text>
  <text x="100" y="240" text-anchor="end" font-size="13" fill="#34495e">토출헤드</text>

  <!-- discharge nozzle -->
  <rect x="270" y="245" width="90" height="34" fill="#f4f6f8" stroke="#34495e" stroke-width="2"/>
  <line x1="300" y1="262" x2="385" y2="262" stroke="#2c6fbb" stroke-width="3" marker-end="url(#ab)"/>
  <text x="392" y="267" font-size="13" fill="#2c6fbb" font-weight="700">토출 배관</text>

  <!-- sole plate & foundation -->
  <rect x="110" y="290" width="200" height="14" fill="#95a5a6" stroke="#34495e" stroke-width="1.5"/>
  <text x="320" y="302" font-size="12" fill="#555">솔플레이트</text>
  <rect x="90" y="304" width="240" height="30" fill="#d5d8dc" stroke="#7f8c8d" stroke-width="1"/>
  <text x="210" y="324" text-anchor="middle" font-size="12" fill="#555">기초 · 그라우트</text>

  <!-- column -->
  <rect x="195" y="334" width="30" height="100" fill="#ecf0f1" stroke="#34495e" stroke-width="1.5"/>
  <line x1="210" y1="430" x2="210" y2="350" stroke="#555" stroke-width="2" marker-end="url(#ag)"/>
  <text x="240" y="395" font-size="12" fill="#555">컬럼 (유체 상승)</text>
  <text x="210" y="455" text-anchor="middle" font-size="12" fill="#555">수조 · 캔 내부</text>

  <!-- cantilever deflection hint -->
  <path d="M140,60 Q125,175 120,290" fill="none" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="52" y="150" font-size="12" fill="#c0392b">리드(Reed)</text>
  <text x="52" y="166" font-size="12" fill="#c0392b">모드 형상</text>

  <!-- divider -->
  <line x1="460" y1="50" x2="460" y2="440" stroke="#dcdcdc" stroke-width="1.5"/>

  <!-- ===== Right: plan view ===== -->
  <text x="660" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#222">② 평면도 — 두 방향의 강성이 다르다</text>

  <circle cx="660" cy="220" r="105" fill="#f4f6f8" stroke="#34495e" stroke-width="2"/>
  <!-- windows -->
  <path d="M600,135 A105,105 0 0,1 720,135" fill="none" stroke="#ffffff" stroke-width="10"/>
  <path d="M600,305 A105,105 0 0,0 720,305" fill="none" stroke="#ffffff" stroke-width="10"/>
  <path d="M600,135 A105,105 0 0,1 720,135" fill="none" stroke="#7f8c8d" stroke-width="1.5" stroke-dasharray="4 3"/>
  <path d="M600,305 A105,105 0 0,0 720,305" fill="none" stroke="#7f8c8d" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="660" y="108" text-anchor="middle" font-size="11" fill="#7f8c8d">점검창</text>
  <text x="660" y="342" text-anchor="middle" font-size="11" fill="#7f8c8d">점검창</text>

  <circle cx="660" cy="220" r="22" fill="#e8eef5" stroke="#34495e" stroke-width="1.5"/>
  
  <!-- nozzle -->
  <rect x="765" y="200" width="60" height="40" fill="#f4f6f8" stroke="#34495e" stroke-width="2"/>
  <text x="795" y="262" text-anchor="middle" font-size="12" fill="#2c6fbb">토출 노즐</text>

  <!-- direction arrows -->
  <line x1="530" y1="220" x2="745" y2="220" stroke="#c0392b" stroke-width="3" marker-start="url(#ar)" marker-end="url(#ar)"/>
  <text x="478" y="190" font-size="13" fill="#c0392b" font-weight="700">P</text><text x="478" y="207" font-size="13" fill="#c0392b" font-weight="700">토출 방향</text>
  <line x1="660" y1="160" x2="660" y2="198" stroke="#2c6fbb" stroke-width="3" marker-start="url(#ab)"/>
  <line x1="660" y1="242" x2="660" y2="282" stroke="#2c6fbb" stroke-width="3" marker-end="url(#ab)"/>
  <text x="676" y="290" font-size="13" fill="#2c6fbb" font-weight="700">C (직각 방향)</text>

  <!-- summary box -->
  <rect x="500" y="370" width="320" height="70" rx="8" fill="#fdf2f0" stroke="#c0392b" stroke-width="1.2"/>
  <text x="660" y="398" text-anchor="middle" font-size="14" fill="#222" font-weight="700">k<tspan font-size="10" dy="3">P</tspan><tspan dy="-3"> ≠ k</tspan><tspan font-size="10" dy="3">C</tspan><tspan dy="-3">  →  f</tspan><tspan font-size="10" dy="3">n,P</tspan><tspan dy="-3"> ≠ f</tspan><tspan font-size="10" dy="3">n,C</tspan></text>
  <text x="660" y="424" text-anchor="middle" font-size="12" fill="#555">같은 가진력이라도 운전속도에 가까운 쪽 방향만 크게 증폭된다</text>
</svg>
