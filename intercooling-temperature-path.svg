<svg viewBox="0 0 900 470" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="한 번에 압축할 때와 다단 중간냉각을 적용할 때의 온도 경로 비교" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>나누고 식히면 한계를 넘지 않는다</title>

  <defs>
    <marker id="icAx" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a1a"/>
    </marker>
    <marker id="icCool" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1d5a92"/>
    </marker>
  </defs>

  <g font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif">

    <text x="20" y="48" font-size="17" font-weight="700" fill="#2c3e50">나누기만 해서는 안 된다. 식혀야 한다</text>
    <text x="20" y="70" font-size="12.5" fill="#1f2933">같은 전체 압력비를 세 가지 방식으로 올렸을 때의 온도 경로</text>

    <rect x="110" y="90" width="720" height="48" fill="#fbe9e7"/>

    <line x1="110" y1="90" x2="110" y2="330" stroke="#1a1a1a" stroke-width="1.6"/>
    <path d="M 110 330 L 845 330" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#icAx)"/>
    <text x="90" y="215" font-size="12" fill="#1a1a1a" transform="rotate(-90 90 215)" text-anchor="middle">온도</text>
    <text x="836" y="352" font-size="12" fill="#1a1a1a" text-anchor="end">압력 →</text>

    <line x1="110" y1="138" x2="838" y2="138" stroke="#c0392b" stroke-width="2.6" stroke-dasharray="9 5"/>
    <text x="124" y="131" font-size="11.5" font-weight="700" fill="#a03228">온도 한계</text>

    <line x1="110" y1="296" x2="838" y2="296" stroke="#8b98a4" stroke-width="1.4" stroke-dasharray="5 4"/>
    <text x="124" y="290" font-size="10.5" fill="#5b6673">냉각 후 도달 온도</text>

    <!-- ① 한 번에 -->
    <path d="M 140 296 C 260 268, 400 212, 540 158 C 620 128, 700 106, 790 96" fill="none" stroke="#c0392b" stroke-width="3.2"/>
    <circle cx="140" cy="296" r="6" fill="#1a1a1a"/>
    <circle cx="790" cy="96" r="7" fill="#c0392b"/>
    <text x="700" y="88" font-size="11.5" font-weight="700" fill="#a03228">한계를 넘는다</text>

    <!-- ② 나누기만 -->
    <path d="M 140 296 C 220 280, 300 254, 380 228 L 430 228 C 510 208, 590 176, 670 148 C 720 130, 760 116, 790 110"
          fill="none" stroke="#c1500a" stroke-width="3" stroke-dasharray="8 4"/>
    <circle cx="790" cy="110" r="6" fill="#c1500a"/>

    <!-- ③ 다단 + 중간냉각 -->
    <path d="M 140 296 C 220 280, 300 254, 380 228" fill="none" stroke="#2f6b3a" stroke-width="3.2"/>
    <path d="M 380 228 L 380 296" stroke="#1d5a92" stroke-width="3" marker-end="url(#icCool)"/>
    <path d="M 380 296 C 450 282, 530 258, 600 232" fill="none" stroke="#2f6b3a" stroke-width="3.2"/>
    <path d="M 600 232 L 600 296" stroke="#1d5a92" stroke-width="3" marker-end="url(#icCool)"/>
    <path d="M 600 296 C 660 284, 730 264, 790 244" fill="none" stroke="#2f6b3a" stroke-width="3.2"/>
    <circle cx="790" cy="244" r="7" fill="#2f6b3a"/>

    <text x="392" y="268" font-size="10" font-weight="700" fill="#123049">냉각</text>
    <text x="612" y="268" font-size="10" font-weight="700" fill="#123049">냉각</text>

    <text x="700" y="238" font-size="11.5" font-weight="700" fill="#2f6b3a">한계 안에 머문다</text>

    <text x="128" y="316" font-size="10" fill="#1a1a1a">흡입</text>

    <!-- 범례 -->
    <line x1="140" y1="386" x2="176" y2="386" stroke="#c0392b" stroke-width="3.2"/>
    <text x="186" y="390" font-size="11.5" fill="#1a1a1a">① 한 번에 압축</text>

    <line x1="330" y1="386" x2="366" y2="386" stroke="#c1500a" stroke-width="3" stroke-dasharray="8 4"/>
    <text x="376" y="390" font-size="11.5" fill="#1a1a1a">② 단만 나눔 (냉각 없음)</text>

    <line x1="600" y1="386" x2="636" y2="386" stroke="#2f6b3a" stroke-width="3.2"/>
    <text x="646" y="390" font-size="11.5" fill="#1a1a1a">③ 다단 + 중간냉각</text>

    <!-- 캡션 -->
    <text x="20" y="424" font-size="13" fill="#1a1a1a">
      ②는 단을 나눴지만 뜨거운 가스가 그대로 다음 단으로 간다. 온도는 비율로 오르므로 출발점이 높으면 결과도 높다.
    </text>
    <text x="20" y="446" font-size="13" fill="#1a1a1a">
      ③은 매번 출발점을 되돌린다. 온도 한계를 지키는 동시에, 차가운 가스는 밀도가 높아 압축에 드는 일도 줄어든다.
    </text>
  </g>
</svg>
