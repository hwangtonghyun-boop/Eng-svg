<svg viewBox="0 0 900 565" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="전식 대책 배치 비교 - 대책 없음, 양쪽 절연의 위험, 구동측 접지 링과 반구동측 절연 베어링 조합" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>대책은 어디에 두는가</title>

  <defs>
    <marker id="cArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c0392b"/>
    </marker>
    <marker id="gArrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2f6b3a"/>
    </marker>
  </defs>

  <g font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif">

    <!-- ============ ① 대책 없음 ============ -->
    <rect x="20" y="30" width="860" height="140" rx="8" fill="#fdf9f8" stroke="#e8d9d6"/>
    <text x="40" y="84" font-size="13.5" font-weight="700" fill="#2c3e50">① 대책 없음</text>
    <text x="40" y="102" font-size="10" fill="#1f2933">양쪽 베어링으로 방전</text>

    <rect x="160" y="60" width="300" height="65" rx="3" fill="#eef2f5" stroke="#44546a" stroke-width="1.6"/>
    <rect x="535" y="60" width="240" height="65" rx="3" fill="#eef2f5" stroke="#44546a" stroke-width="1.6"/>
    <text x="310" y="76" font-size="10" font-weight="700" fill="#1a1a1a" text-anchor="middle">모터</text>
    <text x="655" y="76" font-size="10" font-weight="700" fill="#1a1a1a" text-anchor="middle">펌프</text>

    <rect x="180" y="88" width="440" height="12" fill="#44546a"/>
    <rect x="480" y="82" width="45" height="24" fill="#c8d2da" stroke="#7a8794"/>
    <rect x="190" y="78" width="35" height="32" fill="#6b8194" stroke="#3f4b58"/>
    <rect x="410" y="78" width="35" height="32" fill="#6b8194" stroke="#3f4b58"/>
    <rect x="555" y="78" width="35" height="32" fill="#6b8194" stroke="#3f4b58"/>

    <path d="M 207 100 L 207 122" stroke="#c0392b" stroke-width="2.4" marker-end="url(#cArrow)"/>
    <path d="M 427 100 L 427 122" stroke="#c0392b" stroke-width="2.4" marker-end="url(#cArrow)"/>

    <line x1="310" y1="125" x2="310" y2="138" stroke="#1a1a1a" stroke-width="1.8"/>
    <line x1="298" y1="138" x2="322" y2="138" stroke="#1a1a1a" stroke-width="1.8"/>
    <line x1="303" y1="143" x2="317" y2="143" stroke="#1a1a1a" stroke-width="1.8"/>

    <text x="640" y="160" font-size="11" font-weight="700" fill="#a03228">전류가 모터 베어링을 통과한다</text>

    <!-- ============ ② 양쪽 절연 ============ -->
    <rect x="20" y="182" width="860" height="140" rx="8" fill="#fdf9f8" stroke="#e8d9d6"/>
    <text x="40" y="236" font-size="13.5" font-weight="700" fill="#2c3e50">② 양쪽 절연</text>
    <text x="40" y="254" font-size="10" fill="#1f2933">전류가 펌프로 넘어간다</text>

    <rect x="160" y="212" width="300" height="65" rx="3" fill="#eef2f5" stroke="#44546a" stroke-width="1.6"/>
    <rect x="535" y="212" width="240" height="65" rx="3" fill="#eef2f5" stroke="#44546a" stroke-width="1.6"/>

    <rect x="180" y="240" width="440" height="12" fill="#44546a"/>
    <rect x="480" y="234" width="45" height="24" fill="#c8d2da" stroke="#7a8794"/>
    <rect x="190" y="230" width="35" height="32" fill="#f4e9d8" stroke="#c1500a" stroke-width="2.6"/>
    <rect x="410" y="230" width="35" height="32" fill="#f4e9d8" stroke="#c1500a" stroke-width="2.6"/>
    <rect x="555" y="230" width="35" height="32" fill="#6b8194" stroke="#3f4b58"/>

    <path d="M 240 246 L 545 246" stroke="#c0392b" stroke-width="2.6" stroke-dasharray="8 4"/>
    <path d="M 572 252 L 572 274" stroke="#c0392b" stroke-width="2.6" marker-end="url(#cArrow)"/>
    <text x="503" y="226" font-size="10" font-weight="700" fill="#a03228" text-anchor="middle">커플링을 타고</text>

    <line x1="310" y1="277" x2="310" y2="290" stroke="#1a1a1a" stroke-width="1.8"/>
    <line x1="298" y1="290" x2="322" y2="290" stroke="#1a1a1a" stroke-width="1.8"/>
    <line x1="303" y1="295" x2="317" y2="295" stroke="#1a1a1a" stroke-width="1.8"/>

    <text x="620" y="312" font-size="11" font-weight="700" fill="#a03228">모터는 지키지만 펌프 베어링이 손상된다</text>

    <!-- ============ ③ 접지 링 + 절연 ============ -->
    <rect x="20" y="334" width="860" height="140" rx="8" fill="#f7fbf7" stroke="#d6e6d4"/>
    <text x="40" y="388" font-size="13.5" font-weight="700" fill="#2c3e50">③ 접지 링 + 절연</text>
    <text x="40" y="406" font-size="10" fill="#1f2933">전하를 안전하게 배출</text>

    <rect x="160" y="364" width="300" height="65" rx="3" fill="#eef2f5" stroke="#44546a" stroke-width="1.6"/>
    <rect x="535" y="364" width="240" height="65" rx="3" fill="#eef2f5" stroke="#44546a" stroke-width="1.6"/>

    <rect x="180" y="392" width="440" height="12" fill="#44546a"/>
    <rect x="480" y="386" width="45" height="24" fill="#c8d2da" stroke="#7a8794"/>
    <rect x="190" y="382" width="35" height="32" fill="#f4e9d8" stroke="#c1500a" stroke-width="2.6"/>
    <rect x="410" y="382" width="35" height="32" fill="#6b8194" stroke="#3f4b58"/>
    <rect x="555" y="382" width="35" height="32" fill="#6b8194" stroke="#3f4b58"/>

    <rect x="450" y="384" width="20" height="28" fill="#d8ecd6" stroke="#2f6b3a" stroke-width="2.6"/>
    <text x="460" y="374" font-size="9.5" font-weight="700" fill="#2f6b3a" text-anchor="middle">접지 링</text>

    <path d="M 240 398 L 444 398" stroke="#2f6b3a" stroke-width="2.6" stroke-dasharray="8 4"/>
    <path d="M 460 412 L 460 440" stroke="#2f6b3a" stroke-width="2.6" marker-end="url(#gArrow2)"/>
    <line x1="446" y1="444" x2="474" y2="444" stroke="#1a1a1a" stroke-width="1.8"/>
    <line x1="451" y1="449" x2="469" y2="449" stroke="#1a1a1a" stroke-width="1.8"/>
    <line x1="456" y1="454" x2="464" y2="454" stroke="#1a1a1a" stroke-width="1.8"/>

    <text x="620" y="464" font-size="11" font-weight="700" fill="#2f6b3a">전하가 유막을 뚫기 전에 빠져나간다</text>

    <!-- 범례 -->
    <line x1="40" y1="500" x2="72" y2="500" stroke="#c0392b" stroke-width="2.6" stroke-dasharray="8 4"/>
    <text x="80" y="505" font-size="11" fill="#1a1a1a">전류 경로</text>

    <rect x="180" y="493" width="16" height="14" fill="#f4e9d8" stroke="#c1500a" stroke-width="2.2"/>
    <text x="204" y="505" font-size="11" fill="#1a1a1a">절연 베어링</text>

    <rect x="320" y="493" width="16" height="14" fill="#d8ecd6" stroke="#2f6b3a" stroke-width="2.2"/>
    <text x="344" y="505" font-size="11" fill="#1a1a1a">접지 링</text>

    <rect x="440" y="493" width="16" height="14" fill="#6b8194" stroke="#3f4b58"/>
    <text x="464" y="505" font-size="11" fill="#1a1a1a">일반 베어링</text>

    <!-- 캡션 -->
    <text x="20" y="540" font-size="13" fill="#1a1a1a">
      전류는 없어지지 않는다. 길을 막으면 다른 길을 찾는다. 그래서 막기만 해서는 안 되고 빠져나갈 길을 함께 만들어야 한다.
    </text>
    <text x="20" y="562" font-size="13" fill="#1a1a1a">
      양쪽을 모두 절연하면 모터는 지키지만 커플링 너머 펌프 베어링이 대신 손상된다.
    </text>
  </g>
</svg>
