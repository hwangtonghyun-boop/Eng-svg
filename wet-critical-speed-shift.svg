<svg viewBox="0 0 900 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="마모가 진행되면 습식 임계속도가 낮아져 운전 속도에 접근하는 과정" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>습식 임계속도는 시간이 지나면 내려온다</title>

  <defs>
    <marker id="wArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a03228"/>
    </marker>
    <marker id="wAx" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a1a"/>
    </marker>
    <marker id="wUp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a03228"/>
    </marker>
  </defs>

  <g font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif">

    <rect x="20" y="30" width="860" height="300" rx="8" fill="#fafbfc" stroke="#dfe4e8"/>
    <text x="40" y="58" font-size="15" font-weight="700" fill="#2c3e50">마모가 진행되면 습식 임계속도가 운전 속도 쪽으로 내려온다</text>

    <line x1="90" y1="88" x2="90" y2="300" stroke="#1a1a1a" stroke-width="1.6"/>
    <path d="M 90 300 L 845 300" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#wAx)"/>
    <text x="838" y="318" font-size="10.5" fill="#1a1a1a" text-anchor="end">회전수</text>
    <text x="70" y="195" font-size="10.5" fill="#1a1a1a" transform="rotate(-90 70 195)" text-anchor="middle">진동 진폭</text>

    <line x1="640" y1="88" x2="640" y2="300" stroke="#2f3d4f" stroke-width="2.4" stroke-dasharray="8 4"/>
    <text x="640" y="80" font-size="11.5" font-weight="700" fill="#2f3d4f" text-anchor="middle">운전 속도</text>

    <path d="M 100 290 L 640 287 C 700 284, 760 160, 800 150 C 815 158, 822 200, 828 240"
          fill="none" stroke="#5a9150" stroke-width="2.6"/>
    <path d="M 100 288 L 560 284 C 630 280, 690 155, 725 148 C 755 158, 790 235, 828 270"
          fill="none" stroke="#c99b3f" stroke-width="2.6"/>
    <path d="M 100 286 L 500 281 C 560 276, 625 148, 660 140 C 700 152, 760 240, 828 278"
          fill="none" stroke="#c0392b" stroke-width="2.8"/>

    <circle cx="640" cy="287" r="5.5" fill="#2f6b3a"/>
    <circle cx="640" cy="232" r="5.5" fill="#8a6114"/>
    <circle cx="640" cy="151" r="6" fill="#a03228"/>

    <path d="M 800 116 L 662 116" stroke="#a03228" stroke-width="2.2" marker-end="url(#wArrow)"/>
    <text x="731" y="108" font-size="11" font-weight="700" fill="#a03228" text-anchor="middle">임계속도가 내려온다</text>

    <path d="M 615 283 L 615 158" stroke="#a03228" stroke-width="2" marker-end="url(#wUp)"/>
    <text x="604" y="214" font-size="11" font-weight="700" fill="#a03228" text-anchor="end">운전점 진폭 증가</text>

    <rect x="120" y="98" width="250" height="86" rx="6" fill="#ffffff" stroke="#dfe4e8"/>
    <line x1="134" y1="120" x2="164" y2="120" stroke="#5a9150" stroke-width="2.6"/>
    <text x="172" y="124" font-size="10.5" fill="#1a1a1a">신품 — 간극이 설계값</text>
    <line x1="134" y1="143" x2="164" y2="143" stroke="#c99b3f" stroke-width="2.6"/>
    <text x="172" y="147" font-size="10.5" fill="#1a1a1a">마모 진행 — 간극 확대</text>
    <line x1="134" y1="166" x2="164" y2="166" stroke="#c0392b" stroke-width="2.8"/>
    <text x="172" y="170" font-size="10.5" fill="#1a1a1a">마모 심함 — 롬막 강성 상실</text>

    <text x="120" y="246" font-size="11" fill="#1a1a1a">간극이 벌어지면 축을 받치던 유체 스프링이 약해진다</text>
    <text x="120" y="266" font-size="11" font-weight="700" fill="#a03228">로터 강성이 떨어지고 임계속도가 낮아진다</text>

    <!-- 캡션 -->
    <text x="20" y="360" font-size="13" fill="#1a1a1a">
      운전점도 그대로고 정렬도 정상인데 진동만 커진다면, 마모 링 간극이 벌어져 습식 임계속도가 내려온 것은 아닌지 의심해야 한다.
    </text>
    <text x="20" y="382" font-size="13" fill="#1a1a1a">
      설계 시점의 분리 여유는 시간이 지나면 잠식된다. 신품 때 통과했다는 사실이 지금도 안전하다는 뜻은 아니다.
    </text>
  </g>
</svg>
