<svg viewBox="0 0 900 460" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="정지 중 상하 온도차로 로터가 휘는 모습과 터닝 디바이스로 천천히 돌려 온도를 고르게 만든 모습 비교">
  <title>돌리면 휘지 않는다</title>

  <defs>
    <marker id="tdRot" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2f6b3a"/>
    </marker>
    <marker id="tdHit" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c0392b"/>
    </marker>
  </defs>

  <g font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif">

    <!-- ============ ① 정지 ============ -->
    <rect x="20" y="30" width="420" height="320" rx="8" fill="#fdf9f8" stroke="#e8d9d6"/>
    <text x="40" y="58" font-size="14" font-weight="700" fill="#2c3e50">① 멈춰 있을 때</text>
    <text x="40" y="76" font-size="10.5" fill="#1f2933">뜨거운 기체가 위에 머문다</text>

    <rect x="55" y="128" width="350" height="150" rx="5" fill="none" stroke="#44546a" stroke-width="2.4"/>
    <rect x="57" y="130" width="346" height="72" fill="#fbe9e7"/>
    <rect x="57" y="202" width="346" height="74" fill="#e3edf4"/>
    <line x1="57" y1="202" x2="403" y2="202" stroke="#a8b4bd" stroke-width="1.2" stroke-dasharray="5 3"/>

    <text x="76" y="152" font-size="11" font-weight="700" fill="#a03228">뜨겁다 — 더 팽창</text>
    <text x="76" y="262" font-size="11" font-weight="700" fill="#1d5a92">차갑다 — 덜 팽창</text>

    <path d="M 40 208 Q 230 172, 420 208" fill="none" stroke="#44546a" stroke-width="15"/>

    <rect x="148" y="162" width="20" height="26" fill="#6b8194" stroke="#3f4b58" stroke-width="1.2"/>
    <rect x="148" y="224" width="20" height="26" fill="#6b8194" stroke="#3f4b58" stroke-width="1.2"/>
    <rect x="288" y="162" width="20" height="26" fill="#6b8194" stroke="#3f4b58" stroke-width="1.2"/>
    <rect x="288" y="224" width="20" height="26" fill="#6b8194" stroke="#3f4b58" stroke-width="1.2"/>

    <circle cx="158" cy="188" r="10" fill="#e8a33d" opacity="0.55"/>
    <path d="M 158 176 L 158 170 M 146 188 L 140 188 M 170 188 L 176 188" stroke="#c0392b" stroke-width="2.2"/>
    <circle cx="298" cy="188" r="10" fill="#e8a33d" opacity="0.55"/>
    <path d="M 298 176 L 298 170 M 286 188 L 280 188 M 310 188 L 316 188" stroke="#c0392b" stroke-width="2.2"/>

    <text x="158" y="300" font-size="10" font-weight="700" fill="#1a1a1a" text-anchor="middle">씰 · 부싱</text>
    <text x="380" y="214" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">로터</text>

    <text x="40" y="326" font-size="11" font-weight="700" fill="#a03228">위쪽이 더 늘어나 로터가 활처럼 휜다</text>

    <!-- ============ ② 터닝 ============ -->
    <rect x="460" y="30" width="420" height="320" rx="8" fill="#f7fbf7" stroke="#d6e6d4"/>
    <text x="480" y="58" font-size="14" font-weight="700" fill="#2c3e50">② 천천히 돌릴 때</text>
    <text x="480" y="76" font-size="10.5" fill="#1f2933">모든 면이 번갈아 위를 지난다</text>

    <rect x="495" y="128" width="350" height="150" rx="5" fill="none" stroke="#44546a" stroke-width="2.4"/>
    <rect x="497" y="130" width="346" height="146" fill="#fdf3e0"/>

    <text x="516" y="152" font-size="11" font-weight="700" fill="#7a5a24">원주 방향으로 고르게 데워짐</text>

    <path d="M 480 205 L 860 205" fill="none" stroke="#44546a" stroke-width="15"/>

    <rect x="588" y="162" width="20" height="26" fill="#6b8194" stroke="#3f4b58" stroke-width="1.2"/>
    <rect x="588" y="222" width="20" height="26" fill="#6b8194" stroke="#3f4b58" stroke-width="1.2"/>
    <rect x="728" y="162" width="20" height="26" fill="#6b8194" stroke="#3f4b58" stroke-width="1.2"/>
    <rect x="728" y="222" width="20" height="26" fill="#6b8194" stroke="#3f4b58" stroke-width="1.2"/>

    <path d="M 598 190 L 598 196" stroke="#2f6b3a" stroke-width="2"/>
    <path d="M 598 214 L 598 220" stroke="#2f6b3a" stroke-width="2"/>
    <path d="M 738 190 L 738 196" stroke="#2f6b3a" stroke-width="2"/>
    <path d="M 738 214 L 738 220" stroke="#2f6b3a" stroke-width="2"/>
    <text x="620" y="182" font-size="10" font-weight="700" fill="#2f6b3a">간극 유지</text>

    <circle cx="820" cy="205" r="30" fill="none" stroke="#2f6b3a" stroke-width="2.6" stroke-dasharray="8 5"/>
    <path d="M 850 205 A 30 30 0 0 1 836 230" fill="none" stroke="#2f6b3a" stroke-width="3" marker-end="url(#tdRot)"/>
    <text x="820" y="256" font-size="10.5" font-weight="700" fill="#2f6b3a" text-anchor="middle">터닝 디바이스</text>

    <text x="480" y="326" font-size="11" font-weight="700" fill="#2f6b3a">온도차가 생길 틈이 없어 곧게 유지된다</text>

    <!-- 캡션 -->
    <text x="20" y="388" font-size="13" fill="#1a1a1a">
      정지한 로터는 위쪽만 뜨거워져 휜다. 그 상태로 기동하면 휜 부분이 씰과 부싱을 때리고, 접촉이 열을 만들어 휨을 더 키운다.
    </text>
    <text x="20" y="410" font-size="13" fill="#1a1a1a">
      천천히 계속 돌리면 모든 면이 번갈아 위쪽을 지나므로 온도가 고르게 된다. 휘게 만드는 원인 자체가 사라지는 것이다.
    </text>
    <text x="20" y="432" font-size="13" fill="#1a1a1a">
      휜 상태를 오래 두면 영구 변형이 남아 로터를 빼내 교정해야 한다. 냉각 중 터닝이 멈추는 것이 심각한 상황인 이유다.
    </text>
  </g>
</svg>
