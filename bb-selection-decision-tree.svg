<svg viewBox="0 0 900 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="고압 다단 펌프 BB3 BB4 BB5 기종 선정 결정 트리" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>고압 다단 펌프 기종 결정 트리</title>

  <defs>
    <marker id="flowArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6673"/>
    </marker>
  </defs>

  <g font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif">

    <!-- ===== 1단계 ===== -->
    <rect x="60" y="50" width="400" height="72" rx="8" fill="#eef2f5" stroke="#7a8794" stroke-width="1.6"/>
    <text x="260" y="80" font-size="14" font-weight="600" fill="#2c3e50" text-anchor="middle">가연성 · 독성 유체이면서</text>
    <text x="260" y="102" font-size="14" font-weight="600" fill="#2c3e50" text-anchor="middle">상대밀도가 낮은가?</text>

    <path d="M 460 86 L 588 86" stroke="#5b6673" stroke-width="1.8" fill="none" marker-end="url(#flowArrow)"/>
    <text x="524" y="76" font-size="12.5" font-weight="700" fill="#c0392b" text-anchor="middle">예</text>

    <rect x="595" y="50" width="265" height="72" rx="8" fill="#fbe9e7" stroke="#d9a9a2" stroke-width="1.6"/>
    <text x="727" y="80" font-size="14" font-weight="700" fill="#a03228" text-anchor="middle">축방향 분할(BB3) 배제</text>
    <text x="727" y="102" font-size="12.5" fill="#5c221b" text-anchor="middle">방사형 분할 필요 → 실무상 BB5</text>

    <path d="M 260 122 L 260 168" stroke="#5b6673" stroke-width="1.8" fill="none" marker-end="url(#flowArrow)"/>
    <text x="288" y="150" font-size="12.5" fill="#1f2933">아니오</text>

    <!-- ===== 2단계 ===== -->
    <rect x="60" y="175" width="400" height="72" rx="8" fill="#eef2f5" stroke="#7a8794" stroke-width="1.6"/>
    <text x="260" y="205" font-size="14" font-weight="600" fill="#2c3e50" text-anchor="middle">압력 또는 온도가</text>
    <text x="260" y="227" font-size="14" font-weight="600" fill="#2c3e50" text-anchor="middle">BB3의 실용 한계를 넘는가?</text>

    <path d="M 460 211 L 588 211" stroke="#5b6673" stroke-width="1.8" fill="none" marker-end="url(#flowArrow)"/>
    <text x="524" y="201" font-size="12.5" font-weight="700" fill="#c0392b" text-anchor="middle">예</text>

    <rect x="595" y="175" width="265" height="72" rx="8" fill="#fbe9e7" stroke="#d9a9a2" stroke-width="1.6"/>
    <text x="727" y="205" font-size="16" font-weight="700" fill="#a03228" text-anchor="middle">BB5</text>
    <text x="727" y="227" font-size="12.5" fill="#5c221b" text-anchor="middle">배럴 구조 · 대칭 열팽창</text>

    <path d="M 260 247 L 260 293" stroke="#5b6673" stroke-width="1.8" fill="none" marker-end="url(#flowArrow)"/>
    <text x="288" y="275" font-size="12.5" fill="#1f2933">아니오</text>

    <!-- ===== 3단계 ===== -->
    <rect x="60" y="300" width="400" height="72" rx="8" fill="#eef2f5" stroke="#7a8794" stroke-width="1.6"/>
    <text x="260" y="330" font-size="14" font-weight="600" fill="#2c3e50" text-anchor="middle">정유 · 석유화학</text>
    <text x="260" y="352" font-size="14" font-weight="600" fill="#2c3e50" text-anchor="middle">위험물 공정인가?</text>

    <path d="M 460 336 L 588 336" stroke="#5b6673" stroke-width="1.8" fill="none" marker-end="url(#flowArrow)"/>
    <text x="524" y="326" font-size="12.5" font-weight="700" fill="#2f6b3a" text-anchor="middle">예</text>

    <rect x="595" y="300" width="265" height="72" rx="8" fill="#eef6ed" stroke="#a8c9a2" stroke-width="1.6"/>
    <text x="727" y="330" font-size="16" font-weight="700" fill="#3f6139" text-anchor="middle">BB3</text>
    <text x="727" y="352" font-size="12.5" fill="#1e3a19" text-anchor="middle">신뢰성 · 추력 균형 · 정비성</text>

    <path d="M 260 372 L 260 418" stroke="#5b6673" stroke-width="1.8" fill="none" marker-end="url(#flowArrow)"/>
    <text x="288" y="400" font-size="12.5" fill="#1f2933">아니오</text>

    <!-- ===== 4단계 ===== -->
    <rect x="60" y="425" width="400" height="56" rx="8" fill="#fdf3e0" stroke="#dcc191" stroke-width="1.6"/>
    <text x="260" y="459" font-size="14" font-weight="600" fill="#7a5a24" text-anchor="middle">예산과 정비 편의성을 비교</text>

    <path d="M 170 481 L 170 522" stroke="#5b6673" stroke-width="1.8" fill="none" marker-end="url(#flowArrow)"/>
    <path d="M 350 481 L 350 522" stroke="#5b6673" stroke-width="1.8" fill="none" marker-end="url(#flowArrow)"/>

    <rect x="60" y="529" width="220" height="58" rx="8" fill="#f7f4ec" stroke="#cfc6ad" stroke-width="1.6"/>
    <text x="170" y="553" font-size="15" font-weight="700" fill="#7a5a24" text-anchor="middle">BB4</text>
    <text x="170" y="574" font-size="12" fill="#4d3d0f" text-anchor="middle">예산 최우선</text>

    <rect x="300" y="529" width="220" height="58" rx="8" fill="#eef6ed" stroke="#a8c9a2" stroke-width="1.6"/>
    <text x="410" y="553" font-size="15" font-weight="700" fill="#3f6139" text-anchor="middle">BB3</text>
    <text x="410" y="574" font-size="12" fill="#1e3a19" text-anchor="middle">정비 편의 우선</text>

    <!-- 보조 설명 -->
    <text x="595" y="440" font-size="12.5" fill="#1f2933">비위험 유틸리티 라인에서만</text>
    <text x="595" y="460" font-size="12.5" fill="#1f2933">BB4가 선택지에 들어온다.</text>
    <text x="595" y="490" font-size="12.5" fill="#1f2933">각 단계의 구체적 문턱값은</text>
    <text x="595" y="510" font-size="12.5" fill="#1f2933">적용 API 610 판본과</text>
    <text x="595" y="530" font-size="12.5" fill="#1f2933">발주자 사양을 따른다.</text>

  </g>
</svg>
