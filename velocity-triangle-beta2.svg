<svg viewBox="0 0 900 515" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="임펠러 출구 각도에 따른 속도 삼각형 비교" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>출구 각도별 속도 삼각형</title>

  <defs>
    <marker id="vNavy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2f3d4f"/>
    </marker>
    <marker id="vOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c1500a"/>
    </marker>
    <marker id="vBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1d5a92"/>
    </marker>
  </defs>

  <g font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif">

    <!-- ============ PANEL A : 후곡형 ============ -->
    <rect x="20" y="30" width="280" height="400" rx="8" fill="#fafbfc" stroke="#dfe4e8"/>
    <text x="45" y="62" font-size="16" font-weight="700" fill="#2c3e50">후곡형</text>
    <text x="45" y="84" font-size="12.5" fill="#1f2933">Backward — β₂ &lt; 90°</text>

    <line x1="35" y1="300" x2="285" y2="300" stroke="#8b98a4" stroke-width="1.2" stroke-dasharray="6 4"/>
    <path d="M 210 300 L 251 328.7" stroke="#7f95a6" stroke-width="6" stroke-linecap="round"/>

    <path d="M 178 300 A 32 32 0 0 0 183.8 281.6" fill="none" stroke="#1a1a1a" stroke-width="1.4"/>
    <text x="160" y="288" font-size="12.5" font-weight="700" fill="#1a1a1a" text-anchor="end">β₂</text>

    <line x1="124.3" y1="300" x2="124.3" y2="240" stroke="#5b6673" stroke-width="1.4" stroke-dasharray="4 3"/>

    <path d="M 60 300 L 210 300" stroke="#2f3d4f" stroke-width="2.8" marker-end="url(#vNavy)"/>
    <text x="135" y="318" font-size="13" font-weight="700" fill="#2f3d4f" text-anchor="middle">u₂</text>

    <path d="M 210 300 L 124.3 240" stroke="#c1500a" stroke-width="2.8" marker-end="url(#vOrange)"/>
    <text x="182" y="264" font-size="13" font-weight="700" fill="#c1500a">w₂</text>

    <path d="M 60 300 L 124.3 240" stroke="#1d5a92" stroke-width="2.8" marker-end="url(#vBlue)"/>
    <text x="66" y="262" font-size="13" font-weight="700" fill="#1d5a92">v₂</text>

    <line x1="60" y1="358" x2="124.3" y2="358" stroke="#1d5a92" stroke-width="2.2"/>
    <line x1="60" y1="352" x2="60" y2="364" stroke="#1d5a92" stroke-width="2.2"/>
    <line x1="124.3" y1="352" x2="124.3" y2="364" stroke="#1d5a92" stroke-width="2.2"/>
    <text x="92" y="378" font-size="12" font-weight="700" fill="#1d5a92" text-anchor="middle">vu₂</text>

    <text x="45" y="400" font-size="12.5" font-weight="700" fill="#1a1a1a">vu₂ &lt; u₂</text>
    <text x="45" y="419" font-size="12" fill="#1a1a1a">유량 ↑ → 양정 ↓ (우하향)</text>

    <!-- ============ PANEL B : 반경형 ============ -->
    <rect x="310" y="30" width="280" height="400" rx="8" fill="#fafbfc" stroke="#dfe4e8"/>
    <text x="335" y="62" font-size="16" font-weight="700" fill="#2c3e50">반경형</text>
    <text x="335" y="84" font-size="12.5" fill="#1f2933">Radial — β₂ = 90°</text>

    <line x1="325" y1="300" x2="575" y2="300" stroke="#8b98a4" stroke-width="1.2" stroke-dasharray="6 4"/>
    <path d="M 500 300 L 500 340" stroke="#7f95a6" stroke-width="6" stroke-linecap="round"/>

    <path d="M 468 300 A 32 32 0 0 0 500 268" fill="none" stroke="#1a1a1a" stroke-width="1.4"/>
    <text x="460" y="280" font-size="12.5" font-weight="700" fill="#1a1a1a" text-anchor="end">β₂</text>

    <path d="M 350 300 L 500 300" stroke="#2f3d4f" stroke-width="2.8" marker-end="url(#vNavy)"/>
    <text x="425" y="318" font-size="13" font-weight="700" fill="#2f3d4f" text-anchor="middle">u₂</text>

    <path d="M 500 300 L 500 240" stroke="#c1500a" stroke-width="2.8" marker-end="url(#vOrange)"/>
    <text x="510" y="272" font-size="13" font-weight="700" fill="#c1500a">w₂</text>

    <path d="M 350 300 L 500 240" stroke="#1d5a92" stroke-width="2.8" marker-end="url(#vBlue)"/>
    <text x="396" y="262" font-size="13" font-weight="700" fill="#1d5a92">v₂</text>

    <line x1="350" y1="358" x2="500" y2="358" stroke="#1d5a92" stroke-width="2.2"/>
    <line x1="350" y1="352" x2="350" y2="364" stroke="#1d5a92" stroke-width="2.2"/>
    <line x1="500" y1="352" x2="500" y2="364" stroke="#1d5a92" stroke-width="2.2"/>
    <text x="425" y="378" font-size="12" font-weight="700" fill="#1d5a92" text-anchor="middle">vu₂</text>

    <text x="335" y="400" font-size="12.5" font-weight="700" fill="#1a1a1a">vu₂ = u₂</text>
    <text x="335" y="419" font-size="12" fill="#1a1a1a">유량과 무관 (수평)</text>

    <!-- ============ PANEL C : 전곡형 ============ -->
    <rect x="600" y="30" width="280" height="400" rx="8" fill="#fafbfc" stroke="#dfe4e8"/>
    <text x="625" y="62" font-size="16" font-weight="700" fill="#2c3e50">전곡형</text>
    <text x="625" y="84" font-size="12.5" fill="#1f2933">Forward — β₂ &gt; 90°</text>

    <line x1="615" y1="300" x2="870" y2="300" stroke="#8b98a4" stroke-width="1.2" stroke-dasharray="6 4"/>
    <path d="M 790 300 L 764.3 330.6" stroke="#7f95a6" stroke-width="6" stroke-linecap="round"/>

    <path d="M 758 300 A 32 32 0 0 0 810.5 275.5" fill="none" stroke="#1a1a1a" stroke-width="1.4"/>
    <text x="756" y="259" font-size="12.5" font-weight="700" fill="#1a1a1a" text-anchor="end">β₂</text>

    <line x1="840.3" y1="300" x2="840.3" y2="240" stroke="#5b6673" stroke-width="1.4" stroke-dasharray="4 3"/>

    <path d="M 640 300 L 790 300" stroke="#2f3d4f" stroke-width="2.8" marker-end="url(#vNavy)"/>
    <text x="715" y="318" font-size="13" font-weight="700" fill="#2f3d4f" text-anchor="middle">u₂</text>

    <path d="M 790 300 L 840.3 240" stroke="#c1500a" stroke-width="2.8" marker-end="url(#vOrange)"/>
    <text x="846" y="266" font-size="13" font-weight="700" fill="#c1500a">w₂</text>

    <path d="M 640 300 L 840.3 240" stroke="#1d5a92" stroke-width="2.8" marker-end="url(#vBlue)"/>
    <text x="676" y="262" font-size="13" font-weight="700" fill="#1d5a92">v₂</text>

    <line x1="640" y1="358" x2="840.3" y2="358" stroke="#1d5a92" stroke-width="2.2"/>
    <line x1="640" y1="352" x2="640" y2="364" stroke="#1d5a92" stroke-width="2.2"/>
    <line x1="840.3" y1="352" x2="840.3" y2="364" stroke="#1d5a92" stroke-width="2.2"/>
    <text x="740" y="378" font-size="12" font-weight="700" fill="#1d5a92" text-anchor="middle">vu₂</text>

    <text x="625" y="400" font-size="12.5" font-weight="700" fill="#1a1a1a">vu₂ &gt; u₂</text>
    <text x="625" y="419" font-size="12" fill="#1a1a1a">유량 ↑ → 양정 ↑ (우상향)</text>

    <!-- ===== 범례 ===== -->
    <line x1="30" y1="458" x2="60" y2="458" stroke="#2f3d4f" stroke-width="2.8"/>
    <text x="68" y="463" font-size="12" fill="#1a1a1a">u₂ 원주 속도</text>

    <line x1="175" y1="458" x2="205" y2="458" stroke="#c1500a" stroke-width="2.8"/>
    <text x="213" y="463" font-size="12" fill="#1a1a1a">w₂ 상대 속도</text>

    <line x1="320" y1="458" x2="350" y2="458" stroke="#1d5a92" stroke-width="2.8"/>
    <text x="358" y="463" font-size="12" fill="#1a1a1a">v₂ 절대 속도</text>

    <line x1="465" y1="458" x2="495" y2="458" stroke="#5b6673" stroke-width="1.6" stroke-dasharray="4 3"/>
    <text x="503" y="463" font-size="12" fill="#1a1a1a">vm₂ 자오면 성분 (유량에 비례)</text>

    <line x1="700" y1="458" x2="730" y2="458" stroke="#7f95a6" stroke-width="6"/>
    <text x="738" y="463" font-size="12" fill="#1a1a1a">날개 (출구부)</text>

    <text x="30" y="495" font-size="13" fill="#1a1a1a">
      세 경우 모두 u₂와 vm₂는 같다. 날개가 뒤로 누울수록 w₂의 원주 성분이 u₂를 깎아내어 vu₂가 작아진다.
    </text>
  </g>
</svg>
