<svg viewBox="0 0 900 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="스페이서 길이에 따라 디스크 팩의 꺾임 각도가 달라지는 원리" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>스페이서가 평행 편차를 흡수하는 방식</title>

  <defs>
    <marker id="dimB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c0392b"/>
    </marker>
  </defs>

  <g font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif">

    <!-- ============ 짧은 스페이서 ============ -->
    <rect x="20" y="30" width="420" height="290" rx="8" fill="#fdf9f8" stroke="#e8d9d6"/>
    <text x="42" y="60" font-size="15" font-weight="700" fill="#2c3e50">짧은 스페이서</text>
    <text x="42" y="80" font-size="11" fill="#1f2933">같은 편차에도 디스크가 크게 꺾인다</text>

    <!-- 축 중심선 -->
    <line x1="42" y1="150" x2="180" y2="150" stroke="#8b98a4" stroke-width="1.2" stroke-dasharray="12 4 3 4"/>
    <line x1="270" y1="210" x2="418" y2="210" stroke="#8b98a4" stroke-width="1.2" stroke-dasharray="12 4 3 4"/>

    <!-- 축 -->
    <rect x="42" y="140" width="98" height="20" fill="#44546a"/>
    <rect x="320" y="200" width="98" height="20" fill="#44546a"/>
    <text x="70" y="134" font-size="10" fill="#1a1a1a">모터 축</text>
    <text x="348" y="238" font-size="10" fill="#1a1a1a">펌프 축</text>

    <!-- 스페이서 (기울어진) -->
    <polygon points="180,144 270,204 270,216 180,156" fill="#c8d2da" stroke="#44546a" stroke-width="1.6"/>
    <text x="225" y="188" font-size="10.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">스페이서</text>

    <!-- 디스크 팩 -->
    <rect x="140" y="134" width="14" height="32" fill="#c0392b"/>
    <rect x="264" y="194" width="14" height="32" fill="#c0392b"/>

    <!-- 각도 표시 -->
    <line x1="180" y1="150" x2="290" y2="150" stroke="#8b98a4" stroke-width="1" stroke-dasharray="4 3"/>
    <path d="M 232 150 A 52 52 0 0 1 216 178" fill="none" stroke="#c0392b" stroke-width="2.2"/>
    <text x="246" y="176" font-size="14" font-weight="700" fill="#a03228">θ₁</text>

    <!-- 편차 -->
    <line x1="418" y1="150" x2="418" y2="210" stroke="#8b98a4" stroke-width="1" stroke-dasharray="4 3"/>
    <line x1="290" y1="150" x2="418" y2="150" stroke="#8b98a4" stroke-width="1" stroke-dasharray="4 3"/>
    <path d="M 404 150 L 404 210" stroke="#c0392b" stroke-width="2" marker-start="url(#dimB)" marker-end="url(#dimB)"/>
    <text x="390" y="184" font-size="12" font-weight="700" fill="#a03228" text-anchor="end">Δy</text>

    <!-- 길이 표시 -->
    <path d="M 147 268 L 271 268" stroke="#1a1a1a" stroke-width="1.6" marker-start="url(#dimB)" marker-end="url(#dimB)"/>
    <text x="209" y="288" font-size="11" font-weight="700" fill="#1a1a1a" text-anchor="middle">짧은 DBSE</text>

    <text x="42" y="308" font-size="11.5" font-weight="700" fill="#a03228">꺾임 각도가 커져 디스크에 부담이 크다</text>

    <!-- ============ 긴 스페이서 ============ -->
    <rect x="460" y="30" width="420" height="290" rx="8" fill="#f7fbf7" stroke="#d6e6d4"/>
    <text x="482" y="60" font-size="15" font-weight="700" fill="#2c3e50">긴 스페이서</text>
    <text x="482" y="80" font-size="11" fill="#1f2933">같은 편차라도 디스크가 덜 꺾인다</text>

    <line x1="482" y1="150" x2="560" y2="150" stroke="#8b98a4" stroke-width="1.2" stroke-dasharray="12 4 3 4"/>
    <line x1="790" y1="210" x2="858" y2="210" stroke="#8b98a4" stroke-width="1.2" stroke-dasharray="12 4 3 4"/>

    <rect x="482" y="140" width="66" height="20" fill="#44546a"/>
    <rect x="800" y="200" width="58" height="20" fill="#44546a"/>
    <text x="496" y="134" font-size="10" fill="#1a1a1a">모터 축</text>
    <text x="812" y="238" font-size="10" fill="#1a1a1a">펌프 축</text>

    <polygon points="574,144 786,204 786,216 574,156" fill="#c8d2da" stroke="#44546a" stroke-width="1.6"/>
    <text x="680" y="188" font-size="10.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">스페이서</text>

    <rect x="548" y="134" width="14" height="32" fill="#c0392b"/>
    <rect x="780" y="194" width="14" height="32" fill="#c0392b"/>

    <line x1="574" y1="150" x2="700" y2="150" stroke="#8b98a4" stroke-width="1" stroke-dasharray="4 3"/>
    <path d="M 640 150 A 66 66 0 0 1 636 168" fill="none" stroke="#2f6b3a" stroke-width="2.2"/>
    <text x="654" y="170" font-size="14" font-weight="700" fill="#2f6b3a">θ₂</text>

    <line x1="858" y1="150" x2="858" y2="210" stroke="#8b98a4" stroke-width="1" stroke-dasharray="4 3"/>
    <line x1="700" y1="150" x2="858" y2="150" stroke="#8b98a4" stroke-width="1" stroke-dasharray="4 3"/>
    <path d="M 844 150 L 844 210" stroke="#c0392b" stroke-width="2" marker-start="url(#dimB)" marker-end="url(#dimB)"/>
    <text x="830" y="184" font-size="12" font-weight="700" fill="#a03228" text-anchor="end">Δy</text>

    <path d="M 555 268 L 787 268" stroke="#1a1a1a" stroke-width="1.6" marker-start="url(#dimB)" marker-end="url(#dimB)"/>
    <text x="671" y="288" font-size="11" font-weight="700" fill="#1a1a1a" text-anchor="middle">긴 DBSE</text>

    <text x="482" y="308" font-size="11.5" font-weight="700" fill="#2f6b3a">꺾임 각도가 작아 여유가 생긴다</text>

    <!-- 범례 · 캡션 -->
    <rect x="30" y="342" width="14" height="14" fill="#c0392b"/>
    <text x="52" y="354" font-size="11" fill="#1a1a1a">디스크 팩</text>

    <text x="30" y="382" font-size="13" fill="#1a1a1a">
      디스크 팩 하나는 각도 변위를 흡수한다. 두 개를 떨어뜨려 배치하면 서로 반대로 꺾이면서 평행 편차 Δy를 만들어낸다.
    </text>
    <text x="30" y="404" font-size="13" fill="#1a1a1a">
      같은 Δy라도 스페이서가 길수록 각 팩의 꺾임 각도가 작아진다. 스페이서 길이를 임의로 바꾸면 허용 정렬 오차가 달라진다.
    </text>
  </g>
</svg>
