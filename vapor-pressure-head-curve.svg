<svg viewBox="0 0 900 440" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="온도가 오르면 증기압 수두가 가파르게 상승해 대기압 수두를 잠식하는 관계" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>증기압 수두는 가파르게 오른다</title>

  <defs>
    <marker id="vpAx" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a1a"/>
    </marker>
  </defs>

  <g font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif">

    <text x="20" y="48" font-size="17" font-weight="700" fill="#2c3e50">온도가 오르면 여유가 사라진다</text>
    <text x="20" y="70" font-size="12.5" fill="#1f2933">대기 개방 조건에서 쓸 수 있는 수두는 대기압 수두에서 증기압 수두를 뺀 몫이다</text>

    <path d="M 110 330 C 200 329, 300 322, 394 313 C 470 306, 505 298, 536 285 C 600 258, 645 243, 678 222 C 720 194, 760 160, 790 130 C 805 118, 815 109, 820 105 L 110 105 Z"
          fill="#dce8f2"/>

    <line x1="110" y1="90" x2="110" y2="330" stroke="#1a1a1a" stroke-width="1.6"/>
    <path d="M 110 330 L 840 330" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#vpAx)"/>
    <text x="92" y="210" font-size="11.5" fill="#1a1a1a" transform="rotate(-90 92 210)" text-anchor="middle">수두 (m)</text>
    <text x="832" y="368" font-size="11" fill="#1a1a1a" text-anchor="end">유체 온도 (°C)</text>

    <line x1="110" y1="105" x2="825" y2="105" stroke="#1d5a92" stroke-width="2.2" stroke-dasharray="8 4"/>
    <text x="124" y="99" font-size="11" font-weight="700" fill="#123049">대기압 수두 (약 10.3 m)</text>

    <path d="M 110 330 C 200 329, 300 322, 394 313 C 470 306, 505 298, 536 285 C 600 258, 645 243, 678 222 C 720 194, 760 160, 790 130 C 805 118, 815 109, 820 105"
          fill="none" stroke="#c0392b" stroke-width="3"/>
    <text x="640" y="278" font-size="12" font-weight="700" fill="#a03228">증기압 수두</text>

    <text x="380" y="200" font-size="13" font-weight="700" fill="#123049" text-anchor="middle">남는 여유</text>

    <circle cx="252" cy="325" r="5.5" fill="#c0392b"/>
    <text x="260" y="318" font-size="10.5" font-weight="700" fill="#a03228">0.24 m</text>
    <circle cx="536" cy="285" r="5.5" fill="#c0392b"/>
    <text x="544" y="278" font-size="10.5" font-weight="700" fill="#a03228">2.07 m</text>
    <circle cx="678" cy="222" r="5.5" fill="#c0392b"/>
    <text x="686" y="215" font-size="10.5" font-weight="700" fill="#a03228">4.97 m</text>
    <circle cx="784" cy="135" r="5.5" fill="#c0392b"/>
    <text x="776" y="128" font-size="10.5" font-weight="700" fill="#a03228" text-anchor="end">8.96 m</text>

    <line x1="252" y1="325" x2="252" y2="330" stroke="#8b98a4" stroke-width="1.2"/>
    <line x1="536" y1="285" x2="536" y2="330" stroke="#8b98a4" stroke-width="1.2" stroke-dasharray="4 3"/>
    <line x1="678" y1="222" x2="678" y2="330" stroke="#8b98a4" stroke-width="1.2" stroke-dasharray="4 3"/>
    <line x1="784" y1="135" x2="784" y2="330" stroke="#8b98a4" stroke-width="1.2" stroke-dasharray="4 3"/>

    <text x="110" y="350" font-size="10.5" fill="#1a1a1a" text-anchor="middle">0</text>
    <text x="252" y="350" font-size="10.5" fill="#1a1a1a" text-anchor="middle">20</text>
    <text x="394" y="350" font-size="10.5" fill="#1a1a1a" text-anchor="middle">40</text>
    <text x="536" y="350" font-size="10.5" fill="#1a1a1a" text-anchor="middle">60</text>
    <text x="678" y="350" font-size="10.5" fill="#1a1a1a" text-anchor="middle">80</text>
    <text x="820" y="350" font-size="10.5" fill="#1a1a1a" text-anchor="middle">100</text>

    <!-- 캡션 -->
    <text x="20" y="398" font-size="13" fill="#1a1a1a">
      증기압 수두는 온도에 대해 선형이 아니라 가파르게 오른다. 20°C에서 60°C까지 두 단계 오르는 동안 여덟 배 넘게 뛴다.
    </text>
    <text x="20" y="420" font-size="13" fill="#1a1a1a">
      끓는점에 가까워지면 대기압으로 얻는 수두가 거의 다 상쇄된다. 고온 계통에서 액면을 높이는 것이 선택이 아닌 이유다.
    </text>
  </g>
</svg>
