<svg viewBox="0 0 900 460" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="유체 커플링의 단면 구조와 작동유 순환 경로, 그리고 슬립이 없으면 순환도 없다는 원리" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>유체 커플링의 구조와 순환</title>

  <g font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif">

    <!-- ============ ① 구조와 순환 ============ -->
    <rect x="20" y="30" width="540" height="360" rx="8" fill="#fafbfc" stroke="#dfe4e8"/>
    <text x="40" y="58" font-size="14" font-weight="700" fill="#2c3e50">① 두 날개바퀴가 마주 본다</text>
    <text x="40" y="76" font-size="10.5" fill="#1f2933">축은 닿지 않고, 사이를 작동유가 잇는다</text>

    <line x1="300" y1="100" x2="300" y2="330" stroke="#c0392b" stroke-width="1.6" stroke-dasharray="6 4"/>
    <text x="300" y="94" font-size="10.5" font-weight="700" fill="#a03228" text-anchor="middle">서로 닿지 않는다</text>

    <circle cx="300" cy="190" r="60" fill="#e6d3a3"/>

    <path d="M 298 122 A 68 68 0 0 0 298 258 L 298 250 A 60 60 0 0 1 298 130 Z" fill="#6b8194" stroke="#3f4b58" stroke-width="1.4"/>
    <path d="M 302 122 A 68 68 0 0 1 302 258 L 302 250 A 60 60 0 0 0 302 130 Z" fill="#44546a" stroke="#2f3d4f" stroke-width="1.4"/>

    <line x1="285" y1="176" x2="258" y2="149" stroke="#3f4b58" stroke-width="2"/>
    <line x1="280" y1="190" x2="242" y2="190" stroke="#3f4b58" stroke-width="2"/>
    <line x1="285" y1="204" x2="258" y2="231" stroke="#3f4b58" stroke-width="2"/>
    <line x1="315" y1="176" x2="342" y2="149" stroke="#2f3d4f" stroke-width="2"/>
    <line x1="320" y1="190" x2="358" y2="190" stroke="#2f3d4f" stroke-width="2"/>
    <line x1="315" y1="204" x2="342" y2="231" stroke="#2f3d4f" stroke-width="2"/>

    <path d="M 260 190 A 40 40 0 0 1 340 190" fill="none" stroke="#c0392b" stroke-width="2.6"/>
    <path d="M 340 190 A 40 40 0 0 1 260 190" fill="none" stroke="#c0392b" stroke-width="2.6"/>
    <polygon points="296,144 296,156 308,150" fill="#c0392b"/>
    <polygon points="304,224 304,236 292,230" fill="#c0392b"/>
    <polygon points="254,196 266,196 260,184" fill="#c0392b"/>
    <polygon points="334,184 346,184 340,196" fill="#c0392b"/>

    <rect x="248" y="250" width="50" height="50" fill="#6b8194" stroke="#3f4b58" stroke-width="1.4"/>
    <rect x="302" y="250" width="50" height="50" fill="#44546a" stroke="#2f3d4f" stroke-width="1.4"/>
    <rect x="60" y="300" width="188" height="20" fill="#6b8194"/>
    <rect x="352" y="300" width="188" height="20" fill="#44546a"/>

    <line x1="55" y1="310" x2="545" y2="310" stroke="#8b98a4" stroke-width="1.2" stroke-dasharray="14 4 3 4"/>

    <text x="200" y="118" font-size="11.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">임펠러 (모터측)</text>
    <text x="400" y="118" font-size="11.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">러너 (피동측)</text>

    <path d="M 168 182 L 246 188" stroke="#8a6d24" stroke-width="1.2"/>
    <text x="60" y="178" font-size="10.5" font-weight="700" fill="#5c4610">작동유가 도는 회로</text>

    <text x="150" y="292" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="middle">n₁</text>
    <text x="450" y="292" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="middle">n₂</text>

    <text x="40" y="348" font-size="11" fill="#1a1a1a">임펠러가 기름을 바깥으로 밀어 러너로 건너보내고</text>
    <text x="40" y="366" font-size="11" font-weight="700" fill="#a03228">러너 날개에 부딪히며 운동량을 넘겨준다. 그것이 토크다</text>

    <!-- ============ ② 슬립의 역할 ============ -->
    <rect x="580" y="30" width="300" height="360" rx="8" fill="#fafbfc" stroke="#dfe4e8"/>
    <text x="600" y="58" font-size="14" font-weight="700" fill="#2c3e50">② 슬립이 있어야</text>
    <text x="600" y="76" font-size="14" font-weight="700" fill="#2c3e50">토크가 생긴다</text>

    <text x="730" y="106" font-size="11.5" font-weight="700" fill="#2f6b3a" text-anchor="middle">n₁ &gt; n₂ · 슬립 있음</text>
    <circle cx="730" cy="168" r="45" fill="#e6d3a3" stroke="#a8996a" stroke-width="1.4"/>
    <line x1="730" y1="123" x2="730" y2="213" stroke="#c0392b" stroke-width="1.4" stroke-dasharray="4 3"/>
    <path d="M 700 168 A 30 30 0 0 1 760 168" fill="none" stroke="#c0392b" stroke-width="2.4"/>
    <path d="M 760 168 A 30 30 0 0 1 700 168" fill="none" stroke="#c0392b" stroke-width="2.4"/>
    <polygon points="726,132 726,144 738,138" fill="#c0392b"/>
    <polygon points="734,192 734,204 722,198" fill="#c0392b"/>
    <text x="730" y="232" font-size="11" font-weight="700" fill="#2f6b3a" text-anchor="middle">순환 있음 → 토크 전달</text>

    <text x="730" y="266" font-size="11.5" font-weight="700" fill="#a03228" text-anchor="middle">n₁ = n₂ · 슬립 없음</text>
    <circle cx="730" cy="318" r="45" fill="#e6d3a3" stroke="#a8996a" stroke-width="1.4"/>
    <line x1="730" y1="273" x2="730" y2="363" stroke="#c0392b" stroke-width="1.4" stroke-dasharray="4 3"/>
    <path d="M 700 318 A 30 30 0 0 1 760 318" fill="none" stroke="#a8b4bd" stroke-width="2.4" stroke-dasharray="5 4"/>
    <path d="M 760 318 A 30 30 0 0 1 700 318" fill="none" stroke="#a8b4bd" stroke-width="2.4" stroke-dasharray="5 4"/>
    <path d="M 708 296 L 752 340 M 752 296 L 708 340" stroke="#c0392b" stroke-width="3"/>
    <text x="730" y="382" font-size="11" font-weight="700" fill="#a03228" text-anchor="middle">순환 없음 → 토크 0</text>

    <!-- 캡션 -->
    <text x="20" y="420" font-size="13" fill="#1a1a1a">
      두 바퀴가 같은 속도로 돌면 기름은 함께 돌 뿐 도넛 안을 순환하지 않는다. 순환이 없으면 운동량 전달도 없다.
    </text>
    <text x="20" y="442" font-size="13" fill="#1a1a1a">
      그래서 슬립은 없애야 할 손실이 아니라, 토크를 만들기 위해 반드시 있어야 하는 조건이다.
    </text>
  </g>
</svg>
