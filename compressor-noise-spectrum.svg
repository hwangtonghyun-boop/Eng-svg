<svg viewBox="0 0 900 450" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="압축기 소음 스펙트럼에서 주파수 대역별로 나타나는 원인" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>주파수가 원인을 알려준다</title>

  <defs>
    <marker id="nsAx2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a1a"/>
    </marker>
  </defs>

  <g font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif">

    <text x="20" y="48" font-size="17" font-weight="700" fill="#2c3e50">소음도 주파수로 읽는다</text>
    <text x="20" y="70" font-size="12.5" fill="#1f2933">순음으로 솟은 성분과 넓게 깔린 성분은 원인이 다르다</text>

    <line x1="100" y1="90" x2="100" y2="300" stroke="#1a1a1a" stroke-width="1.6"/>
    <path d="M 100 300 L 850 300" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#nsAx2)"/>
    <text x="82" y="195" font-size="11.5" fill="#1a1a1a" transform="rotate(-90 82 195)" text-anchor="middle">음압 레벨</text>
    <text x="842" y="322" font-size="11.5" fill="#1a1a1a" text-anchor="end">주파수 →</text>

    <!-- 광대역 배경 -->
    <path d="M 110 300 C 200 258, 320 240, 450 248 C 580 256, 700 274, 840 292 L 840 300 Z" fill="#dfe6eb"/>
    <path d="M 110 300 C 200 258, 320 240, 450 248 C 580 256, 700 274, 840 292"
          fill="none" stroke="#7a8794" stroke-width="2.2"/>
    <text x="330" y="232" font-size="11.5" font-weight="700" fill="#4a5560">난류 · 유동 박리 — 넓게 깔린다</text>

    <!-- 저주파 맥동 -->
    <line x1="150" y1="300" x2="150" y2="180" stroke="#c1500a" stroke-width="6" stroke-linecap="round"/>
    <line x1="176" y1="300" x2="176" y2="228" stroke="#c1500a" stroke-width="5" stroke-linecap="round"/>
    <text x="150" y="168" font-size="11" font-weight="700" fill="#8a3a08" text-anchor="middle">맥동 · 서지</text>

    <!-- 회전 주파수 -->
    <line x1="270" y1="300" x2="270" y2="206" stroke="#2f6b3a" stroke-width="6" stroke-linecap="round"/>
    <line x1="310" y1="300" x2="310" y2="238" stroke="#2f6b3a" stroke-width="5" stroke-linecap="round"/>
    <text x="284" y="194" font-size="11" font-weight="700" fill="#245430" text-anchor="middle">1× · 2×</text>
    <text x="284" y="180" font-size="9.5" fill="#245430" text-anchor="middle">불평형 · 정렬</text>

    <!-- BPF -->
    <line x1="480" y1="300" x2="480" y2="128" stroke="#c0392b" stroke-width="7" stroke-linecap="round"/>
    <line x1="560" y1="300" x2="560" y2="196" stroke="#c0392b" stroke-width="5" stroke-linecap="round"/>
    <text x="480" y="116" font-size="12.5" font-weight="700" fill="#a03228" text-anchor="middle">BPF</text>
    <text x="480" y="102" font-size="10" fill="#a03228" text-anchor="middle">날개와 디퓨저의 간섭</text>
    <text x="566" y="188" font-size="10" font-weight="700" fill="#a03228">2×BPF</text>

    <!-- 기어 -->
    <line x1="700" y1="300" x2="700" y2="166" stroke="#6b3fa0" stroke-width="6" stroke-linecap="round"/>
    <line x1="760" y1="300" x2="760" y2="226" stroke="#6b3fa0" stroke-width="5" stroke-linecap="round"/>
    <text x="700" y="154" font-size="11.5" font-weight="700" fill="#4a2a70" text-anchor="middle">기어 맞물림</text>

    <!-- 대책 대응 -->
    <line x1="150" y1="328" x2="176" y2="328" stroke="#c1500a" stroke-width="5"/>
    <text x="110" y="352" font-size="10.5" fill="#1a1a1a">맥동 저감 용기</text>
    <line x1="270" y1="328" x2="310" y2="328" stroke="#2f6b3a" stroke-width="5"/>
    <text x="252" y="352" font-size="10.5" fill="#1a1a1a">밸런싱 · 정렬</text>
    <line x1="480" y1="328" x2="560" y2="328" stroke="#c0392b" stroke-width="5"/>
    <text x="448" y="352" font-size="10.5" fill="#1a1a1a">날개 수 조합 · 간극 확대</text>
    <line x1="700" y1="328" x2="760" y2="328" stroke="#6b3fa0" stroke-width="5"/>
    <text x="682" y="352" font-size="10.5" fill="#1a1a1a">기어 형식 · 정밀도</text>

    <!-- 캡션 -->
    <text x="20" y="394" font-size="13" fill="#1a1a1a">
      뾰족하게 솟은 순음 성분은 발생원이 특정된다. 회색으로 넓게 깔린 성분은 유동 자체가 만드는 것이라 유속을 낮추는 것 말고는 방법이 적다.
    </text>
    <text x="20" y="416" font-size="13" fill="#1a1a1a">
      BPF는 크기가 크지 않아도 순음이라 뚜렷하게 들린다. 압축기 소음 민원의 상당수가 이 성분에서 나온다.
    </text>
    <text x="20" y="438" font-size="13" fill="#1a1a1a">
      회전수를 바꿨을 때 따라 움직이면 기계 기인, 유량을 바꿨을 때 변하면 유동 기인이다.
    </text>
  </g>
</svg>
