<svg viewBox="0 0 900 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="속도비에 따른 유체 커플링의 전달 토크와 효율 변화" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>슬립과 토크, 그리고 효율</title>

  <defs>
    <marker id="fcAx" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a1a"/>
    </marker>
  </defs>

  <g font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif">

    <text x="20" y="48" font-size="17" font-weight="700" fill="#2c3e50">슬립이 커지면 토크는 늘고 효율은 떨어진다</text>
    <text x="20" y="70" font-size="12.5" fill="#1f2933">유체 커플링의 효율은 곧 속도비다</text>

    <rect x="751" y="90" width="35" height="230" fill="#e8f2e6"/>
    <text x="768" y="84" font-size="10.5" font-weight="700" fill="#2f6b3a" text-anchor="middle">정상 운전</text>

    <line x1="100" y1="90" x2="100" y2="320" stroke="#1a1a1a" stroke-width="1.6"/>
    <path d="M 100 320 L 815 320" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#fcAx)"/>
    <text x="80" y="205" font-size="11.5" fill="#1a1a1a" transform="rotate(-90 80 205)" text-anchor="middle">상대값</text>
    <text x="808" y="358" font-size="11" fill="#1a1a1a" text-anchor="end">속도비 n₂ / n₁</text>

    <path d="M 100 110 C 250 140, 400 200, 630 268 C 700 292, 760 312, 800 320"
          fill="none" stroke="#c0392b" stroke-width="3"/>
    <line x1="100" y1="320" x2="800" y2="110" stroke="#2f6b3a" stroke-width="3"/>

    <text x="268" y="163" font-size="12" font-weight="700" fill="#a03228">전달 토크</text>
    <text x="572" y="198" font-size="12" font-weight="700" fill="#2f6b3a">효율 = 속도비</text>

    <circle cx="100" cy="110" r="6" fill="#c0392b"/>
    <path d="M 150 288 L 108 126" stroke="#a03228" stroke-width="1.2"/>
    <text x="158" y="294" font-size="11" font-weight="700" fill="#a03228">스톨 — 출력이 0이므로</text>
    <text x="158" y="310" font-size="11" font-weight="700" fill="#a03228">입력 동력 전부가 열이 된다</text>

    <text x="100" y="340" font-size="10.5" fill="#1a1a1a" text-anchor="middle">0</text>
    <text x="450" y="340" font-size="10.5" fill="#1a1a1a" text-anchor="middle">0.5</text>
    <text x="800" y="340" font-size="10.5" fill="#1a1a1a" text-anchor="middle">1.0</text>

    <text x="100" y="356" font-size="9.5" fill="#7a8794" text-anchor="middle">슬립 100%</text>
    <text x="800" y="356" font-size="9.5" fill="#7a8794" text-anchor="middle">슬립 0%</text>

    <!-- 캡션 -->
    <text x="20" y="388" font-size="13" fill="#1a1a1a">
      입력 토크와 출력 토크는 같으므로 효율은 그대로 속도비가 된다. 슬립 5%면 효율 95%이고, 나머지 5%는 작동유를 데운다.
    </text>
    <text x="20" y="410" font-size="13" fill="#1a1a1a">
      속도비가 1에 가까워지면 효율은 높지만 전달 토크가 사라진다. 두 곡선이 반대 방향인 것이 이 기계의 본질이다.
    </text>
  </g>
</svg>
