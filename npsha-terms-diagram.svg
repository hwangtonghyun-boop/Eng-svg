<svg viewBox="0 0 900 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="NPSHa 계산식의 각 항이 배관 계통에서 어디에 해당하는지 보여주는 그림" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>NPSHa는 어디에서 오는가</title>

  <defs>
    <marker id="nBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1d5a92"/>
    </marker>
    <marker id="nGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2f6b3a"/>
    </marker>
  </defs>

  <g font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif">

    <rect x="20" y="30" width="860" height="360" rx="8" fill="#fafbfc" stroke="#dfe4e8"/>
    <text x="40" y="58" font-size="15" font-weight="700" fill="#2c3e50">계산식의 네 항은 각각 여기서 온다</text>
    <text x="40" y="76" font-size="11" fill="#1f2933">색이 아래 수식의 각 항과 대응한다</text>

    <path d="M 160 96 L 160 116" stroke="#1d5a92" stroke-width="2.6" marker-end="url(#nBlue)"/>
    <text x="176" y="108" font-size="11.5" font-weight="700" fill="#1d5a92">Pabs — 액면 절대압력</text>

    <path d="M 80 120 L 80 250 L 240 250 L 240 120" fill="none" stroke="#44546a" stroke-width="2.6"/>
    <rect x="83" y="158" width="154" height="90" fill="#dce8f2"/>
    <line x1="83" y1="158" x2="237" y2="158" stroke="#1d5a92" stroke-width="2"/>
    <text x="110" y="272" font-size="10.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">흡입 용기</text>

    <text x="250" y="152" font-size="11.5" font-weight="700" fill="#c0392b">Pv — 운전 온도의 포화증기압</text>

    <line x1="240" y1="158" x2="285" y2="158" stroke="#8b98a4" stroke-width="1.2" stroke-dasharray="4 3"/>
    <path d="M 270 158 L 270 335" stroke="#2f6b3a" stroke-width="2.2" marker-start="url(#nGreen)" marker-end="url(#nGreen)"/>
    <text x="282" y="250" font-size="12" font-weight="700" fill="#2f6b3a">Zs — 액면과 펌프의 높이차</text>

    <path d="M 160 250 L 160 335 L 540 335" fill="none" stroke="#44546a" stroke-width="22"/>
    <path d="M 160 250 L 160 335 L 540 335" fill="none" stroke="#dce8f2" stroke-width="15"/>

    <polygon points="540,324 580,324 580,338 540,346" fill="#c8d2da" stroke="#44546a" stroke-width="1.6"/>
    <path d="M 580 331 L 622 331" fill="none" stroke="#44546a" stroke-width="15"/>
    <path d="M 580 331 L 622 331" fill="none" stroke="#dce8f2" stroke-width="9"/>
    <text x="560" y="312" font-size="10" font-weight="700" fill="#1a1a1a" text-anchor="middle">편심 리듀서</text>
    <text x="560" y="298" font-size="9.5" fill="#1a1a1a" text-anchor="middle">평면을 위로</text>

    <rect x="300" y="322" width="32" height="26" fill="#7f95a6" stroke="#3f4b58" stroke-width="1.4"/>
    <text x="316" y="314" font-size="9.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">스트레이너</text>
    <polygon points="404,324 404,346 420,335" fill="#44546a"/>
    <polygon points="436,324 436,346 420,335" fill="#44546a"/>
    <text x="420" y="314" font-size="9.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">밸브</text>

    <circle cx="650" cy="331" r="28" fill="#44546a"/>
    <text x="650" y="336" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">펌프</text>
    <line x1="622" y1="335" x2="760" y2="335" stroke="#8b98a4" stroke-width="1.2" stroke-dasharray="12 4 3 4"/>
    <text x="768" y="339" font-size="10" fill="#1a1a1a">펌프 기준면</text>

    <line x1="165" y1="366" x2="625" y2="366" stroke="#c1500a" stroke-width="2"/>
    <line x1="165" y1="360" x2="165" y2="372" stroke="#c1500a" stroke-width="2"/>
    <line x1="625" y1="360" x2="625" y2="372" stroke="#c1500a" stroke-width="2"/>
    <text x="395" y="384" font-size="11.5" font-weight="700" fill="#c1500a" text-anchor="middle">hf — 배관과 부속의 마찰 손실</text>

    <!-- 수식 -->
    <rect x="20" y="400" width="860" height="42" rx="6" fill="#eef2f5" stroke="#c8d2da"/>
    <text x="150" y="427" font-size="16" font-weight="700" fill="#1a1a1a">NPSHa  =</text>
    <text x="260" y="427" font-size="16" fill="#1a1a1a">(</text>
    <text x="274" y="427" font-size="16" font-weight="700" fill="#1d5a92">Pabs</text>
    <text x="330" y="427" font-size="16" fill="#1a1a1a">−</text>
    <text x="352" y="427" font-size="16" font-weight="700" fill="#c0392b">Pv</text>
    <text x="384" y="427" font-size="16" fill="#1a1a1a">) / ρg</text>
    <text x="452" y="427" font-size="16" fill="#1a1a1a">+</text>
    <text x="476" y="427" font-size="16" font-weight="700" fill="#2f6b3a">Zs</text>
    <text x="512" y="427" font-size="16" fill="#1a1a1a">−</text>
    <text x="536" y="427" font-size="16" font-weight="700" fill="#c1500a">hf</text>

    <text x="20" y="468" font-size="13" fill="#1a1a1a">
      네 항 중 어느 하나만 나빠져도 NPSHa는 줄어든다. 온도가 오르거나 스트레이너가 막히면 계산서의 값은 더 이상 유효하지 않다.
    </text>
  </g>
</svg>
