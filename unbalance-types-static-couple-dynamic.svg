<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 680 280" xmlns="http://www.w3.org/2000/svg" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif"><rect width="680" height="280" fill="#fff"/>
<text x="120" y="70" font-size="15" font-weight="bold" text-anchor="middle">정적 불균형</text><line x1="15" y1="140" x2="225" y2="140" stroke="#555" stroke-width="5"/><rect x="50" y="90" width="140" height="100" rx="6" fill="#e8f1fb" stroke="#1f5fa8" stroke-width="2"/><line x1="5" y1="140" x2="235" y2="140" stroke="#1f5fa8" stroke-dasharray="5 4"/><circle cx="120" cy="102" r="9" fill="#c0392b"/><text x="120" y="220" font-size="12" text-anchor="middle" fill="#555">질량 중심이 축에서 벗어남</text><text x="120" y="238" font-size="12" text-anchor="middle" fill="#555">1면 보정으로 해결</text>
<text x="340" y="70" font-size="15" font-weight="bold" text-anchor="middle">짝(커플) 불균형</text><line x1="235" y1="140" x2="445" y2="140" stroke="#555" stroke-width="5"/><rect x="270" y="90" width="140" height="100" rx="6" fill="#e8f1fb" stroke="#1f5fa8" stroke-width="2"/><line x1="225" y1="140" x2="455" y2="140" stroke="#1f5fa8" stroke-dasharray="5 4"/><circle cx="290" cy="102" r="9" fill="#c0392b"/><circle cx="390" cy="178" r="9" fill="#c0392b"/><text x="340" y="220" font-size="12" text-anchor="middle" fill="#555">같은 무게가 반대편 양 끝에</text><text x="340" y="238" font-size="12" text-anchor="middle" fill="#555">정지 상태에선 안 보임</text>
<text x="560" y="70" font-size="15" font-weight="bold" text-anchor="middle">동 불균형</text><line x1="455" y1="140" x2="665" y2="140" stroke="#555" stroke-width="5"/><rect x="490" y="90" width="140" height="100" rx="6" fill="#e8f1fb" stroke="#1f5fa8" stroke-width="2"/><line x1="445" y1="140" x2="675" y2="140" stroke="#1f5fa8" stroke-dasharray="5 4"/><circle cx="510" cy="102" r="9" fill="#c0392b"/><circle cx="610" cy="160" r="9" fill="#c0392b"/><text x="560" y="220" font-size="12" text-anchor="middle" fill="#555">정적 + 짝 불균형의 조합</text><text x="560" y="238" font-size="12" text-anchor="middle" fill="#555">2면 보정 필요</text>
</svg>