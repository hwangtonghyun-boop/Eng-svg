<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" font-family="Noto Sans KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif"><rect width="780" height="470" fill="#fff"/><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#1d4ed8"/></marker><marker id="r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#dc2626"/></marker></defs><text x="390" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2937">최소유량 재순환 라인 기본 구성 (제어밸브 방식)</text><rect x="40" y="70" width="120" height="190" rx="40" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/><rect x="42" y="150" width="116" height="108" rx="0" fill="#7dd3fc" opacity="0.6"/><text x="100" y="120" text-anchor="middle" font-size="14" font-weight="700" fill="#0c4a6e">흡입 용기</text><text x="100" y="138" text-anchor="middle" font-size="11" fill="#0c4a6e">(Suction drum)</text><path d="M100,260 L100,370 L235,370" stroke="#1d4ed8" stroke-width="4" fill="none" marker-end="url(#a)"/><text x="150" y="392" font-size="12" fill="#334155">흡입 배관</text><circle cx="270" cy="370" r="32" fill="#f1f5f9" stroke="#0f172a" stroke-width="3"/><path d="M270,338 L302,338" stroke="#0f172a" stroke-width="3"/><text x="270" y="375" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">P</text><text x="270" y="423" text-anchor="middle" font-size="13" fill="#0f172a">펌프</text><path d="M302,338 L302,250 L740,250" stroke="#1d4ed8" stroke-width="4" fill="none" marker-end="url(#a)"/><text x="730" y="226" text-anchor="end" font-size="13" font-weight="700" fill="#1d4ed8">공정으로 →</text><circle cx="302" cy="290" r="15" fill="#fff" stroke="#7c3aed" stroke-width="2"/><text x="302" y="294" text-anchor="middle" font-size="10" font-weight="700" fill="#7c3aed">FT</text><text x="325" y="305" font-size="11" fill="#7c3aed">펌프 전체 유량 측정</text><circle cx="420" cy="250" r="5" fill="#0f172a"/><polygon points="526,238 526,262 550,250" fill="#fff" stroke="#0f172a" stroke-width="2"/><line x1="552" y1="236" x2="552" y2="264" stroke="#0f172a" stroke-width="2"/><text x="540" y="282" text-anchor="middle" font-size="12" fill="#0f172a">역지밸브</text><text x="472" y="232" text-anchor="middle" font-size="11" fill="#475569">분기점은 역지밸브 앞</text><path d="M420,250 L420,110 L180,110 L180,140 L162,140" stroke="#dc2626" stroke-width="3.5" fill="none" stroke-dasharray="0" marker-end="url(#r)"/><polygon points="314,100 314,120 346,100 346,120" fill="#fff" stroke="#dc2626" stroke-width="2"/><line x1="330" y1="110" x2="330" y2="84" stroke="#dc2626" stroke-width="2"/><rect x="316" y="72" width="28" height="12" fill="#fff" stroke="#dc2626" stroke-width="2"/><text x="330" y="64" text-anchor="middle" font-size="11" fill="#b91c1c">최소유량 제어밸브</text><line x1="230" y1="96" x2="230" y2="124" stroke="#0f172a" stroke-width="3"/><line x1="236" y1="96" x2="236" y2="124" stroke="#0f172a" stroke-width="3"/><text x="233" y="88" text-anchor="middle" font-size="11" fill="#0f172a">감압 오리피스(RO)</text><circle cx="390" cy="175" r="16" fill="#fff" stroke="#7c3aed" stroke-width="2"/><text x="390" y="179" text-anchor="middle" font-size="10" font-weight="700" fill="#7c3aed">FIC</text><path d="M317,290 L390,191" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="5 4" fill="none"/><path d="M378,164 L338,88" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="5 4" fill="none"/><text x="434" y="150" font-size="12" font-weight="700" fill="#dc2626">최소유량 재순환 라인</text><text x="434" y="168" font-size="11" fill="#b91c1c">유량이 설정값 아래로 떨어지면</text><text x="434" y="184" font-size="11" fill="#b91c1c">밸브가 열려 흡입 용기로 되돌림</text><text x="420" y="330" font-size="12" fill="#1f2937">① 되돌리는 곳은 펌프 흡입 배관이 아니라 흡입 용기 (열 축적 방지)</text><text x="420" y="352" font-size="12" fill="#1f2937">② 감압 오리피스는 용기 가까이 배치 (플래싱·소음 구간 최소화)</text><text x="420" y="374" font-size="12" fill="#1f2937">③ 병렬 펌프는 펌프마다 FT와 재순환 라인을 따로 설치</text><text x="740" y="462" text-anchor="end" font-size="11" fill="#6b7280">※ 개념도이며 실제 계장 구성은 공정 조건에 따라 달라짐</text></svg>