<svg viewBox="0 0 900 450" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="병렬 합성 곡선과 시스템 곡선의 교점, 그리고 시스템 곡선 기울기에 따른 직렬 병렬 선택" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>직렬·병렬 운전과 시스템 곡선</title>

  <defs>
    <marker id="pDim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2f6b3a"/>
    </marker>
    <marker id="pAx" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a1a"/>
    </marker>
  </defs>

  <g font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif">

    <!-- ============ ① 병렬 운전의 실제 ============ -->
    <rect x="20" y="30" width="420" height="350" rx="8" fill="#fafbfc" stroke="#dfe4e8"/>
    <text x="40" y="58" font-size="14" font-weight="700" fill="#2c3e50">① 병렬로 묶어도 유량은 2배가 되지 않는다</text>
    <text x="40" y="76" font-size="10.5" fill="#1f2933">마찰 손실이 유량의 제곱으로 커지기 때문</text>

    <line x1="60" y1="95" x2="60" y2="290" stroke="#1a1a1a" stroke-width="1.6"/>
    <path d="M 60 290 L 425 290" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#pAx)"/>
    <text x="418" y="306" font-size="10.5" fill="#1a1a1a" text-anchor="end">유량 Q</text>
    <text x="46" y="190" font-size="10.5" fill="#1a1a1a" transform="rotate(-90 46 190)" text-anchor="middle">양정 H</text>

    <path d="M 60 260 C 105 256, 145 215, 172 160 C 188 128, 198 108, 206 88"
          fill="none" stroke="#8a6d24" stroke-width="2.6" stroke-dasharray="8 4"/>
    <text x="212" y="100" font-size="10" font-weight="700" fill="#5c4610">시스템 저항</text>

    <path d="M 68 110 C 120 118, 170 145, 240 220" fill="none" stroke="#2f3d4f" stroke-width="2.8"/>
    <path d="M 76 110 C 180 118, 280 145, 420 220" fill="none" stroke="#1d5a92" stroke-width="2.8"/>

    <text x="244" y="232" font-size="10" font-weight="700" fill="#2f3d4f">1대</text>
    <text x="380" y="238" font-size="10" font-weight="700" fill="#1d5a92">2대 병렬</text>

    <circle cx="171" cy="156" r="6" fill="#2f3d4f"/>
    <circle cx="186" cy="127" r="6" fill="#1d5a92"/>
    <circle cx="281" cy="156" r="6" fill="#ffffff" stroke="#c0392b" stroke-width="2.4"/>

    <line x1="171" y1="156" x2="171" y2="290" stroke="#2f3d4f" stroke-width="1.2" stroke-dasharray="4 3"/>
    <line x1="186" y1="127" x2="186" y2="290" stroke="#1d5a92" stroke-width="1.2" stroke-dasharray="4 3"/>
    <line x1="281" y1="156" x2="281" y2="290" stroke="#c0392b" stroke-width="1.2" stroke-dasharray="4 3"/>

    <text x="165" y="306" font-size="10.5" font-weight="700" fill="#2f3d4f" text-anchor="end">Q₁</text>
    <text x="192" y="306" font-size="10.5" font-weight="700" fill="#1d5a92">Q₂</text>
    <text x="281" y="306" font-size="10.5" font-weight="700" fill="#a03228" text-anchor="middle">2 × Q₁</text>
    <text x="281" y="322" font-size="9.5" fill="#a03228" text-anchor="middle">기대했던 지점</text>

    <text x="40" y="348" font-size="11" fill="#1a1a1a">실제 운전점은 합성 곡선과 시스템 곡선의 교점이다</text>
    <text x="40" y="366" font-size="11" font-weight="700" fill="#a03228">각 펌프의 유량은 오히려 줄어 BEP 왼쪽으로 밀린다</text>

    <!-- ============ ② 어느 쪽이 유리한가 ============ -->
    <rect x="460" y="30" width="420" height="350" rx="8" fill="#fafbfc" stroke="#dfe4e8"/>
    <text x="478" y="58" font-size="14" font-weight="700" fill="#2c3e50">② 시스템 곡선의 기울기가 승패를 가른다</text>
    <text x="478" y="76" font-size="10.5" fill="#1f2933">배관이 어떤 저항인가에 따라 답이 달라진다</text>

    <!-- 상단: 완만한 시스템 -->
    <text x="490" y="110" font-size="11" font-weight="700" fill="#2f6b3a">완만한 시스템 — 정수두 지배</text>
    <line x1="505" y1="118" x2="505" y2="210" stroke="#1a1a1a" stroke-width="1.4"/>
    <line x1="505" y1="210" x2="866" y2="210" stroke="#1a1a1a" stroke-width="1.4"/>

    <path d="M 505 190 C 600 186, 720 180, 862 174" fill="none" stroke="#8a6d24" stroke-width="2.2" stroke-dasharray="8 4"/>
    <path d="M 511 130 C 560 136, 610 158, 670 200" fill="none" stroke="#2f3d4f" stroke-width="2.4"/>
    <path d="M 517 130 C 615 136, 710 158, 830 200" fill="none" stroke="#1d5a92" stroke-width="2.4"/>
    <text x="674" y="196" font-size="9.5" font-weight="700" fill="#2f3d4f">1대</text>
    <text x="834" y="196" font-size="9.5" font-weight="700" fill="#1d5a92">병렬</text>

    <circle cx="647" cy="182" r="5" fill="#2f3d4f"/>
    <circle cx="755" cy="179" r="5" fill="#1d5a92"/>
    <path d="M 647 166 L 755 166" stroke="#2f6b3a" stroke-width="2" marker-start="url(#pDim)" marker-end="url(#pDim)"/>
    <text x="701" y="158" font-size="10.5" font-weight="700" fill="#2f6b3a" text-anchor="middle">병렬 유리 — 유량 증가가 크다</text>

    <!-- 하단: 가파른 시스템 -->
    <text x="490" y="250" font-size="11" font-weight="700" fill="#a03228">가파른 시스템 — 마찰 지배</text>
    <line x1="505" y1="258" x2="505" y2="355" stroke="#1a1a1a" stroke-width="1.4"/>
    <line x1="505" y1="355" x2="866" y2="355" stroke="#1a1a1a" stroke-width="1.4"/>

    <path d="M 505 350 C 550 346, 590 320, 618 285 C 632 267, 642 255, 650 246"
          fill="none" stroke="#8a6d24" stroke-width="2.2" stroke-dasharray="8 4"/>
    <path d="M 511 300 C 555 305, 600 320, 655 348" fill="none" stroke="#2f3d4f" stroke-width="2.4"/>
    <path d="M 517 300 C 605 305, 690 320, 800 348" fill="none" stroke="#1d5a92" stroke-width="2.4"/>
    <path d="M 511 245 C 555 255, 600 285, 655 341" fill="none" stroke="#a03228" stroke-width="2.4"/>

    <text x="662" y="338" font-size="9.5" font-weight="700" fill="#a03228">직렬</text>
    <text x="662" y="354" font-size="9.5" font-weight="700" fill="#2f3d4f">1대</text>
    <text x="806" y="354" font-size="9.5" font-weight="700" fill="#1d5a92">병렬</text>

    <circle cx="584" cy="317" r="5" fill="#2f3d4f"/>
    <circle cx="595" cy="308" r="5" fill="#1d5a92"/>
    <circle cx="605" cy="300" r="5.5" fill="#a03228"/>

    <path d="M 698 288 L 614 297" stroke="#a03228" stroke-width="1.2"/>
    <text x="704" y="286" font-size="10.5" font-weight="700" fill="#a03228">직렬 유리 — 양정을 더해야</text>
    <text x="704" y="302" font-size="10.5" font-weight="700" fill="#a03228">유량이 늘어난다</text>

    <!-- 캡션 -->
    <text x="20" y="410" font-size="13" fill="#1a1a1a">
      직렬은 같은 유량에서 양정을 더하고, 병렬은 같은 양정에서 유량을 더한다. 하지만 실제 운전점은 시스템 곡선이 정한다.
    </text>
    <text x="20" y="432" font-size="13" fill="#1a1a1a">
      배관이 병목이라면 펌프를 늘려도 그 병목이 옮겨갈 뿐이다. 관경 확대나 회전수 제어가 나은 경우가 많다.
    </text>
  </g>
</svg>
