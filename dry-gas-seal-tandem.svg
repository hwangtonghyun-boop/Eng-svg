<svg viewBox="0 0 900 460" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="드라이 가스 씰 탠덤 배열의 계통 구성 - 씰 가스, 1차 씰, 2차 씰, 벤트, 분리 가스, 베어링" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>탠덤 배열 계통</title>

  <defs>
    <marker id="tdGas" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1d5a92"/>
    </marker>
    <marker id="tdVent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c0392b"/>
    </marker>
    <marker id="tdSep" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2f6b3a"/>
    </marker>
  </defs>

  <g font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif">

    <text x="20" y="48" font-size="17" font-weight="700" fill="#2c3e50">탠덤 배열 — 씰보다 계통이 복잡하다</text>
    <text x="20" y="70" font-size="12.5" fill="#1f2933">왼쪽이 공정 가스 쪽, 오른쪽이 베어링 쪽이다</text>

    <!-- 축 -->
    <rect x="60" y="238" width="800" height="30" fill="#44546a"/>
    <text x="100" y="258" font-size="11" font-weight="700" fill="#ffffff">축</text>

    <!-- 공정 가스 영역 -->
    <rect x="60" y="150" width="140" height="88" fill="#f0d9d4" stroke="#8a281c" stroke-width="1.6"/>
    <text x="130" y="186" font-size="11.5" font-weight="700" fill="#8a281c" text-anchor="middle">공정 가스</text>
    <text x="130" y="206" font-size="10" fill="#8a281c" text-anchor="middle">고압</text>

    <!-- 1차 씰 -->
    <rect x="240" y="150" width="60" height="88" fill="#6b8194" stroke="#3f4b58" stroke-width="2"/>
    <text x="270" y="190" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">1차</text>
    <text x="270" y="206" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">씰</text>
    <text x="270" y="300" font-size="10" fill="#1a1a1a" text-anchor="middle">압력을 감당한다</text>

    <!-- 2차 씰 -->
    <rect x="430" y="150" width="60" height="88" fill="#8a97a3" stroke="#3f4b58" stroke-width="2"/>
    <text x="460" y="190" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">2차</text>
    <text x="460" y="206" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">씰</text>
    <text x="460" y="300" font-size="10" fill="#1a1a1a" text-anchor="middle">1차 고장 시 대비</text>

    <!-- 라비린스 -->
    <rect x="620" y="158" width="46" height="80" fill="#c8d2da" stroke="#3f4b58" stroke-width="1.6"/>
    <path d="M 630 158 L 630 238 M 643 158 L 643 238 M 656 158 L 656 238" stroke="#7a8794" stroke-width="2"/>
    <text x="643" y="300" font-size="10" fill="#1a1a1a" text-anchor="middle">라비린스</text>

    <!-- 베어링 -->
    <rect x="740" y="150" width="90" height="88" fill="#e4e8eb" stroke="#44546a" stroke-width="1.8"/>
    <text x="785" y="186" font-size="11.5" font-weight="700" fill="#2c3e50" text-anchor="middle">베어링</text>
    <text x="785" y="206" font-size="10" fill="#2c3e50" text-anchor="middle">윤활유</text>

    <!-- 씰 가스 주입 -->
    <path d="M 220 100 L 220 146" stroke="#1d5a92" stroke-width="7" marker-end="url(#tdGas)"/>
    <rect x="160 " y="70" width="120" height="30" rx="4" fill="#dce8f2" stroke="#1d5a92" stroke-width="2"/>
    <text x="220" y="90" font-size="11" font-weight="700" fill="#123049" text-anchor="middle">씰 가스</text>
    <text x="292" y="92" font-size="10" fill="#123049">필터 · 가열 · 조절</text>
    <path d="M 220 152 L 212 178 L 204 152" fill="none" stroke="#1d5a92" stroke-width="2"/>
    <text x="196" y="130" font-size="9.5" font-weight="700" fill="#123049" text-anchor="end">공정보다</text>
    <text x="196" y="143" font-size="9.5" font-weight="700" fill="#123049" text-anchor="end">약간 높게</text>

    <!-- 1차 벤트 -->
    <path d="M 360 146 L 360 100" stroke="#c0392b" stroke-width="7" marker-end="url(#tdVent)"/>
    <rect x="310" y="70" width="100" height="30" rx="4" fill="#fbe9e7" stroke="#c0392b" stroke-width="2"/>
    <text x="360" y="90" font-size="11" font-weight="700" fill="#a03228" text-anchor="middle">1차 벤트</text>
    <text x="420" y="92" font-size="10" font-weight="700" fill="#a03228">유량 감시</text>
    <rect x="330" y="150" width="70" height="88" fill="#fdf0ee" stroke="#d9a9a2" stroke-width="1.4"/>
    <text x="365" y="198" font-size="9.5" fill="#8a281c" text-anchor="middle">누설 가스</text>

    <!-- 2차 벤트 -->
    <path d="M 555 146 L 555 118" stroke="#c99b3f" stroke-width="5" marker-end="url(#tdVent)"/>
    <text x="555" y="110" font-size="10" font-weight="700" fill="#8a6114" text-anchor="middle">2차 벤트</text>
    <rect x="520" y="150" width="70" height="88" fill="#fdf6e9" stroke="#dcc191" stroke-width="1.4"/>

    <!-- 분리 가스 -->
    <path d="M 700 100 L 700 152" stroke="#2f6b3a" stroke-width="7" marker-end="url(#tdSep)"/>
    <rect x="630" y="70" width="140" height="30" rx="4" fill="#d8ecd6" stroke="#2f6b3a" stroke-width="2"/>
    <text x="700" y="90" font-size="11" font-weight="700" fill="#2f6b3a" text-anchor="middle">분리 가스 (질소)</text>
    <rect x="676" y="158" width="52" height="80" fill="#e8f2e6" stroke="#a8c9a2" stroke-width="1.4"/>
    <path d="M 690 196 L 668 196" stroke="#2f6b3a" stroke-width="2.4" marker-end="url(#tdSep)"/>
    <path d="M 714 196 L 736 196" stroke="#2f6b3a" stroke-width="2.4" marker-end="url(#tdSep)"/>
    <text x="700" y="300" font-size="10" font-weight="700" fill="#2f6b3a" text-anchor="middle">오일 침입 차단</text>

    <text x="620" y="330" font-size="11" font-weight="700" fill="#2f6b3a">정지 중에도 계속 공급해야 한다</text>

    <!-- 캡션 -->
    <text x="20" y="376" font-size="13" fill="#1a1a1a">
      1차 씰이 압력을 감당하고 2차는 평소 거의 일하지 않는다. 1차 벤트 유량이 씰 상태를 알려주는 가장 직접적인 지표다.
    </text>
    <text x="20" y="398" font-size="13" fill="#1a1a1a">
      분리 가스는 베어링 윤활유가 씰 쪽으로 넘어오지 못하게 막는다. 오일이 씰 면에 닿으면 홈이 막혀 떠오르지 못한다.
    </text>
    <text x="20" y="420" font-size="13" fill="#1a1a1a">
      씰이 새면 씰을 의심하기 전에 이 계통을 보라. 대개 씰 가스가 더러웠거나, 오일이 들어왔거나, 압력이 급변했다.
    </text>
  </g>
</svg>
