<svg viewBox="0 0 900 440" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="온도가 달라져도 송풍기의 체적 유량은 일정하지만 압력과 축동력은 밀도를 따라 변한다" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>체적은 그대로, 압력과 동력은 밀도를 따라간다</title>

  <g font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif">

    <text x="20" y="48" font-size="17" font-weight="700" fill="#2c3e50">온도가 바뀌면 무엇이 달라지는가</text>
    <text x="20" y="70" font-size="12.5" fill="#1f2933">같은 회전수, 같은 송풍기. 20°C 조건을 100으로 둔 상댓값</text>

    <line x1="110" y1="90" x2="110" y2="320" stroke="#1a1a1a" stroke-width="1.6"/>
    <line x1="110" y1="320" x2="810" y2="320" stroke="#1a1a1a" stroke-width="1.6"/>
    <text x="92" y="205" font-size="11.5" fill="#1a1a1a" transform="rotate(-90 92 205)" text-anchor="middle">상댓값 (%)</text>

    <line x1="110" y1="136.7" x2="800" y2="136.7" stroke="#1d5a92" stroke-width="1.8" stroke-dasharray="8 4"/>
    <text x="115" y="112" font-size="12" font-weight="700" fill="#123049">체적 유량은 일정하다</text>

    <rect x="184" y="136.7" width="60" height="183.3" fill="#4a7fb5" stroke="#1d5a92" stroke-width="1.4"/>
    <rect x="256" y="123.3" width="60" height="196.7" fill="#c0392b" stroke="#8a281c" stroke-width="1.4"/>
    <text x="214" y="130" font-size="11" font-weight="700" fill="#123049" text-anchor="middle">100</text>
    <text x="286" y="116" font-size="11" font-weight="700" fill="#8a281c" text-anchor="middle">107</text>

    <rect x="384" y="136.7" width="60" height="183.3" fill="#4a7fb5" stroke="#1d5a92" stroke-width="1.4"/>
    <rect x="456" y="136.7" width="60" height="183.3" fill="#c0392b" stroke="#8a281c" stroke-width="1.4"/>
    <text x="414" y="130" font-size="11" font-weight="700" fill="#123049" text-anchor="middle">100</text>
    <text x="486" y="130" font-size="11" font-weight="700" fill="#8a281c" text-anchor="middle">100</text>

    <rect x="584" y="136.7" width="60" height="183.3" fill="#4a7fb5" stroke="#1d5a92" stroke-width="1.4"/>
    <rect x="656" y="148.6" width="60" height="171.4" fill="#c0392b" stroke="#8a281c" stroke-width="1.4"/>
    <text x="614" y="130" font-size="11" font-weight="700" fill="#123049" text-anchor="middle">100</text>
    <text x="686" y="142" font-size="11" font-weight="700" fill="#8a281c" text-anchor="middle">93.5</text>

    <path d="M 286 123.3 L 486 136.7 L 686 148.6" fill="none" stroke="#8a281c" stroke-width="1.8" stroke-dasharray="6 4"/>

    <text x="560" y="100" font-size="12" font-weight="700" fill="#8a281c">압력과 동력은 밀도를 따라 움직인다</text>

    <text x="250" y="342" font-size="13" font-weight="700" fill="#2c3e50" text-anchor="middle">0°C</text>
    <text x="450" y="342" font-size="13" font-weight="700" fill="#2c3e50" text-anchor="middle">20°C</text>
    <text x="650" y="342" font-size="13" font-weight="700" fill="#2c3e50" text-anchor="middle">40°C</text>
    <text x="250" y="360" font-size="10.5" fill="#1a1a1a" text-anchor="middle">ρ ≈ 1.293</text>
    <text x="450" y="360" font-size="10.5" fill="#1a1a1a" text-anchor="middle">ρ ≈ 1.205</text>
    <text x="650" y="360" font-size="10.5" fill="#1a1a1a" text-anchor="middle">ρ ≈ 1.127</text>

    <rect x="150" y="378" width="16" height="14" fill="#4a7fb5" stroke="#1d5a92" stroke-width="1.2"/>
    <text x="174" y="390" font-size="11.5" fill="#1a1a1a">체적 유량</text>
    <rect x="290" y="378" width="16" height="14" fill="#c0392b" stroke="#8a281c" stroke-width="1.2"/>
    <text x="314" y="390" font-size="11.5" fill="#1a1a1a">압력 상승 · 축동력 · 질량 유량</text>

    <!-- 캡션 -->
    <text x="20" y="422" font-size="13" fill="#1a1a1a">
      찬 공기일수록 압력은 잘 나오지만 축동력도 함께 커진다. 그래서 모터는 가장 밀도가 높은 조건 — 겨울철과 기동 시점 — 으로 선정해야 한다.
    </text>
  </g>
</svg>
