<svg viewBox="0 0 900 470" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="제어선과 서지선 사이의 거리가 밸브 응답과 계통 회복에 필요한 시간을 만들어주는 관계" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>마진은 곧 시간이다</title>

  <defs>
    <marker id="mvArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c1500a"/>
    </marker>
    <marker id="mgArrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6673"/>
    </marker>
    <marker id="tmAx" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a1a"/>
    </marker>
  </defs>

  <g font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif">

    <!-- ============ ① 맵 위의 마진 ============ -->
    <rect x="20" y="30" width="420" height="330" rx="8" fill="#fafbfc" stroke="#dfe4e8"/>
    <text x="40" y="58" font-size="14" font-weight="700" fill="#2c3e50">① 맵 위의 거리</text>
    <text x="40" y="76" font-size="10.5" fill="#1f2933">운전점은 왼쪽으로 이동한다</text>

    <rect x="80" y="100" width="70" height="220" fill="#fbe9e7"/>

    <line x1="80" y1="100" x2="80" y2="320" stroke="#1a1a1a" stroke-width="1.6"/>
    <line x1="80" y1="320" x2="415" y2="320" stroke="#1a1a1a" stroke-width="1.6"/>
    <text x="408" y="340" font-size="10" fill="#1a1a1a" text-anchor="end">유량</text>
    <text x="64" y="210" font-size="10" fill="#1a1a1a" transform="rotate(-90 64 210)" text-anchor="middle">헤드</text>

    <path d="M 150 118 C 230 128, 320 158, 400 208" fill="none" stroke="#2f3d4f" stroke-width="2.6"/>

    <line x1="150" y1="100" x2="150" y2="320" stroke="#c0392b" stroke-width="3.4"/>
    <text x="115" y="300" font-size="11" font-weight="700" fill="#a03228" text-anchor="middle">서지</text>
    <text x="115" y="316" font-size="11" font-weight="700" fill="#a03228" text-anchor="middle">영역</text>
    <text x="156" y="94" font-size="11" font-weight="700" fill="#a03228">서지선</text>

    <line x1="240" y1="100" x2="240" y2="320" stroke="#2f6b3a" stroke-width="2.6" stroke-dasharray="9 5"/>
    <text x="246" y="94" font-size="11" font-weight="700" fill="#2f6b3a">제어선</text>

    <circle cx="340" cy="168" r="7" fill="#1d5a92"/>
    <text x="352" y="164" font-size="10.5" font-weight="700" fill="#123049">운전점</text>
    <path d="M 328 186 L 252 186" stroke="#c1500a" stroke-width="2.6" marker-end="url(#mvArrow)"/>
    <text x="290" y="204" font-size="10" font-weight="700" fill="#8a3a08" text-anchor="middle">유량 감소</text>

    <path d="M 152 250 L 238 250" stroke="#5b6673" stroke-width="2" marker-start="url(#mgArrow2)" marker-end="url(#mgArrow2)"/>
    <text x="195" y="268" font-size="11.5" font-weight="700" fill="#2c3e50" text-anchor="middle">마진</text>

    <text x="40" y="350" font-size="11" font-weight="700" fill="#1a1a1a">이 거리를 지나는 동안 밸브가 일해야 한다</text>

    <!-- ============ ② 시간으로 환산 ============ -->
    <rect x="460" y="30" width="420" height="330" rx="8" fill="#fafbfc" stroke="#dfe4e8"/>
    <text x="480" y="58" font-size="14" font-weight="700" fill="#2c3e50">② 그 거리는 시간이다</text>
    <text x="480" y="76" font-size="10.5" fill="#1f2933">제어선에 닿은 뒤 유량이 회복되기까지</text>

    <line x1="500" y1="100" x2="500" y2="290" stroke="#1a1a1a" stroke-width="1.6"/>
    <path d="M 500 290 L 862 290" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#tmAx)"/>
    <text x="852" y="310" font-size="10" fill="#1a1a1a" text-anchor="end">시간</text>

    <rect x="516" y="112" width="86" height="30" rx="4" fill="#dfe6eb" stroke="#5b6673" stroke-width="1.4"/>
    <text x="559" y="132" font-size="10.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">계측 · 전송</text>

    <rect x="602" y="152" width="70" height="30" rx="4" fill="#dfe6eb" stroke="#5b6673" stroke-width="1.4"/>
    <text x="637" y="172" font-size="10.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">제어 연산</text>

    <rect x="672" y="192" width="90" height="30" rx="4" fill="#d8ecd6" stroke="#2f6b3a" stroke-width="1.8"/>
    <text x="717" y="212" font-size="10.5" font-weight="700" fill="#2f6b3a" text-anchor="middle">밸브 동작</text>

    <rect x="762" y="232" width="96" height="30" rx="4" fill="#d8ecd6" stroke="#2f6b3a" stroke-width="1.8"/>
    <text x="810" y="252" font-size="10.5" font-weight="700" fill="#2f6b3a" text-anchor="middle">유량 회복</text>

    <line x1="516" y1="278" x2="858" y2="278" stroke="#c0392b" stroke-width="2.4"/>
    <line x1="516" y1="270" x2="516" y2="286" stroke="#c0392b" stroke-width="2.4"/>
    <line x1="858" y1="270" x2="858" y2="286" stroke="#c0392b" stroke-width="2.4"/>
    <text x="687" y="272" font-size="11.5" font-weight="700" fill="#a03228" text-anchor="middle">이 시간 안에 끝나야 한다</text>

    <text x="480" y="332" font-size="11" fill="#1a1a1a">마진이 좁으면 이 사슬을 다 돌기 전에</text>
    <text x="480" y="350" font-size="11" font-weight="700" fill="#a03228">운전점이 서지선을 넘는다</text>

    <!-- 캡션 -->
    <text x="20" y="400" font-size="13" fill="#1a1a1a">
      마진은 임의로 정하는 값이 아니라, 오른쪽 사슬을 모두 더한 시간에 운전점의 이동 속도를 곱해 나오는 거리다.
    </text>
    <text x="20" y="422" font-size="13" fill="#1a1a1a">
      하류 용적이 크면 유량 회복이 느려지므로 마진이 더 필요하다. 트립처럼 운전점이 빠르게 이동하는 경우도 마찬가지다.
    </text>
    <text x="20" y="444" font-size="13" fill="#1a1a1a">
      반대로 마진이 넓으면 불필요한 리사이클이 열린다. 압축에 쓴 에너지를 매일 그만큼 버리는 셈이다.
    </text>
  </g>
</svg>
