<svg viewBox="0 0 900 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="최종 토출에서 뽑아 밸브로 감압하는 경우와 중간단에서 직접 추출하는 경우의 압력 비교" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>어디에서 뽑을 것인가</title>

  <defs>
    <marker id="dropRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c0392b"/>
    </marker>
    <marker id="dropGrn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2f6b3a"/>
    </marker>
  </defs>

  <g font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif">

    <!-- ============ ① 최종 토출에서 뽑기 ============ -->
    <rect x="20" y="30" width="420" height="320" rx="8" fill="#fdf9f8" stroke="#e8d9d6"/>
    <text x="40" y="58" font-size="14" font-weight="700" fill="#2c3e50">① 최종 토출에서 뽑아 깎기</text>
    <text x="40" y="76" font-size="10.5" fill="#1f2933">끝까지 올렸다가 밸브로 내린다</text>

    <rect x="352" y="111" width="36" height="119" fill="#fbe9e7"/>

    <line x1="60" y1="95" x2="60" y2="300" stroke="#1a1a1a" stroke-width="1.6"/>
    <line x1="60" y1="300" x2="412" y2="300" stroke="#1a1a1a" stroke-width="1.6"/>
    <text x="46" y="195" font-size="10.5" fill="#1a1a1a" transform="rotate(-90 46 195)" text-anchor="middle">압력</text>
    <text x="405" y="318" font-size="10.5" fill="#1a1a1a" text-anchor="end">단 (Stage)</text>

    <line x1="60" y1="230" x2="412" y2="230" stroke="#8a6d24" stroke-width="1.8" stroke-dasharray="7 4"/>
    <text x="72" y="223" font-size="10.5" font-weight="700" fill="#5c4610">재열기 필요 압력</text>

    <path d="M 70 295 L 103 295 L 103 272 L 136 272 L 136 249 L 169 249 L 169 226 L 202 226 L 202 203 L 235 203 L 235 180 L 268 180 L 268 157 L 301 157 L 301 134 L 334 134 L 334 111 L 370 111"
          fill="none" stroke="#2f3d4f" stroke-width="3"/>
    <text x="340" y="104" font-size="10" font-weight="700" fill="#1a1a1a">최종 토출</text>

    <path d="M 370 118 L 370 224" stroke="#c0392b" stroke-width="3.4" marker-end="url(#dropRed)"/>
    <text x="370" y="252" font-size="11" font-weight="700" fill="#a03228" text-anchor="middle">밸브에서 깎아낸다</text>
    <text x="370" y="268" font-size="10" font-weight="700" fill="#a03228" text-anchor="middle">이만큼이 버려진다</text>

    <text x="40" y="332" font-size="11" font-weight="700" fill="#a03228">펌프가 만든 압력을 밸브가 다시 버린다</text>

    <!-- ============ ② 중간단 추출 ============ -->
    <rect x="460" y="30" width="420" height="320" rx="8" fill="#f7fbf7" stroke="#d6e6d4"/>
    <text x="480" y="58" font-size="14" font-weight="700" fill="#2c3e50">② 중간단에서 직접 뽑기</text>
    <text x="480" y="76" font-size="10.5" fill="#1f2933">필요한 압력에 가까운 지점에서</text>

    <rect x="630" y="203" width="24" height="27" fill="#e8f2e6"/>

    <line x1="500" y1="95" x2="500" y2="300" stroke="#1a1a1a" stroke-width="1.6"/>
    <line x1="500" y1="300" x2="852" y2="300" stroke="#1a1a1a" stroke-width="1.6"/>
    <text x="486" y="195" font-size="10.5" fill="#1a1a1a" transform="rotate(-90 486 195)" text-anchor="middle">압력</text>
    <text x="845" y="318" font-size="10.5" fill="#1a1a1a" text-anchor="end">단 (Stage)</text>

    <line x1="500" y1="230" x2="852" y2="230" stroke="#8a6d24" stroke-width="1.8" stroke-dasharray="7 4"/>
    <text x="512" y="223" font-size="10.5" font-weight="700" fill="#5c4610">재열기 필요 압력</text>

    <path d="M 510 295 L 543 295 L 543 272 L 576 272 L 576 249 L 609 249 L 609 226 L 642 226 L 642 203 L 675 203 L 675 180 L 708 180 L 708 157 L 741 157 L 741 134 L 774 134 L 774 111 L 810 111"
          fill="none" stroke="#2f3d4f" stroke-width="3"/>

    <circle cx="642" cy="203" r="7" fill="#2f6b3a"/>
    <text x="578" y="186" font-size="11" font-weight="700" fill="#2f6b3a">중간단 추출</text>

    <path d="M 642 210 L 642 224" stroke="#2f6b3a" stroke-width="3.4" marker-end="url(#dropGrn)"/>
    <text x="664" y="222" font-size="10.5" font-weight="700" fill="#2f6b3a">작은 차압</text>

    <line x1="642" y1="252" x2="810" y2="252" stroke="#5b6673" stroke-width="1.6"/>
    <line x1="642" y1="246" x2="642" y2="258" stroke="#5b6673" stroke-width="1.6"/>
    <line x1="810" y1="246" x2="810" y2="258" stroke="#5b6673" stroke-width="1.6"/>
    <text x="660" y="272" font-size="10.5" fill="#1a1a1a">추출된 유량은 이 뒤를 거치지 않는다</text>

    <text x="480" y="332" font-size="11" font-weight="700" fill="#2f6b3a">필요한 만큼만 압축하므로 버릴 것이 적다</text>

    <!-- 캡션 -->
    <text x="20" y="382" font-size="13" fill="#1a1a1a">
      붉은 영역이 밸브에서 열로 버려지는 압력이다. 중간단에서 뽑으면 그 영역이 크게 줄고, 뒷단을 거치지 않는 만큼 펌프 동력도 준다.
    </text>
    <text x="20" y="404" font-size="13" fill="#1a1a1a">
      차압이 작아지면 밸브 트림의 침식도 줄고, 거의 닫힌 상태에서 미세 제어를 해야 하는 불안정한 영역도 벗어난다.
    </text>
  </g>
</svg>
