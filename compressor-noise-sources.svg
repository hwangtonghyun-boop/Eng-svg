<svg viewBox="0 0 900 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="압축기 계통에서 소음이 나오는 지점들과 각각에 대응하는 대책" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>소음은 어디서 나오는가</title>

  <defs>
    <marker id="nzWave" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c0392b"/>
    </marker>
  </defs>

  <g font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif">

    <text x="20" y="48" font-size="17" font-weight="700" fill="#2c3e50">발생원마다 대책이 다르다</text>
    <text x="20" y="70" font-size="12.5" fill="#1f2933">붉은 표시가 소음원, 초록 표시가 그에 맞는 대책이다</text>

    <!-- 방음 커버 -->
    <rect x="230" y="152" width="330" height="150" rx="6" fill="none" stroke="#2f6b3a" stroke-width="2.6" stroke-dasharray="10 5"/>
    <text x="395" y="146" font-size="11" font-weight="700" fill="#2f6b3a" text-anchor="middle">방음 커버 — 기계 표면 방사음</text>

    <!-- 배관 -->
    <path d="M 70 230 L 250 230" stroke="#44546a" stroke-width="16"/>
    <path d="M 70 230 L 250 230" stroke="#dce8f2" stroke-width="10"/>
    <path d="M 540 230 L 830 230" stroke="#44546a" stroke-width="16"/>
    <path d="M 540 230 L 830 230" stroke="#f0d9d4" stroke-width="10"/>

    <!-- 압축기 본체 -->
    <circle cx="340" cy="230" r="44" fill="#44546a"/>
    <text x="340" y="228" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">압축기</text>
    <text x="340" y="244" font-size="9" fill="#ffffff" text-anchor="middle">임펠러 · 디퓨저</text>

    <rect x="440" y="196" width="80" height="68" rx="4" fill="#8a97a3" stroke="#3f4b58" stroke-width="1.6"/>
    <text x="480" y="228" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">기어 · 구동</text>

    <!-- 흡입 사일런서 -->
    <rect x="86" y="200" width="72" height="60" rx="4" fill="#d8ecd6" stroke="#2f6b3a" stroke-width="2.2"/>
    <path d="M 96 212 L 148 212 M 96 226 L 148 226 M 96 240 L 148 240 M 96 252 L 148 252" stroke="#2f6b3a" stroke-width="2"/>
    <text x="122" y="284" font-size="10.5" font-weight="700" fill="#2f6b3a" text-anchor="middle">흡입 사일런서</text>
    <text x="122" y="298" font-size="9.5" fill="#2f6b3a" text-anchor="middle">압력 손실 반영 필요</text>

    <!-- 소음원 표시 -->
    <circle cx="62" cy="230" r="9" fill="#c0392b"/>
    <path d="M 52 210 C 40 216, 40 244, 52 250" fill="none" stroke="#c0392b" stroke-width="2"/>
    <path d="M 44 200 C 26 210, 26 250, 44 260" fill="none" stroke="#c0392b" stroke-width="2"/>
    <text x="62" y="186" font-size="10.5" font-weight="700" fill="#a03228" text-anchor="middle">흡입구</text>
    <text x="62" y="172" font-size="9.5" fill="#a03228" text-anchor="middle">대기 방사</text>

    <circle cx="340" cy="186" r="8" fill="#c0392b"/>
    <text x="340" y="172" font-size="10" font-weight="700" fill="#a03228" text-anchor="middle">BPF</text>

    <circle cx="480" cy="186" r="8" fill="#c0392b"/>
    <text x="480" y="172" font-size="10" font-weight="700" fill="#a03228" text-anchor="middle">기어 맞물림</text>

    <!-- 토출 배관 -->
    <rect x="600" y="214" width="120" height="32" fill="none" stroke="#2f6b3a" stroke-width="2.4"/>
    <text x="660" y="272" font-size="10.5" font-weight="700" fill="#2f6b3a" text-anchor="middle">배관 차음</text>
    <circle cx="660" cy="192" r="8" fill="#c0392b"/>
    <text x="660" y="178" font-size="10" font-weight="700" fill="#a03228" text-anchor="middle">배관 벽 방사</text>

    <!-- 벤트 -->
    <path d="M 770 222 L 770 132" stroke="#44546a" stroke-width="12"/>
    <path d="M 770 222 L 770 132" stroke="#f0d9d4" stroke-width="7"/>
    <rect x="744" y="86" width="52" height="46" rx="4" fill="#d8ecd6" stroke="#2f6b3a" stroke-width="2.2"/>
    <path d="M 752 98 L 788 98 M 752 110 L 788 110 M 752 122 L 788 122" stroke="#2f6b3a" stroke-width="2"/>
    <circle cx="770" cy="72" r="9" fill="#c0392b"/>
    <path d="M 790 62 C 802 68, 802 96, 790 102" fill="none" stroke="#c0392b" stroke-width="2"/>
    <path d="M 800 52 C 818 62, 818 102, 800 112" fill="none" stroke="#c0392b" stroke-width="2"/>
    <text x="820" y="80" font-size="10.5" font-weight="700" fill="#a03228">벤트 · 방출구</text>
    <text x="820" y="96" font-size="9.5" fill="#a03228">가장 시끄러운 곳</text>
    <text x="700" y="112" font-size="10" font-weight="700" fill="#2f6b3a" text-anchor="end">벤트 사일런서</text>

    <!-- 기초 -->
    <rect x="240" y="302" width="320" height="26" fill="#b8c4cc" stroke="#8b98a4" stroke-width="1.4"/>
    <text x="400" y="320" font-size="10" font-weight="700" fill="#1a1a1a" text-anchor="middle">기초 — 구조 전달음 차단</text>
    <circle cx="200" cy="315" r="8" fill="#c0392b"/>
    <path d="M 186 302 C 174 308, 174 322, 186 328" fill="none" stroke="#c0392b" stroke-width="2"/>
    <text x="180" y="348" font-size="10" font-weight="700" fill="#a03228" text-anchor="middle">진동 전달</text>

    <!-- 캡션 -->
    <text x="20" y="392" font-size="13" fill="#1a1a1a">
      방음 커버는 기계 표면에서 나오는 소리만 막는다. 배관과 벤트로 나가는 소음에는 아무 효과가 없다.
    </text>
    <text x="20" y="414" font-size="13" fill="#1a1a1a">
      반대로 사일런서를 달았는데 실제 원인이 기어였다면, 압력 손실만 늘고 소음은 그대로다.
    </text>
    <text x="20" y="436" font-size="13" fill="#1a1a1a">
      그래서 대책을 고르기 전에 어느 지점이 주된 소음원인지 측정으로 특정해야 한다.
    </text>
  </g>
</svg>
