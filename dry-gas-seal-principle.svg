<svg viewBox="0 0 900 470" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="드라이 가스 씰의 홈 형상과 가스가 압축되며 씰 면을 띄우는 원리" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>닿지 않고 막는다</title>

  <defs>
    <marker id="dgFlow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1d5a92"/>
    </marker>
    <marker id="dgUp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c0392b"/>
    </marker>
    <marker id="dgDn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2f6b3a"/>
    </marker>
  </defs>

  <g font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif">

    <!-- ============ ① 씰 면의 홈 ============ -->
    <rect x="20" y="30" width="400" height="330" rx="8" fill="#fafbfc" stroke="#dfe4e8"/>
    <text x="40" y="58" font-size="14" font-weight="700" fill="#2c3e50">① 씰 면을 정면에서 보면</text>
    <text x="40" y="76" font-size="10.5" fill="#1f2933">회전링 표면에 홈이 가공되어 있다</text>

    <circle cx="220" cy="210" r="112" fill="#8a97a3" stroke="#3f4b58" stroke-width="2"/>
    <circle cx="220" cy="210" r="62" fill="#44546a" stroke="#3f4b58" stroke-width="2"/>

    <g fill="#dce8f2">
      <path d="M 220 98 A 112 112 0 0 1 272 111 L 244 158 A 62 62 0 0 0 220 148 Z"/>
      <path d="M 311 143 A 112 112 0 0 1 331 192 L 279 199 A 62 62 0 0 0 268 172 Z"/>
      <path d="M 329 240 A 112 112 0 0 1 300 285 L 264 252 A 62 62 0 0 0 280 227 Z"/>
      <path d="M 265 309 A 112 112 0 0 1 216 322 L 218 264 A 62 62 0 0 0 245 257 Z"/>
      <path d="M 169 313 A 112 112 0 0 1 128 284 L 176 251 A 62 62 0 0 0 199 267 Z"/>
      <path d="M 110 240 A 112 112 0 0 1 110 190 L 167 199 A 62 62 0 0 0 167 221 Z"/>
      <path d="M 128 137 A 112 112 0 0 1 170 108 L 198 157 A 62 62 0 0 0 175 173 Z"/>
    </g>

    <path d="M 296 96 A 118 118 0 0 1 336 150" fill="none" stroke="#c1500a" stroke-width="3" marker-end="url(#dgFlow)"/>
    <text x="300" y="88" font-size="11" font-weight="700" fill="#8a3a08">회전 방향</text>

    <text x="220" y="215" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">밀봉 댐</text>
    <text x="42" y="204" font-size="10.5" font-weight="700" fill="#123049">홈</text>
    <path d="M 60 200 L 112 198" stroke="#123049" stroke-width="1.2"/>

    <text x="40" y="344" font-size="11" font-weight="700" fill="#1a1a1a">바깥에서 들어온 가스가 안쪽으로 갈수록 좁아진다</text>

    <!-- ============ ② 부상 원리 ============ -->
    <rect x="440" y="30" width="440" height="330" rx="8" fill="#fafbfc" stroke="#dfe4e8"/>
    <text x="460" y="58" font-size="14" font-weight="700" fill="#2c3e50">② 왜 떠오르는가</text>
    <text x="460" y="76" font-size="10.5" fill="#1f2933">단면으로 본 두 씰 면</text>

    <rect x="490" y="110" width="330" height="52" fill="#6b8194" stroke="#3f4b58" stroke-width="1.8"/>
    <text x="512" y="141" font-size="11" font-weight="700" fill="#ffffff">고정링</text>

    <rect x="490" y="196" width="330" height="52" fill="#44546a" stroke="#2f3d4f" stroke-width="1.8"/>
    <text x="512" y="227" font-size="11" font-weight="700" fill="#ffffff">회전링</text>
    <polygon points="700,196 736,196 736,178 700,178" fill="#dce8f2" stroke="#2f3d4f" stroke-width="1.2"/>
    <polygon points="620,196 656,196 656,184 620,184" fill="#dce8f2" stroke="#2f3d4f" stroke-width="1.2"/>
    <text x="678" y="270" font-size="10" font-weight="700" fill="#123049" text-anchor="middle">홈이 가스를 끌어들인다</text>

    <rect x="490" y="162" width="330" height="34" fill="#e8f0f7"/>
    <text x="560" y="184" font-size="10.5" font-weight="700" fill="#123049">가스 막</text>

    <path d="M 800 250 L 800 200" stroke="#1d5a92" stroke-width="3" marker-end="url(#dgFlow)"/>
    <path d="M 800 196 L 760 180" stroke="#1d5a92" stroke-width="3" marker-end="url(#dgFlow)"/>

    <path d="M 600 100 L 600 142" stroke="#2f6b3a" stroke-width="3.4" marker-end="url(#dgDn)"/>
    <text x="608" y="106" font-size="11" font-weight="700" fill="#2f6b3a">스프링 — 붙이려 한다</text>

    <path d="M 600 190 L 600 168" stroke="#c0392b" stroke-width="3.4" marker-end="url(#dgUp)"/>
    <text x="608" y="214" font-size="11" font-weight="700" fill="#a03228">가스 압력 — 떼어내려 한다</text>

    <text x="460" y="304" font-size="11" fill="#1a1a1a">간극이 좁아지면 가스가 더 압축되어 밀어낸다</text>
    <text x="460" y="322" font-size="11" fill="#1a1a1a">넓어지면 압축이 약해져 스프링이 이긴다</text>
    <text x="460" y="344" font-size="11.5" font-weight="700" fill="#2f6b3a">스스로 같은 간극을 유지한다</text>

    <!-- 캡션 -->
    <text x="20" y="398" font-size="13" fill="#1a1a1a">
      회전링의 홈이 바깥 가스를 안으로 끌어들이고, 좁아지는 통로에서 압축된 가스가 두 면을 밀어낸다.
    </text>
    <text x="20" y="420" font-size="13" fill="#1a1a1a">
      정지 중에는 스프링 힘으로 맞닿아 있다가, 회전이 올라가면 떠오른다. 그래서 기동과 정지의 저속 구간에서만 접촉이 일어난다.
    </text>
    <text x="20" y="442" font-size="13" fill="#1a1a1a">
      홈이 막히면 떠오르지 못한다. 씰 가스의 청정도가 곧 씰의 수명인 이유다.
    </text>
  </g>
</svg>
