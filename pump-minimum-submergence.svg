-size="13" font-weight="700" fill="#fff">2</text><text x="610" y="162" font-size="12" fill="#1f2937">표면 함몰(딤플)</text><circle cx="589" cy="202" r="13" fill="#d97706"/><text x="589" y="207" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">3</text><text x="610" y="206" font-size="12" fill="#1f2937">염료 코어가 흡입구까지</text><circle cx="589" cy="246" r="13" fill="#dc2626"/><text x="589" y="251" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">4</text><text x="610" y="250" font-size="12" fill="#1f2937">부유물을 끌어들임</text><circle cx="589" cy="290" r="13" fill="#dc2626"/><text x="589" y="295" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">5</text><text x="610" y="294" font-size="12" fill="#1f2937">기포를 끌어들임</text><circle cx="589" cy="334" r="13" fill="#dc2626"/><text x="589" y="339" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">6</text><text x="610" y="338" font-size="12" fill="#1f2937">공기 코어가 흡입구까지</text><text x="665" y="392" text-anchor="middle" font-size="11" fill="#475569">녹색: 허용 · 주황: 조건부</text><text x="665" y="408" text-anchor="middle" font-size="11" fill="#475569">빨강: 불허 (HI 9.8 모델시험 기준)</text><text x="540" y="458" text-anchor="end" font-size="11" fill="#6b7280">※ 개념도, 치수 비율은 실제와 다름</text></svg>