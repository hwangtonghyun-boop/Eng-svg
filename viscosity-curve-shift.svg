<svg viewBox="0 0 900 425" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="고점도 유체에서 양정 곡선이 처지고 동력 곡선이 올라가는 변화" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>점도가 곡선을 바꾼다</title>

  <defs>
    <marker id="vDim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c0392b"/>
    </marker>
    <marker id="vAx" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a1a"/>
    </marker>
  </defs>

  <g font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif">

    <!-- ============ ① 양정 곡선 ============ -->
    <rect x="20" y="30" width="420" height="325" rx="8" fill="#fafbfc" stroke="#dfe4e8"/>
    <text x="40" y="58" font-size="14" font-weight="700" fill="#2c3e50">① 양정 곡선</text>
    <text x="40" y="76" font-size="10.5" fill="#1f2933">곡선이 아래로 처진다</text>

    <line x1="70" y1="90" x2="70" y2="290" stroke="#1a1a1a" stroke-width="1.6"/>
    <path d="M 70 290 L 415 290" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#vAx)"/>
    <text x="408" y="306" font-size="11" fill="#1a1a1a" text-anchor="end">유량 Q</text>
    <text x="54" y="190" font-size="11" fill="#1a1a1a" transform="rotate(-90 54 190)" text-anchor="middle">양정 H</text>

    <path d="M 75 130 C 160 138, 250 175, 380 240" fill="none" stroke="#2f3d4f" stroke-width="2.8"/>
    <path d="M 75 145 C 150 160, 225 205, 345 272" fill="none" stroke="#c0392b" stroke-width="2.8"/>

    <path d="M 328 218 L 328 262" stroke="#c0392b" stroke-width="2" marker-start="url(#vDim)" marker-end="url(#vDim)"/>
    <text x="318" y="210" font-size="10.5" font-weight="700" fill="#a03228" text-anchor="end">차이 확대</text>

    <rect x="245" y="100" width="180" height="50" rx="5" fill="#ffffff" stroke="#dfe4e8"/>
    <line x1="258" y1="118" x2="288" y2="118" stroke="#2f3d4f" stroke-width="2.8"/>
    <text x="296" y="122" font-size="10.5" fill="#1a1a1a">물 기준</text>
    <line x1="258" y1="140" x2="288" y2="140" stroke="#c0392b" stroke-width="2.8"/>
    <text x="296" y="144" font-size="10.5" fill="#1a1a1a">고점도 유체</text>

    <text x="40" y="320" font-size="11" fill="#1a1a1a">대유량 쪽일수록 하락 폭이 크다</text>
    <text x="40" y="338" font-size="11" font-weight="700" fill="#a03228">하나의 계수로 평행 이동시킬 수 없다</text>

    <!-- ============ ② 동력 곡선 ============ -->
    <rect x="460" y="30" width="420" height="325" rx="8" fill="#fafbfc" stroke="#dfe4e8"/>
    <text x="478" y="58" font-size="14" font-weight="700" fill="#2c3e50">② 동력 곡선</text>
    <text x="478" y="76" font-size="10.5" fill="#1f2933">곡선이 위로 올라간다</text>

    <line x1="510" y1="90" x2="510" y2="290" stroke="#1a1a1a" stroke-width="1.6"/>
    <path d="M 510 290 L 855 290" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#vAx)"/>
    <text x="848" y="306" font-size="11" fill="#1a1a1a" text-anchor="end">유량 Q</text>
    <text x="494" y="190" font-size="11" fill="#1a1a1a" transform="rotate(-90 494 190)" text-anchor="middle">축동력 P</text>

    <path d="M 515 258 C 600 250, 700 228, 840 198" fill="none" stroke="#2f3d4f" stroke-width="2.8"/>
    <path d="M 515 222 C 600 202, 690 168, 820 132" fill="none" stroke="#c0392b" stroke-width="2.8"/>

    <path d="M 762 148 L 762 215" stroke="#c0392b" stroke-width="2" marker-start="url(#vDim)" marker-end="url(#vDim)"/>
    <text x="752" y="186" font-size="10.5" font-weight="700" fill="#a03228" text-anchor="end">동력 증가</text>

    <rect x="545" y="96" width="180" height="50" rx="5" fill="#ffffff" stroke="#dfe4e8"/>
    <line x1="558" y1="114" x2="588" y2="114" stroke="#2f3d4f" stroke-width="2.8"/>
    <text x="596" y="118" font-size="10.5" fill="#1a1a1a">물 기준</text>
    <line x1="558" y1="136" x2="588" y2="136" stroke="#c0392b" stroke-width="2.8"/>
    <text x="596" y="140" font-size="10.5" fill="#1a1a1a">고점도 유체</text>

    <text x="478" y="320" font-size="11" fill="#1a1a1a">유량과 양정이 줄었는데도 동력은 오른다</text>
    <text x="478" y="338" font-size="11" font-weight="700" fill="#a03228">효율 저하가 곧 동력 증가다</text>

    <!-- 캡션 -->
    <text x="20" y="385" font-size="13" fill="#1a1a1a">
      점성이 만드는 손실은 유체를 내보내는 데 전혀 기여하지 않고 열로 버려진다. 그래서 양정은 내려가고 동력은 올라간다.
    </text>
    <text x="20" y="407" font-size="13" fill="#1a1a1a">
      두 곡선이 반대 방향으로 벌어지는 것, 그것이 모터를 한 단계 키워야 하는 이유다.
    </text>
  </g>
</svg>
