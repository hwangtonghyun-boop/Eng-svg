<svg viewBox="0 0 900 530" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="BB3, BB4, BB5 세 타입의 케이싱 분할 방식 비교 종단면도" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>BB3 · BB4 · BB5 케이싱 분할 방식 비교</title>

  <g font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif">

    <!-- ============ PANEL A : BB3 ============ -->
    <rect x="20" y="20" width="280" height="400" rx="8" fill="#fafbfc" stroke="#dfe4e8"/>
    <text x="40" y="50" font-size="17" font-weight="700" fill="#2c3e50">BB3</text>
    <text x="40" y="72" font-size="12.5" fill="#1f2933">수평 분할 (Axially Split)</text>

    <!-- 축 스터브 -->
    <rect x="22" y="216" width="33" height="8" fill="#44546a"/>
    <rect x="265" y="216" width="33" height="8" fill="#44546a"/>

    <!-- 케이싱 -->
    <rect x="55" y="155" width="210" height="130" rx="10" fill="#e8edf1" stroke="#7a8794" stroke-width="1.6"/>

    <!-- 플랜지 탭 -->
    <rect x="40" y="212" width="15" height="16" fill="#c8d2da" stroke="#97a3ad"/>
    <rect x="265" y="212" width="15" height="16" fill="#c8d2da" stroke="#97a3ad"/>

    <!-- 임펠러 -->
    <rect x="76" y="196" width="9" height="48" fill="#44546a"/>
    <rect x="116" y="196" width="9" height="48" fill="#44546a"/>
    <rect x="156" y="196" width="9" height="48" fill="#44546a"/>
    <rect x="196" y="196" width="9" height="48" fill="#44546a"/>
    <rect x="236" y="196" width="9" height="48" fill="#44546a"/>

    <!-- 분할면 -->
    <line x1="40" y1="220" x2="280" y2="220" stroke="#c0392b" stroke-width="2.8"/>

    <!-- 체결 볼트 -->
    <line x1="46" y1="208" x2="46" y2="232" stroke="#5b6673" stroke-width="2.2"/>
    <line x1="100" y1="208" x2="100" y2="232" stroke="#5b6673" stroke-width="2.2"/>
    <line x1="140" y1="208" x2="140" y2="232" stroke="#5b6673" stroke-width="2.2"/>
    <line x1="180" y1="208" x2="180" y2="232" stroke="#5b6673" stroke-width="2.2"/>
    <line x1="220" y1="208" x2="220" y2="232" stroke="#5b6673" stroke-width="2.2"/>
    <line x1="274" y1="208" x2="274" y2="232" stroke="#5b6673" stroke-width="2.2"/>

    <circle cx="44" cy="350" r="3.5" fill="#c0392b"/>
    <text x="56" y="355" font-size="12.5" fill="#1a1a1a">분할면이 축을 따라 길게 지나감</text>
    <circle cx="44" cy="378" r="3.5" fill="#c0392b"/>
    <text x="56" y="383" font-size="12.5" fill="#1a1a1a">긴 평면 가스켓 하나로 밀봉</text>
    <circle cx="44" cy="406" r="3.5" fill="#c0392b"/>
    <text x="56" y="411" font-size="12.5" fill="#1a1a1a">상부만 열면 배관 유지한 채 정비</text>

    <!-- ============ PANEL B : BB4 ============ -->
    <rect x="310" y="20" width="280" height="400" rx="8" fill="#fafbfc" stroke="#dfe4e8"/>
    <text x="330" y="50" font-size="17" font-weight="700" fill="#2c3e50">BB4</text>
    <text x="330" y="72" font-size="12.5" fill="#1f2933">단간 링 분할 (Ring-Section)</text>

    <!-- 축 스터브 -->
    <rect x="315" y="216" width="25" height="8" fill="#44546a"/>
    <rect x="560" y="216" width="25" height="8" fill="#44546a"/>

    <!-- 엔드 커버 -->
    <rect x="340" y="158" width="20" height="124" fill="#c8d2da" stroke="#97a3ad"/>
    <rect x="540" y="158" width="20" height="124" fill="#c8d2da" stroke="#97a3ad"/>

    <!-- 스테이지 링 -->
    <rect x="360" y="165" width="180" height="110" fill="#e8edf1" stroke="#7a8794" stroke-width="1.6"/>

    <!-- 임펠러 -->
    <rect x="371" y="200" width="8" height="40" fill="#44546a"/>
    <rect x="401" y="200" width="8" height="40" fill="#44546a"/>
    <rect x="431" y="200" width="8" height="40" fill="#44546a"/>
    <rect x="461" y="200" width="8" height="40" fill="#44546a"/>
    <rect x="491" y="200" width="8" height="40" fill="#44546a"/>
    <rect x="521" y="200" width="8" height="40" fill="#44546a"/>

    <!-- 단 경계 분할면 -->
    <line x1="390" y1="165" x2="390" y2="275" stroke="#c0392b" stroke-width="2.6"/>
    <line x1="420" y1="165" x2="420" y2="275" stroke="#c0392b" stroke-width="2.6"/>
    <line x1="450" y1="165" x2="450" y2="275" stroke="#c0392b" stroke-width="2.6"/>
    <line x1="480" y1="165" x2="480" y2="275" stroke="#c0392b" stroke-width="2.6"/>
    <line x1="510" y1="165" x2="510" y2="275" stroke="#c0392b" stroke-width="2.6"/>

    <!-- 타이 볼트 -->
    <line x1="336" y1="150" x2="564" y2="150" stroke="#5b6673" stroke-width="3"/>
    <line x1="336" y1="290" x2="564" y2="290" stroke="#5b6673" stroke-width="3"/>
    <circle cx="336" cy="150" r="4" fill="#5b6673"/>
    <circle cx="564" cy="150" r="4" fill="#5b6673"/>
    <circle cx="336" cy="290" r="4" fill="#5b6673"/>
    <circle cx="564" cy="290" r="4" fill="#5b6673"/>
    <text x="450" y="140" font-size="11.5" fill="#1f2933" text-anchor="middle">타이 볼트</text>

    <circle cx="334" cy="350" r="3.5" fill="#c0392b"/>
    <text x="346" y="355" font-size="12.5" fill="#1a1a1a">단 경계마다 밀봉 조인트 발생</text>
    <circle cx="334" cy="378" r="3.5" fill="#c0392b"/>
    <text x="346" y="383" font-size="12.5" fill="#1a1a1a">타이 볼트로 전체를 압착</text>
    <circle cx="334" cy="406" r="3.5" fill="#c0392b"/>
    <text x="346" y="411" font-size="12.5" fill="#1a1a1a">제작비 최저, 누설 지점 최다</text>

    <!-- ============ PANEL C : BB5 ============ -->
    <rect x="600" y="20" width="280" height="400" rx="8" fill="#fafbfc" stroke="#dfe4e8"/>
    <text x="620" y="50" font-size="17" font-weight="700" fill="#2c3e50">BB5</text>
    <text x="620" y="72" font-size="12.5" fill="#1f2933">이중 배럴 (Double Casing)</text>

    <!-- 축 스터브 -->
    <rect x="600" y="216" width="20" height="8" fill="#44546a"/>
    <rect x="852" y="216" width="26" height="8" fill="#44546a"/>

    <!-- 외부 배럴 -->
    <rect x="615" y="155" width="230" height="130" rx="12" fill="#eef2f5" stroke="#5b6673" stroke-width="3.5"/>

    <!-- 배럴 커버 -->
    <rect x="832" y="148" width="20" height="144" rx="3" fill="#c8d2da" stroke="#97a3ad"/>

    <!-- 내부 번들 -->
    <rect x="632" y="180" width="188" height="80" rx="6" fill="#d5dde3" stroke="#97a3ad" stroke-width="1.4"/>
    <text x="726" y="273" font-size="11.5" fill="#1f2933" text-anchor="middle">내부 번들</text>

    <!-- 임펠러 -->
    <rect x="651" y="195" width="8" height="50" fill="#44546a"/>
    <rect x="686" y="195" width="8" height="50" fill="#44546a"/>
    <rect x="721" y="195" width="8" height="50" fill="#44546a"/>
    <rect x="756" y="195" width="8" height="50" fill="#44546a"/>
    <rect x="791" y="195" width="8" height="50" fill="#44546a"/>

    <!-- 유일한 외부 밀봉면 -->
    <line x1="832" y1="148" x2="832" y2="292" stroke="#c0392b" stroke-width="2.8"/>

    <circle cx="624" cy="350" r="3.5" fill="#c0392b"/>
    <text x="636" y="355" font-size="12.5" fill="#1a1a1a">외부 밀봉면은 배럴 커버 하나뿐</text>
    <circle cx="624" cy="378" r="3.5" fill="#c0392b"/>
    <text x="636" y="383" font-size="12.5" fill="#1a1a1a">원통 대칭이라 열팽창이 균일</text>
    <circle cx="624" cy="406" r="3.5" fill="#c0392b"/>
    <text x="636" y="411" font-size="12.5" fill="#1a1a1a">번들을 통째로 후단 인출</text>

    <!-- 범례 -->
    <line x1="330" y1="456" x2="368" y2="456" stroke="#c0392b" stroke-width="2.8"/>
    <text x="378" y="461" font-size="13" fill="#1a1a1a">외부로 향하는 밀봉면(분할면)</text>

    <text x="450" y="500" font-size="13.5" fill="#1a1a1a" text-anchor="middle">
      밀봉면이 길고 많을수록 누설 위험이 커진다. BB5는 그 면을 원형 하나로 줄인 구조다.
    </text>
  </g>
</svg>
