<svg viewBox="0 0 900 470" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="다단 펌프에서 누적된 임펠러 추력을 밸런스 드럼이 상쇄하고 남은 잔류 추력만 쓰러스트 베어링이 받는 구조">
  <title>밸런스 라인은 조건을 유지한다</title>

  <defs>
    <marker id="blThrust" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c0392b"/>
    </marker>
    <marker id="blBal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2f6b3a"/>
    </marker>
    <marker id="blFlow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1d5a92"/>
    </marker>
  </defs>

  <g font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif">

    <text x="20" y="48" font-size="17" font-weight="700" fill="#2c3e50">추력은 누적되고, 밸런스 드럼이 되민다</text>
    <text x="20" y="70" font-size="12.5" fill="#1f2933">그 되미는 힘은 밸런스 챔버가 낮게 유지될 때만 생긴다</text>

    <!-- 밸런스 라인 -->
    <path d="M 712 148 L 712 104 L 120 104 L 120 196" fill="none" stroke="#1d5a92" stroke-width="9"/>
    <path d="M 470 104 L 430 104" stroke="#1d5a92" stroke-width="3" marker-end="url(#blFlow)"/>
    <path d="M 240 104 L 200 104" stroke="#1d5a92" stroke-width="3" marker-end="url(#blFlow)"/>
    <text x="470" y="94" font-size="12" font-weight="700" fill="#123049">밸런스 라인 — 누설 유체를 흡입으로 되돌린다</text>

    <!-- 케이싱 -->
    <rect x="150" y="160" width="620" height="110" rx="5" fill="#eef2f5" stroke="#44546a" stroke-width="2"/>

    <!-- 축 -->
    <rect x="100" y="200" width="760" height="28" fill="#44546a"/>
    <text x="828" y="219" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">축</text>

    <!-- 임펠러 -->
    <g stroke="#3f4b58" stroke-width="1.4">
      <polygon points="196,172 222,172 222,200 196,200" fill="#6b8194"/>
      <polygon points="196,256 222,256 222,228 196,228" fill="#6b8194"/>
      <polygon points="266,172 292,172 292,200 266,200" fill="#6b8194"/>
      <polygon points="266,256 292,256 292,228 266,228" fill="#6b8194"/>
      <polygon points="336,172 362,172 362,200 336,200" fill="#6b8194"/>
      <polygon points="336,256 362,256 362,228 336,228" fill="#6b8194"/>
      <polygon points="406,172 432,172 432,200 406,200" fill="#6b8194"/>
      <polygon points="406,256 432,256 432,228 406,228" fill="#6b8194"/>
      <polygon points="476,172 502,172 502,200 476,200" fill="#6b8194"/>
      <polygon points="476,256 502,256 502,228 476,228" fill="#6b8194"/>
      <polygon points="546,172 572,172 572,200 546,200" fill="#6b8194"/>
      <polygon points="546,256 572,256 572,228 546,228" fill="#6b8194"/>
    </g>

    <text x="384" y="296" font-size="11" font-weight="700" fill="#1a1a1a" text-anchor="middle">임펠러가 모두 같은 방향을 본다</text>

    <!-- 추력 화살표 -->
    <path d="M 240 318 L 196 318" stroke="#c0392b" stroke-width="3" marker-end="url(#blThrust)"/>
    <path d="M 310 318 L 240 318" stroke="#c0392b" stroke-width="3.6" marker-end="url(#blThrust)"/>
    <path d="M 380 318 L 292 318" stroke="#c0392b" stroke-width="4.2" marker-end="url(#blThrust)"/>
    <path d="M 450 318 L 344 318" stroke="#c0392b" stroke-width="4.8" marker-end="url(#blThrust)"/>
    <path d="M 520 318 L 396 318" stroke="#c0392b" stroke-width="5.4" marker-end="url(#blThrust)"/>
    <path d="M 590 318 L 448 318" stroke="#c0392b" stroke-width="6" marker-end="url(#blThrust)"/>
    <text x="604" y="322" font-size="11.5" font-weight="700" fill="#a03228">단마다 더해진다</text>

    <!-- 밸런스 드럼 -->
    <rect x="650" y="178" width="58" height="72" fill="#c8a882" stroke="#a8795a" stroke-width="2"/>
    <rect x="646" y="172" width="66" height="6" fill="#8a97a3" stroke="#3f4b58" stroke-width="1.2"/>
    <rect x="646" y="250" width="66" height="6" fill="#8a97a3" stroke="#3f4b58" stroke-width="1.2"/>
    <text x="679" y="166" font-size="10.5" font-weight="700" fill="#7a4f34" text-anchor="middle">밸런스 드럼</text>

    <!-- 고압측 -->
    <rect x="600" y="162" width="50" height="106" fill="#f0d9d4"/>
    <text x="625" y="214" font-size="10" font-weight="700" fill="#8a281c" text-anchor="middle">토출</text>
    <text x="625" y="228" font-size="10" font-weight="700" fill="#8a281c" text-anchor="middle">압력</text>

    <!-- 밸런스 챔버 -->
    <rect x="708" y="162" width="60" height="106" fill="#dce8f2"/>
    <text x="738" y="206" font-size="10" font-weight="700" fill="#123049" text-anchor="middle">밸런스</text>
    <text x="738" y="220" font-size="10" font-weight="700" fill="#123049" text-anchor="middle">챔버</text>
    <text x="738" y="240" font-size="9.5" font-weight="700" fill="#123049" text-anchor="middle">낮게 유지</text>

    <!-- 되미는 힘 -->
    <path d="M 640 352 L 760 352" stroke="#2f6b3a" stroke-width="6" marker-end="url(#blBal)"/>
    <text x="700" y="374" font-size="11.5" font-weight="700" fill="#2f6b3a" text-anchor="middle">되미는 힘</text>

    <!-- 잔류 추력과 베어링 -->
    <rect x="820" y="186" width="34" height="56" fill="#8a97a3" stroke="#3f4b58" stroke-width="1.6"/>
    <text x="837" y="178" font-size="10" font-weight="700" fill="#1a1a1a" text-anchor="middle">쓰러스트</text>
    <text x="837" y="260" font-size="10" font-weight="700" fill="#1a1a1a" text-anchor="middle">베어링</text>

    <path d="M 818 318 L 790 318" stroke="#c0392b" stroke-width="2.4" marker-end="url(#blThrust)"/>
    <text x="824" y="322" font-size="10.5" font-weight="700" fill="#a03228">잔류</text>

    <!-- 캡션 -->
    <text x="20" y="404" font-size="13" fill="#1a1a1a">
      붉은 화살표가 단을 지날수록 굵어진다. 임펠러가 모두 같은 방향을 보고 있으므로 추력이 한쪽으로 누적되기 때문이다.
    </text>
    <text x="20" y="426" font-size="13" fill="#1a1a1a">
      초록 화살표가 그 대부분을 되민다. 그리고 그 힘은 드럼 양단의 압력차에서 나오므로, 오른쪽 챔버가 낮게 유지되어야만 생긴다.
    </text>
    <text x="20" y="448" font-size="13" fill="#1a1a1a">
      베어링이 받는 것은 남은 몫뿐이다. 밸런스 라인은 힘을 만드는 관이 아니라, 힘이 생길 조건을 유지하는 관이다.
    </text>
  </g>
</svg>
