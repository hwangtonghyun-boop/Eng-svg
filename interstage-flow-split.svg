<svg viewBox="0 0 900 455" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="중간단 추출 지점을 기준으로 앞단과 뒷단의 유량이 달라지는 구조" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>추출 지점 뒤는 다른 유량으로 돈다</title>

  <defs>
    <marker id="flowThick" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1d5a92"/>
    </marker>
    <marker id="tapArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2f6b3a"/>
    </marker>
    <marker id="dimRed2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c0392b"/>
    </marker>
  </defs>

  <g font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif">

    <rect x="20" y="30" width="860" height="360" rx="8" fill="#fafbfc" stroke="#dfe4e8"/>
    <text x="40" y="58" font-size="15" font-weight="700" fill="#2c3e50">추출 지점을 경계로 유량이 갈린다</text>
    <text x="40" y="76" font-size="11" fill="#1f2933">같은 펌프 안에서 앞단과 뒷단이 서로 다른 운전점에 놓인다</text>

    <path d="M 403 92 L 403 116" stroke="#2f6b3a" stroke-width="11" marker-end="url(#tapArrow)"/>
    <text x="424" y="106" font-size="11.5" font-weight="700" fill="#2f6b3a">중간단 추출</text>

    <rect x="392" y="116" width="22" height="24" fill="#c8d2da" stroke="#44546a" stroke-width="1.4"/>
    <rect x="100" y="118" width="660" height="104" rx="4" fill="#eef2f5" stroke="#44546a" stroke-width="2"/>

    <rect x="80" y="162" width="740" height="16" fill="#44546a"/>

    <rect x="132" y="130" width="26" height="32" fill="#6b8194" stroke="#3f4b58"/>
    <rect x="132" y="178" width="26" height="32" fill="#6b8194" stroke="#3f4b58"/>
    <rect x="207" y="130" width="26" height="32" fill="#6b8194" stroke="#3f4b58"/>
    <rect x="207" y="178" width="26" height="32" fill="#6b8194" stroke="#3f4b58"/>
    <rect x="282" y="130" width="26" height="32" fill="#6b8194" stroke="#3f4b58"/>
    <rect x="282" y="178" width="26" height="32" fill="#6b8194" stroke="#3f4b58"/>
    <rect x="357" y="130" width="26" height="32" fill="#6b8194" stroke="#3f4b58"/>
    <rect x="357" y="178" width="26" height="32" fill="#6b8194" stroke="#3f4b58"/>
    <rect x="432" y="130" width="26" height="32" fill="#7f95a6" stroke="#3f4b58"/>
    <rect x="432" y="178" width="26" height="32" fill="#7f95a6" stroke="#3f4b58"/>
    <rect x="507" y="130" width="26" height="32" fill="#7f95a6" stroke="#3f4b58"/>
    <rect x="507" y="178" width="26" height="32" fill="#7f95a6" stroke="#3f4b58"/>
    <rect x="582" y="130" width="26" height="32" fill="#7f95a6" stroke="#3f4b58"/>
    <rect x="582" y="178" width="26" height="32" fill="#7f95a6" stroke="#3f4b58"/>
    <rect x="657" y="130" width="26" height="32" fill="#7f95a6" stroke="#3f4b58"/>
    <rect x="657" y="178" width="26" height="32" fill="#7f95a6" stroke="#3f4b58"/>

    <path d="M 44 170 L 94 170" stroke="#1d5a92" stroke-width="24" marker-end="url(#flowThick)"/>
    <text x="44" y="200" font-size="10" font-weight="700" fill="#1d5a92">흡입</text>
    <path d="M 766 170 L 836 170" stroke="#1d5a92" stroke-width="15" marker-end="url(#flowThick)"/>
    <text x="800" y="200" font-size="10" font-weight="700" fill="#1d5a92">토출</text>

    <text x="145" y="240" font-size="10" fill="#1a1a1a" text-anchor="middle">1</text>
    <text x="220" y="240" font-size="10" fill="#1a1a1a" text-anchor="middle">2</text>
    <text x="295" y="240" font-size="10" fill="#1a1a1a" text-anchor="middle">3</text>
    <text x="370" y="240" font-size="10" fill="#1a1a1a" text-anchor="middle">4</text>
    <text x="445" y="240" font-size="10" fill="#1a1a1a" text-anchor="middle">5</text>
    <text x="520" y="240" font-size="10" fill="#1a1a1a" text-anchor="middle">6</text>
    <text x="595" y="240" font-size="10" fill="#1a1a1a" text-anchor="middle">7</text>
    <text x="670" y="240" font-size="10" fill="#1a1a1a" text-anchor="middle">8</text>

    <line x1="100" y1="340" x2="760" y2="340" stroke="#1a1a1a" stroke-width="1.6"/>
    <line x1="100" y1="260" x2="100" y2="340" stroke="#1a1a1a" stroke-width="1.6"/>
    <text x="84" y="300" font-size="10.5" fill="#1a1a1a" transform="rotate(-90 84 300)" text-anchor="middle">유량</text>

    <rect x="100" y="278" width="303" height="62" fill="#cfe0ee" stroke="#4a7fb5" stroke-width="1.6"/>
    <rect x="403" y="308" width="357" height="32" fill="#cfe0ee" stroke="#4a7fb5" stroke-width="1.6"/>
    <line x1="403" y1="278" x2="403" y2="308" stroke="#4a7fb5" stroke-width="1.6"/>

    <text x="250" y="300" font-size="11" font-weight="700" fill="#123049" text-anchor="middle">앞단 — 전체 유량</text>
    <text x="580" y="328" font-size="11" font-weight="700" fill="#123049" text-anchor="middle">뒷단 — 추출분을 뺀 유량</text>

    <path d="M 430 282 L 430 304" stroke="#c0392b" stroke-width="2.2" marker-start="url(#dimRed2)" marker-end="url(#dimRed2)"/>
    <text x="444" y="298" font-size="10.5" font-weight="700" fill="#a03228">추출량</text>

    <line x1="403" y1="116" x2="403" y2="270" stroke="#2f6b3a" stroke-width="1.4" stroke-dasharray="5 4"/>

    <text x="40" y="368" font-size="11" font-weight="700" fill="#a03228">뒷단은 더 적은 유량으로 운전하므로, 추출이 많으면 최소유량 아래로 내려갈 수 있다</text>

    <!-- 캡션 -->
    <text x="20" y="420" font-size="13" fill="#1a1a1a">
      전체 토출 유량계는 정상으로 보여도 뒷단만 재순환에 들어갈 수 있다. 최소유량 보호는 주 유량과 추출 유량을 함께 보고 설정해야 한다.
    </text>
    <text x="20" y="442" font-size="13" fill="#1a1a1a">
      단별 유량이 달라지면 각 단의 압력 분포도 달라지고, 그 결과 축 추력과 밸런스 계통의 부하도 설계 의도와 달라진다.
    </text>
  </g>
</svg>
