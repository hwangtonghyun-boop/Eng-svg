<svg viewBox="0 0 900 490" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="압축기 한 대에 동시에 적용되는 규격들의 계층 구조와 적용 부위" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>한 대에 여러 규격이 겹친다</title>

  <g font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif">

    <text x="20" y="48" font-size="17" font-weight="700" fill="#2c3e50">한 대의 압축기에 여러 규격이 동시에 걸린다</text>
    <text x="20" y="70" font-size="12.5" fill="#1f2933">본체 규격 하나만 인용해서는 사양서가 완성되지 않는다</text>

    <!-- 발주자 사양 (최외곽) -->
    <rect x="40" y="94" width="820" height="266" rx="10" fill="none" stroke="#5b6673" stroke-width="2.6" stroke-dasharray="11 6"/>
    <rect x="54" y="84" width="180" height="22" rx="4" fill="#dfe6eb" stroke="#5b6673" stroke-width="1.4"/>
    <text x="144" y="100" font-size="11" font-weight="700" fill="#2c3e50" text-anchor="middle">발주자 사양 — 전체에 추가</text>

    <!-- 트레인 -->
    <rect x="70" y="150" width="760" height="140" rx="8" fill="#f4f6f8" stroke="#8b98a4" stroke-width="1.6"/>
    <text x="86" y="172" font-size="11" font-weight="700" fill="#5b6673">트레인 — 비틀림 해석은 전체를 대상으로</text>

    <!-- 구동기 -->
    <rect x="96" y="188" width="140" height="80" rx="5" fill="#e8ecef" stroke="#5b6673" stroke-width="1.8"/>
    <text x="166" y="216" font-size="12" font-weight="700" fill="#2c3e50" text-anchor="middle">구동기</text>
    <text x="166" y="238" font-size="10" fill="#2c3e50" text-anchor="middle">모터 · 증기터빈</text>
    <text x="166" y="254" font-size="10" fill="#2c3e50" text-anchor="middle">가스터빈</text>
    <rect x="96" y="300" width="140" height="24" rx="4" fill="#dfe6eb" stroke="#5b6673" stroke-width="1.4"/>
    <text x="166" y="317" font-size="10.5" font-weight="700" fill="#2c3e50" text-anchor="middle">API 541 · 611 · 612 · 616</text>

    <!-- 커플링 -->
    <rect x="252" y="212" width="46" height="32" rx="3" fill="#c8d2da" stroke="#44546a" stroke-width="1.6"/>
    <text x="275" y="196" font-size="10" font-weight="700" fill="#2c3e50" text-anchor="middle">커플링</text>
    <rect x="240" y="300" width="70" height="24" rx="4" fill="#dfe6eb" stroke="#5b6673" stroke-width="1.4"/>
    <text x="275" y="317" font-size="10.5" font-weight="700" fill="#2c3e50" text-anchor="middle">API 671</text>

    <!-- 기어 -->
    <rect x="316" y="196" width="70" height="64" rx="5" fill="#e8ecef" stroke="#5b6673" stroke-width="1.8"/>
    <text x="351" y="234" font-size="11" font-weight="700" fill="#2c3e50" text-anchor="middle">기어</text>
    <rect x="316" y="300" width="70" height="24" rx="4" fill="#dfe6eb" stroke="#5b6673" stroke-width="1.4"/>
    <text x="351" y="317" font-size="10.5" font-weight="700" fill="#2c3e50" text-anchor="middle">613 · 677</text>

    <!-- 압축기 본체 -->
    <rect x="410" y="180" width="200" height="96" rx="6" fill="#cfe0ee" stroke="#1d5a92" stroke-width="2.6"/>
    <text x="510" y="212" font-size="14" font-weight="700" fill="#123049" text-anchor="middle">압축기 본체</text>
    <text x="510" y="236" font-size="10.5" fill="#123049" text-anchor="middle">케이싱 · 로터 · 씰</text>
    <text x="510" y="254" font-size="10.5" fill="#123049" text-anchor="middle">베어링 · 재질 · 검사</text>

    <rect x="410" y="300" width="200" height="46" rx="4" fill="#dce8f2" stroke="#1d5a92" stroke-width="2"/>
    <text x="510" y="318" font-size="11.5" font-weight="700" fill="#123049" text-anchor="middle">API 617 — 원심 · 축류</text>
    <text x="510" y="336" font-size="10.5" fill="#123049" text-anchor="middle">618 왕복동 · 619 회전 용적형</text>

    <!-- 윤활 · 씰 계통 -->
    <rect x="634" y="188" width="84" height="80" rx="5" fill="#e8f2e6" stroke="#2f6b3a" stroke-width="1.8"/>
    <text x="676" y="220" font-size="11" font-weight="700" fill="#245430" text-anchor="middle">윤활 · 씰</text>
    <text x="676" y="238" font-size="11" font-weight="700" fill="#245430" text-anchor="middle">계통</text>
    <rect x="626" y="300" width="100" height="24" rx="4" fill="#d8ecd6" stroke="#2f6b3a" stroke-width="1.4"/>
    <text x="676" y="317" font-size="10.5" font-weight="700" fill="#245430" text-anchor="middle">API 614</text>

    <!-- 감시 계통 -->
    <rect x="740" y="188" width="74" height="80" rx="5" fill="#f0e4f2" stroke="#6b3fa0" stroke-width="1.8"/>
    <text x="777" y="220" font-size="11" font-weight="700" fill="#4a2a70" text-anchor="middle">진동 · 축</text>
    <text x="777" y="238" font-size="11" font-weight="700" fill="#4a2a70" text-anchor="middle">감시</text>
    <rect x="740" y="300" width="90" height="24" rx="4" fill="#e6d8ef" stroke="#6b3fa0" stroke-width="1.4"/>
    <text x="785" y="317" font-size="10.5" font-weight="700" fill="#4a2a70" text-anchor="middle">API 670</text>

    <!-- 성능 시험 -->
    <rect x="410" y="384" width="200" height="40" rx="5" fill="#fdf3e0" stroke="#c1500a" stroke-width="2.2"/>
    <text x="510" y="400" font-size="11.5" font-weight="700" fill="#8a3a08" text-anchor="middle">ASME PTC 10</text>
    <text x="510" y="417" font-size="10" fill="#8a3a08" text-anchor="middle">성능 시험과 환산</text>
    <path d="M 510 348 L 510 380" stroke="#c1500a" stroke-width="2.2" stroke-dasharray="5 3"/>

    <!-- 캡션 -->
    <text x="20" y="452" font-size="13" fill="#1a1a1a">
      본체 규격은 형식마다 바뀌지만, 윤활과 감시와 커플링 규격은 그대로 겹쳐 적용된다. 구동기까지 포함하면 하나의 트레인이다.
    </text>
    <text x="20" y="474" font-size="13" fill="#1a1a1a">
      선택 항목을 비워 두면 제작사가 가장 저렴한 쪽을 고른다. 명시하지 않은 것은 나중에 이의를 제기할 수 없다.
    </text>
  </g>
</svg>
