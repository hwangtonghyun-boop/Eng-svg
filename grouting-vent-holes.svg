<svg viewBox="0 0 900 530" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="벤트 홀이 없을 때 공기가 갇히는 모습과 벤트 홀이 있을 때 공기가 배출되는 모습, 해머 사운딩 판정" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
