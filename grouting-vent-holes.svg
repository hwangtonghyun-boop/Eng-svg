    <!-- 캡션 -->
    <text x="20" y="488" font-size="13" fill="#1a1a1a">
      그라우팅 실패의 대부분은 공기가 나갈 길이 없어서 생긴다. 벤트 홀은 설계 도면 단계에서 확인해야 할 항목이다.
    </text>
    <text x="20" y="510" font-size="13" fill="#1a1a1a">
      타설이 끝나면 직접 두드려 보라. 두 소리의 차이는 뚜렷해서 한 번만 비교해 보면 그 뒤로는 바로 구분된다.
    </text>
