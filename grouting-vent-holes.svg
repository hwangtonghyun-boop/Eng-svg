    <rect x="803" y="135" width="26" height="13" fill="#44546a"/>
    <rect x="839" y="135" width="16" height="13" fill="#44546a"/>

    <path d="M 500 190 L 840 190" stroke="#8a6d24" stroke-width="3" marker-end="url(#gArrow)" opacity="0.85"/>
