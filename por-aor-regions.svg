<svg viewBox="0 0 900 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="펌프 성능 곡선 위의 POR과 AOR 영역 구분" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>POR과 AOR의 관계</title>

  <g font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif">

    <text x="20" y="46" font-size="18" font-weight="700" fill="#2c3e50">POR과 AOR — 나란히 놓인 두 구간이 아니다</text>
    <text x="20" y="72" font-size="13.5" fill="#1f2933">AOR이 바깥 영역이고, 그 안쪽 알짜 구간이 POR이다</text>

    <!-- 영역 배경 -->
    <rect x="110" y="110" width="220.3" height="290" fill="#fbe9e7"/>
    <rect x="330.3" y="110" width="122.5" height="290" fill="#fdf3e0"/>
    <rect x="452.8" y="110" width="244.8" height="290" fill="#e8f2e6"/>
    <rect x="697.6" y="110" width="58.7" height="290" fill="#fdf3e0"/>
    <rect x="756.3" y="110" width="63.7" height="290" fill="#fbe9e7"/>

    <!-- 축 -->
    <line x1="110" y1="400" x2="820" y2="400" stroke="#1a1a1a" stroke-width="1.6"/>
    <line x1="110" y1="110" x2="110" y2="400" stroke="#1a1a1a" stroke-width="1.6"/>

    <!-- 기준선 -->
    <line x1="330.3" y1="110" x2="330.3" y2="400" stroke="#c0392b" stroke-width="2.6" stroke-dasharray="9 5"/>
    <line x1="452.8" y1="110" x2="452.8" y2="400" stroke="#3f6139" stroke-width="2.2" stroke-dasharray="7 4"/>
    <line x1="599.7" y1="110" x2="599.7" y2="400" stroke="#5b6673" stroke-width="1.5" stroke-dasharray="2 4"/>
    <line x1="697.6" y1="110" x2="697.6" y2="400" stroke="#3f6139" stroke-width="2.2" stroke-dasharray="7 4"/>
    <line x1="756.3" y1="110" x2="756.3" y2="400" stroke="#c0392b" stroke-width="2.6" stroke-dasharray="9 5"/>

    <!-- 양정 곡선 -->
    <path d="M 110 170 C 320 190, 500 250, 820 370" fill="none" stroke="#2f3d4f" stroke-width="2.8"/>

    <!-- 진동 곡선 -->
    <path d="M 110 130 C 210 265, 290 300, 453 345 C 530 364, 560 368, 600 369 C 680 371, 760 345, 820 315"
          fill="none" stroke="#d35400" stroke-width="2.8"/>

    <!-- 곡선 범례 -->
    <line x1="618" y1="145" x2="650" y2="145" stroke="#2f3d4f" stroke-width="2.8"/>
    <text x="658" y="150" font-size="12.5" fill="#1a1a1a">양정 (H-Q)</text>
    <line x1="618" y1="172" x2="650" y2="172" stroke="#d35400" stroke-width="2.8"/>
    <text x="658" y="177" font-size="12.5" fill="#1a1a1a">진동 레벨</text>

    <!-- 축 제목 -->
    <text x="52" y="255" font-size="13" fill="#1a1a1a" transform="rotate(-90 52 255)" text-anchor="middle">양정 · 진동</text>

    <!-- 기준선 라벨 -->
    <text x="330.3" y="422" font-size="12.5" font-weight="700" fill="#a03228" text-anchor="middle">MCSF</text>
    <text x="452.8" y="422" font-size="12.5" font-weight="700" fill="#2f5c2a" text-anchor="middle">70%</text>
    <text x="599.7" y="422" font-size="12.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">BEP 100%</text>
    <text x="697.6" y="422" font-size="12.5" font-weight="700" fill="#2f5c2a" text-anchor="middle">120%</text>
    <text x="756.3" y="422" font-size="12.5" font-weight="700" fill="#a03228" text-anchor="middle">런아웃</text>

    <!-- AOR 브래킷 -->
    <text x="543" y="454" font-size="13.5" font-weight="700" fill="#7a5a24" text-anchor="middle">AOR (허용 운전 영역)</text>
    <line x1="330.3" y1="462" x2="756.3" y2="462" stroke="#b8862b" stroke-width="2"/>
    <line x1="330.3" y1="462" x2="330.3" y2="472" stroke="#b8862b" stroke-width="2"/>
    <line x1="756.3" y1="462" x2="756.3" y2="472" stroke="#b8862b" stroke-width="2"/>

    <!-- POR 브래킷 -->
    <text x="575" y="490" font-size="13.5" font-weight="700" fill="#2f5c2a" text-anchor="middle">POR (최적 운전 영역)</text>
    <line x1="452.8" y1="498" x2="697.6" y2="498" stroke="#3f6139" stroke-width="2.6"/>
    <line x1="452.8" y1="498" x2="452.8" y2="508" stroke="#3f6139" stroke-width="2.6"/>
    <line x1="697.6" y1="498" x2="697.6" y2="508" stroke="#3f6139" stroke-width="2.6"/>

    <!-- 범례 -->
    <rect x="110" y="540" width="20" height="14" fill="#e8f2e6" stroke="#a8c9a2"/>
    <text x="138" y="552" font-size="12.5" fill="#1a1a1a">POR — 정상 · 정격 운전점의 필수 위치</text>

    <rect x="400" y="540" width="20" height="14" fill="#fdf3e0" stroke="#dcc191"/>
    <text x="428" y="552" font-size="12.5" fill="#1a1a1a">AOR 안 · POR 밖 — 단시간 체류만</text>

    <rect x="680" y="540" width="20" height="14" fill="#fbe9e7" stroke="#d9a9a2"/>
    <text x="708" y="552" font-size="12.5" fill="#1a1a1a">운전 금지</text>

    <!-- 캡션 -->
    <text x="110" y="590" font-size="13.5" fill="#1a1a1a">
      AOR은 MCSF부터 런아웃 직전까지 전체를 가리키며, POR을 감싸고 있다. "AOR에서 돌린다"는 말은 "AOR 안이지만 POR 밖"이라는 뜻이다.
    </text>
  </g>
</svg>
