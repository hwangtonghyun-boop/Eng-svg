<svg viewBox="0 0 900 435" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="씰 페이스 마모 궤적 네 가지 유형 - 정상, 편마모, 물결 마모, 광폭 마모" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>마모 궤적으로 원인 읽기</title>

  <g font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif">

    <!-- ============ ① 정상 ============ -->
    <rect x="20" y="30" width="210" height="360" rx="8" fill="#fafbfc" stroke="#dfe4e8"/>
    <text x="35" y="58" font-size="14" font-weight="700" fill="#2f6b3a">① 정상</text>
    <text x="35" y="76" font-size="10.5" fill="#1f2933">Normal Track</text>

    <circle cx="125" cy="200" r="72" fill="#dfe6eb" stroke="#5b6673" stroke-width="2"/>
    <circle cx="125" cy="200" r="55" fill="none" stroke="#8b7355" stroke-width="14"/>
    <circle cx="125" cy="200" r="38" fill="#ffffff" stroke="#5b6673" stroke-width="2"/>

    <text x="35" y="322" font-size="11" fill="#1a1a1a">궤적이 균일하고 동심</text>
    <text x="35" y="342" font-size="11" fill="#1a1a1a">폭이 상대 면과 일치</text>
    <text x="35" y="362" font-size="11" font-weight="700" fill="#2f6b3a">원인 추적 불필요</text>

    <!-- ============ ② 편마모 ============ -->
    <rect x="240" y="30" width="210" height="360" rx="8" fill="#fafbfc" stroke="#dfe4e8"/>
    <text x="255" y="58" font-size="14" font-weight="700" fill="#a03228">② 편마모</text>
    <text x="255" y="76" font-size="10.5" fill="#1f2933">Uneven Track</text>

    <circle cx="345" cy="200" r="72" fill="#dfe6eb" stroke="#5b6673" stroke-width="2"/>
    <circle cx="345" cy="200" r="55" fill="none" stroke="#cfd6dc" stroke-width="14"/>
    <path d="M 363.8 251.7 A 55 55 0 0 0 363.8 148.3" fill="none" stroke="#8b7355" stroke-width="14"/>
    <circle cx="345" cy="200" r="38" fill="#ffffff" stroke="#5b6673" stroke-width="2"/>

    <text x="255" y="322" font-size="11" fill="#1a1a1a">한쪽만 닳아 있다</text>
    <text x="255" y="342" font-size="11" fill="#1a1a1a">축 정렬 불량 · 편하중</text>
    <text x="255" y="362" font-size="11" font-weight="700" fill="#a03228">운전점도 함께 확인</text>

    <!-- ============ ③ 물결 마모 ============ -->
    <rect x="460" y="30" width="210" height="360" rx="8" fill="#fafbfc" stroke="#dfe4e8"/>
    <text x="475" y="58" font-size="14" font-weight="700" fill="#a03228">③ 물결 마모</text>
    <text x="475" y="76" font-size="10.5" fill="#1f2933">Wavy Track</text>

    <circle cx="565" cy="200" r="72" fill="#dfe6eb" stroke="#5b6673" stroke-width="2"/>
    <circle cx="565" cy="200" r="55" fill="none" stroke="#cfd6dc" stroke-width="14"/>
    <path d="M 533.5 154.9 A 55 55 0 0 1 596.5 154.9" fill="none" stroke="#8b7355" stroke-width="14"/>
    <path d="M 541.8 249.8 A 55 55 0 0 1 510.2 195.2" fill="none" stroke="#8b7355" stroke-width="14"/>
    <path d="M 619.8 195.2 A 55 55 0 0 1 588.2 249.8" fill="none" stroke="#8b7355" stroke-width="14"/>
    <circle cx="565" cy="200" r="38" fill="#ffffff" stroke="#5b6673" stroke-width="2"/>

    <text x="475" y="322" font-size="11" fill="#1a1a1a">서너 군데만 닿아 있다</text>
    <text x="475" y="342" font-size="11" fill="#1a1a1a">글랜드 볼트 불균일 조임</text>
    <text x="475" y="362" font-size="11" font-weight="700" fill="#a03228">대각선 순서로 재체결</text>

    <!-- ============ ④ 광폭 마모 ============ -->
    <rect x="680" y="30" width="210" height="360" rx="8" fill="#fafbfc" stroke="#dfe4e8"/>
    <text x="695" y="58" font-size="14" font-weight="700" fill="#a03228">④ 광폭 마모</text>
    <text x="695" y="76" font-size="10.5" fill="#1f2933">Wide Track</text>

    <circle cx="785" cy="200" r="72" fill="#dfe6eb" stroke="#5b6673" stroke-width="2"/>
    <circle cx="785" cy="200" r="55" fill="none" stroke="#8b7355" stroke-width="26"/>
    <circle cx="785" cy="200" r="48" fill="none" stroke="#c0392b" stroke-width="1.4" stroke-dasharray="4 3"/>
    <circle cx="785" cy="200" r="62" fill="none" stroke="#c0392b" stroke-width="1.4" stroke-dasharray="4 3"/>
    <circle cx="785" cy="200" r="38" fill="#ffffff" stroke="#5b6673" stroke-width="2"/>

    <text x="695" y="322" font-size="11" fill="#1a1a1a">상대 면보다 넓다</text>
    <text x="695" y="342" font-size="11" fill="#1a1a1a">축 방향 유격 과다</text>
    <text x="695" y="362" font-size="11" font-weight="700" fill="#a03228">추력 베어링 점검</text>

    <!-- 범례 · 캡션 -->
    <circle cx="694" cy="405" r="5" fill="#8b7355"/>
    <text x="706" y="410" font-size="11" fill="#1a1a1a">마모 궤적</text>

    <line x1="778" y1="405" x2="800" y2="405" stroke="#c0392b" stroke-width="1.4" stroke-dasharray="4 3"/>
    <text x="808" y="410" font-size="11" fill="#1a1a1a">정상 폭</text>

    <text x="35" y="410" font-size="13" fill="#1a1a1a">
      씰 페이스를 정면에서 본 모습이다. 궤적의 모양이 원인을 좁혀 준다.
    </text>
  </g>
</svg>
