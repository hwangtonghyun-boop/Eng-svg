<svg viewBox="0 0 900 465" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="전체 양정 3퍼센트 저하가 단수에 따라 1단 임펠러에게는 훨씬 큰 손실이 되는 관계" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>같은 3%, 다른 상태</title>

  <defs>
    <marker id="msAx" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a1a"/>
    </marker>
    <marker id="msDim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6673"/>
    </marker>
  </defs>

  <g font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif">

    <!-- ============ ① 단수별 비교 ============ -->
    <rect x="20" y="30" width="420" height="330" rx="8" fill="#fafbfc" stroke="#dfe4e8"/>
    <text x="40" y="58" font-size="14" font-weight="700" fill="#2c3e50">① 같은 3%인데 1단에게는 다르다</text>
    <text x="40" y="76" font-size="10.5" fill="#1f2933">붉은 띠는 세 경우 모두 전체 양정의 3%로 같은 크기다</text>

    <path d="M 58 130 L 58 310" stroke="#5b6673" stroke-width="1.6" marker-start="url(#msDim)" marker-end="url(#msDim)"/>
    <text x="36" y="224" font-size="10.5" fill="#1a1a1a" transform="rotate(-90 36 224)" text-anchor="middle">전체 양정</text>

    <!-- 단단 -->
    <rect x="78" y="130" width="64" height="180" fill="#7f95a6" stroke="#3f4b58" stroke-width="1.4"/>
    <rect x="78" y="130" width="64" height="5.4" fill="#c0392b"/>
    <text x="110" y="300" font-size="10.5" font-weight="700" fill="#ffffff" text-anchor="middle">1단</text>
    <text x="110" y="330" font-size="12" font-weight="700" fill="#2c3e50" text-anchor="middle">단단</text>
    <text x="110" y="350" font-size="13" font-weight="700" fill="#2f6b3a" text-anchor="middle">3%</text>

    <!-- 4단 -->
    <rect x="198" y="130" width="64" height="180" fill="#7f95a6" stroke="#3f4b58" stroke-width="1.4"/>
    <line x1="198" y1="175" x2="262" y2="175" stroke="#3f4b58" stroke-width="1.4"/>
    <line x1="198" y1="220" x2="262" y2="220" stroke="#3f4b58" stroke-width="1.4"/>
    <line x1="198" y1="265" x2="262" y2="265" stroke="#3f4b58" stroke-width="1.4"/>
    <rect x="198" y="259.6" width="64" height="5.4" fill="#c0392b"/>
    <text x="230" y="292" font-size="10.5" font-weight="700" fill="#ffffff" text-anchor="middle">1단</text>
    <text x="230" y="330" font-size="12" font-weight="700" fill="#2c3e50" text-anchor="middle">4단</text>
    <text x="230" y="350" font-size="13" font-weight="700" fill="#c1500a" text-anchor="middle">12%</text>

    <!-- 8단 -->
    <rect x="318" y="130" width="64" height="180" fill="#7f95a6" stroke="#3f4b58" stroke-width="1.4"/>
    <line x1="318" y1="152.5" x2="382" y2="152.5" stroke="#3f4b58" stroke-width="1.2"/>
    <line x1="318" y1="175" x2="382" y2="175" stroke="#3f4b58" stroke-width="1.2"/>
    <line x1="318" y1="197.5" x2="382" y2="197.5" stroke="#3f4b58" stroke-width="1.2"/>
    <line x1="318" y1="220" x2="382" y2="220" stroke="#3f4b58" stroke-width="1.2"/>
    <line x1="318" y1="242.5" x2="382" y2="242.5" stroke="#3f4b58" stroke-width="1.2"/>
    <line x1="318" y1="265" x2="382" y2="265" stroke="#3f4b58" stroke-width="1.2"/>
    <line x1="318" y1="287.5" x2="382" y2="287.5" stroke="#3f4b58" stroke-width="1.2"/>
    <rect x="318" y="282.1" width="64" height="5.4" fill="#c0392b"/>
    <text x="350" y="303" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">1단</text>
    <text x="350" y="330" font-size="12" font-weight="700" fill="#2c3e50" text-anchor="middle">8단</text>
    <text x="350" y="350" font-size="13" font-weight="700" fill="#c0392b" text-anchor="middle">24%</text>

    <!-- ============ ② 브레이크다운 곡선 ============ -->
    <rect x="460" y="30" width="420" height="330" rx="8" fill="#fafbfc" stroke="#dfe4e8"/>
    <text x="480" y="58" font-size="14" font-weight="700" fill="#2c3e50">② 1단은 절벽 아래에 있다</text>
    <text x="480" y="76" font-size="10.5" fill="#1f2933">1단 양정 기준으로 본 브레이크다운 곡선</text>

    <line x1="500" y1="100" x2="500" y2="320" stroke="#1a1a1a" stroke-width="1.6"/>
    <path d="M 500 320 L 872 320" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#msAx)"/>
    <text x="486" y="205" font-size="10.5" fill="#1a1a1a" transform="rotate(-90 486 205)" text-anchor="middle">1단 양정</text>
    <text x="862" y="340" font-size="10.5" fill="#1a1a1a" text-anchor="end">NPSHa 증가 →</text>

    <line x1="500" y1="129" x2="868" y2="129" stroke="#8b98a4" stroke-width="1.4" stroke-dasharray="6 4"/>
    <text x="506" y="123" font-size="10" fill="#1a1a1a">정상 양정</text>

    <path d="M 860 129 C 790 129, 730 131, 700 136 C 678 141, 662 147, 655 152 C 640 161, 628 170, 620 176 C 608 192, 598 240, 592 320"
          fill="none" stroke="#2f3d4f" stroke-width="3"/>

    <line x1="500" y1="136" x2="700" y2="136" stroke="#2f6b3a" stroke-width="1.2" stroke-dasharray="4 3"/>
    <line x1="700" y1="136" x2="700" y2="320" stroke="#2f6b3a" stroke-width="1.2" stroke-dasharray="4 3"/>
    <circle cx="700" cy="136" r="6" fill="#2f6b3a"/>
    <text x="494" y="140" font-size="11" font-weight="700" fill="#2f6b3a" text-anchor="end">3%</text>
    <text x="700" y="340" font-size="11" font-weight="700" fill="#2f6b3a" text-anchor="middle">단단</text>

    <line x1="500" y1="152" x2="655" y2="152" stroke="#c1500a" stroke-width="1.2" stroke-dasharray="4 3"/>
    <line x1="655" y1="152" x2="655" y2="320" stroke="#c1500a" stroke-width="1.2" stroke-dasharray="4 3"/>
    <circle cx="655" cy="152" r="6" fill="#c1500a"/>
    <text x="494" y="156" font-size="11" font-weight="700" fill="#c1500a" text-anchor="end">12%</text>
    <text x="655" y="340" font-size="11" font-weight="700" fill="#c1500a" text-anchor="middle">4단</text>

    <line x1="500" y1="176" x2="620" y2="176" stroke="#c0392b" stroke-width="1.2" stroke-dasharray="4 3"/>
    <line x1="620" y1="176" x2="620" y2="320" stroke="#c0392b" stroke-width="1.2" stroke-dasharray="4 3"/>
    <circle cx="620" cy="176" r="6.5" fill="#c0392b"/>
    <text x="494" y="180" font-size="11" font-weight="700" fill="#c0392b" text-anchor="end">24%</text>
    <text x="620" y="356" font-size="11" font-weight="700" fill="#c0392b" text-anchor="middle">8단</text>

    <text x="700" y="206" font-size="11.5" font-weight="700" fill="#a03228">단수가 많을수록</text>
    <text x="700" y="224" font-size="11.5" font-weight="700" fill="#a03228">보고되는 NPSHr은 작아지고</text>
    <text x="700" y="242" font-size="11.5" font-weight="700" fill="#a03228">1단은 더 깊이 내려간다</text>

    <!-- 캡션 -->
    <text x="20" y="400" font-size="13" fill="#1a1a1a">
      붉은 띠는 세 경우 모두 같은 크기다. 전체 양정의 3%라는 같은 양이지만, 1단 하나가 감당하는 몫으로 보면 전혀 다르다.
    </text>
    <text x="20" y="422" font-size="13" fill="#1a1a1a">
      오른쪽 곡선에서 세 점의 가로 위치를 보라. 단수가 많을수록 데이터 시트의 NPSHr은 작게 나오지만, 그 지점의 1단은 절벽을 한참 내려간 상태다.
    </text>
    <text x="20" y="444" font-size="13" fill="#1a1a1a">
      계기판의 토출 압력이 정상으로 보이는 이유는 간단하다. 나머지 단들이 1단의 손실을 대신 메우고 있기 때문이다.
    </text>
  </g>
</svg>
