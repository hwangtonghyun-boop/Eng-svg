<svg viewBox="0 0 900 455" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="같은 질량의 공기가 온도에 따라 다른 체적을 차지하는 관계와 Nm3, Sm3, 실제 체적 표기의 차이" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Nm³와 Sm³는 사실상 질량 표기다</title>

  <defs>
    <marker id="volDim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6673"/>
    </marker>
  </defs>

  <g font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif">

    <text x="20" y="48" font-size="17" font-weight="700" fill="#2c3e50">같은 질량의 공기, 다른 체적</text>
    <text x="20" y="70" font-size="12.5" fill="#1f2933">점의 개수는 세 경우 모두 같다. 담기는 그릇의 크기만 달라진다</text>

    <text x="450" y="100" font-size="12.5" font-weight="700" fill="#1d5a92" text-anchor="middle">— 질량 동일 —</text>

    <!-- 0도 -->
    <rect x="120" y="140" width="140" height="180" fill="#eaf3f8" stroke="#1d5a92" stroke-width="2"/>
    <g fill="#1d5a92">
      <circle cx="148" cy="170" r="4"/><circle cx="176" cy="170" r="4"/><circle cx="204" cy="170" r="4"/><circle cx="232" cy="170" r="4"/>
      <circle cx="148" cy="200" r="4"/><circle cx="176" cy="200" r="4"/><circle cx="204" cy="200" r="4"/><circle cx="232" cy="200" r="4"/>
      <circle cx="148" cy="230" r="4"/><circle cx="176" cy="230" r="4"/><circle cx="204" cy="230" r="4"/><circle cx="232" cy="230" r="4"/>
      <circle cx="148" cy="260" r="4"/><circle cx="176" cy="260" r="4"/><circle cx="204" cy="260" r="4"/><circle cx="232" cy="260" r="4"/>
      <circle cx="148" cy="290" r="4"/><circle cx="176" cy="290" r="4"/><circle cx="204" cy="290" r="4"/><circle cx="232" cy="290" r="4"/>
    </g>
    <path d="M 275 140 L 275 320" stroke="#5b6673" stroke-width="1.8" marker-start="url(#volDim)" marker-end="url(#volDim)"/>
    <text x="284" y="234" font-size="12" font-weight="700" fill="#1a1a1a">100%</text>

    <text x="190" y="344" font-size="12.5" font-weight="700" fill="#2c3e50" text-anchor="middle">기준상태 (Normal)</text>
    <text x="190" y="362" font-size="11" fill="#1a1a1a" text-anchor="middle">0°C · 1 atm · ρ ≈ 1.293</text>
    <text x="190" y="382" font-size="12" font-weight="700" fill="#1d5a92" text-anchor="middle">Nm³ 로 표기</text>

    <!-- 20도 -->
    <rect x="380" y="127" width="140" height="193" fill="#eaf3f8" stroke="#1d5a92" stroke-width="2"/>
    <g fill="#1d5a92">
      <circle cx="408" cy="159" r="4"/><circle cx="436" cy="159" r="4"/><circle cx="464" cy="159" r="4"/><circle cx="492" cy="159" r="4"/>
      <circle cx="408" cy="191" r="4"/><circle cx="436" cy="191" r="4"/><circle cx="464" cy="191" r="4"/><circle cx="492" cy="191" r="4"/>
      <circle cx="408" cy="224" r="4"/><circle cx="436" cy="224" r="4"/><circle cx="464" cy="224" r="4"/><circle cx="492" cy="224" r="4"/>
      <circle cx="408" cy="256" r="4"/><circle cx="436" cy="256" r="4"/><circle cx="464" cy="256" r="4"/><circle cx="492" cy="256" r="4"/>
      <circle cx="408" cy="288" r="4"/><circle cx="436" cy="288" r="4"/><circle cx="464" cy="288" r="4"/><circle cx="492" cy="288" r="4"/>
    </g>
    <path d="M 535 127 L 535 320" stroke="#5b6673" stroke-width="1.8" marker-start="url(#volDim)" marker-end="url(#volDim)"/>
    <text x="544" y="228" font-size="12" font-weight="700" fill="#1a1a1a">107%</text>

    <text x="450" y="344" font-size="12.5" font-weight="700" fill="#2c3e50" text-anchor="middle">표준상태 (Standard)</text>
    <text x="450" y="362" font-size="11" fill="#1a1a1a" text-anchor="middle">20°C 계열 · 1 atm · ρ ≈ 1.205</text>
    <text x="450" y="382" font-size="12" font-weight="700" fill="#1d5a92" text-anchor="middle">Sm³ 로 표기</text>

    <!-- 40도 -->
    <rect x="640" y="114" width="140" height="206" fill="#fdf3e0" stroke="#c1500a" stroke-width="2"/>
    <g fill="#c1500a">
      <circle cx="668" cy="148" r="4"/><circle cx="696" cy="148" r="4"/><circle cx="724" cy="148" r="4"/><circle cx="752" cy="148" r="4"/>
      <circle cx="668" cy="183" r="4"/><circle cx="696" cy="183" r="4"/><circle cx="724" cy="183" r="4"/><circle cx="752" cy="183" r="4"/>
      <circle cx="668" cy="217" r="4"/><circle cx="696" cy="217" r="4"/><circle cx="724" cy="217" r="4"/><circle cx="752" cy="217" r="4"/>
      <circle cx="668" cy="251" r="4"/><circle cx="696" cy="251" r="4"/><circle cx="724" cy="251" r="4"/><circle cx="752" cy="251" r="4"/>
      <circle cx="668" cy="286" r="4"/><circle cx="696" cy="286" r="4"/><circle cx="724" cy="286" r="4"/><circle cx="752" cy="286" r="4"/>
    </g>
    <path d="M 795 114 L 795 320" stroke="#5b6673" stroke-width="1.8" marker-start="url(#volDim)" marker-end="url(#volDim)"/>
    <text x="804" y="221" font-size="12" font-weight="700" fill="#a03228">115%</text>

    <text x="710" y="344" font-size="12.5" font-weight="700" fill="#2c3e50" text-anchor="middle">현장 상태 (Actual)</text>
    <text x="710" y="362" font-size="11" fill="#1a1a1a" text-anchor="middle">40°C · 1 atm · ρ ≈ 1.127</text>
    <text x="710" y="382" font-size="12" font-weight="700" fill="#c1500a" text-anchor="middle">접두어 없는 m³</text>

    <line x1="120" y1="320" x2="800" y2="320" stroke="#1a1a1a" stroke-width="1.6"/>

    <!-- 캡션 -->
    <text x="20" y="414" font-size="13" fill="#1a1a1a">
      Nm³와 Sm³는 조건을 고정한 표기이므로 사실상 질량을 나타낸다. 접두어가 없는 m³는 그 자리의 실제 체적이다.
    </text>
    <text x="20" y="436" font-size="13" fill="#1a1a1a">
      같은 Nm³/min을 보내려면 뜨거운 공기일수록 더 큰 실제 체적이 필요하다. 접두어를 놓치면 용량 선정이 통째로 어긋난다.
    </text>
  </g>
</svg>
