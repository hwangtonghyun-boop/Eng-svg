<svg viewBox="0 0 900 640" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="강제 윤활 스키드 계통도 - 탱크, 이중 펌프, 이중 쿨러, 이중 필터, 어큐뮬레이터, 런다운 탱크, 베어링, 중력 드레인" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>강제 윤활 스키드 계통</title>

  <defs>
    <marker id="flowNavy" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2f3d4f"/>
    </marker>
    <marker id="flowGray" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6673"/>
    </marker>
    <marker id="flowAmber" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a8762a"/>
    </marker>
  </defs>

  <g font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif">

    <text x="20" y="44" font-size="18" font-weight="700" fill="#2c3e50">강제 윤활 스키드 계통</text>
    <text x="20" y="68" font-size="13" fill="#1f2933">주요 기기가 모두 이중화되어 있고, 드레인만 유일하게 중력으로 흐른다</text>

    <!-- ===== 배관: 흡입 ===== -->
    <path d="M 115 400 L 115 230 L 196 230" fill="none" stroke="#5b6673" stroke-width="3"/>
    <path d="M 115 340 L 115 320" stroke="#5b6673" stroke-width="3" marker-end="url(#flowGray)"/>

    <!-- ===== 배관: 가압 공급 ===== -->
    <path d="M 196 230 L 196 200 L 206 200" fill="none" stroke="#2f3d4f" stroke-width="3"/>
    <path d="M 196 230 L 196 260 L 206 260" fill="none" stroke="#2f3d4f" stroke-width="3"/>
    <path d="M 254 200 L 285 200 L 285 260 L 254 260" fill="none" stroke="#2f3d4f" stroke-width="3"/>
    <path d="M 285 230 L 310 230" fill="none" stroke="#2f3d4f" stroke-width="3"/>
    <path d="M 310 200 L 310 260" fill="none" stroke="#2f3d4f" stroke-width="3"/>
    <path d="M 310 200 L 320 200" fill="none" stroke="#2f3d4f" stroke-width="3"/>
    <path d="M 310 260 L 320 260" fill="none" stroke="#2f3d4f" stroke-width="3"/>
    <path d="M 400 200 L 412 200 L 412 260 L 400 260" fill="none" stroke="#2f3d4f" stroke-width="3"/>
    <path d="M 412 230 L 440 230" fill="none" stroke="#2f3d4f" stroke-width="3"/>
    <path d="M 440 200 L 440 260" fill="none" stroke="#2f3d4f" stroke-width="3"/>
    <path d="M 440 200 L 450 200" fill="none" stroke="#2f3d4f" stroke-width="3"/>
    <path d="M 440 260 L 450 260" fill="none" stroke="#2f3d4f" stroke-width="3"/>
    <path d="M 530 200 L 542 200 L 542 260 L 530 260" fill="none" stroke="#2f3d4f" stroke-width="3"/>
    <path d="M 542 230 L 760 230" fill="none" stroke="#2f3d4f" stroke-width="3"/>
    <path d="M 570 230 L 592 230" stroke="#2f3d4f" stroke-width="3" marker-end="url(#flowNavy)"/>
    <path d="M 620 160 L 620 230" fill="none" stroke="#2f3d4f" stroke-width="3"/>
    <path d="M 720 140 L 720 230" fill="none" stroke="#2f3d4f" stroke-width="3"/>
    <path d="M 760 230 L 760 330" fill="none" stroke="#2f3d4f" stroke-width="3"/>
    <path d="M 760 280 L 760 302" stroke="#2f3d4f" stroke-width="3" marker-end="url(#flowNavy)"/>

    <!-- ===== 배관: 중력 드레인 ===== -->
    <path d="M 700 390 L 700 455 L 175 485" fill="none" stroke="#a8762a" stroke-width="3"/>
    <path d="M 470 472 L 448 473" stroke="#a8762a" stroke-width="3" marker-end="url(#flowAmber)"/>

    <!-- ===== 오일 탱크 ===== -->
    <rect x="55" y="400" width="120" height="100" rx="4" fill="#eef2f5" stroke="#44546a" stroke-width="2.2"/>
    <rect x="57" y="427" width="116" height="71" fill="#e6d3a3"/>
    <line x1="57" y1="427" x2="173" y2="427" stroke="#a8905a" stroke-width="1.6"/>
    <text x="115" y="470" font-size="13" font-weight="700" fill="#3d3517" text-anchor="middle">오일 탱크</text>

    <!-- ===== 오일 펌프 ===== -->
    <circle cx="230" cy="200" r="24" fill="#eef2f5" stroke="#44546a" stroke-width="2.2"/>
    <text x="230" y="205" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="middle">P-A</text>
    <circle cx="230" cy="260" r="24" fill="#eef2f5" stroke="#44546a" stroke-width="2.2"/>
    <text x="230" y="265" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="middle">P-B</text>
    <text x="230" y="168" font-size="11" fill="#1a1a1a" text-anchor="middle">운전</text>
    <text x="230" y="300" font-size="11" fill="#1a1a1a" text-anchor="middle">예비</text>
    <text x="230" y="324" font-size="12.5" font-weight="700" fill="#2c3e50" text-anchor="middle">오일 펌프</text>

    <!-- ===== 쿨러 ===== -->
    <rect x="320" y="178" width="80" height="44" rx="3" fill="#eef2f5" stroke="#44546a" stroke-width="2.2"/>
    <text x="360" y="205" font-size="12" fill="#1a1a1a" text-anchor="middle">쿨러 A</text>
    <rect x="320" y="238" width="80" height="44" rx="3" fill="#eef2f5" stroke="#44546a" stroke-width="2.2"/>
    <text x="360" y="265" font-size="12" fill="#1a1a1a" text-anchor="middle">쿨러 B</text>
    <text x="360" y="324" font-size="12.5" font-weight="700" fill="#2c3e50" text-anchor="middle">이중 쿨러</text>
    <text x="360" y="342" font-size="11" fill="#1a1a1a" text-anchor="middle">점도 유지</text>

    <!-- ===== 필터 ===== -->
    <rect x="450" y="178" width="80" height="44" rx="3" fill="#eef2f5" stroke="#44546a" stroke-width="2.2"/>
    <text x="490" y="205" font-size="12" fill="#1a1a1a" text-anchor="middle">필터 A</text>
    <rect x="450" y="238" width="80" height="44" rx="3" fill="#eef2f5" stroke="#44546a" stroke-width="2.2"/>
    <text x="490" y="265" font-size="12" fill="#1a1a1a" text-anchor="middle">필터 B</text>
    <text x="490" y="324" font-size="12.5" font-weight="700" fill="#2c3e50" text-anchor="middle">이중 필터</text>
    <text x="490" y="342" font-size="11" fill="#1a1a1a" text-anchor="middle">차압 감시</text>

    <!-- ===== 어큐뮬레이터 ===== -->
    <rect x="600" y="100" width="40" height="60" rx="18" fill="#eef2f5" stroke="#44546a" stroke-width="2.2"/>
    <line x1="601" y1="128" x2="639" y2="128" stroke="#44546a" stroke-width="1.6"/>
    <text x="620" y="120" font-size="11" font-weight="700" fill="#1a1a1a" text-anchor="middle">N₂</text>
    <text x="620" y="88" font-size="12" font-weight="700" fill="#2c3e50" text-anchor="middle">어큐뮬레이터</text>

    <!-- ===== 런다운 탱크 ===== -->
    <rect x="700" y="80" width="100" height="60" rx="4" fill="#eef2f5" stroke="#44546a" stroke-width="2.2"/>
    <rect x="702" y="100" width="96" height="38" fill="#e6d3a3"/>
    <text x="750" y="125" font-size="12" font-weight="700" fill="#3d3517" text-anchor="middle">런다운 탱크</text>

    <!-- ===== 베어링 ===== -->
    <rect x="690" y="330" width="115" height="60" rx="4" fill="#dfe6eb" stroke="#44546a" stroke-width="2.4"/>
    <text x="747" y="358" font-size="13" font-weight="700" fill="#1a1a1a" text-anchor="middle">베어링</text>
    <text x="747" y="376" font-size="10.5" fill="#1a1a1a" text-anchor="middle">슬리브 · 틸팅 패드</text>

    <!-- ===== 번호 뱃지 ===== -->
    <circle cx="272" cy="170" r="11" fill="#c0392b"/>
    <text x="272" y="175" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
    <circle cx="583" cy="120" r="11" fill="#c0392b"/>
    <text x="583" y="125" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
    <circle cx="684" cy="95" r="11" fill="#c0392b"/>
    <text x="684" y="100" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>

    <!-- ===== 드레인 주석 ===== -->
    <text x="230" y="428" font-size="12.5" font-weight="700" fill="#7a5a24">중력 드레인 — 구배 유지, 트랩 금지</text>
    <text x="230" y="446" font-size="11.5" fill="#1a1a1a">관을 가득 채우지 않고 흘러야 공기가 빠진다</text>

    <!-- ===== 범례 ===== -->
    <rect x="470" y="505" width="410" height="110" rx="8" fill="#fdf9f8" stroke="#e8d9d6"/>
    <text x="490" y="530" font-size="13.5" font-weight="700" fill="#2c3e50">비상 시 대응은 시간 계층을 이룬다</text>

    <circle cx="497" cy="552" r="10" fill="#c0392b"/>
    <text x="497" y="557" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
    <text x="516" y="557" font-size="12" fill="#1a1a1a">어큐뮬레이터 — 압력이 떨어진 직후 수 초를 메운다</text>

    <circle cx="497" cy="578" r="10" fill="#c0392b"/>
    <text x="497" y="583" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
    <text x="516" y="583" font-size="12" fill="#1a1a1a">예비 펌프 — 자동 기동해 정상 압력을 회복한다</text>

    <circle cx="497" cy="604" r="10" fill="#c0392b"/>
    <text x="497" y="609" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
    <text x="516" y="609" font-size="12" fill="#1a1a1a">런다운 탱크 — 정전 시 코스팅 다운까지 버틴다</text>

    <!-- ===== 배관 범례 ===== -->
    <line x1="30" y1="540" x2="66" y2="540" stroke="#5b6673" stroke-width="3"/>
    <text x="74" y="545" font-size="12" fill="#1a1a1a">흡입</text>
    <line x1="30" y1="568" x2="66" y2="568" stroke="#2f3d4f" stroke-width="3"/>
    <text x="74" y="573" font-size="12" fill="#1a1a1a">가압 공급</text>
    <line x1="30" y1="596" x2="66" y2="596" stroke="#a8762a" stroke-width="3"/>
    <text x="74" y="601" font-size="12" fill="#1a1a1a">중력 드레인</text>

  </g>
</svg>
