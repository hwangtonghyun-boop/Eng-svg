<svg viewBox="0 0 900 710" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="API 682 Plan 11, 23, 32, 53의 배관 흐름 비교" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>플러싱 플랜 네 가지의 배관 흐름</title>

  <defs>
    <marker id="fNavy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2f3d4f"/>
    </marker>
    <marker id="fGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2f6b3a"/>
    </marker>
  </defs>

  <g font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif">

    <!-- ============ Plan 11 ============ -->
    <rect x="20" y="30" width="420" height="300" rx="8" fill="#fafbfc" stroke="#dfe4e8"/>
    <text x="40" y="60" font-size="15" font-weight="700" fill="#2c3e50">Plan 11</text>
    <text x="40" y="78" font-size="11" fill="#1f2933">자체 공정 유체 · 싱글 씰</text>

    <path d="M 95 155 L 95 105 L 205 105 L 205 178" fill="none" stroke="#2f3d4f" stroke-width="2.6" marker-end="url(#fNavy)"/>
    <polygon points="145,98 150,105 145,112" fill="#44546a"/>
    <polygon points="155,98 150,105 155,112" fill="#44546a"/>
    <text x="150" y="94" font-size="10.5" fill="#1a1a1a" text-anchor="middle">오리피스</text>
    <text x="108" y="132" font-size="10.5" fill="#1a1a1a">토출부에서 인출</text>

    <rect x="45" y="155" width="100" height="90" fill="#c8d2da" stroke="#44546a" stroke-width="1.6"/>
    <rect x="145" y="182" width="125" height="63" fill="#dce8f2" stroke="#44546a" stroke-width="1.6"/>
    <rect x="141" y="182" width="8" height="63" fill="#c1500a"/>
    <line x1="250" y1="182" x2="250" y2="245" stroke="#c0392b" stroke-width="4"/>
    <rect x="45" y="245" width="370" height="17" fill="#44546a"/>

    <text x="95" y="238" font-size="10.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">펌프 내부</text>
    <text x="192" y="238" font-size="10.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">씰 챔버</text>

    <text x="40" y="295" font-size="11" fill="#1a1a1a">토출 유체를 오리피스로 감압해 공급</text>
    <text x="40" y="313" font-size="11" font-weight="700" fill="#a03228">고형물과 고온에 취약</text>

    <!-- ============ Plan 23 ============ -->
    <rect x="460" y="30" width="420" height="300" rx="8" fill="#fafbfc" stroke="#dfe4e8"/>
    <text x="480" y="60" font-size="15" font-weight="700" fill="#2c3e50">Plan 23</text>
    <text x="480" y="78" font-size="11" fill="#1f2933">폐루프 순환 냉각 · 싱글 씰</text>

    <path d="M 600 182 L 600 100 L 696 100" fill="none" stroke="#2f3d4f" stroke-width="2.6" marker-end="url(#fNavy)"/>
    <rect x="700" y="84" width="74" height="32" rx="3" fill="#eef2f5" stroke="#44546a" stroke-width="1.6"/>
    <text x="737" y="104" font-size="11" font-weight="700" fill="#1a1a1a" text-anchor="middle">쿨러</text>
    <path d="M 774 100 L 810 100 L 810 145 L 670 145 L 670 178" fill="none" stroke="#2f3d4f" stroke-width="2.6" marker-end="url(#fNavy)"/>

    <text x="540" y="142" font-size="10.5" font-weight="700" fill="#8a3a08">스로트 부싱</text>
    <line x1="555" y1="148" x2="581" y2="178" stroke="#8a3a08" stroke-width="1.2"/>

    <rect x="485" y="155" width="100" height="90" fill="#c8d2da" stroke="#44546a" stroke-width="1.6"/>
    <rect x="585" y="182" width="125" height="63" fill="#dce8f2" stroke="#44546a" stroke-width="1.6"/>
    <rect x="581" y="182" width="8" height="63" fill="#c1500a"/>
    <rect x="625" y="232" width="17" height="13" fill="#b8862b"/>
    <line x1="690" y1="182" x2="690" y2="245" stroke="#c0392b" stroke-width="4"/>
    <rect x="485" y="245" width="370" height="17" fill="#44546a"/>

    <text x="535" y="238" font-size="10.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">펌프 내부</text>
    <text x="633" y="212" font-size="10" fill="#1a1a1a" text-anchor="middle">펌핑 링</text>

    <text x="480" y="295" font-size="11" fill="#1a1a1a">챔버 안의 유체만 폐루프로 순환·냉각</text>
    <text x="480" y="313" font-size="11" font-weight="700" fill="#a03228">부싱 간극이 벌어지면 효과가 준다</text>

    <!-- ============ Plan 32 ============ -->
    <rect x="20" y="345" width="420" height="300" rx="8" fill="#fafbfc" stroke="#dfe4e8"/>
    <text x="40" y="375" font-size="15" font-weight="700" fill="#2c3e50">Plan 32</text>
    <text x="40" y="393" font-size="11" fill="#1f2933">외부 청정 유체 · 싱글 씰</text>

    <rect x="310" y="412" width="90" height="36" rx="3" fill="#e8f2e6" stroke="#44546a" stroke-width="1.6"/>
    <text x="355" y="435" font-size="10" font-weight="700" fill="#1e3a19" text-anchor="middle">외부 청정 유체</text>
    <path d="M 310 430 L 200 430 L 200 498" fill="none" stroke="#2f6b3a" stroke-width="2.6" marker-end="url(#fGreen)"/>
    <polygon points="262,430 255,423 248,430 255,437" fill="#2f6b3a"/>
    <text x="255" y="416" font-size="10" fill="#1a1a1a" text-anchor="middle">스트레이너</text>

    <rect x="45" y="470" width="100" height="90" fill="#c8d2da" stroke="#44546a" stroke-width="1.6"/>
    <rect x="145" y="502" width="125" height="58" fill="#e8f2e6" stroke="#44546a" stroke-width="1.6"/>
    <rect x="141" y="502" width="8" height="58" fill="#c1500a"/>
    <line x1="250" y1="502" x2="250" y2="560" stroke="#c0392b" stroke-width="4"/>
    <path d="M 192 540 L 115 540" fill="none" stroke="#2f6b3a" stroke-width="2.6" marker-end="url(#fGreen)"/>
    <rect x="45" y="560" width="370" height="17" fill="#44546a"/>

    <text x="95" y="493" font-size="10.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">펌프 내부</text>
    <text x="192" y="522" font-size="10.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">씰 챔버</text>

    <text x="40" y="610" font-size="11" fill="#1a1a1a">외부 유체가 챔버를 채우고 펌프로 흘러든다</text>
    <text x="40" y="628" font-size="11" font-weight="700" fill="#a03228">공급이 끊기면 씰이 곧바로 위험</text>

    <!-- ============ Plan 53 ============ -->
    <rect x="460" y="345" width="420" height="300" rx="8" fill="#fafbfc" stroke="#dfe4e8"/>
    <text x="480" y="375" font-size="15" font-weight="700" fill="#2c3e50">Plan 53</text>
    <text x="480" y="393" font-size="11" fill="#1f2933">가압 배리어 · 이중 씰</text>

    <rect x="780" y="410" width="70" height="75" rx="3" fill="#eef2f5" stroke="#44546a" stroke-width="1.6"/>
    <rect x="782" y="442" width="66" height="41" fill="#e6d3a3"/>
    <text x="815" y="432" font-size="11" font-weight="700" fill="#1a1a1a" text-anchor="middle">N₂</text>
    <path d="M 815 386 L 815 406" stroke="#2f3d4f" stroke-width="2.4" marker-end="url(#fNavy)"/>
    <text x="836" y="396" font-size="10" fill="#1a1a1a">가압</text>
    <text x="815" y="500" font-size="10.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">씰 팟</text>

    <path d="M 660 502 L 660 455 L 776 455" fill="none" stroke="#2f6b3a" stroke-width="2.4" marker-end="url(#fGreen)"/>
    <path d="M 776 472 L 695 472 L 695 498" fill="none" stroke="#2f6b3a" stroke-width="2.4" marker-end="url(#fGreen)"/>

    <rect x="485" y="470" width="100" height="90" fill="#c8d2da" stroke="#44546a" stroke-width="1.6"/>
    <rect x="585" y="502" width="145" height="58" fill="#dce8f2" stroke="#44546a" stroke-width="1.6"/>
    <rect x="650" y="502" width="50" height="58" fill="#d8ecd6"/>
    <rect x="581" y="502" width="8" height="58" fill="#c1500a"/>
    <line x1="650" y1="502" x2="650" y2="560" stroke="#c0392b" stroke-width="4"/>
    <line x1="700" y1="502" x2="700" y2="560" stroke="#c0392b" stroke-width="4"/>
    <rect x="485" y="560" width="370" height="17" fill="#44546a"/>

    <text x="535" y="493" font-size="10.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">펌프 내부</text>
    <text x="617" y="536" font-size="10.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">씰 챔버</text>

    <text x="480" y="610" font-size="11" fill="#1a1a1a">배리어를 공정 압력보다 높게 가압한다</text>
    <text x="480" y="628" font-size="11" font-weight="700" fill="#2f6b3a">가압 방식에 따라 53A · 53B · 53C</text>

    <!-- 범례 -->
    <line x1="30" y1="663" x2="58" y2="663" stroke="#c0392b" stroke-width="4"/>
    <text x="66" y="668" font-size="11" fill="#1a1a1a">씰 페이스</text>

    <rect x="160" y="656" width="14" height="14" fill="#c1500a"/>
    <text x="182" y="668" font-size="11" fill="#1a1a1a">스로트 부싱</text>

    <rect x="300" y="656" width="14" height="14" fill="#d8ecd6" stroke="#a8c9a2"/>
    <text x="322" y="668" font-size="11" fill="#1a1a1a">배리어 유체</text>

    <text x="30" y="695" font-size="13" fill="#1a1a1a">
      네 플랜의 차이는 하나다. 씰 페이스의 유막을 만들 유체를 어디서 가져오는가.
    </text>
  </g>
</svg>
