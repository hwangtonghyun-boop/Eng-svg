<svg viewBox="0 0 900 330" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="평행 편차, 각도 편차, 축방향 변위 세 가지 축 오정렬 유형" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>커플링이 감당하는 세 가지 변위</title>

  <defs>
    <marker id="dimA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c0392b"/>
    </marker>
  </defs>

  <g font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif">

    <!-- ============ ① 평행 편차 ============ -->
    <rect x="20" y="30" width="280" height="230" rx="8" fill="#fafbfc" stroke="#dfe4e8"/>
    <text x="38" y="58" font-size="14" font-weight="700" fill="#2c3e50">① 평행 편차</text>
    <text x="38" y="76" font-size="10.5" fill="#1f2933">Parallel Offset</text>

    <rect x="42" y="122" width="98" height="20" fill="#44546a"/>
    <rect x="180" y="158" width="98" height="20" fill="#44546a"/>
    <line x1="42" y1="132" x2="150" y2="132" stroke="#8b98a4" stroke-width="1.2" stroke-dasharray="12 4 3 4"/>
    <line x1="170" y1="168" x2="278" y2="168" stroke="#8b98a4" stroke-width="1.2" stroke-dasharray="12 4 3 4"/>
    <line x1="140" y1="132" x2="180" y2="132" stroke="#8b98a4" stroke-width="1.2" stroke-dasharray="4 3"/>

    <path d="M 160 132 L 160 168" stroke="#c0392b" stroke-width="2" marker-start="url(#dimA)" marker-end="url(#dimA)"/>
    <text x="170" y="154" font-size="12" font-weight="700" fill="#a03228">Δy</text>

    <text x="38" y="212" font-size="11" fill="#1a1a1a">두 축이 나란한 채로 어긋난다</text>
    <text x="38" y="232" font-size="11" font-weight="700" fill="#1a1a1a">디스크 팩 하나로는 흡수 못 한다</text>

    <!-- ============ ② 각도 편차 ============ -->
    <rect x="310" y="30" width="280" height="230" rx="8" fill="#fafbfc" stroke="#dfe4e8"/>
    <text x="328" y="58" font-size="14" font-weight="700" fill="#2c3e50">② 각도 편차</text>
    <text x="328" y="76" font-size="10.5" fill="#1f2933">Angular</text>

    <rect x="332" y="140" width="98" height="20" fill="#44546a"/>
    <line x1="332" y1="150" x2="450" y2="150" stroke="#8b98a4" stroke-width="1.2" stroke-dasharray="12 4 3 4"/>

    <g transform="rotate(14 450 150)">
      <rect x="470" y="140" width="98" height="20" fill="#44546a"/>
      <line x1="450" y1="150" x2="568" y2="150" stroke="#8b98a4" stroke-width="1.2" stroke-dasharray="12 4 3 4"/>
    </g>

    <path d="M 502 150 A 52 52 0 0 1 500.5 163" fill="none" stroke="#c0392b" stroke-width="2"/>
    <text x="512" y="172" font-size="12" font-weight="700" fill="#a03228">θ</text>
    <circle cx="450" cy="150" r="3.5" fill="#c0392b"/>

    <text x="328" y="212" font-size="11" fill="#1a1a1a">두 축이 각을 이루며 만난다</text>
    <text x="328" y="232" font-size="11" font-weight="700" fill="#1a1a1a">디스크 팩이 직접 흡수하는 변위</text>

    <!-- ============ ③ 축방향 변위 ============ -->
    <rect x="600" y="30" width="280" height="230" rx="8" fill="#fafbfc" stroke="#dfe4e8"/>
    <text x="618" y="58" font-size="14" font-weight="700" fill="#2c3e50">③ 축방향 변위</text>
    <text x="618" y="76" font-size="10.5" fill="#1f2933">Axial</text>

    <rect x="622" y="140" width="92" height="20" fill="#44546a"/>
    <rect x="766" y="140" width="92" height="20" fill="#44546a"/>
    <line x1="622" y1="150" x2="858" y2="150" stroke="#8b98a4" stroke-width="1.2" stroke-dasharray="12 4 3 4"/>

    <path d="M 718 128 L 762 128" stroke="#c0392b" stroke-width="2" marker-start="url(#dimA)" marker-end="url(#dimA)"/>
    <text x="740" y="120" font-size="12" font-weight="700" fill="#a03228" text-anchor="middle">Δx</text>

    <text x="618" y="212" font-size="11" fill="#1a1a1a">열팽창으로 축이 앞뒤로 움직인다</text>
    <text x="618" y="232" font-size="11" font-weight="700" fill="#1a1a1a">디스크 팩이 휘며 받아낸다</text>

    <!-- 캡션 -->
    <text x="20" y="295" font-size="13" fill="#1a1a1a">
      현장의 정렬 불량은 대개 이 셋이 섞여 나타난다. 커플링이 흡수하지 못한 몫은 그대로 베어링과 씰로 넘어간다.
    </text>
  </g>
</svg>
