<svg viewBox="0 0 900 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="임펠러 트리밍이 출구 폭, 출구 각도, 날개 끝단 두께에 미치는 영향" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>트리밍이 바꾸는 세 가지</title>

  <defs>
    <marker id="tDim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c0392b"/>
    </marker>
    <marker id="tAx" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6673"/>
    </marker>
  </defs>

  <g font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif">

    <!-- ============ ① 출구 폭 ============ -->
    <rect x="20" y="30" width="280" height="310" rx="8" fill="#fafbfc" stroke="#dfe4e8"/>
    <text x="38" y="58" font-size="13.5" font-weight="700" fill="#2c3e50">① 출구 폭 b₂</text>
    <text x="38" y="76" font-size="10.5" fill="#1f2933">자오면 단면</text>

    <path d="M 70 250 L 70 112" stroke="#5b6673" stroke-width="1.6" marker-end="url(#tAx)"/>
    <text x="58" y="180" font-size="10" fill="#1a1a1a" transform="rotate(-90 58 180)" text-anchor="middle">반경</text>

    <line x1="130" y1="110" x2="240" y2="110" stroke="#5b6673" stroke-width="1.6"/>
    <text x="244" y="108" font-size="9.5" fill="#1a1a1a">원래 외경</text>

    <line x1="130" y1="185" x2="240" y2="185" stroke="#c0392b" stroke-width="1.8" stroke-dasharray="7 4"/>
    <text x="244" y="183" font-size="9.5" font-weight="700" fill="#a03228">트림 후</text>

    <line x1="147" y1="250" x2="185" y2="110" stroke="#44546a" stroke-width="3"/>
    <line x1="218" y1="250" x2="200" y2="110" stroke="#44546a" stroke-width="3"/>

    <line x1="185" y1="100" x2="200" y2="100" stroke="#5b6673" stroke-width="1.6"/>
    <line x1="185" y1="96" x2="185" y2="104" stroke="#5b6673" stroke-width="1.6"/>
    <line x1="200" y1="96" x2="200" y2="104" stroke="#5b6673" stroke-width="1.6"/>
    <text x="192" y="92" font-size="11" font-weight="700" fill="#1a1a1a" text-anchor="middle">b₂</text>

    <path d="M 164.6 185 L 209.6 185" stroke="#c0392b" stroke-width="2" marker-start="url(#tDim)" marker-end="url(#tDim)"/>
    <text x="187" y="203" font-size="12" font-weight="700" fill="#a03228" text-anchor="middle">b₂′</text>

    <line x1="40" y1="266" x2="280" y2="266" stroke="#8b98a4" stroke-width="1.2" stroke-dasharray="12 4 3 4"/>
    <text x="42" y="280" font-size="9" fill="#1a1a1a">축 중심</text>

    <text x="38" y="305" font-size="10.5" fill="#1a1a1a">슈라우드가 평행하지 않다</text>
    <text x="38" y="323" font-size="10.5" font-weight="700" fill="#a03228">안쪽에서 자르면 b₂가 넓어진다</text>

    <!-- ============ ② 출구 각도 ============ -->
    <rect x="310" y="30" width="280" height="310" rx="8" fill="#fafbfc" stroke="#dfe4e8"/>
    <text x="328" y="58" font-size="13.5" font-weight="700" fill="#2c3e50">② 출구 각도 β₂</text>
    <text x="328" y="76" font-size="10.5" fill="#1f2933">전개 단면</text>

    <path d="M 330 275 L 330 162" stroke="#5b6673" stroke-width="1.6" marker-end="url(#tAx)"/>
    <text x="320" y="220" font-size="10" fill="#1a1a1a" transform="rotate(-90 320 220)" text-anchor="middle">반경 증가</text>

    <line x1="344" y1="172" x2="570" y2="172" stroke="#5b6673" stroke-width="1.6"/>
    <text x="344" y="164" font-size="9.5" fill="#1a1a1a">원래 외경에서의 원주 방향</text>

    <line x1="344" y1="268" x2="570" y2="268" stroke="#c0392b" stroke-width="1.8" stroke-dasharray="7 4"/>
    <text x="344" y="288" font-size="9.5" font-weight="700" fill="#a03228">트림 후 위치에서의 원주 방향</text>

    <path d="M 370 268 C 410 232, 450 208, 535 172" fill="none" stroke="#44546a" stroke-width="4"/>
    <text x="470" y="228" font-size="10" font-weight="700" fill="#1a1a1a">날개</text>

    <path d="M 404 268 A 34 34 0 0 0 395.3 245.3" fill="none" stroke="#c0392b" stroke-width="2"/>
    <text x="412" y="252" font-size="12" font-weight="700" fill="#a03228">β₂′</text>

    <path d="M 569 172 A 34 34 0 0 0 566.3 158.7" fill="none" stroke="#1a1a1a" stroke-width="2"/>
    <text x="552" y="150" font-size="12" font-weight="700" fill="#1a1a1a">β₂</text>

    <text x="328" y="305" font-size="10.5" fill="#1a1a1a">날개 곡률이 반경에 따라 변한다</text>
    <text x="328" y="323" font-size="10.5" font-weight="700" fill="#a03228">잘린 위치의 각도는 설계값과 다르다</text>

    <!-- ============ ③ 끝단 두께 ============ -->
    <rect x="600" y="30" width="280" height="310" rx="8" fill="#fafbfc" stroke="#dfe4e8"/>
    <text x="618" y="58" font-size="13.5" font-weight="700" fill="#2c3e50">③ 끝단 두께</text>
    <text x="618" y="76" font-size="10.5" fill="#1f2933">날개 단면 · 언더파일링</text>

    <text x="618" y="96" font-size="10.5" font-weight="700" fill="#1a1a1a">원래 날개</text>
    <polygon points="630,103 820,116 820,120 630,133" fill="#c8d2da" stroke="#44546a" stroke-width="1.4"/>
    <text x="618" y="148" font-size="9.5" fill="#1a1a1a">팁으로 갈수록 얇아지도록 설계</text>

    <text x="618" y="168" font-size="10.5" font-weight="700" fill="#1a1a1a">트림 후</text>
    <polygon points="760,183.9 820,188 820,192 760,196.1" fill="none" stroke="#a8b4bd" stroke-width="1.2" stroke-dasharray="4 3"/>
    <polygon points="630,175 760,183.9 760,196.1 630,205" fill="#c8d2da" stroke="#44546a" stroke-width="1.4"/>
    <line x1="760" y1="183.9" x2="760" y2="196.1" stroke="#c0392b" stroke-width="3.4"/>
    <text x="618" y="220" font-size="9.5" fill="#1a1a1a">더 두꺼운 위치에서 잘린다</text>

    <text x="618" y="236" font-size="10.5" font-weight="700" fill="#1a1a1a">언더파일링 후</text>
    <line x1="630" y1="273" x2="760" y2="264.1" stroke="#a8b4bd" stroke-width="1.2" stroke-dasharray="4 3"/>
    <polygon points="630,243 760,251.9 760,256 690,266 630,273" fill="#d8ecd6" stroke="#2f6b3a" stroke-width="1.4"/>
    <line x1="760" y1="251.9" x2="760" y2="256" stroke="#2f6b3a" stroke-width="3.4"/>
    <text x="618" y="288" font-size="9.5" fill="#1a1a1a">뒤쪽을 갈아 두께를 회복한다</text>

    <text x="618" y="308" font-size="10.5" fill="#1a1a1a">잘린 끝단은 뭉툭해진다</text>
    <text x="618" y="326" font-size="10.5" font-weight="700" fill="#2f6b3a">언더파일링은 보정이지 완전 회복은 아니다</text>

    <!-- 캡션 -->
    <text x="20" y="375" font-size="13" fill="#1a1a1a">
      외경만 깎는 가공은 닮은꼴 축소가 아니다. 출구 폭, 출구 각도, 끝단 두께가 동시에 어긋나므로 상사 법칙 예측이 빗나간다.
    </text>
    <text x="20" y="397" font-size="13" fill="#1a1a1a">
      트림량이 클수록 세 가지 어긋남이 모두 커진다. 그래서 예측은 제작사의 트림 보정 곡선으로 해야 한다.
    </text>
  </g>
</svg>
