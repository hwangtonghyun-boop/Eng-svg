<svg viewBox="0 0 900 460" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="압력비가 커질수록 토출 온도가 가파르게 오르고 비열비에 따라 곡선이 달라지는 관계" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>압력비가 토출 온도를 정한다</title>

  <defs>
    <marker id="tdAx" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a1a"/>
    </marker>
    <marker id="tdLim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c0392b"/>
    </marker>
  </defs>

  <g font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif">

    <text x="20" y="48" font-size="17" font-weight="700" fill="#2c3e50">왜 한 번에 올릴 수 없는가</text>
    <text x="20" y="70" font-size="12.5" fill="#1f2933">압력비가 커질수록 토출 온도가 가파르게 오른다</text>

    <rect x="110" y="90" width="700" height="60" fill="#fbe9e7"/>

    <line x1="110" y1="90" x2="110" y2="330" stroke="#1a1a1a" stroke-width="1.6"/>
    <path d="M 110 330 L 830 330" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#tdAx)"/>
    <text x="90" y="215" font-size="12" fill="#1a1a1a" transform="rotate(-90 90 215)" text-anchor="middle">토출 온도</text>
    <text x="820" y="352" font-size="12" fill="#1a1a1a" text-anchor="end">압력비 p₂ / p₁</text>

    <line x1="110" y1="150" x2="815" y2="150" stroke="#c0392b" stroke-width="2.6" stroke-dasharray="9 5"/>
    <text x="124" y="143" font-size="11.5" font-weight="700" fill="#a03228">온도 한계 — 재질 · 가스 안정성 · 윤활</text>

    <path d="M 130 312 C 260 296, 380 262, 470 218 C 540 184, 600 150, 640 122 C 668 102, 686 94, 700 90"
          fill="none" stroke="#c0392b" stroke-width="3"/>
    <path d="M 130 316 C 280 304, 420 280, 530 248 C 610 224, 680 194, 740 164 C 775 146, 800 134, 815 128"
          fill="none" stroke="#c1500a" stroke-width="3"/>
    <path d="M 130 320 C 300 312, 460 296, 580 274 C 670 257, 750 236, 815 216"
          fill="none" stroke="#1d5a92" stroke-width="3"/>

    <text x="706" y="104" font-size="11" font-weight="700" fill="#a03228">비열비 큼</text>
    <text x="706" y="120" font-size="10" fill="#a03228">단원자 · 가벼운 가스</text>
    <text x="700" y="160" font-size="11" font-weight="700" fill="#8a3a08">중간</text>
    <text x="700" y="176" font-size="10" fill="#8a3a08">공기 · 질소</text>
    <text x="700" y="234" font-size="11" font-weight="700" fill="#123049">비열비 작음</text>
    <text x="700" y="250" font-size="10" fill="#123049">무거운 탄화수소</text>

    <line x1="470" y1="218" x2="470" y2="330" stroke="#c0392b" stroke-width="1.4" stroke-dasharray="4 3"/>
    <circle cx="470" cy="218" r="6" fill="#c0392b"/>
    <text x="470" y="350" font-size="10.5" font-weight="700" fill="#a03228" text-anchor="middle">여기서 한계</text>

    <line x1="640" y1="122" x2="640" y2="330" stroke="#8a6d24" stroke-width="1.4" stroke-dasharray="4 3"/>

    <path d="M 480 200 L 630 138" stroke="#8a6d24" stroke-width="2" marker-end="url(#tdLim)"/>
    <text x="490" y="192" font-size="10.5" font-weight="700" fill="#5c4610">같은 가스라도 더 올리면 넘어선다</text>

    <text x="130" y="300" font-size="10.5" fill="#7a8794">낮은 압력비에서는</text>
    <text x="130" y="315" font-size="10.5" fill="#7a8794">여유가 있다</text>

    <!-- 캡션 -->
    <text x="20" y="396" font-size="13" fill="#1a1a1a">
      곡선이 오른쪽으로 갈수록 가팔라진다. 압력비를 조금 더 올리려다 온도 한계를 넘는 일이 쉽게 생긴다.
    </text>
    <text x="20" y="418" font-size="13" fill="#1a1a1a">
      같은 압력비라도 가스에 따라 온도가 다르다. 공기 압축기의 감각을 탄화수소 압축기에 그대로 적용할 수 없는 이유다.
    </text>
    <text x="20" y="440" font-size="13" fill="#1a1a1a">
      그리고 효율이 나쁘면 이 곡선보다 더 위로 간다. 토출 온도가 효율의 지표인 이유가 여기 있다.
    </text>
  </g>
</svg>
