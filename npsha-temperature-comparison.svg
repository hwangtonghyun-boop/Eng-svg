<svg viewBox="0 0 900 450" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="20도와 80도 물에서 NPSHa를 구성하는 각 항의 크기 비교" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>같은 배관, 온도만 다를 때</title>

  <defs>
    <marker id="dropDim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c0392b"/>
    </marker>
  </defs>

  <g font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif">

    <text x="20" y="48" font-size="17" font-weight="700" fill="#2c3e50">같은 배관인데 온도만 바꿨다</text>
    <text x="20" y="70" font-size="12.5" fill="#1f2933">높이와 마찰은 그대로다. 달라진 것은 압력 항뿐이다</text>

    <line x1="100" y1="90" x2="100" y2="340" stroke="#1a1a1a" stroke-width="1.6"/>
    <line x1="100" y1="340" x2="880" y2="340" stroke="#1a1a1a" stroke-width="1.6"/>
    <text x="82" y="215" font-size="11.5" fill="#1a1a1a" transform="rotate(-90 82 215)" text-anchor="middle">수두 (m)</text>

    <line x1="100" y1="277.5" x2="875" y2="277.5" stroke="#e4e8eb" stroke-width="1"/>
    <line x1="100" y1="215" x2="875" y2="215" stroke="#e4e8eb" stroke-width="1"/>
    <line x1="100" y1="152.5" x2="875" y2="152.5" stroke="#e4e8eb" stroke-width="1"/>
    <line x1="100" y1="90" x2="875" y2="90" stroke="#e4e8eb" stroke-width="1"/>
    <text x="92" y="344" font-size="10" fill="#1a1a1a" text-anchor="end">0</text>
    <text x="92" y="281" font-size="10" fill="#1a1a1a" text-anchor="end">3</text>
    <text x="92" y="219" font-size="10" fill="#1a1a1a" text-anchor="end">6</text>
    <text x="92" y="156" font-size="10" fill="#1a1a1a" text-anchor="end">9</text>
    <text x="92" y="94" font-size="10" fill="#1a1a1a" text-anchor="end">12</text>

    <!-- 20도 -->
    <text x="300" y="112" font-size="15" font-weight="700" fill="#2c3e50" text-anchor="middle">20°C</text>

    <rect x="130" y="129.4" width="70" height="210.6" fill="#4a7fb5" stroke="#1d5a92" stroke-width="1.4"/>
    <text x="165" y="122" font-size="11.5" font-weight="700" fill="#123049" text-anchor="middle">10.11</text>

    <line x1="200" y1="129.4" x2="220" y2="129.4" stroke="#8b98a4" stroke-width="1.2" stroke-dasharray="4 3"/>
    <rect x="220" y="98.2" width="70" height="31.2" fill="#5a9150" stroke="#2f6b3a" stroke-width="1.4"/>
    <text x="255" y="91" font-size="11.5" font-weight="700" fill="#1e3a19" text-anchor="middle">+ 1.5</text>

    <line x1="290" y1="98.2" x2="310" y2="98.2" stroke="#8b98a4" stroke-width="1.2" stroke-dasharray="4 3"/>
    <rect x="310" y="98.2" width="70" height="20.8" fill="#f0dcc4" stroke="#c0392b" stroke-width="1.6"/>
    <text x="345" y="91" font-size="11.5" font-weight="700" fill="#a03228" text-anchor="middle">− 1.0</text>

    <line x1="380" y1="119" x2="400" y2="119" stroke="#8b98a4" stroke-width="1.2" stroke-dasharray="4 3"/>
    <rect x="400" y="119" width="70" height="221" fill="#2f3d4f"/>
    <text x="435" y="112" font-size="13" font-weight="700" fill="#1a1a1a" text-anchor="middle">10.61</text>

    <!-- 80도 -->
    <text x="660" y="112" font-size="15" font-weight="700" fill="#2c3e50" text-anchor="middle">80°C</text>

    <rect x="490" y="222.1" width="70" height="117.9" fill="#4a7fb5" stroke="#1d5a92" stroke-width="1.4"/>
    <text x="525" y="215" font-size="11.5" font-weight="700" fill="#123049" text-anchor="middle">5.66</text>

    <line x1="560" y1="222.1" x2="580" y2="222.1" stroke="#8b98a4" stroke-width="1.2" stroke-dasharray="4 3"/>
    <rect x="580" y="190.8" width="70" height="31.3" fill="#5a9150" stroke="#2f6b3a" stroke-width="1.4"/>
    <text x="615" y="184" font-size="11.5" font-weight="700" fill="#1e3a19" text-anchor="middle">+ 1.5</text>

    <line x1="650" y1="190.8" x2="670" y2="190.8" stroke="#8b98a4" stroke-width="1.2" stroke-dasharray="4 3"/>
    <rect x="670" y="190.8" width="70" height="20.9" fill="#f0dcc4" stroke="#c0392b" stroke-width="1.6"/>
    <text x="705" y="184" font-size="11.5" font-weight="700" fill="#a03228" text-anchor="middle">− 1.0</text>

    <line x1="740" y1="211.7" x2="760" y2="211.7" stroke="#8b98a4" stroke-width="1.2" stroke-dasharray="4 3"/>
    <rect x="760" y="211.7" width="70" height="128.3" fill="#2f3d4f"/>
    <text x="795" y="204" font-size="13" font-weight="700" fill="#1a1a1a" text-anchor="middle">6.16</text>

    <!-- 차이 -->
    <line x1="470" y1="119" x2="762" y2="119" stroke="#c0392b" stroke-width="1.4" stroke-dasharray="6 4"/>
    <path d="M 762 125 L 762 205" stroke="#c0392b" stroke-width="2.4" marker-end="url(#dropDim)"/>
    <text x="774" y="168" font-size="12.5" font-weight="700" fill="#a03228">4.45 m 감소</text>

    <!-- 항목 라벨 -->
    <text x="165" y="358" font-size="10" fill="#1a1a1a" text-anchor="middle">압력 항</text>
    <text x="255" y="358" font-size="10" fill="#1a1a1a" text-anchor="middle">높이차</text>
    <text x="345" y="358" font-size="10" fill="#1a1a1a" text-anchor="middle">마찰</text>
    <text x="435" y="358" font-size="10" font-weight="700" fill="#1a1a1a" text-anchor="middle">NPSHa</text>
    <text x="525" y="358" font-size="10" fill="#1a1a1a" text-anchor="middle">압력 항</text>
    <text x="615" y="358" font-size="10" fill="#1a1a1a" text-anchor="middle">높이차</text>
    <text x="705" y="358" font-size="10" fill="#1a1a1a" text-anchor="middle">마찰</text>
    <text x="795" y="358" font-size="10" font-weight="700" fill="#1a1a1a" text-anchor="middle">NPSHa</text>

    <!-- 캡션 -->
    <text x="20" y="398" font-size="13" fill="#1a1a1a">
      초록 높이차와 주황 마찰은 두 경우가 똑같다. 파란 압력 항만 절반 가까이 줄어들면서 결과가 4.45 m 깎였다.
    </text>
    <text x="20" y="420" font-size="13" fill="#1a1a1a">
      줄어든 몫의 대부분은 증기압 증가분이다. 밀도 감소는 오히려 수두를 늘리는 방향으로 작용하지만 그 크기가 미미하다.
    </text>
  </g>
</svg>
