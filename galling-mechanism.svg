<svg viewBox="0 0 900 440" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="골링 진행 4단계 - 유막 정상, 돌기 접촉과 산화 피막 파괴, 냉간 용접에 의한 응착, 뜯김과 소착" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>골링은 이렇게 진행된다</title>

  <defs>
    <marker id="glArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b8aa8"/>
    </marker>
  </defs>

  <g font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif">

    <!-- ============ ① 정상 ============ -->
    <rect x="20" y="30" width="210" height="340" rx="8" fill="#f7fbf7" stroke="#d6e6d4"/>
    <text x="35" y="58" font-size="13.5" font-weight="700" fill="#2c3e50">① 정상</text>
    <text x="35" y="76" font-size="10" fill="#1f2933">유막이 막아준다</text>

    <text x="125" y="118" font-size="10" font-weight="700" fill="#1a1a1a" text-anchor="middle">고정 링</text>

    <rect x="35" y="170" width="180" height="45" fill="#dce8f2"/>
    <rect x="35" y="130" width="180" height="40" fill="#6b8194"/>
    <polygon points="56,170 74,170 65,188" fill="#6b8194"/>
    <polygon points="116,170 134,170 125,192" fill="#6b8194"/>
    <polygon points="176,170 194,170 185,186" fill="#6b8194"/>

    <rect x="35" y="215" width="180" height="40" fill="#44546a"/>
    <polygon points="81,215 99,215 90,200" fill="#44546a"/>
    <polygon points="116,215 134,215 125,200" fill="#44546a"/>
    <polygon points="161,215 179,215 170,202" fill="#44546a"/>

    <path d="M 140 178 L 168 178" stroke="#5b8aa8" stroke-width="2" marker-end="url(#glArrow)"/>
    <path d="M 42 208 L 70 208" stroke="#5b8aa8" stroke-width="2" marker-end="url(#glArrow)"/>

    <text x="125" y="275" font-size="10" font-weight="700" fill="#1a1a1a" text-anchor="middle">회전 링 →</text>

    <text x="35" y="302" font-size="10" fill="#1a1a1a">유막이 두 면을 띄운다</text>
    <text x="35" y="322" font-size="10" font-weight="700" fill="#2f6b3a">돌기가 닿지 않는다</text>

    <!-- ============ ② 접촉 ============ -->
    <rect x="240" y="30" width="210" height="340" rx="8" fill="#fdf9f8" stroke="#e8d9d6"/>
    <text x="255" y="58" font-size="13.5" font-weight="700" fill="#2c3e50">② 접촉</text>
    <text x="255" y="76" font-size="10" fill="#1f2933">산화 피막 파괴</text>

    <text x="345" y="118" font-size="10" font-weight="700" fill="#1a1a1a" text-anchor="middle">고정 링</text>

    <rect x="255" y="138" width="180" height="40" fill="#6b8194"/>
    <polygon points="276,178 294,178 285,196" fill="#6b8194"/>
    <polygon points="336,178 354,178 345,200" fill="#6b8194"/>
    <polygon points="396,178 414,178 405,194" fill="#6b8194"/>

    <rect x="255" y="215" width="180" height="40" fill="#44546a"/>
    <polygon points="301,215 319,215 310,200" fill="#44546a"/>
    <polygon points="336,215 354,215 345,200" fill="#44546a"/>
    <polygon points="381,215 399,215 390,202" fill="#44546a"/>

    <polygon points="360,196 368,193 366,201" fill="#c0392b"/>
    <polygon points="326,204 334,201 331,209" fill="#c0392b"/>
    <polygon points="356,208 364,206 361,213" fill="#c0392b"/>
    <text x="372" y="222" font-size="9" font-weight="700" fill="#a03228">피막 조각</text>

    <text x="345" y="275" font-size="10" font-weight="700" fill="#1a1a1a" text-anchor="middle">회전 링 →</text>

    <text x="255" y="302" font-size="10" fill="#1a1a1a">돌기가 부딪히고 피막이 벗겨진다</text>
    <text x="255" y="322" font-size="10" font-weight="700" fill="#a03228">활성 금속면이 드러난다</text>

    <!-- ============ ③ 응착 ============ -->
    <rect x="460" y="30" width="210" height="340" rx="8" fill="#fdf9f8" stroke="#e8d9d6"/>
    <text x="475" y="58" font-size="13.5" font-weight="700" fill="#2c3e50">③ 응착</text>
    <text x="475" y="76" font-size="10" fill="#1f2933">냉간 용접</text>

    <text x="565" y="118" font-size="10" font-weight="700" fill="#1a1a1a" text-anchor="middle">고정 링</text>

    <rect x="475" y="138" width="180" height="40" fill="#6b8194"/>
    <polygon points="496,178 514,178 505,196" fill="#6b8194"/>
    <polygon points="616,178 634,178 625,194" fill="#6b8194"/>

    <rect x="475" y="215" width="180" height="40" fill="#44546a"/>
    <polygon points="521,215 539,215 530,200" fill="#44546a"/>
    <polygon points="601,215 619,215 610,202" fill="#44546a"/>

    <circle cx="565" cy="199" r="20" fill="#e8a33d" opacity="0.4"/>
    <polygon points="556,178 574,178 570,199 574,215 556,215 560,199" fill="#c1500a"/>
    <text x="592" y="196" font-size="9" font-weight="700" fill="#8a3a08">결합부</text>

    <text x="565" y="275" font-size="10" font-weight="700" fill="#1a1a1a" text-anchor="middle">회전 링 →</text>

    <text x="475" y="302" font-size="10" fill="#1a1a1a">외부 열원 없이 결합한다</text>
    <text x="475" y="322" font-size="10" font-weight="700" fill="#a03228">마모가 아니라 붙는 현상이다</text>

    <!-- ============ ④ 뜯김 ============ -->
    <rect x="680" y="30" width="210" height="340" rx="8" fill="#fdf9f8" stroke="#e8d9d6"/>
    <text x="695" y="58" font-size="13.5" font-weight="700" fill="#2c3e50">④ 뜯김</text>
    <text x="695" y="76" font-size="10" fill="#1f2933">소착으로 진행</text>

    <text x="785" y="118" font-size="10" font-weight="700" fill="#1a1a1a" text-anchor="middle">고정 링</text>

    <rect x="695" y="138" width="180" height="40" fill="#6b8194"/>
    <polygon points="716,178 734,178 725,196" fill="#6b8194"/>
    <polygon points="836,178 854,178 845,194" fill="#6b8194"/>
    <polygon points="776,178 794,178 792,206 785,199 778,208" fill="#c1500a"/>

    <rect x="695" y="215" width="180" height="40" fill="#44546a"/>
    <polygon points="741,215 759,215 750,200" fill="#44546a"/>
    <polygon points="821,215 839,215 830,202" fill="#44546a"/>
    <polygon points="775,215 795,215 791,229 779,229" fill="#ffffff" stroke="#c0392b" stroke-width="1.4"/>
    <text x="800" y="240" font-size="9" font-weight="700" fill="#a03228">뜯긴 자리</text>

    <polygon points="812,200 824,197 828,207 816,211" fill="#a03228"/>
    <text x="828" y="192" font-size="9" font-weight="700" fill="#a03228">조각</text>

    <text x="785" y="275" font-size="10" font-weight="700" fill="#1a1a1a" text-anchor="middle">회전 링 →</text>

    <text x="695" y="302" font-size="10" fill="#1a1a1a">결합부가 뜯기며 조각이 생긴다</text>
    <text x="695" y="322" font-size="10" font-weight="700" fill="#a03228">조각이 간극에 끼면 소착</text>

    <!-- 캡션 -->
    <text x="20" y="400" font-size="13" fill="#1a1a1a">
      골링은 재료가 조금씩 없어지는 마모가 아니라, 붙었다가 뜯기는 과정이다. 순식간에 진행되고 한 번 시작되면 스스로 가속한다.
    </text>
    <text x="20" y="422" font-size="13" fill="#1a1a1a">
      같은 재질을 양쪽에 쓰면 결정 구조가 같아 ③단계가 훨씬 쉽게 일어난다. 맞닿는 두 면은 서로 달라야 한다.
    </text>
  </g>
</svg>
