<svg viewBox="0 0 900 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="용적형과 동적 압축기의 압축 원리 차이와 토출 차단 시 서로 다른 거동" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>원리가 다르면 위험도 다르다</title>

  <defs>
    <marker id="pdArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c1500a"/>
    </marker>
    <marker id="dyArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1d5a92"/>
    </marker>
    <marker id="upRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c0392b"/>
    </marker>
    <marker id="prAx" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a1a"/>
    </marker>
  </defs>

  <g font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif">

    <!-- ============ 용적형 ============ -->
    <rect x="20" y="30" width="420" height="180" rx="8" fill="#fdf6e9" stroke="#e8dcc0"/>
    <text x="40" y="58" font-size="14" font-weight="700" fill="#2c3e50">용적형 — 공간을 줄인다</text>

    <rect x="60" y="86" width="150" height="70" fill="#f0e4cc" stroke="#8a6114" stroke-width="2"/>
    <rect x="60" y="86" width="26" height="70" fill="#a8862b"/>
    <g fill="#8a6114">
      <circle cx="108" cy="104" r="3.5"/><circle cx="140" cy="104" r="3.5"/><circle cx="172" cy="104" r="3.5"/>
      <circle cx="108" cy="121" r="3.5"/><circle cx="140" cy="121" r="3.5"/><circle cx="172" cy="121" r="3.5"/>
      <circle cx="108" cy="138" r="3.5"/><circle cx="140" cy="138" r="3.5"/><circle cx="172" cy="138" r="3.5"/>
    </g>
    <text x="135" y="176" font-size="10" fill="#1a1a1a" text-anchor="middle">흡입</text>

    <path d="M 224 121 L 256 121" stroke="#c1500a" stroke-width="3" marker-end="url(#pdArrow)"/>

    <rect x="270" y="86" width="150" height="70" fill="#f0e4cc" stroke="#8a6114" stroke-width="2"/>
    <rect x="270" y="86" width="82" height="70" fill="#a8862b"/>
    <g fill="#8a6114">
      <circle cx="368" cy="99" r="3.5"/><circle cx="386" cy="99" r="3.5"/><circle cx="404" cy="99" r="3.5"/>
      <circle cx="368" cy="114" r="3.5"/><circle cx="386" cy="114" r="3.5"/><circle cx="404" cy="114" r="3.5"/>
      <circle cx="368" cy="129" r="3.5"/><circle cx="386" cy="129" r="3.5"/><circle cx="404" cy="129" r="3.5"/>
      <circle cx="368" cy="144" r="3.5"/><circle cx="386" cy="144" r="3.5"/><circle cx="404" cy="144" r="3.5"/>
    </g>
    <text x="345" y="176" font-size="10" fill="#1a1a1a" text-anchor="middle">압축</text>

    <text x="40" y="200" font-size="11" font-weight="700" fill="#8a6114">가스 양은 같고 공간만 줄어든다</text>

    <!-- ============ 동적 ============ -->
    <rect x="460" y="30" width="420" height="180" rx="8" fill="#eef4f8" stroke="#cddce6"/>
    <text x="480" y="58" font-size="14" font-weight="700" fill="#2c3e50">동적 — 속도를 압력으로</text>

    <circle cx="570" cy="122" r="38" fill="#44546a"/>
    <path d="M 570 122 L 592 100 M 570 122 L 598 130 M 570 122 L 580 150 M 570 122 L 548 148 M 570 122 L 542 112 M 570 122 L 554 96" stroke="#8a97a3" stroke-width="3.4"/>
    <text x="570" y="180" font-size="10" fill="#1a1a1a" text-anchor="middle">임펠러 — 가속</text>

    <path d="M 500 122 L 526 122" stroke="#1d5a92" stroke-width="3" marker-end="url(#dyArrow)"/>

    <path d="M 612 106 L 700 90" stroke="#1d5a92" stroke-width="4" marker-end="url(#dyArrow)"/>
    <path d="M 612 138 L 700 154" stroke="#1d5a92" stroke-width="4" marker-end="url(#dyArrow)"/>

    <polygon points="712,78 790,96 790,148 712,166" fill="#dce8f2" stroke="#1d5a92" stroke-width="2"/>
    <text x="752" y="127" font-size="10" font-weight="700" fill="#123049" text-anchor="middle">디퓨저</text>
    <text x="752" y="180" font-size="10" fill="#1a1a1a" text-anchor="middle">감속 → 압력</text>

    <text x="480" y="200" font-size="11" font-weight="700" fill="#123049">가스가 계속 흘러 지나간다</text>

    <!-- ============ 토출 차단 시 ============ -->
    <rect x="20" y="226" width="860" height="180" rx="8" fill="#fafbfc" stroke="#dfe4e8"/>
    <text x="40" y="254" font-size="14" font-weight="700" fill="#2c3e50">토출을 막으면 무슨 일이 생기는가</text>

    <line x1="110" y1="278" x2="110" y2="378" stroke="#1a1a1a" stroke-width="1.6"/>
    <path d="M 110 378 L 430 378" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#prAx)"/>
    <text x="94" y="330" font-size="10" fill="#1a1a1a" transform="rotate(-90 94 330)" text-anchor="middle">압력</text>
    <text x="422" y="396" font-size="10" fill="#1a1a1a" text-anchor="end">유량 감소 →</text>

    <path d="M 400 350 C 330 340, 250 320, 190 288 C 170 278, 155 272, 145 268" fill="none" stroke="#c1500a" stroke-width="3.4"/>
    <path d="M 145 268 L 145 250" stroke="#c0392b" stroke-width="3.4" marker-end="url(#upRed)"/>
    <text x="158" y="258" font-size="11.5" font-weight="700" fill="#a03228">끝없이 오른다</text>
    <text x="130" y="404" font-size="11" font-weight="700" fill="#8a3a08">용적형 — 릴리프 밸브가 필수다</text>

    <line x1="510" y1="278" x2="510" y2="378" stroke="#1a1a1a" stroke-width="1.6"/>
    <path d="M 510 378 L 830 378" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#prAx)"/>
    <text x="494" y="330" font-size="10" fill="#1a1a1a" transform="rotate(-90 494 330)" text-anchor="middle">압력</text>
    <text x="822" y="396" font-size="10" fill="#1a1a1a" text-anchor="end">유량 감소 →</text>

    <path d="M 800 348 C 730 340, 660 322, 610 302 C 588 294, 572 292, 560 296" fill="none" stroke="#1d5a92" stroke-width="3.4"/>
    <circle cx="588" cy="293" r="6" fill="#c0392b"/>
    <text x="536" y="272" font-size="11.5" font-weight="700" fill="#a03228">여기서 꺾인다</text>
    <path d="M 570 278 L 584 288" stroke="#a03228" stroke-width="1.2"/>
    <text x="530" y="404" font-size="11" font-weight="700" fill="#123049">동적 — 서지에 빠진다. 안티서지 제어가 필수다</text>

    <!-- 캡션 -->
    <text x="20" y="440" font-size="13" fill="#1a1a1a">
      같은 상황에서 한쪽은 터지고 한쪽은 역류한다. 방식이 다르면 지켜야 할 것도 다르다.
    </text>
    <text x="20" y="462" font-size="13" fill="#1a1a1a">
      기계를 고른다는 것은 그 기계가 가진 한계를 함께 받아들이는 일이다. 한계가 없는 방식은 없다.
    </text>
  </g>
</svg>
