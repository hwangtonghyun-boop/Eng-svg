<svg viewBox="0 0 900 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="롬막 효과 - 축이 중앙에 있을 때와 아래로 치우쳤을 때의 웨어 링 틈새 압력 분포 비교" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>롬막 효과 — 틈새가 만드는 복원력</title>

  <defs>
    <marker id="pIn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c0392b"/>
    </marker>
    <marker id="fUp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ffd24a"/>
    </marker>
  </defs>

  <g font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif">

    <!-- ============ PANEL A ============ -->
    <rect x="20" y="30" width="420" height="405" rx="8" fill="#fafbfc" stroke="#dfe4e8"/>
    <text x="35" y="58" font-size="15" font-weight="700" fill="#2c3e50">① 축이 중앙에 있을 때</text>

    <circle cx="175" cy="220" r="100" fill="#c8d2da" stroke="#44546a" stroke-width="2"/>
    <circle cx="175" cy="220" r="76" fill="#dce8f2" stroke="#7a8794" stroke-width="1.2"/>
    <circle cx="175" cy="220" r="50" fill="#44546a"/>
    <text x="175" y="225" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">회전축</text>

    <path d="M 283.3 157.5 L 265.9 167.5" stroke="#c0392b" stroke-width="2.4" marker-end="url(#pIn)"/>
    <path d="M 175 95 L 175 115" stroke="#c0392b" stroke-width="2.4" marker-end="url(#pIn)"/>
    <path d="M 66.8 157.5 L 84.1 167.5" stroke="#c0392b" stroke-width="2.4" marker-end="url(#pIn)"/>
    <path d="M 66.8 282.5 L 84.1 272.5" stroke="#c0392b" stroke-width="2.4" marker-end="url(#pIn)"/>
    <path d="M 175 345 L 175 325" stroke="#c0392b" stroke-width="2.4" marker-end="url(#pIn)"/>
    <path d="M 283.3 282.5 L 265.9 272.5" stroke="#c0392b" stroke-width="2.4" marker-end="url(#pIn)"/>

    <path d="M 290 145 L 222 172" stroke="#1a1a1a" stroke-width="1.2"/>
    <text x="295" y="142" font-size="11.5" fill="#1a1a1a">틈새</text>

    <path d="M 292 306 L 240 286" stroke="#1a1a1a" stroke-width="1.2"/>
    <text x="297" y="311" font-size="11.5" fill="#1a1a1a">고정 웨어 링</text>

    <text x="35" y="395" font-size="12" fill="#1a1a1a">틈새가 둘레 전체에서 같다</text>
    <text x="35" y="415" font-size="12" font-weight="700" fill="#1a1a1a">압력이 상쇄되어 알짜 힘이 0</text>

    <!-- ============ PANEL B ============ -->
    <rect x="460" y="30" width="420" height="405" rx="8" fill="#fdf9f8" stroke="#e8d9d6"/>
    <text x="475" y="58" font-size="15" font-weight="700" fill="#2c3e50">② 축이 아래로 치우쳤을 때</text>

    <text x="615" y="100" font-size="12" font-weight="700" fill="#123049" text-anchor="middle">넓은 틈새 · 저압</text>

    <circle cx="615" cy="220" r="100" fill="#c8d2da" stroke="#44546a" stroke-width="2"/>
    <circle cx="615" cy="220" r="76" fill="#dce8f2" stroke="#7a8794" stroke-width="1.2"/>
    <circle cx="615" cy="233" r="50" fill="#44546a"/>

    <path d="M 718.1 160.5 L 705.9 167.5" stroke="#c0392b" stroke-width="2.4" marker-end="url(#pIn)"/>
    <path d="M 615 109 L 615 115" stroke="#c0392b" stroke-width="2.4" marker-end="url(#pIn)"/>
    <path d="M 511.9 160.5 L 524.1 167.5" stroke="#c0392b" stroke-width="2.4" marker-end="url(#pIn)"/>
    <path d="M 501.6 285.5 L 524.1 272.5" stroke="#c0392b" stroke-width="2.8" marker-end="url(#pIn)"/>
    <path d="M 615 357 L 615 325" stroke="#c0392b" stroke-width="3.2" marker-end="url(#pIn)"/>
    <path d="M 728.5 285.5 L 705.9 272.5" stroke="#c0392b" stroke-width="2.8" marker-end="url(#pIn)"/>

    <path d="M 600 268 L 600 198" stroke="#ffd24a" stroke-width="5" marker-end="url(#fUp)"/>
    <text x="612" y="240" font-size="12" font-weight="700" fill="#ffd24a">복원력</text>

    <text x="615" y="375" font-size="12" font-weight="700" fill="#7b2018" text-anchor="middle">좁은 틈새 · 고압</text>

    <text x="475" y="395" font-size="12" fill="#1a1a1a">좁아진 쪽의 압력이 올라간다</text>
    <text x="475" y="415" font-size="12" font-weight="700" fill="#a03228">축을 중심으로 되미는 힘이 생긴다</text>

    <!-- 캡션 -->
    <text x="20" y="463" font-size="13" fill="#1a1a1a">
      화살표 길이가 압력의 크기다. 축이 치우치면 좁아진 쪽 압력이 올라가 축을 되민다. 이것이 롬막 효과다.
    </text>
    <text x="20" y="484" font-size="13" fill="#1a1a1a">
      간극이 벌어지면 좁은 쪽과 넓은 쪽의 압력 차이가 줄어들고, 복원력은 그보다 훨씬 가파르게 약해진다.
    </text>
  </g>
</svg>
