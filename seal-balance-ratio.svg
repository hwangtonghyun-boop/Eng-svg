<svg viewBox="0 0 900 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="언밸런스 씰과 밸런스 씰의 압력 작용 면적 비교" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>밸런스비 — 언밸런스 씰과 밸런스 씰의 면적 비교</title>

  <defs>
    <marker id="pArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c0392b"/>
    </marker>
  </defs>

  <g font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif">

    <!-- ============ PANEL A : 언밸런스 ============ -->
    <rect x="20" y="20" width="420" height="480" rx="8" fill="#fdf9f8" stroke="#e8d9d6"/>
    <text x="50" y="58" font-size="17" font-weight="700" fill="#2c3e50">언밸런스 씰</text>
    <text x="50" y="80" font-size="12.5" fill="#1f2933">Unbalanced — B &gt; 1</text>

    <text x="250" y="205" font-size="12" fill="#1f2933" text-anchor="middle">회전 링 단면</text>

    <!-- 링 블록 -->
    <rect x="180" y="230" width="140" height="120" fill="#dfe6eb" stroke="#97a3ad" stroke-width="1.4"/>

    <!-- 압력 작용 면적 -->
    <rect x="170" y="230" width="10" height="120" fill="#c0392b" opacity="0.85"/>

    <!-- 페이스 접촉 면적 -->
    <rect x="310" y="230" width="10" height="70" fill="#2d6ba8" opacity="0.85"/>

    <!-- 압력 화살표 -->
    <path d="M 128 250 L 166 250" stroke="#c0392b" stroke-width="2.2" marker-end="url(#pArrow)"/>
    <path d="M 128 290 L 166 290" stroke="#c0392b" stroke-width="2.2" marker-end="url(#pArrow)"/>
    <path d="M 128 330 L 166 330" stroke="#c0392b" stroke-width="2.2" marker-end="url(#pArrow)"/>

    <!-- 밸런스 직경 -->
    <line x1="140" y1="350" x2="380" y2="350" stroke="#c0392b" stroke-width="1.8" stroke-dasharray="8 4"/>
    <text x="196" y="370" font-size="11.5" fill="#c0392b">밸런스 직경 = 슬리브 외경</text>

    <!-- 페이스 내경 -->
    <line x1="300" y1="300" x2="392" y2="300" stroke="#8b98a4" stroke-width="1.2" stroke-dasharray="5 4"/>
    <text x="326" y="294" font-size="11" fill="#1f2933">페이스 내경</text>

    <!-- 치수: Ah -->
    <line x1="110" y1="230" x2="110" y2="350" stroke="#5b6673" stroke-width="1.3"/>
    <line x1="104" y1="230" x2="116" y2="230" stroke="#5b6673" stroke-width="1.3"/>
    <line x1="104" y1="350" x2="116" y2="350" stroke="#5b6673" stroke-width="1.3"/>
    <text x="94" y="294" font-size="13" font-weight="700" fill="#c0392b" text-anchor="end">A<tspan font-size="9" dy="4">h</tspan></text>

    <!-- 치수: Af -->
    <line x1="392" y1="230" x2="392" y2="300" stroke="#5b6673" stroke-width="1.3"/>
    <line x1="386" y1="230" x2="398" y2="230" stroke="#5b6673" stroke-width="1.3"/>
    <line x1="386" y1="300" x2="398" y2="300" stroke="#5b6673" stroke-width="1.3"/>
    <text x="402" y="268" font-size="13" font-weight="700" fill="#2d6ba8">A<tspan font-size="9" dy="4">f</tspan></text>

    <!-- 중심선 -->
    <line x1="60" y1="400" x2="410" y2="400" stroke="#8b98a4" stroke-width="1.2" stroke-dasharray="14 4 3 4"/>
    <text x="60" y="418" font-size="11" fill="#1f2933">축 중심선 (반경 0)</text>

    <text x="50" y="450" font-size="13.5" font-weight="700" fill="#a03228">압력 작용 면적 &gt; 접촉 면적</text>
    <text x="50" y="474" font-size="12.5" fill="#1a1a1a">고압에서 유막이 짜부라지고 발열이 급증한다</text>

    <!-- ============ PANEL B : 밸런스 ============ -->
    <rect x="460" y="20" width="420" height="480" rx="8" fill="#f7fbf7" stroke="#d6e6d4"/>
    <text x="490" y="58" font-size="17" font-weight="700" fill="#2c3e50">밸런스 씰</text>
    <text x="490" y="80" font-size="12.5" fill="#1f2933">Balanced — B &lt; 1</text>

    <text x="710" y="205" font-size="12" fill="#1f2933" text-anchor="middle">회전 링 단면</text>

    <!-- 링 블록 -->
    <rect x="640" y="230" width="140" height="120" fill="#dfe6eb" stroke="#97a3ad" stroke-width="1.4"/>

    <!-- 압력 작용 면적 (축소) -->
    <rect x="630" y="230" width="10" height="55" fill="#c0392b" opacity="0.85"/>

    <!-- 페이스 접촉 면적 -->
    <rect x="770" y="230" width="10" height="70" fill="#2d6ba8" opacity="0.85"/>

    <!-- 압력 화살표 -->
    <path d="M 588 248 L 626 248" stroke="#c0392b" stroke-width="2.2" marker-end="url(#pArrow)"/>
    <path d="M 588 272 L 626 272" stroke="#c0392b" stroke-width="2.2" marker-end="url(#pArrow)"/>

    <!-- 밸런스 직경 (안쪽으로 이동) -->
    <line x1="600" y1="285" x2="840" y2="285" stroke="#c0392b" stroke-width="1.8" stroke-dasharray="8 4"/>
    <text x="652" y="303" font-size="11.5" fill="#c0392b">밸런스 직경 (단을 두어 축소)</text>

    <!-- 페이스 내경 -->
    <line x1="760" y1="300" x2="852" y2="300" stroke="#8b98a4" stroke-width="1.2" stroke-dasharray="5 4"/>

    <!-- 치수: Ah -->
    <line x1="570" y1="230" x2="570" y2="285" stroke="#5b6673" stroke-width="1.3"/>
    <line x1="564" y1="230" x2="576" y2="230" stroke="#5b6673" stroke-width="1.3"/>
    <line x1="564" y1="285" x2="576" y2="285" stroke="#5b6673" stroke-width="1.3"/>
    <text x="554" y="262" font-size="13" font-weight="700" fill="#c0392b" text-anchor="end">A<tspan font-size="9" dy="4">h</tspan></text>

    <!-- 치수: Af -->
    <line x1="852" y1="230" x2="852" y2="300" stroke="#5b6673" stroke-width="1.3"/>
    <line x1="846" y1="230" x2="858" y2="230" stroke="#5b6673" stroke-width="1.3"/>
    <line x1="846" y1="300" x2="858" y2="300" stroke="#5b6673" stroke-width="1.3"/>
    <text x="862" y="268" font-size="13" font-weight="700" fill="#2d6ba8">A<tspan font-size="9" dy="4">f</tspan></text>

    <!-- 중심선 -->
    <line x1="500" y1="400" x2="850" y2="400" stroke="#8b98a4" stroke-width="1.2" stroke-dasharray="14 4 3 4"/>
    <text x="500" y="418" font-size="11" fill="#1f2933">축 중심선 (반경 0)</text>

    <text x="490" y="450" font-size="13.5" font-weight="700" fill="#2f6b3a">압력 작용 면적 &lt; 접촉 면적</text>
    <text x="490" y="474" font-size="12.5" fill="#1a1a1a">고압에서도 유막이 유지된다</text>

    <!-- 캡션 -->
    <text x="450" y="532" font-size="13.5" fill="#1a1a1a" text-anchor="middle">
      밸런스비 B = A(h) / A(f). 슬리브에 단을 두어 압력이 미는 면적을 줄인 것이 밸런스 씰이다.
    </text>
  </g>
</svg>
