<svg viewBox="0 0 900 640" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="그리스, 오일 배스, 오일 링, 오일 미스트 네 가지 윤활 방식의 베어링 하우징 단면 비교" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>베어링 윤활 방식 네 가지 비교</title>

  <defs>
    <clipPath id="clipA"><circle cx="140" cy="180" r="75"/></clipPath>
    <clipPath id="clipB"><circle cx="580" cy="180" r="75"/></clipPath>
    <clipPath id="clipC"><circle cx="140" cy="470" r="75"/></clipPath>
    <marker id="mArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c1500a"/>
    </marker>
  </defs>

  <g font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif">

    <!-- ================= A : 그리스 ================= -->
    <rect x="20" y="30" width="420" height="270" rx="8" fill="#fafbfc" stroke="#dfe4e8"/>
    <text x="45" y="62" font-size="15.5" font-weight="700" fill="#2c3e50">① 그리스</text>
    <text x="45" y="82" font-size="11.5" fill="#1f2933">Grease</text>

    <circle cx="140" cy="180" r="75" fill="#eef2f5" stroke="#44546a" stroke-width="2.5"/>
    <rect x="60" y="205" width="160" height="55" fill="#c4b06a" clip-path="url(#clipA)"/>
    <line x1="71" y1="205" x2="209" y2="205" stroke="#8a7a3a" stroke-width="1.6"/>

    <circle cx="140" cy="180" r="48" fill="none" stroke="#5b6673" stroke-width="3"/>
    <circle cx="176" cy="180" r="9" fill="#7f95a6" stroke="#44546a"/>
    <circle cx="165.5" cy="205.5" r="9" fill="#7f95a6" stroke="#44546a"/>
    <circle cx="140" cy="216" r="9" fill="#7f95a6" stroke="#44546a"/>
    <circle cx="114.5" cy="205.5" r="9" fill="#7f95a6" stroke="#44546a"/>
    <circle cx="104" cy="180" r="9" fill="#7f95a6" stroke="#44546a"/>
    <circle cx="114.5" cy="154.5" r="9" fill="#7f95a6" stroke="#44546a"/>
    <circle cx="140" cy="144" r="9" fill="#7f95a6" stroke="#44546a"/>
    <circle cx="165.5" cy="154.5" r="9" fill="#7f95a6" stroke="#44546a"/>
    <circle cx="140" cy="180" r="24" fill="#44546a"/>

    <text x="140" y="245" font-size="11" font-weight="700" fill="#3d3517" text-anchor="middle">그리스</text>

    <circle cx="252" cy="146" r="3.5" fill="#5b6673"/>
    <text x="264" y="150" font-size="11.5" fill="#1a1a1a">부속 장치가 필요 없다</text>
    <circle cx="252" cy="171" r="3.5" fill="#5b6673"/>
    <text x="264" y="175" font-size="11.5" fill="#1a1a1a">오염물을 물리적으로 차단</text>
    <circle cx="252" cy="196" r="3.5" fill="#c0392b"/>
    <text x="264" y="200" font-size="11.5" fill="#1a1a1a">순환하지 않아 냉각 안 됨</text>
    <circle cx="252" cy="221" r="3.5" fill="#c0392b"/>
    <text x="264" y="225" font-size="11.5" fill="#1a1a1a">과충전하면 교반 발열</text>

    <text x="45" y="283" font-size="11.5" font-weight="600" fill="#1a1a1a">지켜야 할 것 — 주입량</text>

    <!-- ================= B : 오일 배스 ================= -->
    <rect x="460" y="30" width="420" height="270" rx="8" fill="#fafbfc" stroke="#dfe4e8"/>
    <text x="485" y="62" font-size="15.5" font-weight="700" fill="#2c3e50">② 오일 배스</text>
    <text x="485" y="82" font-size="11.5" fill="#1f2933">Oil Bath</text>

    <circle cx="580" cy="180" r="75" fill="#eef2f5" stroke="#44546a" stroke-width="2.5"/>
    <rect x="500" y="216" width="160" height="45" fill="#e6d3a3" clip-path="url(#clipB)"/>
    <line x1="514" y1="216" x2="646" y2="216" stroke="#a8905a" stroke-width="1.8"/>

    <circle cx="580" cy="180" r="48" fill="none" stroke="#5b6673" stroke-width="3"/>
    <circle cx="616" cy="180" r="9" fill="#7f95a6" stroke="#44546a"/>
    <circle cx="605.5" cy="205.5" r="9" fill="#7f95a6" stroke="#44546a"/>
    <circle cx="580" cy="216" r="9" fill="#7f95a6" stroke="#44546a"/>
    <circle cx="554.5" cy="205.5" r="9" fill="#7f95a6" stroke="#44546a"/>
    <circle cx="544" cy="180" r="9" fill="#7f95a6" stroke="#44546a"/>
    <circle cx="554.5" cy="154.5" r="9" fill="#7f95a6" stroke="#44546a"/>
    <circle cx="580" cy="144" r="9" fill="#7f95a6" stroke="#44546a"/>
    <circle cx="605.5" cy="154.5" r="9" fill="#7f95a6" stroke="#44546a"/>
    <circle cx="580" cy="180" r="24" fill="#44546a"/>

    <text x="580" y="243" font-size="11" font-weight="700" fill="#4a3c14" text-anchor="middle">오일</text>

    <circle cx="692" cy="146" r="3.5" fill="#5b6673"/>
    <text x="704" y="150" font-size="11.5" fill="#1a1a1a">레벨 = 최하단 볼 중심</text>
    <circle cx="692" cy="171" r="3.5" fill="#5b6673"/>
    <text x="704" y="175" font-size="11.5" fill="#1a1a1a">오일이 열을 실어 낸다</text>
    <circle cx="692" cy="196" r="3.5" fill="#c0392b"/>
    <text x="704" y="200" font-size="11.5" fill="#1a1a1a">레벨 오차에 민감</text>
    <circle cx="692" cy="221" r="3.5" fill="#c0392b"/>
    <text x="704" y="225" font-size="11.5" fill="#1a1a1a">고속에서 거품 발생</text>

    <text x="485" y="283" font-size="11.5" font-weight="600" fill="#1a1a1a">지켜야 할 것 — 레벨과 청정도</text>

    <!-- ================= C : 오일 링 ================= -->
    <rect x="20" y="320" width="420" height="270" rx="8" fill="#fafbfc" stroke="#dfe4e8"/>
    <text x="45" y="352" font-size="15.5" font-weight="700" fill="#2c3e50">③ 오일 링</text>
    <text x="45" y="372" font-size="11.5" fill="#1f2933">Oil Ring / Slinger</text>

    <circle cx="140" cy="470" r="75" fill="#eef2f5" stroke="#44546a" stroke-width="2.5"/>
    <rect x="60" y="528" width="160" height="25" fill="#e6d3a3" clip-path="url(#clipC)"/>
    <line x1="92" y1="528" x2="188" y2="528" stroke="#a8905a" stroke-width="1.8"/>

    <circle cx="140" cy="470" r="48" fill="none" stroke="#5b6673" stroke-width="3"/>
    <circle cx="176" cy="470" r="9" fill="#7f95a6" stroke="#44546a"/>
    <circle cx="165.5" cy="495.5" r="9" fill="#7f95a6" stroke="#44546a"/>
    <circle cx="140" cy="506" r="9" fill="#7f95a6" stroke="#44546a"/>
    <circle cx="114.5" cy="495.5" r="9" fill="#7f95a6" stroke="#44546a"/>
    <circle cx="104" cy="470" r="9" fill="#7f95a6" stroke="#44546a"/>
    <circle cx="114.5" cy="444.5" r="9" fill="#7f95a6" stroke="#44546a"/>
    <circle cx="140" cy="434" r="9" fill="#7f95a6" stroke="#44546a"/>
    <circle cx="165.5" cy="444.5" r="9" fill="#7f95a6" stroke="#44546a"/>
    <circle cx="140" cy="470" r="24" fill="#44546a"/>

    <circle cx="140" cy="491" r="45" fill="none" stroke="#c1500a" stroke-width="4"/>
    <path d="M 96 486 A 45 45 0 0 1 108 462" fill="none" stroke="#c1500a" stroke-width="2.4" marker-end="url(#mArrow)"/>

    <circle cx="252" cy="436" r="3.5" fill="#c1500a"/>
    <text x="264" y="440" font-size="11.5" fill="#1a1a1a">오일 링이 오일을 퍼 올림</text>
    <circle cx="252" cy="461" r="3.5" fill="#5b6673"/>
    <text x="264" y="465" font-size="11.5" fill="#1a1a1a">베어링은 잠기지 않는다</text>
    <circle cx="252" cy="486" r="3.5" fill="#5b6673"/>
    <text x="264" y="490" font-size="11.5" fill="#1a1a1a">교반열이 없어 고속 가능</text>
    <circle cx="252" cy="511" r="3.5" fill="#c0392b"/>
    <text x="264" y="515" font-size="11.5" fill="#1a1a1a">기울면 링이 멈춘다</text>

    <text x="45" y="573" font-size="11.5" font-weight="600" fill="#1a1a1a">지켜야 할 것 — 수평도와 링의 회전</text>

    <!-- ================= D : 오일 미스트 ================= -->
    <rect x="460" y="320" width="420" height="270" rx="8" fill="#fafbfc" stroke="#dfe4e8"/>
    <text x="485" y="352" font-size="15.5" font-weight="700" fill="#2c3e50">④ 오일 미스트</text>
    <text x="485" y="372" font-size="11.5" fill="#1f2933">Oil Mist (Pure)</text>

    <circle cx="580" cy="470" r="75" fill="#eef2f5" stroke="#44546a" stroke-width="2.5"/>

    <circle cx="580" cy="470" r="48" fill="none" stroke="#5b6673" stroke-width="3"/>
    <circle cx="616" cy="470" r="9" fill="#7f95a6" stroke="#44546a"/>
    <circle cx="605.5" cy="495.5" r="9" fill="#7f95a6" stroke="#44546a"/>
    <circle cx="580" cy="506" r="9" fill="#7f95a6" stroke="#44546a"/>
    <circle cx="554.5" cy="495.5" r="9" fill="#7f95a6" stroke="#44546a"/>
    <circle cx="544" cy="470" r="9" fill="#7f95a6" stroke="#44546a"/>
    <circle cx="554.5" cy="444.5" r="9" fill="#7f95a6" stroke="#44546a"/>
    <circle cx="580" cy="434" r="9" fill="#7f95a6" stroke="#44546a"/>
    <circle cx="605.5" cy="444.5" r="9" fill="#7f95a6" stroke="#44546a"/>
    <circle cx="580" cy="470" r="24" fill="#44546a"/>

    <g fill="#5f8bab">
      <circle cx="540" cy="420" r="2.5"/><circle cx="551" cy="428" r="2.5"/>
      <circle cx="600" cy="425" r="2.5"/><circle cx="620" cy="440" r="2.5"/>
      <circle cx="530" cy="455" r="2.5"/><circle cx="534" cy="487" r="2.5"/>
      <circle cx="558" cy="515" r="2.5"/><circle cx="592" cy="525" r="2.5"/>
      <circle cx="623" cy="502" r="2.5"/><circle cx="630" cy="465" r="2.5"/>
      <circle cx="555" cy="415" r="2.5"/><circle cx="535" cy="435" r="2.5"/>
      <circle cx="625" cy="420" r="2.5"/><circle cx="610" cy="520" r="2.5"/>
      <circle cx="550" cy="520" r="2.5"/><circle cx="520" cy="470" r="2.5"/>
      <circle cx="640" cy="485" r="2.5"/>
    </g>

    <path d="M 580 372 L 580 396" stroke="#c1500a" stroke-width="2.6" marker-end="url(#mArrow)"/>
    <text x="592" y="380" font-size="11" font-weight="600" fill="#8a3a08">미스트 유입</text>
    <rect x="572" y="544" width="16" height="11" fill="#44546a"/>
    <text x="596" y="556" font-size="11" fill="#1a1a1a">배출</text>

    <circle cx="692" cy="436" r="3.5" fill="#5b6673"/>
    <text x="704" y="440" font-size="11.5" fill="#1a1a1a">섬프에 고인 오일이 없다</text>
    <circle cx="692" cy="461" r="3.5" fill="#5b6673"/>
    <text x="704" y="465" font-size="11.5" fill="#1a1a1a">항상 신유가 공급된다</text>
    <circle cx="692" cy="486" r="3.5" fill="#5b6673"/>
    <text x="704" y="490" font-size="11.5" fill="#1a1a1a">내부 양압으로 오염 차단</text>
    <circle cx="692" cy="511" r="3.5" fill="#c0392b"/>
    <text x="704" y="515" font-size="11.5" fill="#1a1a1a">공기 끊기면 완충이 없다</text>

    <text x="485" y="573" font-size="11.5" font-weight="600" fill="#1a1a1a">지켜야 할 것 — 공기 공급의 연속성</text>

    <!-- 캡션 -->
    <text x="20" y="618" font-size="13" fill="#1a1a1a">
      단면은 축에 수직으로 자른 모습이다. 실제 오일 링은 베어링 옆 축에 걸려 있어 같은 평면에 놓이지는 않는다.
    </text>
  </g>
</svg>
