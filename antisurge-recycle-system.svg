<svg viewBox="0 0 900 460" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="안티서지 리사이클 계통도 - 인출점, 쿨러, 밸브, 복귀점, 유량 계측기 위치" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>안티서지 리사이클 계통</title>

  <defs>
    <marker id="asFlow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1d5a92"/>
    </marker>
    <marker id="asRec" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2f6b3a"/>
    </marker>
  </defs>

  <g font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif">

    <text x="20" y="48" font-size="17" font-weight="700" fill="#2c3e50">리사이클 라인은 어디에 붙이는가</text>
    <text x="20" y="70" font-size="12.5" fill="#1f2933">인출점, 쿨러, 유량계 위치가 제어의 성립 여부를 가른다</text>

    <!-- 주 유로 -->
    <path d="M 60 250 L 250 250" stroke="#44546a" stroke-width="16"/>
    <path d="M 60 250 L 250 250" stroke="#dce8f2" stroke-width="10"/>
    <path d="M 350 250 L 700 250" stroke="#44546a" stroke-width="16"/>
    <path d="M 350 250 L 700 250" stroke="#f0d9d4" stroke-width="10"/>
    <path d="M 700 250 L 840 250" stroke="#44546a" stroke-width="16"/>
    <path d="M 700 250 L 840 250" stroke="#f0d9d4" stroke-width="10"/>

    <text x="90" y="232" font-size="10.5" font-weight="700" fill="#1d5a92">흡입</text>
    <text x="800" y="232" font-size="10.5" font-weight="700" fill="#a03228">공정으로</text>

    <!-- 압축기 -->
    <circle cx="300" cy="250" r="46" fill="#44546a"/>
    <text x="300" y="248" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">압축기</text>
    <text x="300" y="266" font-size="9.5" fill="#ffffff" text-anchor="middle">Compressor</text>

    <!-- 체크 밸브 -->
    <polygon points="608,238 608,262 630,250" fill="#2f3d4f"/>
    <line x1="630" y1="234" x2="630" y2="266" stroke="#2f3d4f" stroke-width="3"/>
    <text x="619" y="222" font-size="10" font-weight="700" fill="#1a1a1a" text-anchor="middle">체크 밸브</text>

    <!-- 유량계 -->
    <rect x="178" y="232" width="40" height="36" rx="3" fill="#ffffff" stroke="#1d5a92" stroke-width="2.4"/>
    <text x="198" y="255" font-size="11" font-weight="700" fill="#1d5a92" text-anchor="middle">FT</text>
    <text x="198" y="294" font-size="10" font-weight="700" fill="#1d5a92" text-anchor="middle">유량 계측기</text>
    <text x="198" y="310" font-size="9.5" fill="#1d5a92" text-anchor="middle">합류점 뒤에 둔다</text>

    <!-- 리사이클 라인 -->
    <path d="M 560 242 L 560 130 L 400 130" fill="none" stroke="#2f6b3a" stroke-width="9"/>
    <path d="M 400 130 L 140 130 L 140 242" fill="none" stroke="#2f6b3a" stroke-width="9"/>
    <path d="M 470 130 L 440 130" stroke="#2f6b3a" stroke-width="3" marker-end="url(#asRec)"/>
    <path d="M 260 130 L 230 130" stroke="#2f6b3a" stroke-width="3" marker-end="url(#asRec)"/>

    <circle cx="560" cy="250" r="6" fill="#2f6b3a"/>
    <text x="572" y="278" font-size="10" font-weight="700" fill="#2f6b3a">인출점 — 체크 밸브 앞</text>

    <circle cx="140" cy="250" r="6" fill="#2f6b3a"/>
    <text x="70" y="278" font-size="10" font-weight="700" fill="#2f6b3a">복귀점</text>

    <!-- 쿨러 -->
    <rect x="470" y="106" width="70" height="48" rx="4" fill="#dce8f2" stroke="#1d5a92" stroke-width="2.2"/>
    <path d="M 480 118 L 530 118 M 480 130 L 530 130 M 480 142 L 530 142" stroke="#1d5a92" stroke-width="2"/>
    <text x="505" y="96" font-size="10.5" font-weight="700" fill="#123049" text-anchor="middle">쿨러</text>

    <!-- 안티서지 밸브 -->
    <polygon points="290,116 290,144 312,130" fill="#2f6b3a"/>
    <polygon points="334,116 334,144 312,130" fill="#2f6b3a"/>
    <line x1="312" y1="130" x2="312" y2="100" stroke="#2f6b3a" stroke-width="3"/>
    <rect x="288" y="80" width="48" height="22" rx="3" fill="#d8ecd6" stroke="#2f6b3a" stroke-width="2"/>
    <text x="312" y="70" font-size="10.5" font-weight="700" fill="#2f6b3a" text-anchor="middle">안티서지 밸브</text>
    <text x="312" y="166" font-size="9.5" font-weight="700" fill="#2f6b3a" text-anchor="middle">Fail Open</text>

    <!-- 설명 -->
    <text x="560" y="182" font-size="11" font-weight="700" fill="#a03228">뜨거운 가스를 그대로 되돌리면</text>
    <text x="560" y="198" font-size="11" font-weight="700" fill="#a03228">흡입 온도가 올라 상황이 악화된다</text>

    <!-- 캡션 -->
    <text x="20" y="360" font-size="13" fill="#1a1a1a">
      인출점은 체크 밸브 앞이어야 한다. 밸브 뒤에서 뽑으면 그 밸브가 닫힌 상황에서 무력해진다.
    </text>
    <text x="20" y="382" font-size="13" fill="#1a1a1a">
      유량계는 리사이클 합류점 뒤에 둔다. 공정 유량계를 그대로 쓰면 리사이클분이 빠진 값을 보게 되어 제어가 성립하지 않는다.
    </text>
    <text x="20" y="404" font-size="13" fill="#1a1a1a">
      계장 공기를 잃었을 때 밸브가 닫혀 있으면 서지로 직행한다. 그래서 고장 시 열리는 방향으로 구성한다.
    </text>
  </g>
</svg>
