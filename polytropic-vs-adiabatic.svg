<svg viewBox="0 0 900 460" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="압축 경로에 따라 필요한 일이 달라지는 관계와 다단 압축에서의 재열 효과" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>경로가 다르면 일이 다르다</title>

  <defs>
    <marker id="pwAx" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a1a"/>
    </marker>
    <marker id="pwDim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c0392b"/>
    </marker>
  </defs>

  <g font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif">

    <!-- ============ ① p-v 선도 ============ -->
    <rect x="20" y="30" width="520" height="330" rx="8" fill="#fafbfc" stroke="#dfe4e8"/>
    <text x="40" y="58" font-size="14" font-weight="700" fill="#2c3e50">① 같은 압력비인데 경로가 다르다</text>
    <text x="40" y="76" font-size="10.5" fill="#1f2933">압축에 드는 일은 곡선 왼쪽 면적에 해당한다</text>

    <path d="M 450 290 C 390 272, 300 215, 240 120 L 170 120 C 250 205, 370 270, 450 290 Z"
          fill="#fbe9e7"/>

    <line x1="90" y1="90" x2="90" y2="320" stroke="#1a1a1a" stroke-width="1.6"/>
    <path d="M 90 320 L 520 320" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#pwAx)"/>
    <text x="74" y="200" font-size="11" fill="#1a1a1a" transform="rotate(-90 74 200)" text-anchor="middle">압력 p</text>
    <text x="512" y="338" font-size="11" fill="#1a1a1a" text-anchor="end">비체적 v</text>

    <line x1="90" y1="120" x2="460" y2="120" stroke="#8b98a4" stroke-width="1.2" stroke-dasharray="5 4"/>
    <text x="80" y="124" font-size="11" font-weight="700" fill="#1a1a1a" text-anchor="end">p₂</text>
    <line x1="90" y1="290" x2="460" y2="290" stroke="#8b98a4" stroke-width="1.2" stroke-dasharray="5 4"/>
    <text x="80" y="294" font-size="11" font-weight="700" fill="#1a1a1a" text-anchor="end">p₁</text>

    <path d="M 450 290 C 370 270, 250 205, 170 120" fill="none" stroke="#1d5a92" stroke-width="3"/>
    <path d="M 450 290 C 390 272, 300 215, 240 120" fill="none" stroke="#c0392b" stroke-width="3"/>

    <circle cx="450" cy="290" r="6" fill="#1a1a1a"/>
    <text x="462" y="286" font-size="10.5" font-weight="700" fill="#1a1a1a">흡입</text>
    <circle cx="170" cy="120" r="6" fill="#1d5a92"/>
    <circle cx="240" cy="120" r="6" fill="#c0392b"/>

    <text x="155" y="108" font-size="11.5" font-weight="700" fill="#123049" text-anchor="middle">단열 (이상)</text>
    <text x="250" y="108" font-size="11.5" font-weight="700" fill="#a03228">실제</text>

    <path d="M 346 180 L 296 202" stroke="#a03228" stroke-width="1.2"/>
    <text x="352" y="176" font-size="11" font-weight="700" fill="#a03228">재열로 늘어난 일</text>

    <text x="40" y="348" font-size="11" font-weight="700" fill="#1a1a1a">뜨거울수록 부풀어 곡선이 오른쪽으로 밀린다</text>

    <!-- ============ ② 재열 효과 ============ -->
    <rect x="560" y="30" width="320" height="330" rx="8" fill="#fafbfc" stroke="#dfe4e8"/>
    <text x="580" y="58" font-size="14" font-weight="700" fill="#2c3e50">② 재열 효과</text>
    <text x="580" y="76" font-size="10.5" fill="#1f2933">앞단의 손실이 뒷단을 어렵게 한다</text>

    <line x1="600" y1="110" x2="600" y2="320" stroke="#1a1a1a" stroke-width="1.6"/>
    <line x1="600" y1="320" x2="866" y2="320" stroke="#1a1a1a" stroke-width="1.6"/>

    <rect x="620" y="170" width="70" height="150" fill="#4a7fb5" stroke="#1d5a92" stroke-width="1.4"/>

    <rect x="750" y="272" width="70" height="48" fill="#e0a49c" stroke="#8a281c" stroke-width="1.4"/>
    <rect x="750" y="210" width="70" height="62" fill="#d07b6e" stroke="#8a281c" stroke-width="1.4"/>
    <rect x="750" y="135" width="70" height="75" fill="#c0392b" stroke="#8a281c" stroke-width="1.4"/>
    <text x="785" y="301" font-size="10" font-weight="700" fill="#5c1a12" text-anchor="middle">1단</text>
    <text x="785" y="246" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">2단</text>
    <text x="785" y="178" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">3단</text>

    <line x1="690" y1="170" x2="750" y2="170" stroke="#c0392b" stroke-width="1.4" stroke-dasharray="5 3"/>
    <path d="M 735 168 L 735 137" stroke="#c0392b" stroke-width="2.2" marker-start="url(#pwDim)" marker-end="url(#pwDim)"/>
    <text x="728" y="156" font-size="11" font-weight="700" fill="#a03228" text-anchor="end">재열 효과</text>

    <text x="655" y="340" font-size="10.5" font-weight="700" fill="#123049" text-anchor="middle">전체 단열 일</text>
    <text x="655" y="354" font-size="9.5" fill="#123049" text-anchor="middle">손실 없는 경로</text>
    <text x="785" y="340" font-size="10.5" font-weight="700" fill="#a03228" text-anchor="middle">단별 일의 합</text>
    <text x="785" y="354" font-size="9.5" fill="#a03228" text-anchor="middle">데워진 가스를 받는다</text>

    <!-- 캡션 -->
    <text x="20" y="398" font-size="13" fill="#1a1a1a">
      왼쪽 붉은 면적이 재열로 늘어난 일이다. 손실이 열이 되어 가스를 부풀리므로 실제 경로가 오른쪽으로 밀린다.
    </text>
    <text x="20" y="420" font-size="13" fill="#1a1a1a">
      단열 효율은 이 면적까지 전부 비효율로 센다. 폴리트로픽 효율은 실제 경로를 인정하고 그 위의 손실만 따진다.
    </text>
    <text x="20" y="442" font-size="13" fill="#1a1a1a">
      그래서 같은 기계인데 폴리트로픽 효율이 더 높게 나오고, 압력비가 클수록 두 값의 차이가 벌어진다.
    </text>
  </g>
</svg>
