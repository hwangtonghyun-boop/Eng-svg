<svg viewBox="0 0 900 470" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="유량과 압력비에 따라 왕복동, 스크루, 원심, 축류 압축기가 담당하는 영역" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>압축기 방식 선정 맵</title>

  <defs>
    <marker id="selAx" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a1a"/>
    </marker>
  </defs>

  <g font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif">

    <text x="20" y="48" font-size="17" font-weight="700" fill="#2c3e50">유량과 압력비가 방식을 정한다</text>
    <text x="20" y="70" font-size="12.5" fill="#1f2933">경계는 겹친다. 그 영역에서는 다른 조건이 결정한다</text>

    <!-- 영역 -->
    <path d="M 120 110 L 300 110 L 300 250 L 120 250 Z" fill="#f0dcc4" stroke="#c1500a" stroke-width="2"/>
    <path d="M 230 215 L 450 215 L 450 305 L 230 305 Z" fill="#e8dcc0" stroke="#a8862b" stroke-width="2"/>
    <path d="M 330 255 L 700 255 L 700 340 L 330 340 Z" fill="#cfe0ee" stroke="#1d5a92" stroke-width="2"/>
    <path d="M 600 320 L 830 320 L 830 375 L 600 375 Z" fill="#d8ecd6" stroke="#2f6b3a" stroke-width="2"/>

    <text x="210" y="168" font-size="14" font-weight="700" fill="#8a3a08" text-anchor="middle">왕복동</text>
    <text x="210" y="190" font-size="10" fill="#8a3a08" text-anchor="middle">적은 유량 · 높은 압력비</text>

    <text x="288" y="258" font-size="14" font-weight="700" fill="#6b5410" text-anchor="middle">스크루</text>
    <text x="300" y="280" font-size="10" fill="#6b5410" text-anchor="middle">중간 영역</text>

    <text x="520" y="292" font-size="14" font-weight="700" fill="#123049" text-anchor="middle">원심</text>
    <text x="520" y="314" font-size="10" fill="#123049" text-anchor="middle">많은 유량 · 중간 압력비</text>

    <text x="740" y="344" font-size="14" font-weight="700" fill="#245430" text-anchor="middle">축류</text>
    <text x="740" y="364" font-size="10" fill="#245430" text-anchor="middle">아주 많은 유량 · 낮은 압력비</text>

    <!-- 축 -->
    <line x1="100" y1="90" x2="100" y2="400" stroke="#1a1a1a" stroke-width="1.8"/>
    <path d="M 100 400 L 862 400" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#selAx)"/>
    <text x="80" y="245" font-size="12.5" fill="#1a1a1a" transform="rotate(-90 80 245)" text-anchor="middle">압력비</text>
    <text x="854" y="422" font-size="12.5" fill="#1a1a1a" text-anchor="end">유량</text>

    <text x="90" y="118" font-size="10.5" fill="#7a8794" text-anchor="end">높다</text>
    <text x="90" y="394" font-size="10.5" fill="#7a8794" text-anchor="end">낮다</text>
    <text x="124" y="420" font-size="10.5" fill="#7a8794" text-anchor="middle">적다</text>
    <text x="820" y="420" font-size="10.5" fill="#7a8794" text-anchor="middle">많다</text>

    <!-- 분류 표시 -->
    <rect x="120" y="440" width="16" height="14" fill="#f0dcc4" stroke="#c1500a" stroke-width="1.6"/>
    <rect x="142" y="440" width="16" height="14" fill="#e8dcc0" stroke="#a8862b" stroke-width="1.6"/>
    <text x="168" y="452" font-size="12" font-weight="700" fill="#1a1a1a">용적형 — 공간을 줄인다</text>

    <rect x="450" y="440" width="16" height="14" fill="#cfe0ee" stroke="#1d5a92" stroke-width="1.6"/>
    <rect x="472" y="440" width="16" height="14" fill="#d8ecd6" stroke="#2f6b3a" stroke-width="1.6"/>
    <text x="498" y="452" font-size="12" font-weight="700" fill="#1a1a1a">동적 — 속도를 압력으로 바꾼다</text>
  </g>
</svg>
