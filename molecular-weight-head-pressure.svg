<svg viewBox="0 0 900 450" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="같은 임펠러가 만드는 같은 헤드가 가스 분자량에 따라 다른 압력비가 되는 관계" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>같은 헤드, 다른 압력비</title>

  <defs>
    <marker id="mwDim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6673"/>
    </marker>
    <marker id="mwUp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c0392b"/>
    </marker>
  </defs>

  <g font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif">

    <text x="20" y="48" font-size="17" font-weight="700" fill="#2c3e50">압축기가 만드는 것은 압력이 아니라 헤드다</text>
    <text x="20" y="70" font-size="12.5" fill="#1f2933">같은 임펠러, 같은 회전수. 가스만 바꿨을 때</text>

    <!-- 공통 헤드 표시 -->
    <line x1="110" y1="110" x2="840" y2="110" stroke="#5b6673" stroke-width="2" stroke-dasharray="8 4"/>
    <text x="118" y="103" font-size="12" font-weight="700" fill="#2c3e50">같은 헤드 — 단위 질량에 준 에너지는 동일하다</text>

    <line x1="110" y1="330" x2="840" y2="330" stroke="#1a1a1a" stroke-width="1.8"/>

    <!-- 가벼운 가스 -->
    <rect x="150" y="130" width="130" height="200" fill="#eaf3f8" stroke="#1d5a92" stroke-width="2"/>
    <g fill="#1d5a92">
      <circle cx="180" cy="168" r="4"/><circle cx="240" cy="182" r="4"/>
      <circle cx="205" cy="220" r="4"/><circle cx="255" cy="252" r="4"/>
      <circle cx="170" cy="272" r="4"/><circle cx="222" cy="305" r="4"/>
    </g>
    <path d="M 300 128 L 300 330" stroke="#5b6673" stroke-width="1.6" marker-start="url(#mwDim)" marker-end="url(#mwDim)"/>

    <text x="215" y="360" font-size="13" font-weight="700" fill="#123049" text-anchor="middle">가벼운 가스</text>
    <text x="215" y="378" font-size="10.5" fill="#123049" text-anchor="middle">밀도가 낮다</text>

    <!-- 중간 -->
    <rect x="390" y="130" width="130" height="200" fill="#e8ecef" stroke="#5b6673" stroke-width="2"/>
    <g fill="#5b6673">
      <circle cx="415" cy="152" r="4"/><circle cx="470" cy="164" r="4"/><circle cx="500" cy="145" r="4"/>
      <circle cx="430" cy="196" r="4"/><circle cx="486" cy="206" r="4"/><circle cx="450" cy="232" r="4"/>
      <circle cx="505" cy="244" r="4"/><circle cx="412" cy="258" r="4"/><circle cx="466" cy="282" r="4"/>
      <circle cx="498" cy="300" r="4"/><circle cx="432" cy="312" r="4"/><circle cx="478" cy="120" r="4" opacity="0"/>
    </g>
    <text x="455" y="360" font-size="13" font-weight="700" fill="#2c3e50" text-anchor="middle">중간</text>
    <text x="455" y="378" font-size="10.5" fill="#2c3e50" text-anchor="middle">공기 · 질소</text>

    <!-- 무거운 가스 -->
    <rect x="630" y="130" width="130" height="200" fill="#fdf0ee" stroke="#c0392b" stroke-width="2"/>
    <g fill="#c0392b">
      <circle cx="652" cy="144" r="4"/><circle cx="690" cy="140" r="4"/><circle cx="726" cy="150" r="4"/><circle cx="752" cy="138" r="4"/>
      <circle cx="660" cy="172" r="4"/><circle cx="700" cy="180" r="4"/><circle cx="738" cy="170" r="4"/>
      <circle cx="645" cy="204" r="4"/><circle cx="684" cy="210" r="4"/><circle cx="720" cy="200" r="4"/><circle cx="754" cy="212" r="4"/>
      <circle cx="658" cy="238" r="4"/><circle cx="696" cy="244" r="4"/><circle cx="734" cy="236" r="4"/>
      <circle cx="644" cy="272" r="4"/><circle cx="682" cy="278" r="4"/><circle cx="722" cy="268" r="4"/><circle cx="752" cy="280" r="4"/>
      <circle cx="662" cy="306" r="4"/><circle cx="702" cy="312" r="4"/><circle cx="742" cy="304" r="4"/>
    </g>
    <text x="695" y="360" font-size="13" font-weight="700" fill="#a03228" text-anchor="middle">무거운 가스</text>
    <text x="695" y="378" font-size="10.5" fill="#a03228" text-anchor="middle">밀도가 높다</text>

    <!-- 압력비 결과 -->
    <rect x="150" y="396" width="130" height="30" rx="4" fill="#dce8f2" stroke="#1d5a92" stroke-width="1.6"/>
    <text x="215" y="416" font-size="12" font-weight="700" fill="#123049" text-anchor="middle">압력비 낮음</text>

    <rect x="390" y="396" width="130" height="30" rx="4" fill="#e8ecef" stroke="#5b6673" stroke-width="1.6"/>
    <text x="455" y="416" font-size="12" font-weight="700" fill="#2c3e50" text-anchor="middle">기준</text>

    <rect x="630" y="396" width="130" height="30" rx="4" fill="#fbe9e7" stroke="#c0392b" stroke-width="1.6"/>
    <text x="695" y="416" font-size="12" font-weight="700" fill="#a03228" text-anchor="middle">압력비 높음</text>

    <path d="M 300 411 L 380 411" stroke="#c0392b" stroke-width="2.6" marker-end="url(#mwUp)"/>
    <path d="M 540 411 L 620 411" stroke="#c0392b" stroke-width="2.6" marker-end="url(#mwUp)"/>

    <text x="790" y="212" font-size="11.5" font-weight="700" fill="#1a1a1a">같은 높이의</text>
    <text x="790" y="230" font-size="11.5" font-weight="700" fill="#1a1a1a">물기둥과 수은 기둥이</text>
    <text x="790" y="248" font-size="11.5" font-weight="700" fill="#1a1a1a">만드는 압력이</text>
    <text x="790" y="266" font-size="11.5" font-weight="700" fill="#1a1a1a">다른 것과 같다</text>
  </g>
</svg>
