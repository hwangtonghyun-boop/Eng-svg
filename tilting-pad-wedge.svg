<svg viewBox="0 0 900 485" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="평행 틈새와 수렴 쐐기의 압력 분포 차이, 그리고 피벗 위 패드의 평형 원리" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>쐐기 유막이 하중을 띄우는 원리</title>

  <defs>
    <marker id="vArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a1a"/>
    </marker>
  </defs>

  <g font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif">

    <!-- ============ ① 평행 틈새 ============ -->
    <rect x="20" y="30" width="280" height="410" rx="8" fill="#fafbfc" stroke="#dfe4e8"/>
    <text x="38" y="58" font-size="14.5" font-weight="700" fill="#2c3e50">① 평행 틈새</text>
    <text x="38" y="76" font-size="10.5" fill="#1f2933">Parallel Gap</text>

    <text x="125" y="140" font-size="10.5" fill="#1a1a1a">간극이 일정하다</text>

    <rect x="65" y="185" width="190" height="25" fill="#e6d3a3"/>
    <rect x="65" y="150" width="190" height="35" fill="#c8d2da" stroke="#44546a" stroke-width="1.6"/>
    <text x="105" y="172" font-size="11.5" font-weight="700" fill="#1a1a1a">패드</text>

    <rect x="40" y="210" width="240" height="30" fill="#44546a"/>
    <text x="160" y="230" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle">쓰러스트 칼라</text>

    <path d="M 90 258 L 230 258" stroke="#1a1a1a" stroke-width="2.2" marker-end="url(#vArrow)"/>
    <text x="160" y="277" font-size="10.5" fill="#1a1a1a" text-anchor="middle">회전 방향</text>

    <line x1="53" y1="270" x2="53" y2="340" stroke="#5b6673" stroke-width="1.4"/>
    <text x="43" y="308" font-size="10.5" fill="#1a1a1a" text-anchor="middle">p</text>
    <line x1="65" y1="340" x2="255" y2="340" stroke="#1a1a1a" stroke-width="1.4"/>
    <line x1="65" y1="340" x2="255" y2="340" stroke="#c0392b" stroke-width="3"/>
    <text x="160" y="328" font-size="11" font-weight="700" fill="#a03228" text-anchor="middle">압력 ≈ 0</text>

    <text x="38" y="375" font-size="10.5" fill="#1a1a1a">위아래 면이 평행하다</text>
    <text x="38" y="395" font-size="10.5" fill="#1a1a1a">들어온 만큼 그대로 빠져나간다</text>
    <text x="38" y="415" font-size="10.5" font-weight="700" fill="#a03228">하중을 띄울 수 없다</text>

    <!-- ============ ② 수렴 쐐기 ============ -->
    <rect x="310" y="30" width="280" height="410" rx="8" fill="#fafbfc" stroke="#dfe4e8"/>
    <text x="328" y="58" font-size="14.5" font-weight="700" fill="#2c3e50">② 수렴 쐐기</text>
    <text x="328" y="76" font-size="10.5" fill="#1f2933">Converging Wedge</text>

    <text x="358" y="140" font-size="10.5" fill="#1a1a1a">입구 (넓음)</text>
    <text x="480" y="140" font-size="10.5" fill="#1a1a1a">출구 (좁음)</text>

    <polygon points="355,188 545,203 545,210 355,210" fill="#e6d3a3"/>
    <polygon points="355,150 545,150 545,203 355,188" fill="#c8d2da" stroke="#44546a" stroke-width="1.6"/>
    <text x="395" y="175" font-size="11.5" font-weight="700" fill="#1a1a1a">패드</text>

    <rect x="330" y="210" width="240" height="30" fill="#44546a"/>
    <text x="450" y="230" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle">쓰러스트 칼라</text>

    <path d="M 380 258 L 520 258" stroke="#1a1a1a" stroke-width="2.2" marker-end="url(#vArrow)"/>
    <text x="450" y="277" font-size="10.5" fill="#1a1a1a" text-anchor="middle">회전 방향</text>

    <line x1="343" y1="270" x2="343" y2="340" stroke="#5b6673" stroke-width="1.4"/>
    <text x="333" y="308" font-size="10.5" fill="#1a1a1a" text-anchor="middle">p</text>
    <path d="M 355 340 C 410 332, 445 288, 469 284 C 495 280, 525 314, 545 340 Z" fill="#f2d9d3"/>
    <path d="M 355 340 C 410 332, 445 288, 469 284 C 495 280, 525 314, 545 340" fill="none" stroke="#c0392b" stroke-width="2.6"/>
    <line x1="355" y1="340" x2="545" y2="340" stroke="#1a1a1a" stroke-width="1.4"/>

    <text x="328" y="375" font-size="10.5" fill="#1a1a1a">입구가 넓고 출구가 좁다</text>
    <text x="328" y="395" font-size="10.5" fill="#1a1a1a">밀려 들어간 유체가 압력을 만든다</text>
    <text x="328" y="415" font-size="10.5" font-weight="700" fill="#2f6b3a">하중을 띄울 수 있다</text>

    <!-- ============ ③ 피벗 위의 패드 ============ -->
    <rect x="600" y="30" width="280" height="410" rx="8" fill="#fafbfc" stroke="#dfe4e8"/>
    <text x="618" y="58" font-size="14.5" font-weight="700" fill="#2c3e50">③ 피벗 위의 패드</text>
    <text x="618" y="76" font-size="10.5" fill="#1f2933">Tilting Pad</text>

    <line x1="755" y1="92" x2="755" y2="352" stroke="#c0392b" stroke-width="1.4" stroke-dasharray="6 4"/>

    <rect x="620" y="95" width="240" height="12" fill="#c8d2da" stroke="#44546a"/>
    <text x="628" y="90" font-size="10" fill="#1a1a1a">하우징</text>
    <line x1="755" y1="107" x2="755" y2="142" stroke="#44546a" stroke-width="4"/>
    <polygon points="748,140 762,140 755,153" fill="#44546a"/>
    <text x="768" y="130" font-size="10.5" font-weight="700" fill="#1a1a1a">피벗</text>

    <polygon points="645,188 835,203 835,210 645,210" fill="#e6d3a3"/>
    <polygon points="645,150 835,150 835,203 645,188" fill="#c8d2da" stroke="#44546a" stroke-width="1.6"/>

    <rect x="620" y="210" width="240" height="30" fill="#44546a"/>
    <text x="740" y="230" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle">쓰러스트 칼라</text>

    <path d="M 670 258 L 810 258" stroke="#1a1a1a" stroke-width="2.2" marker-end="url(#vArrow)"/>
    <text x="740" y="277" font-size="10.5" fill="#1a1a1a" text-anchor="middle">회전 방향</text>

    <line x1="633" y1="270" x2="633" y2="340" stroke="#5b6673" stroke-width="1.4"/>
    <text x="623" y="308" font-size="10.5" fill="#1a1a1a" text-anchor="middle">p</text>
    <path d="M 645 340 C 700 332, 735 288, 759 284 C 785 280, 815 314, 835 340 Z" fill="#f2d9d3"/>
    <path d="M 645 340 C 700 332, 735 288, 759 284 C 785 280, 815 314, 835 340" fill="none" stroke="#c0392b" stroke-width="2.6"/>
    <line x1="645" y1="340" x2="835" y2="340" stroke="#1a1a1a" stroke-width="1.4"/>
    <text x="763" y="360" font-size="10.5" font-weight="700" fill="#a03228">압력 중심</text>

    <text x="618" y="375" font-size="10.5" fill="#1a1a1a">패드가 피벗 위에서 자유롭게 기운다</text>
    <text x="618" y="395" font-size="10.5" fill="#1a1a1a">압력 중심과 피벗이 어긋나면 회전한다</text>
    <text x="618" y="415" font-size="10.5" font-weight="700" fill="#2f6b3a">두 지점이 일치하는 각도에서 멈춘다</text>

    <!-- 캡션 -->
    <text x="20" y="468" font-size="13" fill="#1a1a1a">
      패드가 기울어져서 압력이 생기는 것이 아니라, 압력이 패드를 기울인다. 운전 조건이 바뀌면 패드는 새로운 평형각을 스스로 찾는다.
    </text>
  </g>
</svg>
