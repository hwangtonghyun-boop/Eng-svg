<svg viewBox="0 0 900 410" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="VFD 공통 모드 전압이 기생 정전용량을 통해 축으로 전달되어 베어링 유막을 뚫고 방전하는 경로" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>전류는 이렇게 베어링에 도달한다</title>

  <defs>
    <marker id="eArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c0392b"/>
    </marker>
  </defs>

  <g font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif">

    <!-- ============ ① 경로 ============ -->
    <rect x="20" y="30" width="500" height="310" rx="8" fill="#fafbfc" stroke="#dfe4e8"/>
    <text x="40" y="58" font-size="14" font-weight="700" fill="#2c3e50">① 전류가 축까지 오는 경로</text>

    <rect x="45" y="105" width="95" height="70" rx="4" fill="#c8d2da" stroke="#44546a" stroke-width="1.6"/>
    <text x="92" y="134" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="middle">VFD</text>
    <text x="92" y="154" font-size="10" fill="#1a1a1a" text-anchor="middle">인버터</text>

    <path d="M 140 140 L 196 140" stroke="#c0392b" stroke-width="2.6" stroke-dasharray="7 4" marker-end="url(#eArrow)"/>
    <text x="45" y="96" font-size="10" font-weight="700" fill="#a03228">공통 모드 전압</text>

    <rect x="200" y="90" width="240" height="180" rx="4" fill="none" stroke="#44546a" stroke-width="1.6"/>
    <rect x="212" y="100" width="216" height="45" fill="#dce8f2" stroke="#7a8794"/>
    <text x="320" y="127" font-size="11" font-weight="700" fill="#123049" text-anchor="middle">고정자 권선</text>

    <line x1="238" y1="152" x2="262" y2="152" stroke="#1a1a1a" stroke-width="2"/>
    <line x1="238" y1="162" x2="262" y2="162" stroke="#1a1a1a" stroke-width="2"/>
    <line x1="308" y1="152" x2="332" y2="152" stroke="#1a1a1a" stroke-width="2"/>
    <line x1="308" y1="162" x2="332" y2="162" stroke="#1a1a1a" stroke-width="2"/>
    <line x1="378" y1="152" x2="402" y2="152" stroke="#1a1a1a" stroke-width="2"/>
    <line x1="378" y1="162" x2="402" y2="162" stroke="#1a1a1a" stroke-width="2"/>

    <path d="M 250 166 L 250 182" stroke="#c0392b" stroke-width="2.2" marker-end="url(#eArrow)"/>
    <path d="M 320 166 L 320 182" stroke="#c0392b" stroke-width="2.2" marker-end="url(#eArrow)"/>
    <path d="M 390 166 L 390 182" stroke="#c0392b" stroke-width="2.2" marker-end="url(#eArrow)"/>
    <text x="320" y="178" font-size="10" font-weight="700" fill="#1a1a1a" text-anchor="middle">기생 정전용량</text>

    <rect x="215" y="185" width="285" height="23" fill="#44546a"/>
    <text x="470" y="201" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">축</text>
    <text x="415" y="178" font-size="10" font-weight="700" fill="#a03228">축 전압</text>

    <rect x="245" y="175" width="45" height="60" fill="#6b8194" stroke="#3f4b58" stroke-width="1.4"/>
    <path d="M 267 210 L 267 232" stroke="#c0392b" stroke-width="2.6" marker-end="url(#eArrow)"/>
    <text x="267" y="252" font-size="10" font-weight="700" fill="#1a1a1a" text-anchor="middle">베어링</text>

    <rect x="212" y="245" width="216" height="17" fill="#c8d2da" stroke="#7a8794"/>
    <text x="380" y="258" font-size="10" font-weight="700" fill="#1a1a1a" text-anchor="middle">프레임</text>
    <path d="M 267 236 L 267 244" stroke="#c0392b" stroke-width="2.6"/>

    <line x1="320" y1="262" x2="320" y2="280" stroke="#1a1a1a" stroke-width="2"/>
    <line x1="304" y1="280" x2="336" y2="280" stroke="#1a1a1a" stroke-width="2"/>
    <line x1="310" y1="286" x2="330" y2="286" stroke="#1a1a1a" stroke-width="2"/>
    <line x1="315" y1="292" x2="325" y2="292" stroke="#1a1a1a" stroke-width="2"/>

    <path d="M 132 218 L 240 206" stroke="#a03228" stroke-width="1.2"/>
    <text x="45" y="222" font-size="10" font-weight="700" fill="#a03228">유막을 뚫고 방전</text>

    <text x="40" y="312" font-size="11" fill="#1a1a1a">권선과 회전자는 붙어 있지 않지만</text>
    <text x="40" y="330" font-size="11" font-weight="700" fill="#a03228">고주파에서는 정전용량이 전류의 통로가 된다</text>

    <!-- ============ ② 확대 ============ -->
    <rect x="540" y="30" width="340" height="310" rx="8" fill="#fdf9f8" stroke="#e8d9d6"/>
    <text x="558" y="58" font-size="14" font-weight="700" fill="#2c3e50">② 베어링에서 벌어지는 일</text>

    <text x="570" y="100" font-size="10" font-weight="700" fill="#a03228">궤도에 남는 홈</text>
    <path d="M 620 104 L 634 132" stroke="#a03228" stroke-width="1.2"/>

    <rect x="560" y="110" width="300" height="35" fill="#6b8194"/>
    <path d="M 594 145 Q 600 134 606 145 Z" fill="#2f3d4f"/>
    <path d="M 626 145 Q 632 134 638 145 Z" fill="#2f3d4f"/>
    <path d="M 658 145 Q 664 134 670 145 Z" fill="#2f3d4f"/>
    <text x="578" y="132" font-size="10" font-weight="700" fill="#ffffff">외륜</text>

    <rect x="560" y="145" width="300" height="12" fill="#e6d3a3"/>
    <rect x="560" y="217" width="300" height="12" fill="#e6d3a3"/>
    <text x="788" y="154" font-size="9.5" font-weight="700" fill="#4a3c14">유막 (절연체)</text>

    <circle cx="710" cy="187" r="30" fill="#7f95a6" stroke="#44546a" stroke-width="1.4"/>
    <text x="710" y="191" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">구름 요소</text>

    <rect x="560" y="229" width="300" height="35" fill="#44546a"/>
    <text x="578" y="251" font-size="10" font-weight="700" fill="#ffffff">내륜</text>

    <circle cx="710" cy="151" r="15" fill="#e8a33d" opacity="0.45"/>
    <path d="M 704 145 L 713 149 L 705 152 L 714 157" fill="none" stroke="#ffd24a" stroke-width="3"/>
    <text x="724" y="140" font-size="10" font-weight="700" fill="#8a3a08">방전</text>

    <text x="558" y="290" font-size="11" fill="#1a1a1a">유막이 견딜 수 있는 전압을 넘으면</text>
    <text x="558" y="308" font-size="11" font-weight="700" fill="#a03228">순간 방전이 금속을 미세하게 녹여낸다</text>
    <text x="558" y="328" font-size="11" fill="#1a1a1a">그 자리에 일정 간격의 홈이 남는다</text>

    <!-- 캡션 -->
    <text x="20" y="372" font-size="13" fill="#1a1a1a">
      윤활도 정상이고 정렬도 정상인데 베어링이 망가진다면, 원인이 기계가 아니라 전기일 수 있다.
    </text>
    <text x="20" y="394" font-size="13" fill="#1a1a1a">
      홈이 일정한 간격으로 규칙적이라는 점이 결정적 단서다. 기계적 원인으로는 이런 규칙성이 나오지 않는다.
    </text>
  </g>
</svg>
