<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" font-family="Noto Sans KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif"><rect width="780" height="470" fill="#ffffff"/><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker></defs><text x="390" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2937">비속도(Ns)에 따른 임펠러 형상 변화 (자오면 단면)</text><rect x="15" y="55" width="230" height="250" rx="10" fill="#f8fafc" stroke="#e2e8f0"/><text x="130" y="80" text-anchor="middle" font-size="15" font-weight="700" fill="#1f3a5f">반경류형 (Radial)</text><text x="130" y="99" text-anchor="middle" font-size="12" fill="#475569">저 Ns · 고양정·소유량</text><line x1="35" y1="250" x2="225" y2="250" stroke="#64748b" stroke-width="1.2" stroke-dasharray="8 3 2 3"/><text x="225" y="266" text-anchor="end" font-size="11" fill="#64748b">회전축</text><rect x="275" y="55" width="230" height="250" rx="10" fill="#f8fafc" stroke="#e2e8f0"/><text x="390" y="80" text-anchor="middle" font-size="15" font-weight="700" fill="#1f3a5f">사류형 (Mixed flow)</text><text x="390" y="99" text-anchor="middle" font-size="12" fill="#475569">중 Ns</text><line x1="295" y1="250" x2="485" y2="250" stroke="#64748b" stroke-width="1.2" stroke-dasharray="8 3 2 3"/><text x="485" y="266" text-anchor="end" font-size="11" fill="#64748b">회전축</text><rect x="535" y="55" width="230" height="250" rx="10" fill="#f8fafc" stroke="#e2e8f0"/><text x="650" y="80" text-anchor="middle" font-size="15" font-weight="700" fill="#1f3a5f">축류형 (Axial)</text><text x="650" y="99" text-anchor="middle" font-size="12" fill="#475569">고 Ns · 저양정·대유량</text><line x1="555" y1="250" x2="745" y2="250" stroke="#64748b" stroke-width="1.2" stroke-dasharray="8 3 2 3"/><text x="745" y="266" text-anchor="end" font-size="11" fill="#64748b">회전축</text><path d="M50,225 L110,225 Q135,225 135,200 L135,120" fill="none" stroke="#1d4ed8" stroke-width="4"/><path d="M50,245 L140,245 Q160,245 160,220 L160,120" fill="none" stroke="#0f172a" stroke-width="4"/><path d="M55,235 L125,235 Q147,235 147,210 L147,112" fill="none" stroke="#dc2626" stroke-width="2" marker-end="url(#ar)"/><text x="170" y="135" font-size="12" fill="#334155">출구 반경 큼</text><text x="170" y="150" font-size="12" fill="#334155">유로 폭 좁음</text><path d="M310,210 L360,210 L420,140" fill="none" stroke="#1d4ed8" stroke-width="4"/><path d="M310,245 L380,245 L455,165" fill="none" stroke="#0f172a" stroke-width="4"/><path d="M315,228 L370,228 L440,142" fill="none" stroke="#dc2626" stroke-width="2" marker-end="url(#ar)"/><text x="380" y="122" font-size="12" fill="#334155">비스듬히 빠져나감</text><path d="M565,155 L725,155" fill="none" stroke="#1d4ed8" stroke-width="4"/><rect x="620" y="220" width="60" height="30" fill="#0f172a"/><path d="M625,155 L675,220" stroke="#334155" stroke-width="3"/><path d="M570,188 L725,188" fill="none" stroke="#dc2626" stroke-width="2" marker-end="url(#ar)"/><text x="650" y="142" text-anchor="middle" font-size="12" fill="#334155">축 방향으로 통과</text><g font-size="11" fill="#475569"><line x1="40" y1="292" x2="62" y2="292" stroke="#1d4ed8" stroke-width="4"/><text x="68" y="296">슈라우드</text><line x1="130" y1="292" x2="152" y2="292" stroke="#0f172a" stroke-width="4"/><text x="158" y="296">허브</text></g><text x="50" y="332" font-size="13" font-weight="700" fill="#1f2937">비속도 범위 (대략적인 경계)</text><defs><linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#bfdbfe"/><stop offset="0.5" stop-color="#bbf7d0"/><stop offset="1" stop-color="#fde68a"/></linearGradient></defs><rect x="50" y="340" width="680" height="26" rx="4" fill="url(#g)"/><line x1="336" y1="336" x2="336" y2="370" stroke="#334155" stroke-width="1.5"/><line x1="553" y1="336" x2="553" y2="370" stroke="#334155" stroke-width="1.5"/><text x="193" y="358" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">반경류형</text><text x="444" y="358" text-anchor="middle" font-size="13" font-weight="700" fill="#166534">사류형</text><text x="642" y="358" text-anchor="middle" font-size="13" font-weight="700" fill="#92400e">축류형</text><text x="50" y="390" font-size="12" fill="#475569">US 단위 (rpm, gpm, ft)</text><text x="336" y="390" text-anchor="middle" font-size="12" fill="#111827">≈ 4,000</text><text x="553" y="390" text-anchor="middle" font-size="12" fill="#111827">≈ 9,000</text><text x="730" y="390" text-anchor="end" font-size="12" fill="#111827">15,000+</text><text x="50" y="412" font-size="12" fill="#475569">m³/min, m 단위</text><text x="336" y="412" text-anchor="middle" font-size="12" fill="#111827">≈ 600</text><text x="553" y="412" text-anchor="middle" font-size="12" fill="#111827">≈ 1,350</text><text x="730" y="412" text-anchor="end" font-size="12" fill="#111827">2,250+</text><text x="730" y="462" text-anchor="end" font-size="11" fill="#6b7280">※ 경계값은 문헌마다 조금씩 다르며 형상은 연속적으로 바뀜 (그림은 개념도)</text></svg>