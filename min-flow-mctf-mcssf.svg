<svg viewBox="0 0 900 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="펌프 성능곡선 위에 표시한 MCTF와 MCSSF 기준선 및 운전 영역 구분" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>MCTF · MCSSF와 안정 운전 영역</title>

  <defs>
    <marker id="calloutArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8a6d3b"/>
    </marker>
  </defs>

  <g font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif">

    <text x="110" y="52" font-size="18" font-weight="700" fill="#2c3e50">최소유량 기준선과 운전 영역</text>
    <text x="110" y="76" font-size="13.5" fill="#1f2933">유량이 줄어들 때 펌프를 죽이는 것은 열이 아니라 진동이 먼저다</text>

    <!-- 영역 배경 -->
    <rect x="110" y="110" width="86.25" height="320" fill="#fbe9e7"/>
    <rect x="196.25" y="110" width="172.5" height="320" fill="#fdf3e0"/>
    <rect x="368.75" y="110" width="431.25" height="320" fill="#eef6ed"/>

    <!-- 축 -->
    <line x1="110" y1="430" x2="800" y2="430" stroke="#5b6673" stroke-width="1.6"/>
    <line x1="110" y1="110" x2="110" y2="430" stroke="#5b6673" stroke-width="1.6"/>

    <!-- 기준선 -->
    <line x1="196.25" y1="110" x2="196.25" y2="430" stroke="#a0a8b0" stroke-width="2" stroke-dasharray="7 5"/>
    <line x1="368.75" y1="110" x2="368.75" y2="430" stroke="#c0392b" stroke-width="2.6" stroke-dasharray="9 5"/>
    <line x1="685" y1="110" x2="685" y2="430" stroke="#7a8794" stroke-width="1.6" stroke-dasharray="2 4"/>

    <!-- 양정 곡선 -->
    <path d="M 110 175 C 320 192, 520 242, 800 340" fill="none" stroke="#2f3d4f" stroke-width="2.8"/>
    <text x="650" y="285" font-size="13" font-weight="600" fill="#2f3d4f">양정 (H-Q)</text>

    <!-- 진동 곡선 -->
    <path d="M 110 145 C 200 262, 300 338, 368.75 368 C 480 396, 580 406, 685 406 C 730 406, 770 397, 800 392"
          fill="none" stroke="#d35400" stroke-width="2.8"/>
    <text x="556" y="392" font-size="13" font-weight="600" fill="#d35400">진동 레벨</text>

    <!-- 핵심 주석 -->
    <text x="430" y="250" font-size="14" font-weight="700" fill="#4d3d0f">열은 나지 않지만</text>
    <text x="430" y="272" font-size="14" font-weight="700" fill="#4d3d0f">진동으로 펌프가 죽는 구간</text>
    <path d="M 424 264 L 300 264" stroke="#8a6d3b" stroke-width="1.6" fill="none" marker-end="url(#calloutArrow)"/>

    <!-- 축 제목 -->
    <text x="52" y="270" font-size="13" fill="#1a1a1a" transform="rotate(-90 52 270)" text-anchor="middle">양정 · 진동</text>
    <text x="455" y="556" font-size="13.5" fill="#1a1a1a" text-anchor="middle">유량 Q (BEP 대비 %)</text>

    <!-- 기준선 라벨 -->
    <text x="196.25" y="452" font-size="13.5" font-weight="700" fill="#1f2933" text-anchor="middle">MCTF</text>
    <text x="196.25" y="470" font-size="11.5" fill="#1f2933" text-anchor="middle">BEP의 5~15%</text>

    <text x="368.75" y="452" font-size="13.5" font-weight="700" fill="#c0392b" text-anchor="middle">MCSSF</text>
    <text x="368.75" y="470" font-size="11.5" fill="#5c221b" text-anchor="middle">BEP의 30~60%</text>

    <text x="685" y="452" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">BEP</text>
    <text x="685" y="470" font-size="11.5" fill="#1f2933" text-anchor="middle">100%</text>

    <!-- 영역 띠 -->
    <rect x="110" y="486" width="86.25" height="38" fill="#f2c4bd"/>
    <rect x="196.25" y="486" width="172.5" height="38" fill="#f8dfb4"/>
    <rect x="368.75" y="486" width="431.25" height="38" fill="#cfe6cc"/>

    <text x="153" y="510" font-size="12.5" font-weight="600" fill="#5c221b" text-anchor="middle">열적 파괴</text>
    <text x="282.5" y="510" font-size="12.5" font-weight="600" fill="#7a5a24" text-anchor="middle">진동 · 재순환 손상</text>
    <text x="584" y="510" font-size="12.5" font-weight="600" fill="#3f6139" text-anchor="middle">안정 연속 운전 영역</text>

    <!-- 캡션 -->
    <text x="450" y="592" font-size="13.5" fill="#1a1a1a" text-anchor="middle">
      상시 바이패스 제어선은 MCTF가 아니라 MCSSF 위에 놓여야 한다. 그 사이 구간은 열이 아니라 진동이 펌프를 갉아먹는다.
    </text>
  </g>
</svg>
