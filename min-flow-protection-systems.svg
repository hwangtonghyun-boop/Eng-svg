<svg viewBox="0 0 900 470" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="고정 오리피스, 컨트롤 밸브 루프, 자동 재순환 밸브의 배관 구성 비교" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>최소유량 보호 방식 세 가지</title>

  <g font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif">

    <!-- ============ ① RO ============ -->
    <rect x="20" y="30" width="280" height="360" rx="8" fill="#fafbfc" stroke="#dfe4e8"/>
    <text x="38" y="58" font-size="14" font-weight="700" fill="#2c3e50">① 고정 오리피스</text>
    <text x="38" y="76" font-size="10.5" fill="#1f2933">상시 바이패스 · RO</text>

    <path d="M 248 215 L 172 215 L 172 118 L 64 118 L 64 235" fill="none" stroke="#b8862b" stroke-width="3"/>
    <polygon points="205,207 210,215 205,223" fill="#44546a"/>
    <polygon points="215,207 210,215 215,223" fill="#44546a"/>
    <text x="210" y="203" font-size="10.5" font-weight="700" fill="#8a5a12" text-anchor="middle">오리피스</text>
    <text x="72" y="180" font-size="10.5" font-weight="700" fill="#8a5a12">재순환</text>

    <path d="M 86 268 L 116 268" fill="none" stroke="#2f3d4f" stroke-width="3"/>
    <path d="M 160 268 L 248 268 L 248 155 L 270 155" fill="none" stroke="#2f3d4f" stroke-width="3"/>
    <polygon points="192,258 192,278 208,268" fill="#44546a"/>
    <line x1="208" y1="256" x2="208" y2="280" stroke="#44546a" stroke-width="2.4"/>
    <text x="200" y="302" font-size="10" fill="#1a1a1a" text-anchor="middle">체크 밸브</text>

    <rect x="42" y="235" width="44" height="65" rx="3" fill="#dce8f2" stroke="#44546a" stroke-width="1.8"/>
    <circle cx="138" cy="268" r="22" fill="#44546a"/>
    <text x="138" y="273" font-size="10.5" font-weight="700" fill="#ffffff" text-anchor="middle">펌프</text>
    <text x="64" y="318" font-size="10" fill="#1a1a1a" text-anchor="middle">흡입 용기</text>
    <text x="254" y="148" font-size="10" fill="#1a1a1a">공정</text>

    <text x="38" y="345" font-size="10.5" fill="#1a1a1a">움직이는 부품이 없다</text>
    <text x="38" y="363" font-size="10.5" font-weight="700" fill="#a03228">항상 열려 있고 항상 낭비한다</text>

    <!-- ============ ② 컨트롤 밸브 루프 ============ -->
    <rect x="310" y="30" width="280" height="360" rx="8" fill="#fafbfc" stroke="#dfe4e8"/>
    <text x="328" y="58" font-size="14" font-weight="700" fill="#2c3e50">② 컨트롤 밸브 루프</text>
    <text x="328" y="76" font-size="10.5" fill="#1f2933">유량 측정 + 제어</text>

    <path d="M 538 215 L 462 215 L 462 118 L 354 118 L 354 235" fill="none" stroke="#b8862b" stroke-width="3"/>
    <polygon points="378,110 378,126 390,118" fill="#44546a"/>
    <polygon points="402,110 402,126 390,118" fill="#44546a"/>
    <line x1="390" y1="110" x2="390" y2="100" stroke="#44546a" stroke-width="2.4"/>
    <rect x="378" y="90" width="24" height="10" rx="3" fill="#7f95a6" stroke="#44546a"/>
    <text x="378" y="143" font-size="10.5" font-weight="700" fill="#8a5a12" text-anchor="middle">컨트롤 밸브</text>
    <text x="362" y="180" font-size="10.5" font-weight="700" fill="#8a5a12">재순환</text>

    <path d="M 376 268 L 406 268" fill="none" stroke="#2f3d4f" stroke-width="3"/>
    <path d="M 450 268 L 538 268 L 538 155 L 560 155" fill="none" stroke="#2f3d4f" stroke-width="3"/>
    <polygon points="482,258 482,278 498,268" fill="#44546a"/>
    <line x1="498" y1="256" x2="498" y2="280" stroke="#44546a" stroke-width="2.4"/>
    <text x="490" y="302" font-size="10" fill="#1a1a1a" text-anchor="middle">체크 밸브</text>

    <circle cx="538" cy="185" r="13" fill="#ffffff" stroke="#44546a" stroke-width="1.8"/>
    <text x="538" y="189" font-size="9.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">FT</text>
    <circle cx="485" cy="155" r="13" fill="#ffffff" stroke="#44546a" stroke-width="1.8"/>
    <text x="485" y="159" font-size="9" font-weight="700" fill="#1a1a1a" text-anchor="middle">FIC</text>
    <line x1="528" y1="178" x2="496" y2="162" stroke="#5b6673" stroke-width="1.2" stroke-dasharray="4 3"/>
    <line x1="474" y1="150" x2="398" y2="122" stroke="#5b6673" stroke-width="1.2" stroke-dasharray="4 3"/>

    <rect x="332" y="235" width="44" height="65" rx="3" fill="#dce8f2" stroke="#44546a" stroke-width="1.8"/>
    <circle cx="428" cy="268" r="22" fill="#44546a"/>
    <text x="428" y="273" font-size="10.5" font-weight="700" fill="#ffffff" text-anchor="middle">펌프</text>
    <text x="354" y="318" font-size="10" fill="#1a1a1a" text-anchor="middle">흡입 용기</text>
    <text x="544" y="148" font-size="10" fill="#1a1a1a">공정</text>

    <text x="328" y="345" font-size="10.5" fill="#1a1a1a">필요할 때만 열린다</text>
    <text x="328" y="363" font-size="10.5" font-weight="700" fill="#2f6b3a">고장 지점은 많지만 감시된다</text>

    <!-- ============ ③ ARV ============ -->
    <rect x="600" y="30" width="280" height="360" rx="8" fill="#fafbfc" stroke="#dfe4e8"/>
    <text x="618" y="58" font-size="14" font-weight="700" fill="#2c3e50">③ 자동 재순환 밸브</text>
    <text x="618" y="76" font-size="10.5" fill="#1f2933">자력식 통합 밸브 · ARV</text>

    <path d="M 794 244 L 794 118 L 644 118 L 644 235" fill="none" stroke="#b8862b" stroke-width="3"/>
    <text x="652" y="180" font-size="10.5" font-weight="700" fill="#8a5a12">재순환</text>

    <path d="M 666 268 L 696 268" fill="none" stroke="#2f3d4f" stroke-width="3"/>
    <path d="M 740 268 L 764 268" fill="none" stroke="#2f3d4f" stroke-width="3"/>
    <path d="M 824 268 L 848 268 L 848 155 L 868 155" fill="none" stroke="#2f3d4f" stroke-width="3"/>

    <rect x="764" y="244" width="60" height="48" rx="3" fill="#f2e3c8" stroke="#8a6d24" stroke-width="2.2"/>
    <text x="794" y="273" font-size="12" font-weight="700" fill="#5c4610" text-anchor="middle">ARV</text>
    <text x="794" y="312" font-size="10" fill="#1a1a1a" text-anchor="middle">체크 밸브 기능 포함</text>

    <rect x="622" y="235" width="44" height="65" rx="3" fill="#dce8f2" stroke="#44546a" stroke-width="1.8"/>
    <circle cx="718" cy="268" r="22" fill="#44546a"/>
    <text x="718" y="273" font-size="10.5" font-weight="700" fill="#ffffff" text-anchor="middle">펌프</text>
    <text x="644" y="318" font-size="10" fill="#1a1a1a" text-anchor="middle">흡입 용기</text>
    <text x="852" y="148" font-size="10" fill="#1a1a1a">공정</text>

    <text x="618" y="345" font-size="10.5" fill="#1a1a1a">전원도 계장도 필요 없다</text>
    <text x="618" y="363" font-size="10.5" font-weight="700" fill="#a03228">동작 여부를 알기 어렵다</text>

    <!-- 캡션 -->
    <line x1="30" y1="418" x2="62" y2="418" stroke="#b8862b" stroke-width="3"/>
    <text x="70" y="423" font-size="11" fill="#1a1a1a">재순환(바이패스) 라인</text>

    <line x1="230" y1="418" x2="262" y2="418" stroke="#2f3d4f" stroke-width="3"/>
    <text x="270" y="423" font-size="11" fill="#1a1a1a">주 유로</text>

    <text x="30" y="452" font-size="13" fill="#1a1a1a">
      RO는 항상 작동하지만 항상 낭비하고, 컨트롤 밸브는 낭비하지 않지만 고장 지점이 많으며, ARV는 그 중간이되 상태를 알 수 없다.
    </text>
  </g>
</svg>
