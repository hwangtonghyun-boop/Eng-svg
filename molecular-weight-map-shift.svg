<svg viewBox="0 0 900 460" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="가스가 가벼워지면 성능 맵이 내려가고 서지선이 오른쪽으로 이동해 운전점이 위험해지는 관계" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>조성이 바뀌면 맵이 움직인다</title>

  <defs>
    <marker id="mvAx" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a1a"/>
    </marker>
    <marker id="mvShift" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c0392b"/>
    </marker>
  </defs>

  <g font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif">

    <text x="20" y="48" font-size="17" font-weight="700" fill="#2c3e50">가스가 가벼워지면 서지선이 다가온다</text>
    <text x="20" y="70" font-size="12.5" fill="#1f2933">같은 압축기, 같은 회전수. 조성만 달라졌을 때</text>

    <line x1="110" y1="90" x2="110" y2="330" stroke="#1a1a1a" stroke-width="1.6"/>
    <path d="M 110 330 L 850 330" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#mvAx)"/>
    <text x="90" y="210" font-size="12" fill="#1a1a1a" transform="rotate(-90 90 210)" text-anchor="middle">압력비</text>
    <text x="842" y="352" font-size="12" fill="#1a1a1a" text-anchor="end">유량</text>

    <!-- 설계 조성 곡선 -->
    <path d="M 250 130 C 360 136, 480 152, 600 182 C 660 197, 700 214, 716 232"
          fill="none" stroke="#2f3d4f" stroke-width="3"/>
    <path d="M 250 130 C 228 152, 218 178, 214 206 C 212 226, 212 244, 214 262"
          fill="none" stroke="#2f3d4f" stroke-width="3" stroke-dasharray="7 4"/>
    <text x="610" y="152" font-size="12" font-weight="700" fill="#2f3d4f">설계 조성</text>

    <!-- 가벼워진 조성 곡선 -->
    <path d="M 370 196 C 470 202, 570 218, 672 246 C 720 259, 752 274, 766 290"
          fill="none" stroke="#c0392b" stroke-width="3"/>
    <path d="M 370 196 C 350 216, 342 240, 340 262 C 339 280, 340 296, 342 310"
          fill="none" stroke="#c0392b" stroke-width="3" stroke-dasharray="7 4"/>
    <text x="630" y="222" font-size="12" font-weight="700" fill="#a03228">가벼워진 조성</text>

    <!-- 서지선 -->
    <circle cx="250" cy="130" r="7" fill="#2f3d4f"/>
    <circle cx="370" cy="196" r="7" fill="#c0392b"/>
    <line x1="250" y1="130" x2="250" y2="330" stroke="#2f3d4f" stroke-width="1.6" stroke-dasharray="5 4"/>
    <line x1="370" y1="196" x2="370" y2="330" stroke="#c0392b" stroke-width="2" stroke-dasharray="5 4"/>
    <text x="250" y="350" font-size="10.5" font-weight="700" fill="#2f3d4f" text-anchor="middle">기존 서지점</text>
    <text x="370" y="350" font-size="10.5" font-weight="700" fill="#a03228" text-anchor="middle">새 서지점</text>

    <path d="M 258 110 L 362 110" stroke="#c0392b" stroke-width="2.6" marker-end="url(#mvShift)"/>
    <text x="310" y="102" font-size="11.5" font-weight="700" fill="#a03228" text-anchor="middle">오른쪽으로 이동</text>

    <!-- 제어선 -->
    <line x1="310" y1="90" x2="310" y2="330" stroke="#2f6b3a" stroke-width="2.6" stroke-dasharray="9 5"/>
    <text x="310" y="84" font-size="11" font-weight="700" fill="#2f6b3a" text-anchor="middle">고정된 제어선</text>

    <rect x="310" y="90" width="60" height="240" fill="#fbe9e7" opacity="0.65"/>
    <text x="392" y="284" font-size="11.5" font-weight="700" fill="#a03228">제어선이 서지선보다</text>
    <text x="392" y="302" font-size="11.5" font-weight="700" fill="#a03228">왼쪽에 놓인다</text>

    <!-- 운전점 -->
    <circle cx="520" cy="164" r="7" fill="#1d5a92"/>
    <text x="532" y="160" font-size="11" font-weight="700" fill="#123049">운전점</text>

    <!-- 캡션 -->
    <text x="20" y="392" font-size="13" fill="#1a1a1a">
      가벼운 가스는 같은 유량에서 만드는 압력이 낮다. 그래서 더 큰 유량에서도 하류 압력을 못 이기고, 서지점이 오른쪽으로 옮겨간다.
    </text>
    <text x="20" y="414" font-size="13" fill="#1a1a1a">
      붉은 띠가 문제 구간이다. 제어기는 아직 안전하다고 판단하지만 실제로는 이미 서지 영역에 들어와 있다.
    </text>
    <text x="20" y="436" font-size="13" fill="#1a1a1a">
      그래서 조성 변동이 큰 계통에서는 제어선에 분자량 보정이 들어가야 한다. 고정된 선은 조건이 바뀌면 틀린 선이 된다.
    </text>
  </g>
</svg>
