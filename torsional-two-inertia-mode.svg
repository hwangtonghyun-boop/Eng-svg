<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 680 330" xmlns="http://www.w3.org/2000/svg" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif"><rect width="680" height="330" fill="#fff"/>
<text x="340" y="28" font-size="15" font-weight="bold" text-anchor="middle">2관성 모델과 1차 비틀림 모드</text>
<rect x="70" y="60" width="130" height="80" rx="8" fill="#e8a33d" stroke="#555"/><text x="135" y="98" font-size="14" text-anchor="middle">모터</text><text x="135" y="118" font-size="12" text-anchor="middle">J₁ = 2.0 kg·m²</text>
<path d="M200,100 l15,-12 l15,24 l15,-24 l15,24 l15,-24 l15,24 l15,-24 l15,24 l15,-24 l15,24 l15,-12" fill="none" stroke="#555" stroke-width="2.5"/>
<text x="290" y="72" font-size="12" text-anchor="middle">축·커플링 강성 k</text>
<rect x="380" y="70" width="100" height="60" rx="8" fill="#9db8d8" stroke="#555"/><text x="430" y="98" font-size="14" text-anchor="middle">펌프</text><text x="430" y="117" font-size="12" text-anchor="middle">J₂ = 0.5 kg·m²</text>
<rect x="510" y="66" width="150" height="68" rx="8" fill="#f5f8fc"/><text x="585" y="92" font-size="13" text-anchor="middle">k = 1.0×10⁵ N·m/rad</text><text x="585" y="116" font-size="13" text-anchor="middle" fill="#c0392b">fₙ ≈ 80 Hz</text>
<line x1="60" y1="240" x2="500" y2="240" stroke="#bbb"/>
<text x="40" y="244" font-size="12" text-anchor="end" fill="#777">0</text>


<line x1="135" y1="225" x2="430" y2="300" stroke="#c0392b" stroke-width="3"/>
<circle cx="135" cy="225" r="6" fill="#e8a33d" stroke="#555"/><circle cx="430" cy="300" r="6" fill="#9db8d8" stroke="#555"/>
<circle cx="194" cy="240" r="6" fill="#fff" stroke="#c0392b" stroke-width="2.5"/>
<text x="178" y="262" font-size="12" text-anchor="end" fill="#c0392b">노드(비틀림 각 0)</text>
<text x="135" y="215" font-size="12" text-anchor="middle">모터: 작게 흔들림</text>
<text x="430" y="322" font-size="12" text-anchor="middle">펌프: 반대로 크게 흔들림</text>
<text x="560" y="250" font-size="12" fill="#555">비틀림 각</text><text x="560" y="268" font-size="12" fill="#555">(진폭 분포)</text>
